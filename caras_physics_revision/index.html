<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cara's Physics Revision</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg-1: #fff1f7;
    --bg-2: #e8f7ff;
    --bg-3: #fdf6e3;
    --bg-4: #e9fbe7;
    --ink: #2c3e50;
    --ink-soft: #5b6b7a;
    --card: #ffffff;
    --good: #2ecc71;
    --bad: #e74c3c;
    --warn: #f39c12;
    --line: #e6e2f0;
    --shadow: 0 10px 30px rgba(60, 50, 100, 0.08), 0 4px 10px rgba(60, 50, 100, 0.05);
  }

  html, body {
    height: 100%;
    font-family: -apple-system, "SF Pro Rounded", "Segoe UI", "Avenir Next", Avenir, "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
    background: linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 35%, var(--bg-3) 70%, var(--bg-4) 100%);
    background-attachment: fixed;
    -webkit-font-smoothing: antialiased;
  }

  body {
    min-height: 100vh;
    padding: 24px;
    line-height: 1.55;
  }

  .app {
    max-width: 980px;
    margin: 0 auto;
  }

  /* ---------- HEADER ---------- */
  header.top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 22px;
    background: rgba(255,255,255,0.7);
    backdrop-filter: blur(10px);
    border-radius: 18px;
    box-shadow: var(--shadow);
    margin-bottom: 24px;
  }
  header.top .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    font-weight: 700;
    font-size: 1.05rem;
  }
  header.top .brand .dot {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: linear-gradient(135deg, #ff8ab5, #ffc16b);
    display: grid; place-items: center;
    color: white; font-size: 1.1rem;
    box-shadow: 0 4px 10px rgba(255, 138, 181, 0.45);
  }
  header.top nav button {
    border: 0;
    background: rgba(255,255,255,0.8);
    padding: 8px 14px;
    border-radius: 12px;
    font: inherit;
    color: var(--ink-soft);
    cursor: pointer;
    margin-left: 6px;
    transition: transform 0.15s, background 0.15s;
  }
  header.top nav button:hover { background: white; transform: translateY(-1px); }

  /* ---------- WELCOME ---------- */
  .welcome {
    background: var(--card);
    border-radius: 28px;
    padding: 40px 36px;
    box-shadow: var(--shadow);
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .welcome::before {
    content: '';
    position: absolute; inset: 0;
    background:
      radial-gradient(circle at 12% 18%, rgba(255, 180, 200, 0.25), transparent 35%),
      radial-gradient(circle at 88% 22%, rgba(180, 220, 255, 0.3), transparent 38%),
      radial-gradient(circle at 70% 90%, rgba(255, 230, 150, 0.25), transparent 40%);
    pointer-events: none;
  }
  .welcome > * { position: relative; }
  .welcome h1 {
    font-size: 2.2rem;
    margin-bottom: 12px;
    background: linear-gradient(90deg, #ff7eb6, #ffa45c, #6ec3ff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .welcome p.lead {
    font-size: 1.1rem;
    color: var(--ink-soft);
    max-width: 600px;
    margin: 0 auto 8px;
  }
  .welcome p.sub {
    color: var(--ink-soft);
    max-width: 580px;
    margin: 0 auto 24px;
    font-size: 0.98rem;
  }
  .welcome .start-btn {
    background: linear-gradient(90deg, #ff8ab5, #ffae5c);
    color: white;
    border: 0;
    padding: 14px 34px;
    border-radius: 16px;
    font: inherit;
    font-size: 1.05rem;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(255, 138, 181, 0.4);
    transition: transform 0.15s;
  }
  .welcome .start-btn:hover { transform: translateY(-2px); }
  .welcome .tips {
    margin-top: 28px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 14px;
  }
  .welcome .tips .tip {
    background: rgba(255,255,255,0.6);
    padding: 14px 12px;
    border-radius: 14px;
    border: 1px solid var(--line);
    font-size: 0.92rem;
    color: var(--ink-soft);
  }
  .welcome .tips .tip strong { color: var(--ink); display: block; margin-bottom: 4px; }

  /* ---------- TOPIC MENU ---------- */
  .menu-head {
    text-align: center;
    margin: 8px 0 22px;
  }
  .menu-head h2 {
    font-size: 1.6rem;
    margin-bottom: 6px;
  }
  .menu-head p { color: var(--ink-soft); }

  .topics {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 18px;
  }
  .topic-card {
    background: var(--card);
    border-radius: 22px;
    padding: 22px 20px;
    box-shadow: var(--shadow);
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
    border: 2px solid transparent;
    position: relative;
    overflow: hidden;
  }
  .topic-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 14px 30px rgba(60, 50, 100, 0.12);
  }
  .topic-card .stripe {
    position: absolute; top: 0; left: 0; right: 0;
    height: 6px;
  }
  .topic-card .emoji {
    font-size: 2.2rem;
    margin-bottom: 6px;
    display: block;
  }
  .topic-card h3 {
    font-size: 1.15rem;
    margin-bottom: 4px;
  }
  .topic-card p.desc {
    color: var(--ink-soft);
    font-size: 0.92rem;
    margin-bottom: 14px;
    min-height: 38px;
  }
  .topic-card .meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.85rem;
    color: var(--ink-soft);
  }
  .topic-card .badge {
    background: var(--good);
    color: white;
    padding: 2px 10px;
    border-radius: 999px;
    font-size: 0.78rem;
    font-weight: 600;
  }
  .topic-card .badge.not-done {
    background: #eceff1;
    color: var(--ink-soft);
  }
  .topic-card .bar {
    height: 6px;
    background: #f3f0fa;
    border-radius: 999px;
    margin-top: 10px;
    overflow: hidden;
  }
  .topic-card .bar > span {
    display: block; height: 100%;
    background: linear-gradient(90deg, #ffae5c, #ff8ab5);
    width: 0;
    transition: width 0.4s;
  }

  /* ---------- QUIZ SCREEN ---------- */
  .quiz {
    background: var(--card);
    border-radius: 26px;
    padding: 28px;
    box-shadow: var(--shadow);
  }
  .quiz .header {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 18px;
  }
  .quiz .header .emoji { font-size: 2rem; }
  .quiz .header .info { flex: 1; }
  .quiz .header h2 { font-size: 1.4rem; line-height: 1.15; }
  .quiz .header .progress-text {
    color: var(--ink-soft);
    font-size: 0.92rem;
  }
  .quiz .header .streak {
    background: linear-gradient(135deg, #ff8a5b, #ffd166);
    color: white;
    padding: 6px 12px;
    border-radius: 999px;
    font-weight: 700;
    font-size: 0.9rem;
    box-shadow: 0 4px 10px rgba(255,138,91,0.35);
    opacity: 0;
    transform: scale(0.8);
    transition: opacity 0.3s, transform 0.3s;
  }
  .quiz .header .streak.show { opacity: 1; transform: scale(1); }

  .progress-bar {
    height: 8px;
    background: #f0ebf7;
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 24px;
  }
  .progress-bar > div {
    height: 100%;
    background: linear-gradient(90deg, #6ec3ff, #ff8ab5, #ffae5c);
    width: 0;
    transition: width 0.4s;
    border-radius: 999px;
  }

  .question {
    animation: pop 0.35s ease both;
  }
  @keyframes pop {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .question .stem {
    font-size: 1.15rem;
    font-weight: 600;
    margin-bottom: 18px;
    line-height: 1.4;
  }
  .question .stem .blank {
    display: inline-block;
    min-width: 80px;
    border-bottom: 2.5px dashed #c9bdf1;
    padding: 0 4px;
    color: transparent;
  }
  .question .type-tag {
    display: inline-block;
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding: 3px 9px;
    border-radius: 999px;
    background: #f0ebf7;
    color: #7a5cb1;
    margin-bottom: 10px;
  }

  /* multiple choice */
  .options { display: grid; gap: 10px; }
  .option {
    background: #faf7ff;
    border: 2px solid var(--line);
    padding: 12px 16px;
    border-radius: 14px;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s, transform 0.1s;
    text-align: left;
    font: inherit;
    color: var(--ink);
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .option:hover { background: white; border-color: #c9bdf1; }
  .option .letter {
    width: 28px; height: 28px;
    border-radius: 8px;
    background: white;
    border: 2px solid var(--line);
    display: grid; place-items: center;
    font-weight: 700;
    color: var(--ink-soft);
    flex-shrink: 0;
  }
  .option.selected { border-color: #7a5cb1; background: white; }
  .option.correct {
    background: #e9f9ef;
    border-color: var(--good);
  }
  .option.correct .letter { background: var(--good); color: white; border-color: var(--good); }
  .option.wrong {
    background: #fdecec;
    border-color: var(--bad);
  }
  .option.wrong .letter { background: var(--bad); color: white; border-color: var(--bad); }
  .option.disabled { cursor: default; opacity: 0.85; }

  /* fill in the blank */
  .fill-in {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .fill-in input {
    flex: 1;
    min-width: 200px;
    padding: 13px 16px;
    border-radius: 14px;
    border: 2px solid var(--line);
    font: inherit;
    background: #faf7ff;
    transition: border-color 0.15s, background 0.15s;
  }
  .fill-in input:focus { outline: none; border-color: #7a5cb1; background: white; }
  .fill-in input.correct { border-color: var(--good); background: #e9f9ef; }
  .fill-in input.wrong { border-color: var(--bad); background: #fdecec; }

  /* short answer */
  textarea.short-answer {
    width: 100%;
    min-height: 100px;
    padding: 13px 16px;
    border-radius: 14px;
    border: 2px solid var(--line);
    font: inherit;
    background: #faf7ff;
    resize: vertical;
    line-height: 1.5;
  }
  textarea.short-answer:focus { outline: none; border-color: #7a5cb1; background: white; }
  textarea.short-answer.locked { background: #f5f2fb; }

  /* numerical */
  .num-input {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .num-input input {
    width: 160px;
    padding: 13px 16px;
    border-radius: 14px;
    border: 2px solid var(--line);
    font: inherit;
    background: #faf7ff;
    font-size: 1.1rem;
    text-align: right;
  }
  .num-input input:focus { outline: none; border-color: #7a5cb1; background: white; }
  .num-input .unit {
    font-weight: 600;
    color: var(--ink-soft);
    font-size: 1.05rem;
  }
  .num-input input.correct { border-color: var(--good); background: #e9f9ef; }
  .num-input input.wrong { border-color: var(--bad); background: #fdecec; }

  /* true/false */
  .tf-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    max-width: 360px;
  }
  .tf-btn {
    padding: 16px;
    border-radius: 14px;
    background: #faf7ff;
    border: 2px solid var(--line);
    cursor: pointer;
    font: inherit;
    font-weight: 700;
    font-size: 1.05rem;
    transition: background 0.15s, border-color 0.15s;
  }
  .tf-btn:hover { background: white; border-color: #c9bdf1; }
  .tf-btn.correct { background: #e9f9ef; border-color: var(--good); color: #18794b; }
  .tf-btn.wrong { background: #fdecec; border-color: var(--bad); color: #a3271c; }
  .tf-btn.disabled { cursor: default; }

  /* sort/match */
  .sort {
    display: grid;
    gap: 16px;
  }
  .sort-items {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 14px;
    border-radius: 14px;
    background: #faf7ff;
    border: 2px dashed var(--line);
    min-height: 60px;
  }
  .sort-categories {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 12px;
  }
  .sort-cat {
    background: white;
    border: 2px solid var(--line);
    border-radius: 14px;
    padding: 12px;
    min-height: 110px;
    transition: border-color 0.15s, background 0.15s;
  }
  .sort-cat.over { border-color: #7a5cb1; background: #faf7ff; }
  .sort-cat h4 {
    font-size: 0.95rem;
    text-align: center;
    margin-bottom: 8px;
    color: var(--ink-soft);
    padding-bottom: 6px;
    border-bottom: 1px solid var(--line);
  }
  .sort-cat .drop-zone {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    min-height: 60px;
  }
  .sort-chip {
    background: white;
    border: 2px solid var(--line);
    padding: 7px 12px;
    border-radius: 999px;
    cursor: grab;
    font-size: 0.9rem;
    user-select: none;
    transition: transform 0.1s, box-shadow 0.1s;
  }
  .sort-chip:hover { box-shadow: 0 3px 8px rgba(0,0,0,0.06); }
  .sort-chip.dragging { opacity: 0.5; transform: scale(0.95); }
  .sort-chip.correct { background: #e9f9ef; border-color: var(--good); }
  .sort-chip.wrong { background: #fdecec; border-color: var(--bad); }
  .sort-chip.tap-selected { background: #ede5fb; border-color: #7a5cb1; }

  /* feedback */
  .feedback {
    margin-top: 18px;
    padding: 14px 18px;
    border-radius: 14px;
    animation: pop 0.3s ease both;
    line-height: 1.5;
  }
  .feedback.good { background: #e9f9ef; border-left: 4px solid var(--good); color: #1d5b3b; }
  .feedback.bad { background: #fdecec; border-left: 4px solid var(--bad); color: #862d22; }
  .feedback.partial { background: #fff7e6; border-left: 4px solid var(--warn); color: #7a4d10; }
  .feedback .head { font-weight: 700; margin-bottom: 4px; }
  .feedback .answer-line {
    margin-top: 6px;
    font-size: 0.95rem;
    background: rgba(255,255,255,0.5);
    padding: 6px 10px;
    border-radius: 8px;
  }

  /* nav buttons */
  .quiz .actions {
    display: flex;
    justify-content: space-between;
    margin-top: 20px;
    gap: 10px;
    flex-wrap: wrap;
  }
  .btn {
    padding: 12px 22px;
    border-radius: 14px;
    border: 0;
    background: #f0ebf7;
    color: var(--ink);
    font: inherit;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
  }
  .btn:hover { background: #e6dff0; }
  .btn.primary {
    background: linear-gradient(90deg, #6ec3ff, #ff8ab5);
    color: white;
    box-shadow: 0 6px 14px rgba(110, 195, 255, 0.4);
  }
  .btn.primary:hover { transform: translateY(-1px); }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }

  /* ---------- RESULTS ---------- */
  .results {
    background: var(--card);
    border-radius: 26px;
    padding: 36px 28px;
    box-shadow: var(--shadow);
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .results .ribbon {
    font-size: 4rem;
    margin-bottom: 8px;
    display: inline-block;
    animation: bounce 0.7s ease;
  }
  @keyframes bounce {
    0% { transform: scale(0); }
    60% { transform: scale(1.2); }
    100% { transform: scale(1); }
  }
  .results h2 { font-size: 1.8rem; margin-bottom: 6px; }
  .results .rank {
    display: inline-block;
    padding: 6px 16px;
    border-radius: 999px;
    background: linear-gradient(90deg, #ffae5c, #ff8ab5);
    color: white;
    font-weight: 700;
    margin-bottom: 14px;
  }
  .results .score-line {
    font-size: 1.2rem;
    color: var(--ink-soft);
    margin-bottom: 6px;
  }
  .results .score-line strong { color: var(--ink); font-size: 1.6rem; }
  .results .summary {
    text-align: left;
    background: #faf7ff;
    border-radius: 14px;
    padding: 18px;
    margin: 22px auto;
    max-width: 560px;
  }
  .results .summary h3 { font-size: 1rem; margin-bottom: 10px; color: var(--ink-soft); }
  .results .summary ul { list-style: none; padding: 0; }
  .results .summary li {
    padding: 6px 0;
    border-bottom: 1px solid var(--line);
    display: flex;
    gap: 8px;
    align-items: flex-start;
    font-size: 0.95rem;
  }
  .results .summary li:last-child { border-bottom: 0; }
  .results .summary li .mark {
    font-weight: 700;
    flex-shrink: 0;
    width: 24px;
  }
  .results .summary li .mark.ok { color: var(--good); }
  .results .summary li .mark.no { color: var(--bad); }
  .results .summary li .mark.partial { color: var(--warn); }
  .results .actions-row {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
  }

  /* confetti */
  .confetti-piece {
    position: fixed;
    width: 9px; height: 16px;
    top: -20px;
    pointer-events: none;
    z-index: 9999;
    animation: fall linear forwards;
  }
  @keyframes fall {
    0% { transform: translateY(0) rotate(0); opacity: 1; }
    100% { transform: translateY(120vh) rotate(720deg); opacity: 0; }
  }

  /* hint */
  .hint-btn {
    background: transparent;
    border: 0;
    color: #7a5cb1;
    font: inherit;
    font-size: 0.92rem;
    text-decoration: underline;
    cursor: pointer;
    padding: 4px 0;
  }
  .hint-text {
    color: var(--ink-soft);
    background: #faf6e8;
    border-radius: 10px;
    padding: 10px 14px;
    margin-top: 10px;
    font-size: 0.95rem;
    border-left: 3px solid #f1c84e;
  }

  /* small */
  @media (max-width: 600px) {
    body { padding: 14px; }
    .quiz, .welcome, .results { padding: 22px 18px; }
    .welcome h1 { font-size: 1.75rem; }
    .question .stem { font-size: 1.05rem; }
    .tf-buttons { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="app" id="app"></div>

<script>
/* =========================================================
   CARA'S PHYSICS REVISION — auto-marking question bank
   ========================================================= */

const QUESTIONS = [
  /* ---------------- 1. ENERGY ---------------- */
  {
    id: 'energy',
    name: 'Energy',
    emoji: '⚡',
    color: '#f39c12',
    stripe: 'linear-gradient(90deg, #ffae5c, #ffd166)',
    intro: "Start with the basics — types of energy, units, and the principle that ties it all together.",
    questions: [
      { type: 'mc',
        q: "Which of these is a form of <em>active</em> energy?",
        options: ["Chemical","Gravitational potential","Kinetic","Strain"],
        answer: 2,
        explanation: "Active forms are heat, light, sound, electrical, magnetic and kinetic. The other three in the list are types of <em>potential</em> (stored) energy."
      },
      { type: 'mc',
        q: "Which is a type of <em>potential</em> energy?",
        options: ["Sound","Strain (elastic)","Electrical","Heat"],
        answer: 1,
        explanation: "Potential energy is stored — chemical, strain/elastic and gravitational. Sound, electrical and heat are active forms."
      },
      { type: 'fill',
        q: "The unit of energy is ___.",
        answers: ["joules","joule","j"],
        explanation: "Energy is measured in joules (J). About 1 joule is needed to lift an apple vertically 1 metre."
      },
      { type: 'mc',
        q: "An apple weighs about 1 newton. Roughly how much energy is needed to lift it vertically 1 metre?",
        options: ["1 joule","10 joules","100 joules","1000 joules"],
        answer: 0,
        explanation: "Work done = force × distance = 1 N × 1 m = 1 J. So 1 joule is a tiny amount of energy — roughly enough to lift an apple 1 metre. A useful way to picture how small a joule really is."
      },
      { type: 'tf',
        q: "Energy can be created and destroyed.",
        answer: false,
        explanation: "False. The principle of conservation of energy says energy can be <em>changed</em> from one form to another, but the total never changes."
      },
      { type: 'short',
        q: "State the principle of conservation of energy.",
        keywords: [
          ["energy"],
          ["changed","transferred","converted","transformed"],
          ["total","not","same","conserved","destroyed","created"]
        ],
        model: "Energy can be changed from one form to another, but the total amount of energy does not change.",
        explanation: "The key idea is that total energy in = total energy out. It is transferred, never created or destroyed."
      },
      { type: 'sort',
        q: "Sort each energy type into <em>Potential</em> or <em>Active</em>.",
        categories: { Potential: ["Chemical","Strain","Gravitational"], Active: ["Heat","Light","Sound","Electrical","Magnetic","Kinetic"] },
        explanation: "Potential = stored. Active = doing something (moving, heating, lighting, etc.)."
      },
      { type: 'mc',
        q: "A battery and a piece of food are both examples of which energy store?",
        options: ["Kinetic","Chemical potential","Sound","Strain"],
        answer: 1,
        explanation: "Food, fuel, batteries — all chemical potential energy."
      }
    ]
  },

  /* ---------------- 2. RENEWABLES ---------------- */
  {

/* =========================================================
   APP STATE & ENGINE
   ========================================================= */
const STORE_KEY = 'caras-physics-revision-v1';
const state = {
  screen: 'welcome',
  currentTopic: null,
  currentIdx: 0,
  answers: [], // per question: {correct, partial?, given?}
  streak: 0,
  questionOrder: [],
  scores: load().scores || {} // {topicId: {best:N, total:N}}
};

function load() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; }
  catch(e) { return {}; }
}
function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify({scores: state.scores})); } catch(e) {}
}

/* Fisher-Yates shuffle */
function shuffle(a) {
  const arr = [...a];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

/* =========================================================
   RENDER

const $app = document.getElementById('app');

function render() {
  if (state.screen === 'welcome') renderWelcome();
  else if (state.screen === 'menu') renderMenu();
  else if (state.screen === 'quiz') renderQuiz();
  else if (state.screen === 'results') renderResults();
}

}

/* ---------- QUIZ ---------- */
function startTopic(id) {
  state.currentTopic = QUESTIONS.find(t => t.id === id);
  state.currentIdx = 0;
  state.answers = [];
  state.streak = 0;
  state.questionOrder = shuffle(state.currentTopic.questions);
  state.screen = 'quiz';
  render();
}

function renderQuiz() {
  const t = state.currentTopic;
  const q = state.questionOrder[state.currentIdx];
  const total = state.questionOrder.length;
  const pct = ((state.currentIdx) / total) * 100;
  const answered = state.answers[state.currentIdx];

  $app.innerHTML = `
    ${topBar()}
    <div class="quiz">
      <div class="header">
        <span class="emoji">${t.emoji}</span>
        <div class="info">
          <h2>${t.name}</h2>

        </div>

      </div>
      <div class="progress-bar"><div style="width:${pct}%"></div></div>
      <div class="question" id="qbody">${renderQuestion(q, answered)}</div>

        <button class="btn" onclick="go('menu')">← Back to topics</button>
        <button class="btn primary" id="next-btn" onclick="nextQuestion()" ${answered ? '' : 'disabled'}>
          ${state.currentIdx + 1 === total ? 'See results →' : 'Next question →'}
        </button>
      </div>
    </div>
  `;
}

function renderQuestion(q, ans) {
  const tag = ({mc:'Multiple Choice', fill:'Fill in the Blank', short:'Short Answer', num:'Calculation', tf:'True or False', sort:'Sort & Match'})[q.type] || '';
  const body = (() => {
    switch (q.type) {
      case 'mc': return renderMC(q, ans);
      case 'fill': return renderFill(q, ans);
      case 'short': return renderShort(q, ans);
      case 'num': return renderNum(q, ans);
      case 'tf': return renderTF(q, ans);
      case 'sort': return renderSort(q, ans);
    }
    return '';
  })();
  const feedback = ans ? renderFeedback(ans, q) : '';
  return `<span class="type-tag">${tag}</span><div class="stem">${q.q}</div>${body}${feedback}`;
}

/* ---------- MC ---------- */
function renderMC(q, ans) {
  const letters = ['A','B','C','D','E','F'];
  const opts = q.options.map((opt, i) => {
    let cls = 'option';
    if (ans) {
      cls += ' disabled';
      if (i === q.answer) cls += ' correct';
      else if (i === ans.given) cls += ' wrong';
    }
    const onclick = ans ? '' : `onclick="answerMC(${i})"`;
    return `<button class="${cls}" ${onclick}><span class="letter">${letters[i]}</span><span>${opt}</span></button>`;
  }).join('');
  return `<div class="options">${opts}</div>`;
}

function answerMC(i) {
  const q = state.questionOrder[state.currentIdx];
  const correct = i === q.answer;
  recordAnswer({correct, given: i});
}

/* ---------- FILL ---------- */
function renderFill(q, ans) {
  const v = ans ? ans.given : '';
  const cls = ans ? (ans.correct ? 'correct' : 'wrong') : '';
  const ro = ans ? 'readonly' : '';
  return `
    <div class="fill-in">
      <input id="fill-input" type="text" class="${cls}" value="${escapeAttr(v)}" placeholder="Type your answer…" ${ro} onkeydown="if(event.key==='Enter') checkFill()">
      ${ans ? '' : '<button class="btn primary" onclick="checkFill()">Check</button>'}
    </div>
  `;
}

function checkFill() {
  const inp = document.getElementById('fill-input');
  const given = inp.value.trim();
  if (!given) return;
  const q = state.questionOrder[state.currentIdx];
  const norm = given.toLowerCase().replace(/[.,!?]/g,'').trim();
  const correct = q.answers.some(a => {
    const an = a.toLowerCase().trim();
    return norm === an || norm.includes(an) || an.includes(norm);
  });
  recordAnswer({correct, given});
}

/* ---------- SHORT ANSWER ---------- */
function renderShort(q, ans) {
  const v = ans ? ans.given : '';
  const ro = ans ? 'readonly' : '';
  const cls = ans ? 'locked' : '';
  return `
    <textarea id="short-input" class="short-answer ${cls}" placeholder="Type your answer in a sentence or two…" ${ro}>${escapeHtml(v)}</textarea>
    ${ans ? '' : '<div style="margin-top:10px;display:flex;gap:10px;align-items:center;"><button class="btn primary" onclick="checkShort()">Check</button><button class="hint-btn" onclick="showModel()">Show model answer</button></div>'}
    <div id="model-display"></div>
  `;
}

function showModel() {
  const q = state.questionOrder[state.currentIdx];
  document.getElementById('model-display').innerHTML =
    `<div class="hint-text"><strong>Model answer:</strong> ${q.model}</div>`;
}

function checkShort() {
  const inp = document.getElementById('short-input');
  const given = inp.value.trim();
  if (!given) return;
  const q = state.questionOrder[state.currentIdx];
  const lower = ' ' + given.toLowerCase().replace(/[.,!?;:\-]/g,' ') + ' ';
  let groupsMatched = 0;
  for (const group of q.keywords) {
    if (group.some(k => lower.includes(' ' + k.toLowerCase() + ' ') || lower.includes(k.toLowerCase()))) {
      groupsMatched++;
    }
  }
  const ratio = groupsMatched / q.keywords.length;
  let correct = false, partial = false;
  if (ratio >= 0.85) correct = true;
  else if (ratio >= 0.5) partial = true;
  recordAnswer({correct, partial, given, ratio, groupsMatched, totalGroups: q.keywords.length});
}

/* ---------- NUMERICAL ---------- */
function renderNum(q, ans) {
  const v = ans ? ans.given : '';
  const cls = ans ? (ans.correct ? 'correct' : 'wrong') : '';
  const ro = ans ? 'readonly' : '';
  return `
    <div class="num-input">
      <input id="num-input" type="number" step="any" class="${cls}" value="${escapeAttr(v)}" placeholder="?" ${ro} onkeydown="if(event.key==='Enter') checkNum()">

function checkNum() {
  const inp = document.getElementById('num-input');
  if (inp.value === '') return;
  const given = parseFloat(inp.value);
  const q = state.questionOrder[state.currentIdx];
  const correct = Math.abs(given - q.answer) <= (q.tolerance || 0);

/* ---------- TRUE / FALSE ---------- */
function renderTF(q, ans) {
  let cT = 'tf-btn', cF = 'tf-btn';
  if (ans) {
    cT += ' disabled'; cF += ' disabled';
    if (q.answer === true) cT += ' correct';
    else cF += ' correct';
    if (ans.given === true && !ans.correct) cT += ' wrong';
    if (ans.given === false && !ans.correct) cF += ' wrong';
  }
  const ontT = ans ? '' : 'onclick="answerTF(true)"';
  const ontF = ans ? '' : 'onclick="answerTF(false)"';
  return `
    <div class="tf-buttons">
      <button class="${cT}" ${ontT}>✓ True</button>
      <button class="${cF}" ${ontF}>✗ False</button>
    </div>
  `;
}

function answerTF(val) {
  const q = state.questionOrder[state.currentIdx];
  recordAnswer({correct: val === q.answer, given: val});
}

/* ---------- SORT / MATCH ---------- */
let sortDragItem = null;
let sortTapSelected = null;

function renderSort(q, ans) {
  // build initial pool of items if not answered
  if (!ans) {
    if (!q._allItems) {
      const all = [];
      for (const cat of Object.keys(q.categories)) {
        for (const item of q.categories[cat]) all.push({item, cat});
      }
      q._allItems = all;
    }
    if (!q._currentPlacement) {
      q._currentPlacement = {};
      q._allItems.forEach(({item}) => q._currentPlacement[item] = '_pool');
    }
    const pool = q._allItems.filter(x => q._currentPlacement[x.item] === '_pool').map(x => x.item);
    const cats = Object.keys(q.categories);
    const shuffled = shuffle(pool);
    return `
      <div class="sort">
        <div class="sort-items" id="sort-pool" ondragover="event.preventDefault()" ondrop="dropTo('_pool')">
          ${shuffled.map(it => sortChipHTML(it, q, false)).join('') || '<span style="color:#9aa;align-self:center;font-size:0.9rem;">All placed!</span>'}
        </div>
        <div class="sort-categories">
          ${cats.map(c => `
            <div class="sort-cat" ondragover="event.preventDefault();this.classList.add('over')" ondragleave="this.classList.remove('over')" ondrop="this.classList.remove('over');dropTo('${escapeAttr(c)}')" onclick="tapPlace('${escapeAttr(c)}')">
              <h4>${c}</h4>
              <div class="drop-zone">
                ${q._allItems.filter(x => q._currentPlacement[x.item] === c).map(x => sortChipHTML(x.item, q, false)).join('')}
              </div>
            </div>
          `).join('')}
        </div>
        <div style="text-align:right;">
          <button class="btn primary" onclick="checkSort()" ${Object.values(q._currentPlacement).every(v => v !== '_pool') ? '' : 'disabled'}>Check answers</button>
        </div>
      </div>
    `;
  }
  // answered: show with marks
  const cats = Object.keys(q.categories);
  return `
    <div class="sort">
      <div class="sort-categories">
        ${cats.map(c => `
          <div class="sort-cat">
            <h4>${c}</h4>
            <div class="drop-zone">
              ${q._allItems.filter(x => q._currentPlacement[x.item] === c).map(x => {
                const correct = x.cat === c;
                return `<span class="sort-chip ${correct ? 'correct' : 'wrong'}">${x.item}${correct ? ' ✓' : ' ✗'}</span>`;
              }).join('')}
            </div>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

function sortChipHTML(item, q, placed) {
  const isSelected = sortTapSelected === item;
  return `<span class="sort-chip${isSelected ? ' tap-selected' : ''}" draggable="true"
    ondragstart="sortDragItem='${escapeAttr(item)}';this.classList.add('dragging')"
    ondragend="this.classList.remove('dragging')"
    onclick="event.stopPropagation();tapSelect('${escapeAttr(item)}')">${item}</span>`;
}

function tapSelect(item) {
  sortTapSelected = sortTapSelected === item ? null : item;
  render();
}

function tapPlace(cat) {
  if (!sortTapSelected) return;
  const q = state.questionOrder[state.currentIdx];
  if (!q._currentPlacement) return;
  q._currentPlacement[sortTapSelected] = cat;
  sortTapSelected = null;
  render();
}

function dropTo(cat) {
  if (!sortDragItem) return;
  const q = state.questionOrder[state.currentIdx];
  q._currentPlacement[sortDragItem] = cat;
  sortDragItem = null;
  render();
}

function checkSort() {
  const q = state.questionOrder[state.currentIdx];
  let correctCount = 0;
  for (const x of q._allItems) {
    if (q._currentPlacement[x.item] === x.cat) correctCount++;
  }
  const ratio = correctCount / q._allItems.length;
  let correct = false, partial = false;
  if (ratio === 1) correct = true;
  else if (ratio >= 0.6) partial = true;
  recordAnswer({correct, partial, given: 'sort', ratio, correctCount, totalItems: q._allItems.length});
}

/* =========================================================
   RECORD + FEEDBACK
   ========================================================= */
function recordAnswer(ans) {
  state.answers[state.currentIdx] = ans;
  if (ans.correct) {
    state.streak++;
    if (state.streak === 3 || state.streak === 5 || state.streak === 8) burstConfetti(15);
  } else {
    state.streak = 0;
  }
  render();
}

function renderFeedback(ans, q) {
  if (ans.correct) {
    const msgs = [
      "Nice — that's right.",
      "Spot on, Cara.",
      "Got it — well done.",
      "Yes! Bang on.",
      "Perfect. Keep going.",
      "Exactly right.",
      "Nice spotting!"
    ];
    const msg = msgs[Math.floor(Math.random() * msgs.length)];
    return `<div class="feedback good"><div class="head">${msg}</div>${q.explanation}</div>`;
  }
  if (ans.partial) {
    const acceptableModel = q.model ? `<div class="answer-line"><strong>Model answer:</strong> ${q.model}</div>` : '';
    return `<div class="feedback partial">
      <div class="head">Partly there.</div>
      ${ans.totalGroups ? `You got ${ans.groupsMatched} of the ${ans.totalGroups} key ideas. ` : ''}
      ${ans.totalItems ? `You placed ${ans.correctCount} of ${ans.totalItems} correctly. ` : ''}
      ${q.explanation}
      ${acceptableModel}
    </div>`;
  }
  let answerLine = '';
  if (q.type === 'mc') answerLine = `<div class="answer-line"><strong>Answer:</strong> ${q.options[q.answer]}</div>`;
  else if (q.type === 'fill') answerLine = `<div class="answer-line"><strong>Answer:</strong> ${q.answers[0]}</div>`;
  else if (q.type === 'num') answerLine = `<div class="answer-line"><strong>Answer:</strong> ${q.answer}${q.unit ? ' ' + q.unit : ''}</div>`;
  else if (q.type === 'tf') answerLine = `<div class="answer-line"><strong>Answer:</strong> ${q.answer ? 'True' : 'False'}</div>`;
  else if (q.type === 'short') answerLine = q.model ? `<div class="answer-line"><strong>Model answer:</strong> ${q.model}</div>` : '';
  return `<div class="feedback bad">
    <div class="head">Not this time.</div>
    ${q.explanation}
    ${answerLine}
  </div>`;
}

/* ---------- NEXT / RESULTS ---------- */
function nextQuestion() {
  if (state.currentIdx + 1 >= state.questionOrder.length) {
    finishQuiz();
  } else {
    state.currentIdx++;
    // reset sort interaction state across questions
    sortTapSelected = null;
    render();
  }
}

function finishQuiz() {
  const t = state.currentTopic;
  let score = 0;
  state.answers.forEach((a) => {
    if (a.correct) score += 1;
    else if (a.partial) score += 0.5;
  });
  // store best
  const total = state.questionOrder.length;
  const prev = state.scores[t.id];
  if (!prev || score > prev.best) {
    state.scores[t.id] = { best: score, total };
  }
  save();
  // clear sort caches for re-attempts
  t.questions.forEach(q => { delete q._allItems; delete q._currentPlacement; });
  state.screen = 'results';
  render();
}

function renderResults() {
  const t = state.currentTopic;
  let score = 0;
  state.answers.forEach((a) => {
    if (a.correct) score += 1;
    else if (a.partial) score += 0.5;
  });
  const total = state.questionOrder.length;
  const pct = Math.round((score / total) * 100);

  let ribbon, rank, msg;
  if (pct >= 90) { ribbon = '🏆'; rank = 'Physics Pro'; msg = "Brilliant work, Cara. You've really got this topic locked in."; burstConfetti(60); }
  else if (pct >= 75) { ribbon = '🌟'; rank = 'Strong revision'; msg = "Great going. Just a couple to tighten up and you're there."; burstConfetti(30); }
  else if (pct >= 50) { ribbon = '🚀'; rank = 'Good progress'; msg = "Solid effort — go back over the ones you missed and try again."; }
  else { ribbon = '📘'; rank = 'Worth another go'; msg = "Don't worry — this is exactly why you revise. Read back through the notes for these and have another try."; }

  const summary = state.answers.map((a, i) => {
    const q = state.questionOrder[i];
    const stem = (q.q || '').replace(/<[^>]+>/g,'').slice(0, 100);
    let mark = '<span class="mark no">✗</span>';
    if (a.correct) mark = '<span class="mark ok">✓</span>';
    else if (a.partial) mark = '<span class="mark partial">~</span>';
    return `<li>${mark}<span>${stem}${(q.q || '').length > 100 ? '…' : ''}</span></li>`;
  }).join('');

  // suggest next topic
  const idx = QUESTIONS.findIndex(x => x.id === t.id);
  const nextTopic = QUESTIONS[(idx + 1) % QUESTIONS.length];

  $app.innerHTML = `
    ${topBar()}
    <div class="results">
      <span class="ribbon">${ribbon}</span>
      <h2>${t.emoji} ${t.name}</h2>
      <div class="rank">${rank}</div>
      <p class="score-line">You scored <strong>${score}</strong> out of <strong>${total}</strong> &nbsp;·&nbsp; ${pct}%</p>
      <p style="color:var(--ink-soft);max-width:520px;margin:8px auto 0;">${msg}</p>
      <div class="summary">
        <h3>Question summary</h3>
        <ul>${summary}</ul>
      </div>
      <div class="actions-row">
        <button class="btn" onclick="startTopic('${t.id}')">↻ Try again</button>
        <button class="btn primary" onclick="startTopic('${nextTopic.id}')">Next topic: ${nextTopic.emoji} ${nextTopic.name} →</button>
        <button class="btn" onclick="go('menu')">All topics</button>
      </div>
    </div>
  `;
}

/* =========================================================
   UTIL
   ========================================================= */
function go(screen) {
  state.screen = screen;
  sortTapSelected = null;
  render();
}

function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(s) {
  return escapeHtml(s).replace(/`/g, '&#96;');
}

function burstConfetti(count) {
  const colours = ['#ff8ab5','#ffae5c','#ffd166','#6ec3ff','#c08af0','#2ecc71'];
  for (let i = 0; i < count; i++) {
    const p = document.createElement('div');
    p.className = 'confetti-piece';
    p.style.left = (Math.random() * 100) + 'vw';
    p.style.background = colours[Math.floor(Math.random() * colours.length)];
    p.style.animationDuration = (1.6 + Math.random() * 1.4) + 's';
    p.style.animationDelay = (Math.random() * 0.3) + 's';
    p.style.transform = `rotate(${Math.random() * 360}deg)`;
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 3500);
  }
}

render();
</script>
