<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order in the Court! - S2 Legislation</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
    --bg:#0d0b1e;--bg2:#16132b;--bg3:#1e1a36;
    --gold:#d4a017;--gold-b:#ffd700;--gold-dim:#a68312;
    --danger:#c62828;--danger-l:#ef5350;
    --success:#2e7d32;--success-l:#66bb6a;
    --text:#f0ece2;--text-dim:#a09bb5;
    --blue:#3b82f6;--purple:#8b5cf6;--green:#22c55e;--orange:#f59e0b;
}
body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:linear-gradient(145deg,var(--bg),var(--bg2) 50%,var(--bg3));color:var(--text);min-height:100vh;overflow-x:hidden}
.container{max-width:680px;margin:0 auto;padding:24px 16px;position:relative}

/* ── INTRO ── */
#intro{text-align:center;animation:fadeIn .6s ease}
#intro .judge-wrap{margin:0 auto 20px;width:220px;position:relative}
.judge-img-intro{display:block;width:100%;height:auto;border-radius:12px;filter:drop-shadow(0 8px 30px rgba(212,160,23,.25))}
#intro h1{font-size:clamp(1.8rem,6vw,2.8rem);background:linear-gradient(135deg,var(--gold-b),var(--gold),#fff5c0);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px;letter-spacing:1px}
#intro .tagline{color:var(--text-dim);font-size:.95rem;line-height:1.6;margin-bottom:6px}
#intro .sub{color:var(--text-dim);font-size:.82rem;margin-bottom:28px;opacity:.7}
.start-btn{background:linear-gradient(135deg,var(--gold),var(--gold-b));color:#0d0b1e;border:none;padding:16px 40px;border-radius:999px;font-size:1.1rem;font-weight:800;cursor:pointer;letter-spacing:1px;transition:transform .2s,box-shadow .2s;box-shadow:0 4px 24px rgba(212,160,23,.35)}
.start-btn:hover{transform:translateY(-2px) scale(1.03);box-shadow:0 8px 32px rgba(212,160,23,.5)}

/* ── TOP BAR ── */
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;padding:10px 14px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:12px;font-size:.82rem}
.case-counter{color:var(--text-dim);font-weight:600}
.score-display{color:var(--gold-b);font-weight:800;letter-spacing:.5px}
.progress-track{width:100%;height:4px;background:rgba(255,255,255,.08);border-radius:99px;margin-top:8px}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-b));border-radius:99px;transition:width .4s ease}

/* ── JUDGE PANEL ── */
.judge-panel{display:flex;align-items:flex-start;gap:12px;margin-bottom:18px;position:relative}
.judge-game-wrap{width:120px;min-width:120px;position:relative;overflow:visible}
.judge-img{width:100%;height:auto;border-radius:8px;transition:opacity .15s;display:block;position:relative;z-index:1}
.speech-bubble{flex:1;background:#fff;color:#1a1a2e;border-radius:16px;padding:12px 16px;font-weight:700;font-size:.92rem;line-height:1.45;position:relative;opacity:0;transform:scale(.9);transition:opacity .3s,transform .3s;min-height:52px;display:flex;align-items:center}
.speech-bubble.show{opacity:1;transform:scale(1)}
.speech-bubble::before{content:'';position:absolute;left:-10px;top:20px;width:0;height:0;border-top:8px solid transparent;border-bottom:8px solid transparent;border-right:12px solid #fff}
.speech-text{line-height:1.5}

/* ── EXPLOSION EFFECTS ── */
.explosion-flash{position:absolute;inset:-30px;border-radius:16px;background:radial-gradient(circle,rgba(255,220,50,.7),rgba(255,100,0,.4) 40%,transparent 70%);opacity:0;pointer-events:none;z-index:0}
.explosion-flash.boom{animation:flashBoom .5s ease-out forwards}
.explosion-ring{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:20px;height:20px;border-radius:50%;border:3px solid rgba(255,200,0,.8);opacity:0;pointer-events:none;z-index:3}
.explosion-ring.boom{animation:explosionRing .65s ease-out forwards}
.explosion-particle{position:absolute;top:50%;left:50%;border-radius:50%;pointer-events:none;z-index:3}
.explosion-particle.boom{animation:particleFly .7s ease-out forwards}
.explosion-spark{position:absolute;width:3px;pointer-events:none;z-index:3;border-radius:2px}
.explosion-spark.boom{animation:sparkFly .55s ease-out forwards}

/* ── CASE CARD ── */
.case-card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:20px;margin-bottom:18px;position:relative;overflow:hidden}
.case-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--gold),var(--gold-b),var(--gold))}
.case-card.enter{animation:slideUp .4s ease}
.case-label{display:inline-block;font-size:.7rem;letter-spacing:2px;text-transform:uppercase;color:var(--gold-b);font-weight:800;margin-bottom:10px;background:rgba(212,160,23,.12);padding:4px 10px;border-radius:6px}
.case-scenario{font-size:1rem;line-height:1.65;color:var(--text)}

/* ── BUTTONS ── */
.btn-row{display:flex;gap:12px;margin-bottom:14px}
.btn-row.law-btns{flex-wrap:wrap}
.verdict-btn{flex:1;padding:16px 12px;border:2px solid;border-radius:14px;font-size:1rem;font-weight:800;cursor:pointer;transition:transform .15s,box-shadow .15s;letter-spacing:.5px;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:8px;min-height:56px}
.verdict-btn:active{transform:scale(.96)}
.btn-guilty{background:rgba(198,40,40,.15);border-color:var(--danger);color:var(--danger-l)}
.btn-guilty:hover{background:rgba(198,40,40,.3);box-shadow:0 4px 20px rgba(198,40,40,.3)}
.btn-not-guilty{background:rgba(46,125,50,.15);border-color:var(--success);color:var(--success-l)}
.btn-not-guilty:hover{background:rgba(46,125,50,.3);box-shadow:0 4px 20px rgba(46,125,50,.3)}

.law-btn{flex:1 1 calc(50% - 6px);padding:14px 10px;border:2px solid;border-radius:12px;font-size:.78rem;font-weight:700;cursor:pointer;transition:transform .15s,box-shadow .15s,background .15s;text-align:center;line-height:1.35;min-height:64px;display:flex;align-items:center;justify-content:center}
.law-btn:active{transform:scale(.96)}
.law-btn[data-law="cma"]{background:rgba(59,130,246,.1);border-color:var(--blue);color:#93c5fd}
.law-btn[data-law="cma"]:hover{background:rgba(59,130,246,.25);box-shadow:0 4px 16px rgba(59,130,246,.25)}
.law-btn[data-law="cdpa"]{background:rgba(139,92,246,.1);border-color:var(--purple);color:#c4b5fd}
.law-btn[data-law="cdpa"]:hover{background:rgba(139,92,246,.25);box-shadow:0 4px 16px rgba(139,92,246,.25)}
.law-btn[data-law="dpa"]{background:rgba(34,197,94,.1);border-color:var(--green);color:#86efac}
.law-btn[data-law="dpa"]:hover{background:rgba(34,197,94,.25);box-shadow:0 4px 16px rgba(34,197,94,.25)}
.law-btn[data-law="ccr"]{background:rgba(245,158,11,.1);border-color:var(--orange);color:#fcd34d}
.law-btn[data-law="ccr"]:hover{background:rgba(245,158,11,.25);box-shadow:0 4px 16px rgba(245,158,11,.25)}

.law-btn.correct-law{animation:correctPop .4s ease}
.law-btn.wrong-law{opacity:.4;transform:scale(.95)}
.law-btn.highlight-correct{border-width:3px;box-shadow:0 0 20px rgba(34,197,94,.4)}

.law-prompt{text-align:center;color:var(--gold-b);font-weight:700;font-size:.92rem;margin-bottom:12px;animation:fadeIn .3s ease}

/* ── FEEDBACK ── */
.feedback-panel{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:16px 18px;margin-bottom:14px;animation:slideUp .35s ease}
.fb-header{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.fb-icon{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.1rem;font-weight:800}
.fb-icon.correct{background:rgba(34,197,94,.2);color:var(--green)}
.fb-icon.wrong{background:rgba(198,40,40,.2);color:var(--danger-l)}
.fb-icon.partial{background:rgba(245,158,11,.2);color:var(--orange)}
.fb-label{font-weight:800;font-size:.95rem}
.fb-label.correct{color:var(--success-l)}
.fb-label.wrong{color:var(--danger-l)}
.fb-label.partial{color:var(--orange)}
.fb-text{color:var(--text-dim);font-size:.88rem;line-height:1.6;margin-bottom:4px}
.fb-law{display:inline-block;padding:4px 10px;border-radius:6px;font-size:.75rem;font-weight:700;margin-top:4px}
.fb-law[data-law="cma"]{background:rgba(59,130,246,.15);color:#93c5fd}
.fb-law[data-law="cdpa"]{background:rgba(139,92,246,.15);color:#c4b5fd}
.fb-law[data-law="dpa"]{background:rgba(34,197,94,.15);color:#86efac}
.fb-law[data-law="ccr"]{background:rgba(245,158,11,.15);color:#fcd34d}

.next-btn{width:100%;padding:14px;border:none;border-radius:12px;background:linear-gradient(135deg,var(--gold),var(--gold-b));color:#0d0b1e;font-size:.95rem;font-weight:800;cursor:pointer;letter-spacing:.5px;transition:transform .15s,box-shadow .15s}
.next-btn:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(212,160,23,.35)}

/* ── RESULTS ── */
#results{animation:fadeIn .6s ease}
#results h2{text-align:center;font-size:1.8rem;margin-bottom:4px;background:linear-gradient(135deg,var(--gold-b),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.results-sub{text-align:center;color:var(--text-dim);font-size:.88rem;margin-bottom:20px}
.score-ring{width:140px;height:140px;margin:0 auto 20px;position:relative}
.score-ring svg{transform:rotate(-90deg)}
.score-ring-bg{fill:none;stroke:rgba(255,255,255,.08);stroke-width:8}
.score-ring-fill{fill:none;stroke:var(--gold-b);stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset 1.2s ease}
.score-ring-text{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.score-ring-num{font-size:2rem;font-weight:800;color:var(--gold-b)}
.score-ring-label{font-size:.72rem;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px}
.results-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
.stat-box{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:12px 8px;text-align:center}
.stat-num{font-size:1.5rem;font-weight:800}
.stat-num.green{color:var(--success-l)}
.stat-num.red{color:var(--danger-l)}
.stat-num.amber{color:var(--orange)}
.stat-label{font-size:.68rem;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;margin-top:2px}
.results-breakdown{margin-bottom:20px}
.results-breakdown h3{font-size:.85rem;color:var(--text-dim);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:10px}
.rb-item{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;background:rgba(255,255,255,.03);border-radius:10px;margin-bottom:6px;font-size:.82rem;line-height:1.45}
.rb-num{min-width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.68rem;font-weight:800;color:#fff}
.rb-num.g{background:var(--success)}
.rb-num.r{background:var(--danger)}
.rb-num.p{background:var(--orange)}
.rb-detail{flex:1;color:var(--text-dim)}
.rb-result{font-weight:700;margin-right:4px}
.rb-result.g{color:var(--success-l)}
.rb-result.r{color:var(--danger-l)}
.rb-result.p{color:var(--orange)}
.retry-btn{width:100%;padding:14px;border:2px solid var(--gold);border-radius:12px;background:transparent;color:var(--gold-b);font-size:1rem;font-weight:800;cursor:pointer;transition:background .2s,transform .15s;letter-spacing:.5px;margin-bottom:10px}
.retry-btn:hover{background:rgba(212,160,23,.12);transform:translateY(-1px)}
.home-link{display:block;text-align:center;color:var(--text-dim);font-size:.82rem;text-decoration:none;padding:8px}
.home-link:hover{color:var(--text)}

/* ── SCREEN SHAKE ── */
.shake{animation:screenShake .5s ease}

/* ── HIDDEN ── */
.hidden{display:none!important}

/* ── KEYFRAMES ── */
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes screenShake{
    0%,100%{transform:translateX(0)}
    10%{transform:translateX(-8px) translateY(3px)}
    20%{transform:translateX(8px) translateY(-3px)}
    30%{transform:translateX(-7px) translateY(2px)}
    40%{transform:translateX(7px) translateY(-1px)}
    50%{transform:translateX(-5px)}
    60%{transform:translateX(5px)}
    70%{transform:translateX(-3px)}
    80%{transform:translateX(3px)}
}
@keyframes correctPop{
    0%{transform:scale(1)}
    40%{transform:scale(1.08)}
    100%{transform:scale(1)}
}
@keyframes flashBoom{
    0%{opacity:0;transform:scale(.8)}
    25%{opacity:1;transform:scale(1)}
    100%{opacity:0;transform:scale(1.2)}
}
@keyframes explosionRing{
    0%{width:20px;height:20px;opacity:1;border-width:4px}
    100%{width:220px;height:220px;opacity:0;border-width:1px}
}
@keyframes particleFly{
    0%{transform:translate(0,0) scale(1);opacity:1}
    100%{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0}
}
@keyframes sparkFly{
    0%{transform:translate(0,0) scaleY(1);opacity:1}
    100%{transform:translate(var(--dx),var(--dy)) scaleY(.3);opacity:0}
}
@keyframes judgeSlam{
    0%{transform:scale(1)}
    15%{transform:scale(1.12)}
    30%{transform:scale(.97)}
    45%{transform:scale(1.04)}
    60%{transform:scale(.99)}
    100%{transform:scale(1)}
}

/* ── JUDGE VERDICT BANNER ── */
.verdict-banner{position:fixed;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;z-index:100;pointer-events:none;opacity:0}
.verdict-banner.show{animation:bannerFlash .7s ease forwards}
.verdict-banner .banner-text{font-size:clamp(2.2rem,8vw,4rem);font-weight:900;letter-spacing:3px;text-shadow:0 4px 30px rgba(0,0,0,.6)}
.verdict-banner.guilty-banner{background:rgba(198,40,40,.15)}
.verdict-banner.guilty-banner .banner-text{color:var(--danger-l)}
.verdict-banner.free-banner{background:rgba(46,125,50,.1)}
.verdict-banner.free-banner .banner-text{color:var(--success-l)}
@keyframes bannerFlash{
    0%{opacity:0;backdrop-filter:blur(0px)}
    20%{opacity:1;backdrop-filter:blur(3px)}
    70%{opacity:1;backdrop-filter:blur(3px)}
    100%{opacity:0;backdrop-filter:blur(0px)}
}

/* ── RESPONSIVE ── */
@media(max-width:500px){
    #intro .judge-wrap{width:180px}
    .judge-game-wrap{width:95px;min-width:95px}
    .speech-bubble{font-size:.84rem;padding:10px 12px}
    .verdict-btn{padding:14px 8px;font-size:.9rem}
    .law-btn{font-size:.72rem;padding:12px 8px;min-height:56px}
    .case-scenario{font-size:.92rem}
}
</style>
</head>

/* ── JUDGE IMAGE SWAP ── */
function setJudge(state) {
    const img = $('judge-img');
    if (!img) return;
    if (state === 'furious') {
        img.src = JUDGE_ANGRY;
    } else {
        img.src = JUDGE_NEUTRAL;
    }
}

function setSpeech(text) {
    const bubble = $('speech-bubble');
    const txt = $('speech-text');
    txt.textContent = text;
    bubble.classList.remove('show');
    void bubble.offsetWidth;
    bubble.classList.add('show');
}

/* ── EXPLOSION ANIMATION ── */
function triggerExplosion() {
    const wrap = $('judge-wrap');
    const img = $('judge-img');

    // 1. Screen shake
    const mc = $('main-container');
    mc.classList.remove('shake');
    void mc.offsetWidth;
    mc.classList.add('shake');

    // 2. Judge image slam/bounce
    img.style.animation = 'none';
    void img.offsetWidth;
    img.style.animation = 'judgeSlam .45s ease';

    // 3. Flash behind judge
    const flash = document.createElement('div');
    flash.className = 'explosion-flash boom';
    wrap.appendChild(flash);
    setTimeout(() => flash.remove(), 600);

    // 4. Shockwave ring
    const ring = document.createElement('div');
    ring.className = 'explosion-ring boom';
    wrap.appendChild(ring);
    setTimeout(() => ring.remove(), 750);

    // 5. Flying particles (circles)
    const colors = ['#ffd700','#ff6b35','#ef4444','#ff9500','#ffcc00','#ff4444','#ffaa00','#e74c3c'];
    for (let i = 0; i < 14; i++) {
        const p = document.createElement('div');
        p.className = 'explosion-particle boom';
        const angle = (i / 14) * Math.PI * 2 + (Math.random() * 0.3);
        const dist = 50 + Math.random() * 70;
        const size = 4 + Math.random() * 7;
        p.style.cssText = `
            background:${colors[i % colors.length]};
            width:${size}px;height:${size}px;
            --dx:${Math.cos(angle) * dist}px;
            --dy:${Math.sin(angle) * dist}px;
            animation-delay:${Math.random() * 0.08}s;
        `;
        wrap.appendChild(p);
        setTimeout(() => p.remove(), 900);
    }

    // 6. Flying sparks (lines)
    for (let i = 0; i < 8; i++) {
        const s = document.createElement('div');
        s.className = 'explosion-spark boom';
        const angle = (i / 8) * Math.PI * 2 + (Math.random() * 0.4);
        const dist = 60 + Math.random() * 50;
        const len = 8 + Math.random() * 14;
        s.style.cssText = `
            top:50%;left:50%;
            background:${colors[i % colors.length]};
            height:${len}px;
            --dx:${Math.cos(angle) * dist}px;
            --dy:${Math.sin(angle) * dist}px;
            transform:rotate(${angle}rad);
            animation-delay:${Math.random() * 0.06}s;
        `;
        wrap.appendChild(s);
        setTimeout(() => s.remove(), 700);
    }
}

function showBanner(type, text) {
    const banner = $('verdict-banner');
    const bText = $('banner-text');
    banner.className = 'verdict-banner ' + type + ' show';
    bText.textContent = text;
    setTimeout(() => banner.classList.remove('show'), 800);
}

/* ════════════════════════════════════════
   GAME FLOW
   ════════════════════════════════════════ */
function startGame() {
    shuffled = shuffle(CASES);
    current = 0;
    score = 0;
    maxScore = 0;
    results = [];
    shuffled.forEach(c => { maxScore += c.guilty ? 2 : 1; });
    $('intro').classList.add('hidden');
    $('game').classList.remove('hidden');
    $('results').classList.add('hidden');
    loadCase();
}

function loadCase() {
    locked = false;
    const c = shuffled[current];
    $('case-counter').textContent = `Case ${current + 1} of ${shuffled.length}`;
    $('score-display').textContent = `Score: ${score}`;
    $('progress-fill').style.width = ((current / shuffled.length) * 100) + '%';
    $('case-label').textContent = `CASE #${current + 1}`;
    $('case-scenario').textContent = c.scenario;

    // Reset UI
    $('verdict-btns').classList.remove('hidden');
    $('law-phase').classList.add('hidden');
    $('feedback-area').classList.add('hidden');
    $('feedback-area').innerHTML = '';

    // Reset judge
    setJudge('calm');
    setSpeech(SPEECH.intro);

    // Animate card in
    const card = $('case-card');
    card.classList.remove('enter');
    void card.offsetWidth;
    card.classList.add('enter');

    // Enable buttons
    document.querySelectorAll('.verdict-btn').forEach(b => b.disabled = false);
    document.querySelectorAll('.law-btn').forEach(b => {
        b.disabled = false;
        b.classList.remove('correct-law','wrong-law','highlight-correct');
    });
}

function submitVerdict(playerSaysGuilty) {
    if (locked) return;
    locked = true;
    document.querySelectorAll('.verdict-btn').forEach(b => b.disabled = true);
    const c = shuffled[current];
    const result = { scenario: c.scenario, verdictCorrect: false, lawCorrect: null, points: 0, law: c.lawName, feedback: c.feedback };

    if (playerSaysGuilty && c.guilty) {
        // CORRECT — guilty verdict on a guilty case
        result.verdictCorrect = true;
        score += 1;
        result.points += 1;
        setJudge('furious');
        triggerExplosion();
        setSpeech(SPEECH.guiltyCorrect);
        showBanner('guilty-banner', 'GUILTY!');
        // Show law selection
        setTimeout(() => {
            $('verdict-btns').classList.add('hidden');
            $('law-phase').classList.remove('hidden');
            setSpeech(SPEECH.pickLaw);
            setJudge('calm');
            locked = false;
        }, 1200);
        results.push(result);
        return; // wait for law selection

    } else if (playerSaysGuilty && !c.guilty) {
        // WRONG — said guilty but it's legal
        result.verdictCorrect = false;
        setJudge('calm');
        setSpeech(SPEECH.guiltyWrongVerdict);
        showBanner('free-banner', 'LEGAL!');

    } else if (!playerSaysGuilty && !c.guilty) {
        // CORRECT — not guilty on a legal case
        result.verdictCorrect = true;
        score += 1;
        result.points += 1;
        setJudge('calm');
        setSpeech(SPEECH.notGuiltyCorrect);
        showBanner('free-banner', 'NOT GUILTY');

    } else {
        // WRONG — said not guilty but it IS guilty
        result.verdictCorrect = false;
        setJudge('furious');
        triggerExplosion();
        setSpeech(SPEECH.notGuiltyWrong);
        showBanner('guilty-banner', 'GUILTY!');
    }

    results.push(result);
    $('score-display').textContent = `Score: ${score}`;
    setTimeout(() => showFeedback(result), 1000);
}

function submitLaw(playerLaw) {
    if (locked) return;
    locked = true;
    document.querySelectorAll('.law-btn').forEach(b => b.disabled = true);
    const c = shuffled[current];
    const result = results[results.length - 1]; // get the already-pushed result

    if (playerLaw === c.law) {
        // Correct law!
        result.lawCorrect = true;
        score += 1;
        result.points += 1;
        setJudge('calm');
        setSpeech(SPEECH.lawCorrect);
        document.querySelector(`.law-btn[data-law="${playerLaw}"]`).classList.add('correct-law');
    } else {
        // Wrong law
        result.lawCorrect = false;
        setJudge('calm');
        setSpeech(SPEECH.lawWrong);
        document.querySelector(`.law-btn[data-law="${playerLaw}"]`).classList.add('wrong-law');
        document.querySelector(`.law-btn[data-law="${c.law}"]`).classList.add('highlight-correct');
    }

    $('score-display').textContent = `Score: ${score}`;
    setTimeout(() => showFeedback(result), 800);
}

function showFeedback(result) {
    const c = shuffled[current];
    const area = $('feedback-area');
    let iconCls, iconChar, labelCls, labelText;

    if (result.verdictCorrect && (result.lawCorrect === true || result.lawCorrect === null)) {
        iconCls = 'correct'; iconChar = '&#x2714;'; labelCls = 'correct'; labelText = c.guilty ? 'Perfect — Verdict + Law!' : 'Correct!';
    } else if (result.verdictCorrect && result.lawCorrect === false) {
        iconCls = 'partial'; iconChar = '~'; labelCls = 'partial'; labelText = 'Right verdict, wrong law';
    } else {
        iconCls = 'wrong'; iconChar = '&#x2718;'; labelCls = 'wrong'; labelText = 'Incorrect';
    }

    let lawBadge = '';
    if (c.guilty) {
        lawBadge = `<div class="fb-law" data-law="${c.law}">${c.lawName}</div>`;
    }

    area.innerHTML = `
        <div class="feedback-panel">
            <div class="fb-header">
                <div class="fb-icon ${iconCls}">${iconChar}</div>
                <div class="fb-label ${labelCls}">${labelText}</div>
            </div>
            <div class="fb-text">${c.feedback}</div>
            ${lawBadge}
        </div>
        <button class="next-btn" onclick="nextCase()">${current < shuffled.length - 1 ? 'NEXT CASE &#x2192;' : 'VIEW RESULTS &#x2192;'}</button>
    `;
    area.classList.remove('hidden');
}

function nextCase() {
    current++;
    if (current >= shuffled.length) {
        showResults();
    } else {
        loadCase();
    }
}

/* ════════════════════════════════════════
   RESULTS
   ════════════════════════════════════════ */
function showResults() {
    $('game').classList.add('hidden');
    const r = $('results');
    r.classList.remove('hidden');

    const pct = Math.round((score / maxScore) * 100);
    const circumference = 2 * Math.PI * 54;
    const offset = circumference - (pct / 100) * circumference;

    let perfect = results.filter(r => r.verdictCorrect && (r.lawCorrect === true || r.lawCorrect === null)).length;
    let partial = results.filter(r => r.verdictCorrect && r.lawCorrect === false).length;
    let wrong = results.filter(r => !r.verdictCorrect).length;

    let verdict = '';
    if (pct >= 90) verdict = "Outstanding! You'd make a fine judge!";
    else if (pct >= 70) verdict = "Solid work, counsellor. A few more cases and you'll be on the bench.";
    else if (pct >= 50) verdict = "Not bad, but the criminals are getting away. Hit the textbooks!";
    else verdict = "The courtroom is in chaos! Time to revise those laws.";

    let breakdownHTML = '';
    results.forEach((res, i) => {
        let cls, icon;
        if (res.verdictCorrect && (res.lawCorrect === true || res.lawCorrect === null)) {
            cls = 'g'; icon = 'g';
        } else if (res.verdictCorrect && res.lawCorrect === false) {
            cls = 'p'; icon = 'p';
        } else {
            cls = 'r'; icon = 'r';
        }
        const shortScenario = res.scenario.length > 80 ? res.scenario.substring(0, 80) + '...' : res.scenario;
        let detail = '';
        if (cls === 'g') detail = `<span class="rb-result g">Correct</span>`;
        else if (cls === 'p') detail = `<span class="rb-result p">Partial</span> Right verdict, wrong law`;
        else detail = `<span class="rb-result r">Wrong</span>`;
        detail += ` — ${shortScenario}`;

        breakdownHTML += `<div class="rb-item"><div class="rb-num ${icon}">${i+1}</div><div class="rb-detail">${detail}</div></div>`;
    });

    r.innerHTML = `
        <h2>COURT ADJOURNED</h2>
        <p class="results-sub">${verdict}</p>
        <div class="score-ring">
            <svg width="140" height="140" viewBox="0 0 140 140">
                <circle class="score-ring-bg" cx="70" cy="70" r="54"/>
                <circle class="score-ring-fill" cx="70" cy="70" r="54"
                    stroke-dasharray="${circumference}"
                    stroke-dashoffset="${circumference}"
                    id="ring-fill"/>
            </svg>
            <div class="score-ring-text">
                <div class="score-ring-num">${score}/${maxScore}</div>
                <div class="score-ring-label">points</div>
            </div>
        </div>
        <div class="results-stats">
            <div class="stat-box"><div class="stat-num green">${perfect}</div><div class="stat-label">Perfect</div></div>
            <div class="stat-box"><div class="stat-num amber">${partial}</div><div class="stat-label">Partial</div></div>
            <div class="stat-box"><div class="stat-num red">${wrong}</div><div class="stat-label">Wrong</div></div>
        </div>
        <div class="results-breakdown">
            <h3>Case Breakdown</h3>
            ${breakdownHTML}
        </div>
        <button class="retry-btn" onclick="startGame()">&#x1F504; RETRY TRIAL</button>
        <a href="index.html" class="home-link">&larr; Back to Activities</a>
    `;

    // Animate ring fill
    setTimeout(() => {
        document.getElementById('ring-fill').style.strokeDashoffset = offset;
    }, 200);
}

/* Init */
$('speech-bubble').classList.add('show');
</script>
</body>
</html>
