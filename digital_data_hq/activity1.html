<script>
const HQ_NAME='Digital Data HQ';
/* Past-paper items — wording from CCEA GCSE Digital Technology Unit 1 papers (2018 to 2026), answers from the CCEA mark schemes.
   Topic 1.1 Digital data. Every item maps to a row in S1 Digital data (working)/hq/PAST_PAPER_SWEEP.md (66 questions, all used once).
   Key prefixes: u = units of storage; di = data and information; ty = data types; im = images; so = sound;
   fm = file formats; cp = compression; st = streaming and buffering; po = data portability.
   Where the paper asked for a written answer, the item offers the mark scheme's points to choose from, for the same marks. */
const TF=[{key:'t',label:'TRUE'},{key:'f',label:'FALSE'}];
const PP={
/* ---------- units of storage (Byte Bank) ---------- */
u2018b:{shape:'order-units',needs:['bit','nibble','byte','units'],type:'mcq',keepOrder:true,src:'PP 2018 Q1(b)',ref:'2018 Q1(b) · 1 mark',
  q:'Select the statement in which the units of data storage are listed in ascending order (smallest to largest).',
  options:['bit, byte, nibble, kilobyte','kilobyte, megabyte, terabyte, gigabyte','nibble, byte, kilobyte, megabyte','nibble, bit, byte, kilobyte'],answer:2,
  feedback:'Mark scheme: C. A nibble (4 bits) is smaller than a byte (8 bits), then kilobyte, then megabyte.'},
u2019a:{shape:'digital',needs:['bit'],type:'mcq',keepOrder:true,src:'PP 2019 Q1(a)',ref:'2019 Q1(a) · 1 mark',
  q:'A computer system stores data in:',
  options:['Analogue format','Digital format','Information format','Doubled format'],answer:1,
  feedback:'Mark scheme: B, digital format. Everything is stored as binary digits: 0s and 1s.'},
u2019bi:{shape:'count-bits',needs:['nibble'],type:'mcq',src:'PP 2019 Q2(b)(i)',ref:'2019 Q2(b)(i) · 1 mark',
  q:'A byte contains 8 bits. How many bits are in a nibble?',
  options:['2','4','8','16'],answer:1,
  feedback:'Mark scheme: 4. A nibble is half of a byte.'},
u2019bii:{shape:'count-units',needs:['units'],type:'mcq',src:'PP 2019 Q2(b)(ii)',ref:'2019 Q2(b)(ii) · 1 mark',
  q:'A byte contains 8 bits. How many kilobytes can be stored in a megabyte?',
  options:['8','100','1000','1024'],answer:3,
  feedback:'Mark scheme: 1024. Each unit is 1024 of the unit before it.'},
u2021a:{shape:'count-bits',needs:['byte'],type:'mcq',src:'PP 2021 Q4(a)',ref:'2021 Q4(a) · 1 mark',
  q:'A computer stores data in binary format. How many bits are there in a byte?',
  options:['4','8','16','1024'],answer:1,
  feedback:'Mark scheme: 8.'},
u2021b:{shape:'name-unit',needs:['nibble'],type:'mcq',src:'PP 2021 Q4(b)',ref:'2021 Q4(b) · 1 mark',
  q:'A computer stores data in binary format. What is the name given to a group of four bits?',
  options:['Byte','Kilobyte','Nibble','Pixel'],answer:2,
  feedback:'Mark scheme: Nibble.'},
u2022b:{shape:'convert',needs:['byte'],type:'mcq',keepOrder:true,src:'PP 2022 Q1(b)',ref:'2022 Q1(b) · 1 mark',
  q:'If a file is 6400 bits in size, how many bytes are required to store the file?',
  options:['8','80','800','8000'],answer:2,
  feedback:'Mark scheme: C, 800. There are 8 bits in a byte, so 6400 ÷ 8 = 800 bytes.'},
u2023a:{shape:'name-unit',needs:['bit','byte'],type:'fill',src:'PP 2023 Q1(a)',ref:'2023 Q1(a) · 2 marks',
  q:'Place one of the following terms beside the correct definition. (Not all terms will be used.)',
  bank:['BYTE','BIT','KILOBYTE'],
  text:'The smallest unit of digital data represented by either 0 or 1: [[BIT]]<br><br>Describes eight binary digits: [[BYTE]]',
  feedback:'Mark scheme: BIT, then BYTE. A kilobyte is 1024 bytes, so it fits neither line.'},
u2024a:{shape:'count-units',needs:['units'],type:'mcq',keepOrder:true,src:'PP 2024 Q1(a)',ref:'2024 Q1(a) · 1 mark',
  q:'One kilobyte (KB) contains:',
  options:['100 bytes','256 bytes','10000 bytes','1024 bytes'],answer:3,
  feedback:'Mark scheme: D, 1024 bytes.'},
u2025a:{shape:'order-units',needs:['bit','byte','units'],type:'mcq',keepOrder:true,src:'PP 2025 Q1(a)',ref:'2025 Q1(a) · 1 mark',
  q:'Which of the following is the largest unit of data used to measure storage capacity?',
  options:['Kilobyte','Byte','Terabyte','Bit'],answer:2,
  feedback:'Mark scheme: C, Terabyte. A terabyte is 1024 gigabytes.'},
u2025c:{shape:'convert',needs:['units'],type:'mcq',src:'PP 2025 Q4(c)',ref:'2025 Q4(c) · 1 mark',
  q:'A laptop has 2048 Megabytes of RAM. State what size the RAM is in Gigabytes.',
  options:['2 Gigabytes','20 Gigabytes','1024 Gigabytes','2048 Gigabytes'],answer:0,
  feedback:'Mark scheme: 2 (2.048 was also accepted). 2048 ÷ 1024 = 2 gigabytes.'},
/* ---------- data and information, data types (Club Sign-Up) ---------- */
di2018a:{shape:'define-data',needs:['data','information'],type:'mcq',keepOrder:true,src:'PP 2018 Q1(a)',ref:'2018 Q1(a) · 1 mark',
  q:'Select the statement which is true about data.',
  options:['Data is facts and figures which has been processed and given a meaning.','Data is facts and figures which has not been processed but has meaning.','Data is facts and figures which has not been processed and has no meaning.','Data is facts and figures which has been processed but has no meaning.'],answer:2,
  feedback:'Mark scheme: C. Data is raw: not processed, and no meaning yet.'},
di2019ai:{shape:'explain-example',needs:['data'],fig:'2019_receipt.png',type:'pick',src:'PP 2019 Q2(a)(i)',ref:'2019 Q2(a)(i) · 2 marks',need:2,
  q:'The table below records the details of sales in a local computer hardware store.[FIG]Using an example from the table, explain the term data. Choose the two lines that get the two marks.',
  options:[{text:'Data is raw facts and figures with no meaning',ok:true},{text:'Example from the table: 4.00',ok:true},{text:'Data is facts and figures that have been processed and given meaning',ok:false},{text:'Example from the table: the Sales Total is 12.00',ok:false}],
  feedback:'Mark scheme: raw facts and figures with no context or meaning (1), plus an example from the table (1). The example can be a data item or a heading, not both.'},
di2019aii:{shape:'explain-example',needs:['information'],fig:'2019_receipt.png',type:'pick',src:'PP 2019 Q2(a)(ii)',ref:'2019 Q2(a)(ii) · 2 marks',need:2,
  q:'The table below records the details of sales in a local computer hardware store.[FIG]Using an example from the table, explain the term information. Choose the two lines that get the two marks.',
  options:[{text:'Information is data which has been processed and given meaning',ok:true},{text:'Example from the table: the cost of a keyboard is 10.00',ok:true},{text:'Information is raw facts and figures with no meaning',ok:false},{text:'Example from the table: BCT2',ok:false}],
  feedback:'Mark scheme: data with context or meaning which has been processed (1), plus an example from the table (1).'},
di2023ci:{shape:'spot-in-table',needs:['data'],fig:'2023_results.png',type:'mcq',src:'PP 2023 Q1(c)(i)',ref:'2023 Q1(c)(i) · 1 mark',
  q:'The table shows a student’s results.[FIG]Identify one item of Data.',
  options:['CM101','AVERAGE MARK for 5 MODULES 67','MATHS 1 & 2 AVERAGE = 76%','MATHS 2 GCSE EQUIVALENCE = "B"'],answer:0,
  feedback:'Mark scheme: a number such as 51, a code such as CM101, or a module such as Business. On its own, each has no meaning.'},
di2023cii:{shape:'spot-in-table',needs:['information'],fig:'2023_results.png',type:'mcq',src:'PP 2023 Q1(c)(ii)',ref:'2023 Q1(c)(ii) · 1 mark',
  q:'The table shows a student’s results.[FIG]Identify one piece of Information.',
  options:['57','CM11','BUSINESS','AVERAGE MARK for 5 MODULES 67'],answer:3,
  feedback:'Mark scheme: for example Average Mark = 67, or Maths 1 & 2 Average = 76%. "Marks 57" alone is not enough: information needs context.'},
di2025b:{shape:'define-info',needs:['data','information'],type:'mcq',keepOrder:true,src:'PP 2025 Q1(b)',ref:'2025 Q1(b) · 1 mark',
  q:'Which of the following best describes the term “information”?',
  options:['Raw facts and figures without any context or meaning','Data that has been processed or organised to give meaning and relevance','The process of storing and retrieving data in computer memory','A collection of images, audio and video files on a computer system'],answer:1,
  feedback:'Mark scheme: B. Information is data that has been processed to give it meaning.'},
ty2021c:{shape:'match-types',needs:['integer','real','character','string'],fig:'2021_types.png',type:'match',src:'PP 2021 Q4(c)',ref:'2021 Q4(c) · 4 marks',
  q:'Using the words provided, complete the table stating which data type matches the data.[FIG]Click a data type, then click the data it matches.',
  pairs:[{term:'INTEGER',def:'24, 125, -23'},{term:'CHARACTER',def:'A, £, @'},{term:'STRING',def:'Main Street'},{term:'REAL',def:'1.34, 6.2'}],
  feedback:'Mark scheme: 24, 125, -23 = INTEGER; A, £, @ = CHARACTER; Main Street = STRING; 1.34, 6.2 = REAL.'},
ty2023b:{shape:'pick-type',needs:['integer','real','string'],type:'mcq',src:'PP 2023 Q1(b)',ref:'2023 Q1(b) · 1 mark',
  q:'A student scores 51 in a Computing Module. State the most appropriate data type for storing the student score.',
  options:['String','Real','Integer','Date/Time'],answer:2,
  feedback:'Mark scheme: Integer (Numeric was also accepted; "number" was not). 51 is a whole number.'},
ty2024j:{shape:'name-type',needs:['integer'],type:'mcq',src:'PP 2024 Q10',ref:'2024 Q10 · 1 mark',
  q:'Place the correct term against the definition: “A data type which stores positive or negative whole numbers”. (Four of the paper’s eight terms are shown.)',
  options:['Macro','Backup','Integer','Intranet'],answer:2,
  feedback:'Mark scheme: Integer.'},
/* ---------- images (Photo Lab) ---------- */
im2018ai:{shape:'describe-pixel',needs:['pixel','bitmap'],type:'pick',src:'PP 2018 Q4(a)(i)',ref:'2018 Q4(a)(i) · 2 marks',need:2,
  q:'CPC is a small multimedia design business. A client requests a high resolution bitmap image. Describe how a pixel is used in a bitmap image. Choose the two lines that get the two marks.',
  options:[{text:'A pixel is the smallest unit of an image that can be displayed and edited',ok:true},{text:'Each pixel can have its own colour',ok:true},{text:'A pixel is a mathematical object such as a line or a curve',ok:false},{text:'A pixel is the number of bits used to store each colour',ok:false}],
  feedback:'Mark scheme, any two: the smallest unit of an image; it can be edited or displayed; each pixel can have its own colour; combined pixels form an image; each pixel is stored as a series of binary digits.'},
im2018aii:{shape:'explain-resolution',needs:['resolution'],type:'pick',src:'PP 2018 Q4(a)(ii)',ref:'2018 Q4(a)(ii) · 2 marks',need:2,
  q:'CPC is a small multimedia design business. A client requests a high resolution bitmap image. Explain the term resolution and its impact on an image. Choose the two lines that get the two marks.',
  options:[{text:'Resolution is a measure of the quality of an image: the number of pixels',ok:true},{text:'The higher the resolution, the better the quality of the image',ok:true},{text:'The higher the resolution, the less storage space the image needs',ok:false},{text:'Resolution is the type of compression used to save the image',ok:false}],
  feedback:'Mark scheme, any two: a measure of quality, pixels per inch or the number of pixels; higher resolution means better quality; a high resolution image needs more storage space.'},
im2018biii:{shape:'vector-differs',needs:['bitmap','vector'],type:'mcq',src:'PP 2018 Q4(b)(iii)',ref:'2018 Q4(b)(iii) · 1 mark',
  q:'CPC is a small multimedia design business. The client has requested a vector-based graphic of the logo. Identify one way in which a vector-based graphic differs from a bitmap graphic.',
  options:['It stores the colour of every pixel in the image','It stores information about the shapes that make up the image','Its file size is usually much larger','It loses quality when it is resized'],answer:1,
  feedback:'Mark scheme, any one: it stores information about components or shapes; it is made of objects defined by mathematical equations; the file is comparatively smaller; it can be resized without loss of quality.'},
im2019aii:{shape:'explain-resolution',needs:['resolution'],fig:'2019_photo.png',type:'pick',src:'PP 2019 Q4(a)(ii)',ref:'2019 Q4(a)(ii) · 2 marks',need:2,
  q:'Vic is editing her holiday images. Below is the data related to one of her digital photos.[FIG]Explain the term resolution when referring to a graphic. Choose the two lines that get the two marks.',
  options:[{text:'It describes the quality of an image',ok:true},{text:'It is the number of pixels: more pixels gives better quality',ok:true},{text:'It is the number of bits used to store each pixel',ok:false},{text:'It is how much the image has been compressed',ok:false}],
  feedback:'Mark scheme, any two: the quality of an image; the number of pixels; pixels per inch; more pixels means better quality.'},
im2019aiii:{shape:'dpi',needs:['dpi'],fig:'2019_photo.png',type:'mcq',src:'PP 2019 Q4(a)(iii)',ref:'2019 Q4(a)(iii) · 1 mark',
  q:'Vic is editing her holiday images. Below is the data related to one of her digital photos.[FIG]The horizontal resolution is 300 dpi. What do the letters dpi stand for?',
  options:['data per image','dots per inch','digital pixel index','depth per image'],answer:1,
  feedback:'Mark scheme: dots per inch.'},
im2023a:{shape:'vector-true',needs:['bitmap','vector','resolution'],type:'pick',src:'PP 2023 Q2(a)',ref:'2023 Q2(a) · 3 marks',need:3,
  q:'Cassie is creating an image using a graphics software package. Choose the three statements that are true about vector graphics.',
  options:[{text:'When stretched the image can become blurred',ok:false},{text:'The image quality does not depend on resolution',ok:true},{text:'The image takes up a lot of storage space',ok:false},{text:'The image can be stretched without loss of clarity',ok:true},{text:'There is no need to store individual pixel values',ok:true}],
  feedback:'Mark scheme: quality does not depend on resolution; it can be stretched without loss of clarity; no individual pixel values are stored. The other two describe bitmaps.'},
im2023b:{shape:'resolution-size',needs:['resolution','file-size'],type:'pick',src:'PP 2023 Q2(b)',ref:'2023 Q2(b) · 2 marks',need:2,
  q:'Cassie is creating an image using a graphics software package. What effect does the resolution of the image have on the image size? Choose the two lines that get the two marks.',
  options:[{text:'The higher the resolution, the larger the file size',ok:true},{text:'A higher resolution has more pixels to store',ok:true},{text:'The higher the resolution, the smaller the file size',ok:false},{text:'Resolution has no effect on the file size',ok:false}],
  feedback:'Mark scheme: a higher resolution gives a larger file or image size (1), because more pixels have to be stored (1).'},
im2025a1:{shape:'true-false',needs:['bitmap','vector'],type:'classify',src:'PP 2025 Q2(a)',ref:'2025 Q2(a) · 1 mark (statement 1 of 3)',
  text:'“Bitmap graphics use layers while vector graphics use a grid of pixels.”',choices:TF,answer:'f',
  feedback:'Mark scheme: FALSE. It is the bitmap that uses a grid of pixels.'},
im2025a2:{shape:'true-false',needs:['bitmap','vector'],type:'classify',src:'PP 2025 Q2(a)',ref:'2025 Q2(a) · 1 mark (statement 2 of 3)',
  text:'“Bitmap graphics use a grid of pixels, while vector graphics use mathematical equations.”',choices:TF,answer:'t',
  feedback:'Mark scheme: TRUE.'},
im2025a3:{shape:'true-false',needs:['bitmap','vector'],type:'classify',src:'PP 2025 Q2(a)',ref:'2025 Q2(a) · 1 mark (statement 3 of 3)',
  text:'“Bitmap graphics are ideal for creating logos, while vector graphics are better suited for photographs.”',choices:TF,answer:'f',
  feedback:'Mark scheme: FALSE. It is the other way round: vectors suit logos, bitmaps suit photographs.'},
im2025b:{shape:'count-pixels',needs:['pixel','file-size'],type:'mcq',src:'PP 2025 Q2(b)',ref:'2025 Q2(b) · 1 mark',
  q:'Approximately how many pixels are in a bitmap graphic, if the width is 80 pixels and the height is 60 pixels?',
  options:['48','4,800','48,000'],answer:1,
  feedback:'Mark scheme: 4,800. Width × height = 80 × 60.'},
im2026h:{shape:'define-pixel',needs:['pixel'],type:'mcq',keepOrder:true,src:'PP 2026 Q1(h)',ref:'2026 Q1(h) · 1 mark',
  q:'Select the statement which best describes a pixel.',
  options:['The smallest part of a digital image.','A graphic that can be resized without losing quality.','A format for saving vector images.','A way to create animations in digital media.'],answer:0,
  feedback:'Mark scheme: A, the smallest part of a digital image.'},
/* ---------- sound (Sound Desk) ---------- */
so2019j:{shape:'define-bitrate',needs:['sample-rate','bit-depth','bit-rate'],type:'mcq',keepOrder:true,src:'PP 2019 Q1(j)',ref:'2019 Q1(j) · 1 mark',
  q:'Select the statement which correctly describes bit rate when representing sounds.',
  options:['The bit rate is the number of bits used to store each sound sample.','The bit rate is the speed at which the sound has been recorded.','The bit rate is the amount of data, measured in bits, that is processed in a given amount of time.','The bit rate is the number of audio sound samples captured every second.'],answer:2,
  feedback:'Mark scheme: C. A is bit depth and D is sample rate.'},
so2019c:{shape:'record-sound',needs:['analogue','adc'],type:'fill',src:'PP 2019 Q4(c)',ref:'2019 Q4(c) · 2 marks',
  q:'Computers also support the processing of sound files. Using two of the words supplied, complete the following sentences.',
  bank:['DIGITAL','MICROPHONE','ANALOGUE'],
  text:'A [[MICROPHONE]] enables a computer to record sound waves. Sounds are recorded in [[ANALOGUE]] format.',
  feedback:'Mark scheme: MICROPHONE, then ANALOGUE. The sound wave is analogue; the ADC then changes it to digital.'},
so2022c:{shape:'define-bitrate',needs:['sample-rate','bit-depth','bit-rate'],type:'mcq',keepOrder:true,src:'PP 2022 Q1(c)',ref:'2022 Q1(c) · 1 mark',
  q:'Select the statement which correctly describes the bit rate of a sound recording.',
  options:['The number of bits processed over a certain period of time.','The number of times per second that a sound signal is captured.','The number of bits of information in each sample.','The number of times a sound is edited and recorded.'],answer:0,
  feedback:'Mark scheme: A. B is sample rate and C is bit depth.'},
so2022g:{shape:'adc-name',needs:['adc'],type:'mcq',keepOrder:true,src:'PP 2022 Q1(g)',ref:'2022 Q1(g) · 1 mark',
  q:'Mobile phones use an ADC to change sound input using a microphone into a format the computer can understand. What do the letters ADC stand for?',
  options:['Analogue to Digital Changer','Audio to Digital Converter','Analogue to Digital Converter','Audio to Digital Changer'],answer:2,
  feedback:'Mark scheme: C, Analogue to Digital Converter.'},
so2023d:{shape:'sample-rate-effect',needs:['sample-rate'],type:'mcq',src:'PP 2023 Q2(d)',ref:'2023 Q2(d) · 1 mark',
  q:'Cassie changes the sample rate on a sound file she has created. Choose the statement which is true about Cassie’s sound file.',
  options:['Increasing the sample rate increases the quality of the audio file','Increasing the sample rate decreases the file size'],answer:0,
  feedback:'Mark scheme: increasing the sample rate increases the quality. More samples each second also means more data, so a bigger file.'},
so2023e:{shape:'adc-name',needs:['adc'],type:'mcq',src:'PP 2023 Q2(e)',ref:'2023 Q2(e) · 1 mark',
  q:'Cassie changes the sample rate on a sound file she has created. What do the letters ADC stand for?',
  options:['Audio Data Compression','Analogue Digital Converter','Automatic Digital Capture','Analogue Data Copier'],answer:1,
  feedback:'Mark scheme: Analogue (to) Digital Conversion or Converter.'},
so2024b:{shape:'define-bitdepth',needs:['bit-depth'],type:'fill',src:'PP 2024 Q7(b)',ref:'2024 Q7(b) · 2 marks',
  q:'Clarendon College produces video tutorials. Podcasts are also used. What is meant by bit depth when referring to a sound recording? Complete the sentence.',
  bank:['bits','bytes','samples','sample','second','hertz'],
  text:'Bit depth is the number of [[bits]] used for each sound [[sample]].',
  feedback:'Mark scheme: the number of bits (1) used for each sound sample (1).'},
so2025c:{shape:'bitrate-formula',needs:['bit-rate'],type:'mcq',src:'PP 2025 Q2(c)',ref:'2025 Q2(c) · 1 mark',
  q:'Choose the correct formula that calculates the Bit Rate of a sound file.',

/* Shared mini-game kit for the HQ topic activities (Digital Data HQ).
   Uses the engine's helpers only ($, say, sfx, mascot, musBtn, startMusic, stopMusic, shuffle, shakeScreen).
   Nothing here touches the page at load time, so the build's level gate can run it in node. */
let GM=null;
globalThis.simMusicOn=()=>!!(GM&&GM.state!=='end'&&$('gm'));
function gmOpen(area,o){
  if(GM&&GM.timer)clearInterval(GM.timer);
  GM={...o,stage:0,state:'play',lives:o.lives??3,maxLives:o.lives??3};
  area.innerHTML=`<div class="gm" id="gm"><div class="arena-grid"></div><div class="vs-head">${musBtn()}<span class="vs-title">${o.icon} ${o.title}</span>${mascot(o.bot||'🤖')}</div>
<div class="gm-bar"><div class="gm-stages" id="gmStages"></div><div class="gm-lives" id="gmLives" aria-label="Lives"></div></div>
<div id="gmMain"></div><div id="gmMsg" aria-live="polite"></div></div>`;
  gmStage(0);gmLives();startMusic();
}
/* the stages are always shown, and the current one is named */
function gmStage(i){
  GM.stage=i;const s=GM.stages||[];
  $('gmStages').innerHTML=s.length>1?s.map((n,k)=>k===i?`<span class="on">Stage ${k+1} of ${s.length}: ${n}</span>`:`<span class="${k<i?'done':''}">${k<i?'✓ ':''}${n}</span>`).join(''):'';
}
function gmLives(){
  const el=$('gmLives');if(!el)return;
  el.innerHTML=GM.maxLives?`<span class="gm-lab">Lives</span>${'❤️'.repeat(Math.max(0,GM.lives))}${'🖤'.repeat(GM.maxLives-Math.max(0,GM.lives))}`:'';
}
/* lose a life; returns true when none are left */
function gmLose(){GM.lives--;gmLives();sfx('bad');shakeScreen();return GM.lives<=0;}
function gmMsg(html,cls){$('gmMsg').innerHTML=html?`<div class="feedback-box ${cls||''}">${html}</div>`:'';if(html)ddSee($('gmMsg'));}
function gmGo(label,fn,cls){
  $('gmMsg').insertAdjacentHTML('beforeend',`<button class="btn ${cls||'btn-primary'} next-btn" id="goBtn">${label}</button>`);
  $('goBtn').onclick=fn;$('goBtn').focus({preventScroll:true});ddSee($('gmMsg'));
}
function ddSee(el){if(!el||!el.getBoundingClientRect)return;const r=el.getBoundingClientRect(),vh=window.innerHeight||document.documentElement.clientHeight;if(r.bottom>vh-8)window.scrollBy({top:Math.min(r.bottom-vh+14,Math.max(0,r.top-8)),behavior:'smooth'});}
function gmBanner(head,text,btn,fn){
  GM.state='banner';gmMsg('');
  $('gmMain').innerHTML=`<div class="vs-banner"><div class="vs-bh">${head}</div><p>${text}</p><button class="btn btn-primary" id="goBtn">${btn}</button></div>`;
  $('goBtn').onclick=()=>{GM.state='play';fn();};$('goBtn').focus({preventScroll:true});
}
/* finish the mini-game: stars 0 = not passed (the engine asks for another go) */
function gmEnd(st,head,text){
  if(GM.timer)clearInterval(GM.timer);GM.state='end';stopMusic();gmMsg('');
  sfx(st>0?'win':'over');say(st>0?'Done! 🎉':'Oh no! 😬');
  $('gmMain').innerHTML=`<div class="vs-banner"><div class="vs-bh">${head}</div><p>${text}</p><div class="stars-big">${'★'.repeat(st)}${'☆'.repeat(3-st)}</div><button class="btn btn-success" id="goBtn">See level result →</button></div>`;
  const fin=GM.finish;$('goBtn').onclick=()=>{GM=null;fin(0,st);};$('goBtn').focus({preventScroll:true});
}
function gmStars(livesLeft,max){return livesLeft>=max?3:livesLeft>=max-1?2:livesLeft>0?1:0;}
/* a countdown bar inside el; calls out() when time runs out */
function gmTimer(el,secs,out){
  if(GM.timer)clearInterval(GM.timer);
  el.innerHTML='<div class="vs-timer"><div></div></div>';const bar=el.querySelector('.vs-timer div');
  const end=Date.now()+secs*1000;
  GM.timer=setInterval(()=>{
    if(!GM){return;}
    const left=end-Date.now();bar.style.width=Math.max(0,left/(secs*10))+'%';bar.classList.toggle('low',left<secs*300);
    if(left<=0){clearInterval(GM.timer);GM.timer=null;out();}
  },100);
}
function gmStop(){if(GM&&GM.timer){clearInterval(GM.timer);GM.timer=null;}}
function gmSel(id,opts,val){return `<select class="gm-sel" id="${id}">${opts.map(o=>{const [v,l]=Array.isArray(o)?o:[o,o];return `<option value="${v}"${v===val?' selected':''}>${l}</option>`;}).join('')}</select>`;}
function gmShuffle(a){const r=[...a];for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];}return r;}
/* exam rooms draw a fresh set of real questions each time the page opens: [[pool,n],…] */
/* ---------- Digital Data HQ kit: one-question helpers shared by the five mini-games ---------- */
const ddFmt=n=>Number(n).toLocaleString('en-GB');
const ddNum=s=>Number(String(s).replace(/[,\s]/g,''));
const ddPick=(a,n)=>gmShuffle(a).slice(0,n);
/* a question answered with one of several buttons. o={q,panel,opts:[{label,ok,why}],why,next,lost:[head,text],after}
   A wrong answer costs a life, shows the reason, marks the right button, and the game moves on. */
function ddAsk(o){
  GM.state='play';gmMsg('');
  $('gmMain').innerHTML=`<div class="gm-q">${o.q}</div>${o.panel?`<div class="gm-panel">${o.panel}</div>`:''}<div class="mcq-list dd-opts${o.row?' dd-side':''}" id="ddOpts">${o.opts.map((p,i)=>`<button class="mcq-btn" data-i="${i}">${p.label}</button>`).join('')}</div>`;
  if(o.after)o.after();
  const bs=[...$('ddOpts').querySelectorAll('button')];
  bs.forEach(b=>b.onclick=()=>{
    if(GM.state!=='play')return;GM.state='fb';
    const p=o.opts[+b.dataset.i];
    bs.forEach((x,i)=>{x.disabled=true;if(o.opts[i].ok&&x!==b)x.classList.add('missed');});
    if(p.ok){b.classList.add('correct');sfx('good');say(o.yay||'Yes! ✅');gmMsg('Right: '+(p.why||o.why),'correct');return gmGo(o.nextLabel||'Next →',o.next);}
    b.classList.add('wrong');const out=gmLose();say(o.boo||'Not that one ❌');gmMsg(((p.why?p.why+' ':'')+(o.why||'')).trim(),'wrong');
    if(out)return gmGo('See what happened →',()=>gmEnd(0,o.lost[0],o.lost[1]));
    gmGo(o.nextLabel||'Next →',o.next);
  });
}
/* a question answered by typing a number. o={q,panel,answer,unit,why,next,lost} */
function ddType(o){
  GM.state='play';gmMsg('');
  $('gmMain').innerHTML=`<div class="gm-q">${o.q}</div>${o.panel?`<div class="gm-panel">${o.panel}</div>`:''}<div class="dd-type"><label for="ddIn">Your answer:</label><input id="ddIn" class="dd-in" type="text" inputmode="numeric" autocomplete="off" spellcheck="false" placeholder="Type a number"><span class="dd-unit">${o.unit}</span><button class="btn btn-primary" id="ddCheck">Check</button></div>`;
  const go=()=>{
    if(GM.state!=='play')return;
    const raw=$('ddIn').value.trim();
    if(!raw||isNaN(ddNum(raw)))return gmMsg('Type a number in the box, then press Check.','part');
    GM.state='fb';$('ddIn').disabled=true;$('ddCheck').disabled=true;
    if(ddNum(raw)===o.answer){$('ddIn').classList.add('ok');sfx('good');say('Yes! ✅');gmMsg('Right: '+o.why,'correct');return gmGo(o.nextLabel||'Next →',o.next);}
    $('ddIn').classList.add('no');const out=gmLose();say('Not quite ❌');gmMsg(`The answer is ${ddFmt(o.answer)} ${o.unit}. ${o.why}`,'wrong');
    if(out)return gmGo('See what happened →',()=>gmEnd(0,o.lost[0],o.lost[1]));
    gmGo(o.nextLabel||'Next →',o.next);
  };
  $('ddCheck').onclick=go;$('ddIn').onkeydown=e=>{if(e.key==='Enter')go();};$('ddIn').focus({preventScroll:true});
}
/* run a list of step functions one after another; each step is called with the function that starts the next */
function ddRun(steps,done){let i=0;const nx=()=>{const s=steps[i++];s?s(nx):done();};nx();}

/* Activity 1 — Byte Bank. Units of storage (deck section A). Sources: TB p5; PP 2018 Q1(b), 2019 Q1(a), Q2(b), 2021 Q4(a)(b), 2022 Q1(b), 2023 Q1(a), 2024 Q1(a), 2025 Q1(a), Q4(c). */
const LD_UNITS=[['bit','a single 0 or 1'],['nibble','4 bits'],['byte','8 bits'],['kilobyte','1024 bytes'],['megabyte','1024 kilobytes'],['gigabyte','1024 megabytes'],['terabyte','1024 gigabytes']];
const LD_STRIP='<div class="dd-strip"><span>bit</span><span>nibble<i>4 bits</i></span><span>byte<i>8 bits</i></span><span>kilobyte<i>1024 bytes</i></span><span>megabyte<i>1024 kilobytes</i></span><span>gigabyte<i>1024 megabytes</i></span><span>terabyte<i>1024 gigabytes</i></span></div>';
/* stage B questions: each maker returns one typed sum with its working */
const LD_SMALL=[
  ()=>{const n=ddPick([200,300,400,500,700,900],1)[0];return {q:`A file is <b>${ddFmt(n*8)} bits</b> in size. How many <b>bytes</b> are needed to store it?`,answer:n,unit:'bytes',why:`8 bits make 1 byte, so ${ddFmt(n*8)} ÷ 8 = ${n}.`};},
  ()=>{const w=ddPick(['HELLO','NEWRY','BINARY','PIXEL','DATA','COMPUTER'],1)[0];return {q:`Each character takes 1 byte. How many <b>bits</b> are needed to store the word <b>${w}</b>?`,answer:w.length*8,unit:'bits',why:`${w} has ${w.length} characters, so it takes ${w.length} bytes. ${w.length} × 8 = ${w.length*8} bits.`};},
  ()=>{const n=ddPick([3,5,6,7],1)[0];return {q:`How many <b>nibbles</b> are there in <b>${n} bytes</b>?`,answer:n*2,unit:'nibbles',why:`A nibble is 4 bits and a byte is 8 bits, so 2 nibbles make 1 byte. ${n} × 2 = ${n*2}.`};}];
const LD_BIG=[
  ()=>{const n=ddPick([3,4,5,8],1)[0];return {q:`A games console has <b>${ddFmt(n*1024)} megabytes</b> of memory. How many <b>gigabytes</b> is that?`,answer:n,unit:'gigabytes',why:`1024 megabytes make 1 gigabyte, so ${ddFmt(n*1024)} ÷ 1024 = ${n}.`};},
  ()=>{const n=ddPick([2,3,4],1)[0];return {q:`A memory stick holds <b>${n} gigabytes</b>. How many <b>megabytes</b> is that?`,answer:n*1024,unit:'megabytes',why:`1 gigabyte is 1024 megabytes, so ${n} × 1024 = ${ddFmt(n*1024)}.`};},
  ()=>{const n=ddPick([2,3,5],1)[0];return {q:`A photo is <b>${ddFmt(n*1024)} kilobytes</b> in size. How many <b>megabytes</b> is that?`,answer:n,unit:'megabytes',why:`1024 kilobytes make 1 megabyte, so ${ddFmt(n*1024)} ÷ 1024 = ${n}.`};},
  ()=>{const n=ddPick([2,3,4],1)[0];return {q:`A text file is <b>${n} kilobytes</b> in size. How many <b>bytes</b> is that?`,answer:n*1024,unit:'bytes',why:`1 kilobyte is 1024 bytes, so ${n} × 1024 = ${ddFmt(n*1024)}.`};}];
/* stage C: will the file fit? [space, file, fits, working] */
const LD_FIT=[
  ['2 gigabytes','1500 megabytes',true,'2 gigabytes = 2 × 1024 = 2048 megabytes. 1500 megabytes is less than that, so the file fits.'],
  ['1 gigabyte','1100 megabytes',false,'1 gigabyte = 1024 megabytes. 1100 megabytes is more than that, so the file is too big.'],
  ['4 megabytes','3500 kilobytes',true,'4 megabytes = 4 × 1024 = 4096 kilobytes. 3500 kilobytes is less than that, so the file fits.'],
  ['500 kilobytes','1 megabyte',false,'1 megabyte = 1024 kilobytes. That is more than 500 kilobytes, so the file is too big.'],
  ['1 terabyte','900 gigabytes',true,'1 terabyte = 1024 gigabytes. 900 gigabytes is less than that, so the file fits.'],
  ['3 megabytes','3100 kilobytes',false,'3 megabytes = 3 × 1024 = 3072 kilobytes. 3100 kilobytes is more than that, so the file is too big.'],
  ['2000 bytes','2 kilobytes',false,'2 kilobytes = 2 × 1024 = 2048 bytes. That is more than 2000 bytes, so the file is too big.'],
  ['1 kilobyte','1000 bytes',true,'1 kilobyte = 1024 bytes. 1000 bytes is less than that, so the file fits.']];
const LD_LOST=['The bank ran out of lives','Read the lesson on units of storage again, then have another go.'];
let LD=null;
function sim_ladder(area,finish){
  LD={n:0};
  gmOpen(area,{title:'Climb the ladder',icon:'🪜',stages:['Build the ladder','Convert','Will it fit?'],lives:3,finish,bot:'💾'});
  gmBanner('Build the unit ladder','Put the seven units of storage in order, smallest at the bottom. Then use your ladder to convert sizes and to decide whether files will fit. A wrong answer costs a life.','🪜 Start',ldBuild);
}
function ldLadder(n){
  return `<div class="dd-ladder">${LD_UNITS.map((u,i)=>`<div class="dd-rung${i<n?' on':''}"><b>${i<n?u[0]:'?'}</b><span>${i<n?u[1]:''}</span></div>`).join('')}</div>`;
}
function ldBuild(){
  gmStage(0);GM.state='play';gmMsg('');LD.n=0;
  $('gmMain').innerHTML=`<div class="gm-q">Click the units in order, from the <b>smallest</b> to the <b>largest</b>. The ladder fills from the bottom.</div>
<div class="dd-two"><div class="gm-panel" id="ldL">${ldLadder(0)}</div><div class="gm-panel"><div class="vs-h">Units of storage</div><div class="dd-tiles" id="ldT">${gmShuffle(LD_UNITS.map((u,i)=>i)).map(i=>`<button class="dd-tile" data-i="${i}">${LD_UNITS[i][0]}</button>`).join('')}</div></div></div>`;
  $('ldT').querySelectorAll('button').forEach(b=>b.onclick=()=>{
    if(GM.state!=='play')return;
    const i=+b.dataset.i;
    if(i===LD.n){
      LD.n++;b.disabled=true;b.classList.add('used');sfx('tick');$('ldL').innerHTML=ldLadder(LD.n);gmMsg('');
      if(LD.n===LD_UNITS.length){GM.state='fb';sfx('good');say('Ladder built! 🪜');gmMsg('Right: from the kilobyte upwards, each unit is 1024 of the unit below it.','correct');gmGo('Next: convert →',ldConvert);}
      return;
    }
    const out=gmLose();say('Not that one ❌');
    gmMsg(LD.n?`The ${LD_UNITS[i][0]} does not come next. The next unit up is ${LD_UNITS[LD.n][1]}.`:'Start with the smallest unit: a single 0 or 1.','wrong');
    if(out){GM.state='fb';gmGo('See what happened →',()=>gmEnd(0,LD_LOST[0],LD_LOST[1]));}
  });
}
function ldConvert(){
  gmStage(1);
  const qs=[ddPick(LD_SMALL,1)[0](),...ddPick(LD_BIG,2).map(f=>f())];
  ddRun(qs.map((x,k)=>nx=>ddType({q:`<span class="dd-count">Sum ${k+1} of 3</span>${x.q}`,panel:LD_STRIP,answer:x.answer,unit:x.unit,why:x.why,lost:LD_LOST,next:nx,nextLabel:k===2?'Next: will it fit? →':'Next →'})),ldFit);
}
function ldFit(){
  gmStage(2);
  const qs=ddPick(LD_FIT.filter(f=>f[2]),1).concat(ddPick(LD_FIT.filter(f=>!f[2]),1));
  qs.push(ddPick(LD_FIT.filter(f=>!qs.includes(f)),1)[0]);
  ddRun(gmShuffle(qs).map((f,k)=>nx=>ddAsk({q:`<span class="dd-count">File ${k+1} of 3</span>Will the file fit in the space that is left?`,row:true,
    panel:`<div class="dd-fit"><div><span class="dd-big">💾</span><b>Space left</b><em>${f[0]}</em></div><div><span class="dd-big">📁</span><b>File to save</b><em>${f[1]}</em></div></div>`,
    opts:[{label:'✅ Yes, it fits',ok:f[2]},{label:'⛔ No, it is too big',ok:!f[2]}],why:f[3],lost:LD_LOST,next:nx,nextLabel:k===2?'Finish →':'Next →'})),
    ()=>gmEnd(gmStars(GM.lives,3),'Ladder climbed','You put the units in order, converted between them and checked whether files would fit.'));
}

<script>
/* HQ engine v3 (Software HQ v2 + HQ_NAME, sorter variants fall/belt/pop, boss pools drawn fresh each play, real exam figures) — game levels (see S1 Software/GAME_DESIGN.md).
   ACT = {title, icon, intro, topics, ranks:[top,high,mid,low], teach:[{html,init?}], next,
          rounds:[{title, heading, teachAt:[teach indices shown before it], mode?:'sorter'|'boss'|'sim', sim?, boss?:{icon,name}, choices?, keepOrder?, tip, tasks}]}
   A round of classify tasks with shared choices plays as a SORTER (falling cards); any other round plays as a BOSS fight; mode:'sim' calls window['sim_'+r.sim](area, finish).
   Marks (and the rank) come only from sorter and boss levels. Every task carries src (see SOURCE_MAP.md). */
let lvl=0,taskIdx=0,teachStep=0,S=null,B=null,briefOpen=false;
const G={points:0,combo:0,muted:false,lp:[]};
const marks=[],maxMarks=[],stars=[];
function shuffle(a){const r=[...a];for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];}return r;}
function $(id){return document.getElementById(id);}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));$(id).classList.add('active');window.scrollTo({top:0,behavior:'smooth'});}
function setProgress(p){$('progressFill').style.width=p+'%';}
function norm(s){return String(s).trim().toLowerCase();}
const LEVELS=ACT.rounds.map(r=>{const mode=r.mode||(r.pool?'boss':r.choices&&r.tasks.every(t=>t.type==='classify')?'sorter':'boss');
  const brief=(r.teachAt||[]).map(i=>ACT.teach[i]);
  /* the 📖 button: the round's own lessons, and in an exam room every lesson in the activity */
  return {...r,mode,kind:mode==='sorter'?(r.variant||'fall'):mode,brief,book:mode==='boss'?ACT.teach:brief};});
/* kinds: three different sorting games, the boss, and the mini-games */
const KIND_ICON={fall:'🎮',belt:'🛤️',pop:'🎯',boss:'👾',sim:'🕹️'};
const KIND_NAME={fall:'Falling cards',belt:'Conveyor belt',pop:'Pop-up cards',boss:'Boss battle',sim:'Mini-game'};
const KIND_HOW={fall:'Cards fall. Click the right box (or press 1, 2, 3) before the card lands. 3 lives.',
  belt:'Cards ride a conveyor belt. Send each one to the right box before it drops off the end. 3 lives.',
  pop:'Cards pop up anywhere and fade away. Click the right box before each card vanishes. 3 lives.',
  boss:'Real CCEA exam questions. Every mark you score hits the boss. A new set of questions every time you play.',
  sim:'Do the computer\'s job yourself.'};
const lvIcon=L=>L.icon||KIND_ICON[L.kind];
const lvName=L=>L.kindName||KIND_NAME[L.kind];

/* ---------- saved progress (this browser only) ---------- */
const KEY='swhq2_'+ACT.title;
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{};}catch(e){return {};}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(STORE));}catch(e){}}
const STORE=Object.assign({best:0,stars:[],muted:false},load());
G.muted=!!STORE.muted;

/* ---------- sound ---------- */
let AC=null;
const SFX={good:[[660,.07],[880,.1]],combo:[[660,.06],[880,.06],[1175,.12]],bad:[[160,.25,'sawtooth']],hit:[[587,.05],[880,.05],[1319,.14]],
  level:[[523,.1],[659,.1],[784,.1],[1047,.3]],over:[[392,.16],[330,.16],[262,.35]],tick:[[880,.03]],zap:[[740,.03],[1480,.05]],alarm:[[1175,.05],[880,.05],[1175,.06]],scan:[[1047,.025],[1319,.025],[1568,.025],[2093,.04]],win:[[523,.08],[784,.08],[1047,.08],[1568,.35]]};
function sfx(k){
  if(G.muted)return;
  try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();let t=AC.currentTime;
    SFX[k].forEach(([f,d,w])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=w||'triangle';o.frequency.value=f;
      g.gain.setValueAtTime(0.1,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+0.03);t+=d;});}catch(e){}
}
function toggleMute(){G.muted=!G.muted;STORE.muted=G.muted;save();document.querySelectorAll('.mute-btn').forEach(b=>b.textContent=G.muted?'🔇':'🔊');if(G.muted)stopMusic();else if(musicWanted())startMusic();}

/* ---------- points, combo, popups ---------- */
function mult(){return Math.min(4,1+Math.floor(G.combo/3));}
function addPoints(n){G.points+=n;G.lp[lvl]=(G.lp[lvl]||0)+n;hud();}
function hit(){const before=mult();G.combo++;if(mult()>before){sfx('combo');flash(`🔥 Combo ×${mult()}!`);}else sfx('good');}
function miss(){G.combo=0;sfx('bad');hud();}
function popup(text,el,cls){
  const box=(el||$('taskArea')).getBoundingClientRect(),p=document.createElement('div');
  p.className='popup '+(cls||'');p.textContent=text;p.style.left=(box.left+box.width/2)+'px';p.style.top=(box.top+Math.min(box.height/2,120))+'px';
  document.body.appendChild(p);setTimeout(()=>p.remove(),1100);
}
function flash(text){const f=document.createElement('div');f.className='flash-banner';f.textContent=text;document.body.appendChild(f);setTimeout(()=>f.remove(),1300);}
function shakeScreen(){const c=document.querySelector('.container');c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake');}
function starStr(n){return n==null?'☆☆☆':'★'.repeat(n)+'☆'.repeat(3-n);}
function hud(){
  if(!$('hudPts'))return;
  $('hudPts').textContent=G.points.toLocaleString();
  $('hudCombo').textContent=mult()>1?`🔥 ×${mult()}`:'';
  $('hudLives').textContent=S&&S.active?'❤️'.repeat(S.lives)+'🖤'.repeat(3-S.lives):'';
}

/* ---------- welcome + level map ---------- */
function bestStars(i){const a=stars[i],b=STORE.stars[i];return a==null?b:(b==null?a:Math.max(a,b));}
function unlocked(i){return i===0||bestStars(i-1)!=null;}
function renderWelcome(){
  document.title=ACT.title+' — '+(typeof HQ_NAME!=='undefined'?HQ_NAME:'Software HQ');
  stopSorter();
  const next=LEVELS.findIndex((L,i)=>bestStars(i)==null);
  const go=next<0?0:next;
  setProgress(Math.round(LEVELS.filter((L,i)=>bestStars(i)!=null).length/LEVELS.length*100));
  $('welcomeScreen').innerHTML=`<div class="welcome"><div class="welcome-icon">${ACT.icon}</div><h2>${ACT.title}</h2><p>${ACT.intro}</p>
<div class="level-map">${LEVELS.map((L,i)=>{const u=unlocked(i);return `<button class="node ${u?'':'locked'} ${i===go?'current':''}" ${u?`onclick="startLevel(${i})"`:'disabled'}>
<div class="node-icon">${u?lvIcon(L):'🔒'}</div><div class="node-num">Level ${i+1}</div><div class="node-title">${L.title}</div><div class="node-type">${lvName(L)}</div><div class="node-stars">${starStr(bestStars(i))}</div></button>`;}).join('<div class="node-path"></div>')}</div>
<button class="btn btn-primary btn-big" onclick="startLevel(${go})">${next<0?'▶ Play again from Level 1':next===0?'▶ Start Level 1':'▶ Continue: Level '+(go+1)}</button>
<div class="how-box">${['fall','belt','pop','sim','boss'].filter(k=>LEVELS.some(L=>L.kind===k)).map(k=>`<div><b>${KIND_ICON[k]} ${KIND_NAME[k]}</b>${KIND_HOW[k]}</div>`).join('')}</div>
<div class="best-line">🏆 Best score on this device: <b>${(STORE.best||0).toLocaleString()}</b> &nbsp;·&nbsp; <button class="mute-btn link-btn" onclick="toggleMute()">${G.muted?'🔇':'🔊'}</button> sound</div>
<p class="topics-line"><b>Topics:</b> ${ACT.topics}</p></div>`;
  showScreen('welcomeScreen');
}

/* ---------- briefing ---------- */
function startLevel(i){
  lvl=i;teachStep=0;stopSorter();
  if(LEVELS[i].brief.length){showScreen('teachScreen');renderBrief();}else playLevel();
}
function renderBrief(){
  const L=LEVELS[lvl],s=L.brief[teachStep];
  $('teachLabel').textContent=`Level ${lvl+1}: ${L.title} · Briefing ${teachStep+1} of ${L.brief.length}`;
  $('teachContent').innerHTML=s.html;
  const last=teachStep===L.brief.length-1;
  $('teachNextBtn').textContent=last?`${lvIcon(L)} Play Level ${lvl+1} →`:'Next →';
  $('teachNextBtn').className='btn '+(last?'btn-success btn-big':'btn-primary');
  $('teachBackBtn').textContent=teachStep===0?'🗺️ Map':'← Back';
  if(s.init)s.init();
}
function nextTeach(){teachStep++;if(teachStep>=LEVELS[lvl].brief.length)playLevel();else renderBrief();}
function prevTeach(){if(teachStep>0){teachStep--;renderBrief();}else renderWelcome();}
function openBrief(){
  const L=LEVELS[lvl];if(!L.book.length)return;
  if(S)S.paused=true;briefOpen=true;
  const o=document.createElement('div');o.className='overlay';o.id='briefOverlay';
  o.innerHTML=`<div class="overlay-inner">${L.book.map(b=>b.html.replace(/ id="/g,' data-oid="')).join('')}<button class="btn btn-primary" onclick="closeBrief()">Back to the game ▶</button></div>`;
  document.body.appendChild(o);
}
function closeBrief(){$('briefOverlay')?.remove();briefOpen=false;if(S&&S.active&&!S.wait){S.paused=false;S.last=performance.now();}}

/* ---------- level screen ---------- */
function playLevel(){
  const L=LEVELS[lvl];
  G.points-=G.lp[lvl]||0;G.lp[lvl]=0;G.combo=0;
  $('teachContent').innerHTML='';
  showScreen('roundScreen');
  $('roundLabel').innerHTML=`<span>${lvIcon(L)} Level ${lvl+1} of ${LEVELS.length}: ${L.title}</span>
<span class="hud"><span id="hudLives"></span><span id="hudCombo" class="hud-combo"></span><span class="hud-pts">⚡ <span id="hudPts">0</span></span>
${L.book.length?`<button class="hud-btn" title="${L.mode==='boss'?'Look at the lessons again':'Look at the briefing again'}" aria-label="${L.mode==='boss'?'Look at the lessons again':'Look at the briefing again'}" onclick="openBrief()">📖</button>`:''}<button class="hud-btn mute-btn" onclick="toggleMute()">${G.muted?'🔇':'🔊'}</button></span>`;
  $('roundHeading').textContent=L.heading;
  setProgress(Math.round(lvl/LEVELS.length*100));
  ({sorter:playSorter,boss:playBoss,sim:playSim})[L.mode](L);
  hud();
}

/* ---------- SORTER: falling cards ----------
   Life: a robot host who reacts (lines are personality only, never facts), cards that fly into the bin you chose,
   an alarm when a card nears the floor, an "on fire" sky at combo ×3+, and the same quiet music as the bosses. */
const SAY={
  start:['Here they come!','Ready? Sort fast!',"Let's go!"],
  good:['Nice sort!','Yes!','Smooth!','Spot on!','Sorted!'],
  fast:['Lightning fast! ⚡','Whoa, speedy!','So quick!'],

/* ---------- BOSS: exam questions in an arena ----------
   Every mark fires a bolt at the boss; the HP bar is exactly the marks still needed (hp = 70% of the marks), so it never lies.
   A 0-mark answer lets the boss fire back and knock off a shield (shields only add end-of-battle points).
   Full marks before the charge bar empties = a critical hit: double POINTS, never extra marks.
   Taunts are personality only: they never state a fact. */
const RM=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
const TAUNT={
  start:['So you think you can pass the exam?',"Let's see what you really know.","I've beaten better revisers than you!","I'm not going easy on you."],
  hurt:['Argh! Lucky guess!','That one stung!','Impossible!','How did you know that?!','Grr… not bad.'],
  gloat:['Ha! Check the mark scheme!','Too easy!','Missed me!','Is that your final answer? Ha!'],
  rage:["Now I'm ANGRY!",'Enough! Full power!'],

function taunt(k){
  const el=$('bossSay');if(!el||!B)return;
  const pool=(B.boss.taunts&&B.boss.taunts[k])||TAUNT[k];

/* quiet looping bass while a boss is alive; off when muted or switched off with 🎵 */
let MUS=null;
const BASS=[110,110,131,110,165,110,147,131];
function startMusic(){
  stopMusic();if(G.muted||STORE.music===false)return;
  try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
  MUS={i:0};
  const step=()=>{
    if(!MUS)return;
    try{const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type='square';o.frequency.value=BASS[MUS.i%8]*(MUS.i%16>=8?1.19:1);
      g.gain.setValueAtTime(0.022,t);g.gain.exponentialRampToValueAtTime(0.0008,t+0.15);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+0.17);}catch(e){}
    MUS.i++;MUS.t=setTimeout(step,($('arena')&&B&&B.rage)||(S&&S.active&&mult()>=3)?165:225);
  };
  step();
}
function stopMusic(){if(MUS){clearTimeout(MUS.t);MUS=null;}}
function toggleMusic(){
  STORE.music=STORE.music===false;save();
  const b=$('musBtn');if(b)b.classList.toggle('off',STORE.music===false);

}
function boom(){
  if(G.muted)return;
  try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();
    const n=Math.floor(AC.sampleRate*0.7),buf=AC.createBuffer(1,n,AC.sampleRate),d=buf.getChannelData(0);
    for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2.2);
    const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
    f.type='lowpass';f.frequency.value=700;g.gain.value=0.35;s.buffer=buf;s.connect(f);f.connect(g);g.connect(AC.destination);s.start();}catch(e){}
}
function sparks(host,x,y,col,n,big){
  if(RM)return;
  for(let i=0;i<n;i++){
    const s=document.createElement('i');s.className='spark';s.style.background=col;s.style.color=col;s.style.left=x+'px';s.style.top=y+'px';host.appendChild(s);
    const a=Math.random()*Math.PI*2,r=(big?50:22)+Math.random()*(big?110:40);
    s.animate([{transform:'translate(0,0) scale(1)',opacity:1},{transform:`translate(${Math.cos(a)*r}px,${Math.sin(a)*r}px) scale(0)`,opacity:0}],
      {duration:450+Math.random()*350,easing:'cubic-bezier(.2,.8,.3,1)'}).onfinish=()=>s.remove();
  }

function centre(el,host){const a=host.getBoundingClientRect(),r=el.getBoundingClientRect();return [r.left-a.left+r.width/2,r.top-a.top+r.height/2];}
function retrigger(el,cls,ms){el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls);clearTimeout(el['_'+cls]);el['_'+cls]=setTimeout(()=>el.classList.remove(cls),ms);}
function shoot(cls,from,to,ms,land){
  const ar=$('arena');if(!ar){land();return;}
  if(RM){land();return;}
  const [x0,y0]=from,[x1,y1]=to,ang=Math.atan2(y1-y0,x1-x0);
  const b=document.createElement('div');b.className=cls;ar.appendChild(b);

    .onfinish=()=>{b.remove();land();};
}

function drawBoss(pool){
  const cap={},out=[];
  pool.forEach(([items,n])=>{let k=0;shuffle(items.filter(Boolean)).forEach(t=>{const sh=t.shape||t.src;if(k<n&&(cap[sh]||0)<2){cap[sh]=(cap[sh]||0)+1;out.push(t);k++;}});});
  const left=shuffle(out),seq=[];
  while(left.length){const i=left.findIndex(t=>!seq.length||t.shape!==seq[seq.length-1].shape);seq.push(left.splice(i<0?0:i,1)[0]);}
  return seq;
}
function playBoss(L){
  const tasks=L.pool?drawBoss(L.pool):L.keepOrder?L.tasks:shuffle(L.tasks);
  const max=tasks.reduce((a,t)=>a+taskMax(t),0),hp=Math.ceil(max*0.7);
  const boss=L.boss||ACT.boss||{icon:'👾',name:'The Exam Boss'};
  marks[lvl]=0;maxMarks[lvl]=max;
  B={L,tasks,max,hp,left:hp,disp:hp,boss,shields:3,rage:false,T:0,t0:0};taskIdx=0;
  $('taskArea').innerHTML=`<div class="arena" id="arena"><div class="arena-grid"></div>
${musBtn()}
<div class="fighter you"><div class="you-icon" id="you">💻</div><div class="you-name">YOU</div><div class="shields" id="shields">${'<span>🛡️</span>'.repeat(3)}</div></div>
<div class="arena-vs">VS</div>
<div class="fighter foe"><div class="say" id="bossSay" aria-live="polite"></div><div class="boss-sprite enter" id="bossAv">${boss.icon}</div>
<div class="boss-name">${boss.name}</div><div class="hp-segs" id="hpSegs">${'<i></i>'.repeat(hp)}</div><div class="hp-text" id="hpText"></div></div></div>
<div class="charge" id="charge"><div class="charge-label">⚡ CRITICAL CHARGE · full marks before it runs out = double points</div><div class="charge-bar"><div class="charge-fill" id="chargeFill"></div></div></div>
<div class="boss-rule" id="bossRule">Every mark you score fires a bolt. Score <b>${hp}</b> of the ${max} marks to defeat the boss.</div><div id="bossTask"></div>`;
  setTimeout(()=>{const a=$('bossAv');if(a)a.classList.remove('enter');},800);
  bossHp();showTask();
  flash(`⚠️ BOSS BATTLE · ${boss.name}`);sfx('level');
  setTimeout(()=>{if($('arena'))taunt('start');},1000);
  startMusic();
}
function bossHp(){
  const segs=$('hpSegs').children;

  $('hpText').textContent=B.disp>0?`${B.disp} hit${B.disp===1?'':'s'} to go`:'DEFEATED!';

function showTask(){
  if(taskIdx>=B.tasks.length){bossEnd();return;}

  ({classify:renderClassify,mcq:renderMcq,match:renderMatch,fill:renderFill,order:renderOrder,pick:renderPick})[t.type](t,B.L);

function chargeStart(m){
  const f=$('chargeFill');if(!f)return;

function done(t,got){
  const max=taskMax(t),fast=chargeStop(),crit=got===max&&fast;

  if(got===max)G.combo++;else G.combo=0;
  const pts=got*150*mult()*(crit?2:1);if(pts)addPoints(pts);hud();

function fireBolts(n,dmg,crit){

    sfx('zap');

function impact([x,y],counts,crit,lastBolt){

function ko(){

function bossEnd(){

<button class="btn btn-primary" id="goBtn" onclick="levelComplete()">See level result →</button></div>`;
  if(!won&&$('arena'))taunt('gloat');
  sfx(won?'win':'over');$('goBtn').focus({preventScroll:true});
}

/* ---------- SIM: bespoke mini-game ---------- */
function playSim(L){
  marks[lvl]=0;maxMarks[lvl]=0;
  window['sim_'+L.sim]($('taskArea'),(pts,st)=>{addPoints(pts);levelComplete(st);});
}

/* ---------- level complete ---------- */
function levelComplete(simStars){
  stopSorter();
  const L=LEVELS[lvl],isSim=L.mode==='sim';
  const pct=isSim?null:(maxMarks[lvl]?marks[lvl]/maxMarks[lvl]:0);
  const st=isSim?simStars:(pct===1?3:pct>=0.7?2:pct>=0.4?1:0);
  stars[lvl]=st;STORE.stars[lvl]=Math.max(STORE.stars[lvl]??0,st);save();
  const last=lvl===LEVELS.length-1;
  setProgress(Math.round((lvl+1)/LEVELS.length*100));
  sfx('level');if(st===3)fireConfetti();
  $('roundHeading').textContent='';
  $('taskArea').innerHTML=`<div class="level-done"><div class="stars-big">${[0,1,2].map(n=>`<span class="${n<st?'on':''}" style="animation-delay:${0.15+n*0.25}s">★</span>`).join('')}</div>
<h3>Level ${lvl+1} complete!</h3>
${isSim?'':`<div class="ld-marks">${marks[lvl]}/${maxMarks[lvl]} correct</div>`}
<div class="ld-pts">⚡ ${G.points.toLocaleString()} points so far</div>
${st<3?`<p class="ld-tip">${st===0?'Have another go at this level before you move on.':'Replay the level to go for ★★★.'}</p>`:''}
<div class="btn-row-sm"><button class="btn btn-ghost" onclick="playLevel()">↻ Replay level</button>
<button class="btn btn-ghost" onclick="renderWelcome()">🗺️ Map</button>
<button class="btn btn-success" id="goBtn" onclick="${last?'showResults()':`startLevel(${lvl+1})`}">${last?'See my results →':`Level ${lvl+2}: ${LEVELS[lvl+1].title} →`}</button></div></div>`;
  $('goBtn').focus({preventScroll:true});
  hud();
}

/* ---------- task renderers (unchanged from v1) ---------- */
function taskMax(t){
  if(t.type==='match')return t.pairs.length;
  if(t.type==='fill')return (t.text.match(/\[\[/g)||[]).length;
  if(t.type==='order')return t.steps.length;
  if(t.type==='pick')return t.need;
  return 1;
}
/* classify: one statement, sort into a category */
function renderClassify(t,r){
  const choices=t.choices||r.choices;
  $('taskBody').innerHTML=`<div class="item-text">${t.text}</div><div class="classify-btns">${choices.map(c=>`<button class="classify-btn" data-k="${c.key}">${c.label}</button>`).join('')}</div>`;
  document.querySelectorAll('#taskBody .classify-btn').forEach(b=>b.onclick=()=>{
    document.querySelectorAll('#taskBody .classify-btn').forEach(x=>{x.disabled=true;if(x.dataset.k===t.answer)x.classList.add('correct');});
    const ok=b.dataset.k===t.answer;if(!ok)b.classList.add('wrong');
    done(t,ok?1:0);
  });
}
/* the real figure from the exam paper: [FIG] in the question marks where it goes */
function figHtml(t){return [].concat(t.fig||[]).map(f=>`<figure class="exam-fig"><button class="fig-btn" onclick="zoomFig('${f}')" aria-label="Make the figure from the exam paper bigger"><img src="figs/${f}" alt="The figure printed in the exam paper"></button><figcaption>🔍 Click the figure to make it bigger</figcaption></figure>`).join('');}
function stem(t){const f=figHtml(t);return t.q.includes('[FIG]')?t.q.replace('[FIG]',f):f+t.q;}
function zoomFig(f){
  const o=document.createElement('div');o.className='overlay fig-overlay';o.id='figOverlay';
  o.innerHTML=`<div class="fig-big"><img src="figs/${f}" alt="The figure printed in the exam paper, made bigger"></div><button class="btn btn-primary" id="figClose">✕ Close the figure</button>`;
  o.onclick=e=>{if(e.target===o||e.target.id==='figClose')o.remove();};
  document.body.appendChild(o);$('figClose').focus();
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('figOverlay')?.remove();});
/* mcq: options[] with answer index; past-paper A-D keep their order */
function renderMcq(t){
  const letters=t.keepOrder?['A','B','C','D','E']:null;
  const opts=t.options.map((o,i)=>({o,i}));
  const shown=t.keepOrder?opts:shuffle(opts);
  $('taskBody').innerHTML=`<div class="item-text">${stem(t)}</div><div class="mcq-list">${shown.map((x,n)=>`<button class="mcq-btn" data-i="${x.i}">${letters?'<b>'+letters[n]+'.</b> ':''}${x.o}</button>`).join('')}</div>`;
  document.querySelectorAll('#taskBody .mcq-btn').forEach(b=>b.onclick=()=>{
    document.querySelectorAll('#taskBody .mcq-btn').forEach(x=>{x.disabled=true;if(+x.dataset.i===t.answer)x.classList.add('correct');});
    const ok=+b.dataset.i===t.answer;if(!ok)b.classList.add('wrong');
    done(t,ok?1:0);
  });
}
/* match: click a term then its definition; each description scores only if its first term is right. t.spare: extra terms that match nothing (as "not all terms will be used") */
function renderMatch(t){
  let sel=null,left=t.pairs.length,got=0;const missed=new Set();
  const defs=shuffle(t.pairs.map((p,i)=>({d:p.def,i})));
  const terms=t.pairs.map((p,i)=>({term:p.term,i:''+i}));
  if(t.spare){t.spare.forEach((x,k)=>terms.push({term:x,i:'s'+k}));terms.sort((a,b)=>a.term.localeCompare(b.term));}
  $('taskBody').innerHTML=`<div class="item-text">${t.q?stem(t):'Click a term, then click the description that matches it.'}</div>
<div class="match-container"><div class="match-col">${terms.map(x=>`<div class="match-term" data-i="${x.i}">${x.term}</div>`).join('')}</div>
<div class="match-col">${defs.map(x=>`<div class="match-def" data-i="${x.i}">${x.d}</div>`).join('')}</div></div>`;
  document.querySelectorAll('#taskBody .match-term').forEach(el=>el.onclick=()=>{
    if(el.classList.contains('matched'))return;
    document.querySelectorAll('#taskBody .match-term').forEach(x=>x.classList.remove('selected'));
    el.classList.add('selected');sel=el.dataset.i;
  });
  document.querySelectorAll('#taskBody .match-def').forEach(el=>el.onclick=()=>{
    if(sel===null||el.classList.contains('matched'))return;
    const term=document.querySelector(`#taskBody .match-term[data-i="${sel}"]`);
    if(el.dataset.i===sel){
      el.classList.add('matched');term.classList.remove('selected');term.classList.add('matched');
      el.innerHTML=`<span class="match-label">${term.textContent}</span> ${el.innerHTML}`;
      if(!missed.has(el.dataset.i))got++;left--;sel=null;
      if(left===0){document.querySelectorAll('#taskBody .match-term:not(.matched)').forEach(x=>{x.classList.add('spare');x.textContent+=' (not used)';});done(t,got);}
    }else{
      missed.add(el.dataset.i);el.style.animation='shake 0.4s ease';el.style.borderColor='#e74c3c';
      setTimeout(()=>{el.style.animation='';el.style.borderColor='';},500);
    }
  });
}
/* fill: text with [[answer]] blanks, choose from a word bank */
function renderFill(t){
  const answers=[];let n=0;
  const bank=shuffle(t.bank);
  const html=t.text.replace(/\[\[(.+?)\]\]/g,(m,a)=>{answers.push(a);return `<select class="blank" data-n="${n++}"><option value="">— choose —</option>${bank.map(w=>`<option>${w}</option>`).join('')}</select>`;});
  $('taskBody').innerHTML=`<div class="item-text small">${t.q?stem(t):'Complete the text using the words supplied. Not all words will be used.'}</div>
<div class="word-bank">${t.bank.map(w=>`<span>${w}</span>`).join('')}</div><div class="fill-text">${html}</div>
<button class="btn btn-success" id="checkBtn">Check answers</button>`;
  $('checkBtn').onclick=()=>{
    const sels=[...document.querySelectorAll('#taskBody select.blank')];
    if(sels.some(s=>!s.value)&&!confirm('Some gaps are empty. Check anyway?'))return;
    /* alts: other full sets of answers the mark scheme accepts (a field and its criteria must belong together) */
    const alts=t.alts||[answers],score=a=>sels.filter((s,i)=>norm(s.value)===norm(a[i])).length;
    const best=alts.reduce((b,a)=>score(a)>score(b)?a:b,alts[0]);let got=0;
    sels.forEach((s,i)=>{s.disabled=true;if(norm(s.value)===norm(best[i])){got++;s.classList.add('correct');}else{s.classList.add('wrong');s.insertAdjacentHTML('afterend',`<span class="fix">${best[i]}</span>`);}});
    $('checkBtn').remove();done(t,got);
  };
}
/* order: click the steps in the right order */
function renderOrder(t){
  const picked=[];
  $('taskBody').innerHTML=`<div class="item-text small">${stem(t)}</div><div class="order-pool">${shuffle(t.steps.map((s,i)=>({s,i}))).map(x=>`<button class="order-btn" data-i="${x.i}">${x.s}</button>`).join('')}</div>
<ol class="order-answer" id="orderAns"></ol><div class="btn-row-sm"><button class="btn btn-ghost" id="resetBtn">Reset</button><button class="btn btn-success" id="checkBtn" disabled>Check order</button></div>`;
  const pool=[...document.querySelectorAll('#taskBody .order-btn')];
  pool.forEach(b=>b.onclick=()=>{b.disabled=true;picked.push(+b.dataset.i);$('orderAns').insertAdjacentHTML('beforeend',`<li>${t.steps[+b.dataset.i]}</li>`);$('checkBtn').disabled=picked.length<t.steps.length;});
  $('resetBtn').onclick=()=>{picked.length=0;$('orderAns').innerHTML='';pool.forEach(b=>b.disabled=false);$('checkBtn').disabled=true;};
  $('checkBtn').onclick=()=>{
    let got=0;[...$('orderAns').children].forEach((li,i)=>{if(picked[i]===i){got++;li.classList.add('ok');}else{li.classList.add('bad');li.insertAdjacentHTML('beforeend',` <span class="fix">→ should be: ${t.steps[i]}</span>`);}});
    $('resetBtn').remove();$('checkBtn').remove();done(t,got);
  };
}
/* pick: choose `need` correct answers from a list (each wrong pick cancels a right one) */
function renderPick(t){
  const opts=shuffle(t.options.map((o,i)=>({...o,i})));
  $('taskBody').innerHTML=`<div class="item-text">${stem(t)}</div><div class="pick-hint">Choose ${t.need}.</div><div class="mcq-list">${opts.map(o=>`<button class="mcq-btn pick" data-i="${o.i}">${o.text}</button>`).join('')}</div><button class="btn btn-success" id="checkBtn" disabled>Check</button>`;
  const btns=[...document.querySelectorAll('#taskBody .pick')];
  btns.forEach(b=>b.onclick=()=>{
    if(!b.classList.contains('sel')&&btns.filter(x=>x.classList.contains('sel')).length>=t.need)return;
    b.classList.toggle('sel');$('checkBtn').disabled=btns.filter(x=>x.classList.contains('sel')).length!==t.need;
  });
  $('checkBtn').onclick=()=>{
    let right=0,wrong=0;
    const right_=btns.filter(b=>b.classList.contains('sel')&&t.options[+b.dataset.i].ok).length;
    btns.forEach(b=>{b.disabled=true;const o=t.options[+b.dataset.i];const s=b.classList.contains('sel');if(o.ok&&(s||right_<t.need))b.classList.add(s?'correct':'missed');if(s&&o.ok)right++;if(s&&!o.ok){wrong++;b.classList.add('wrong');}});
    $('checkBtn').remove();done(t,right);
  };
}

/* ---------- results ---------- */
function showResults(){
  stopSorter();
  const scored=LEVELS.map((L,i)=>i).filter(i=>LEVELS[i].mode!=='sim');
  const played=scored.filter(i=>maxMarks[i]>0&&marks[i]!=null);
  const total=played.reduce((a,i)=>a+marks[i],0),max=played.reduce((a,i)=>a+maxMarks[i],0),pct=max?Math.round(total/max*100):0;
  const [r1,r2,r3,r4]=ACT.ranks;
  const [icon,rank]=pct>=90?['👑',r1]:pct>=70?['⭐',r2]:pct>=50?['🔧',r3]:['🌱',r4];
  const newBest=G.points>(STORE.best||0);if(newBest){STORE.best=G.points;save();}
  if(window.OLSBridge)OLSBridge.finish(total,max);
  setProgress(100);showScreen('resultsScreen');if(pct>=50||newBest)fireConfetti();sfx('win');
  const tips=played.map(i=>marks[i]/maxMarks[i]<0.7?LEVELS[i].tip:null).filter(Boolean);
  const row=(L,i)=>{const st=stars[i]!=null?starStr(stars[i]):'';
    const sc=L.mode==='sim'?(stars[i]!=null?'mini-game':'not played'):(played.includes(i)?`${marks[i]}/${maxMarks[i]}`:'not played');
    return `<div class="breakdown-row"><span>Level ${i+1}: ${L.title}</span><span><span class="row-stars">${st}</span> ${sc}</span></div>`;};
  $('resultsScreen').innerHTML=`<div class="results"><div class="results-icon">${icon}</div><h2>Mission Complete!</h2>
<div class="pts-big">⚡ ${G.points.toLocaleString()} points</div>
${newBest?'<div class="new-best">🏆 New high score on this device!</div>':`<div class="best-line">🏆 Best on this device: ${(STORE.best||0).toLocaleString()}</div>`}
<div class="score-big">${total}/${max} correct (${pct}%)</div><div class="rank">${rank}</div>
<div class="breakdown">${LEVELS.map(row).join('')}<div class="breakdown-row"><span>Total</span><span>${total}/${max}</span></div></div>
${played.length<scored.length?'<p class="ld-tip">Levels you did not play this time are not counted.</p>':''}
${tips.length?`<div class="revision-box"><h4>📝 Go over these again</h4><ul>${tips.map(t=>'<li>'+t+'</li>').join('')}</ul></div>`:''}
<div class="btn-row"><button class="btn btn-ghost" onclick="location.reload()">↻ Play again</button><a href="index.html" class="btn btn-primary" style="text-decoration:none;">← Back to HQ</a>
${ACT.next?`<a href="${ACT.next.href}" class="btn btn-success" style="text-decoration:none;">${ACT.next.label} →</a>`:''}</div></div>`;
}
function fireConfetti(){const c=['#64b5f6','#2ecc71','#f39c12','#e74c3c','#9b59b6','#1abc9c'];for(let i=0;i<40;i++){const d=document.createElement('div');d.className='confetti-piece';d.style.left=Math.random()*100+'%';d.style.top='-10px';d.style.background=c[i%c.length];d.style.width=d.style.height=(6+Math.random()*8)+'px';d.style.animationDelay=Math.random()*1.5+'s';d.style.animationDuration=(2+Math.random()*2)+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),5000);}}

renderWelcome();

</script>
