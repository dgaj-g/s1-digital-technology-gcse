<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loop Detective - S2 Algorithms</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
    --bg:#F0FFF4;--bg2:#DCFCE7;
    --card:#FFFFFF;--card-border:#BBF7D0;
    --primary:#16A34A;--primary-light:#22C55E;--primary-pale:#F0FFF4;
    --green:#2ecc71;--green-pale:#EDFAF2;
    --gold:#D4A017;--gold-light:#FFD700;--gold-pale:#FFF9E6;
    --red:#e74c3c;--red-pale:#FDECEC;
    --text:#1A2E1A;--text-dim:#6B8F6B;--text-light:#A3C4A3;
    --danger:#D32F2F;--danger-pale:#FDECEC;
    --code-bg:#1E293B;--code-text:#E2E8F0;
    --redacted:#E8652B;
}
body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
.container{max-width:700px;margin:0 auto;padding:24px 16px}
.hidden{display:none!important}

/* ── HOME LINK ── */
.home-btn{display:inline-block;color:var(--text-dim);text-decoration:none;font-size:.85rem;font-weight:600;margin-bottom:18px;padding:6px 0;transition:color .2s}
.home-btn:hover{color:var(--primary)}

/* ── INTRO ── */
#intro{text-align:center;animation:fadeIn .5s ease}
.detective-icon{font-size:4.5rem;margin-bottom:8px;display:block;animation:wobble 2s ease-in-out infinite}
#intro h1{font-size:clamp(1.8rem,6vw,2.6rem);color:var(--primary);margin-bottom:6px;font-weight:900;letter-spacing:.5px}
#intro .tagline{color:var(--text-dim);font-size:1rem;line-height:1.65;margin-bottom:6px;max-width:520px;margin-left:auto;margin-right:auto}
#intro .sub{color:var(--text-light);font-size:.82rem;margin-bottom:28px}
.start-btn{background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;border:none;padding:16px 44px;border-radius:999px;font-size:1.1rem;font-weight:800;cursor:pointer;letter-spacing:.5px;transition:transform .2s,box-shadow .2s;box-shadow:0 4px 20px rgba(22,163,74,.3)}
.start-btn:hover{transform:translateY(-2px) scale(1.03);box-shadow:0 8px 28px rgba(22,163,74,.4)}

/* ── TOP BAR ── */
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;padding:10px 16px;background:var(--card);border:1px solid var(--card-border);border-radius:14px;box-shadow:0 2px 8px rgba(0,0,0,.04);flex-wrap:wrap;gap:6px}
.case-counter{color:var(--text-dim);font-weight:700;font-size:.85rem}
.score-display{font-weight:800;font-size:.95rem;color:var(--primary)}
.streak-display{font-size:.85rem;font-weight:700;color:var(--gold)}
.progress-track{width:100%;height:5px;background:var(--card-border);border-radius:99px;margin-top:10px}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--primary-light));border-radius:99px;transition:width .4s ease}

/* ── QUESTION CARD ── */
.question-card{background:var(--card);border:1px solid var(--card-border);border-radius:16px;padding:24px;margin-bottom:16px;box-shadow:0 2px 12px rgba(0,0,0,.05);position:relative;overflow:hidden;animation:slideIn .35s ease}
.question-card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--primary),var(--gold))}

/* Code type badge */
.type-badge{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:99px;font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:14px}
.type-badge.code-badge{background:#1E293B;color:#94A3B8}
.type-badge.scenario-badge{background:var(--green-pale);color:var(--primary);border:1px solid var(--card-border)}

/* Code block */
.code-block{background:var(--code-bg);border-radius:12px;padding:18px 20px;margin-bottom:6px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.code-block pre{font-family:'Courier New',Courier,monospace;font-size:.88rem;line-height:1.8;color:var(--code-text);white-space:pre;tab-size:4}
.redacted{background:var(--redacted);color:var(--redacted);border-radius:4px;padding:2px 8px;font-weight:900;letter-spacing:-1px;user-select:none;display:inline-block}

/* Scenario block */
.scenario-block{background:var(--bg2);border:1px solid var(--card-border);border-radius:12px;padding:18px 20px;margin-bottom:6px;font-size:.95rem;line-height:1.7;color:var(--text)}
.scenario-block .scenario-icon{font-size:1.6rem;display:block;margin-bottom:8px}

.question-prompt{font-size:.88rem;color:var(--text-dim);font-weight:600;margin-top:10px;margin-bottom:0}

/* ── ANSWER BUTTONS ── */
.answers{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.answer-btn{display:flex;align-items:center;gap:14px;padding:16px 20px;background:var(--card);border:2px solid var(--card-border);border-radius:14px;cursor:pointer;transition:all .2s;font-family:inherit;font-size:1rem;text-align:left;position:relative;overflow:hidden}
.answer-btn:hover{border-color:var(--primary);background:var(--primary-pale);transform:translateY(-1px);box-shadow:0 4px 14px rgba(22,163,74,.12)}
.answer-btn:active{transform:scale(.98)}
.answer-btn .btn-emoji{font-size:1.6rem;flex-shrink:0}
.answer-btn .btn-text{display:flex;flex-direction:column}
.answer-btn .btn-label{font-weight:800;color:var(--text);font-size:1rem}
.answer-btn .btn-hint{font-size:.78rem;color:var(--text-dim);font-weight:500;margin-top:1px}
.answer-btn.correct{border-color:var(--green)!important;background:var(--green-pale)!important}
.answer-btn.wrong{border-color:var(--red)!important;background:var(--red-pale)!important;animation:shake .4s ease}
.answer-btn.disabled{pointer-events:none;opacity:.5}
.answer-btn.correct .btn-label{color:var(--green)}
.answer-btn.wrong .btn-label{color:var(--red)}

/* ── FEEDBACK ── */
.feedback-panel{border-radius:14px;padding:18px 20px;margin-bottom:16px;animation:slideIn .3s ease}
.feedback-panel.correct-fb{background:var(--green-pale);border:1px solid #A7F3D0}
.feedback-panel.wrong-fb{background:var(--red-pale);border:1px solid #FCA5A5}
.feedback-header{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-weight:800;font-size:1rem}
.feedback-header.correct-hd{color:#15803D}
.feedback-header.wrong-hd{color:var(--danger)}
.feedback-explanation{font-size:.88rem;line-height:1.65;color:var(--text)}
.next-btn{display:block;margin:14px auto 0;background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;border:none;padding:12px 36px;border-radius:999px;font-size:.95rem;font-weight:700;cursor:pointer;transition:transform .2s,box-shadow .2s;box-shadow:0 3px 14px rgba(22,163,74,.25)}
.next-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(22,163,74,.35)}

/* ── FLOATING SCORE ── */
.float-score{position:fixed;font-size:1.6rem;font-weight:900;pointer-events:none;z-index:999;animation:floatUp 1s ease-out forwards}
.float-score.plus{color:var(--green)}
.float-score.minus{color:var(--red)}

/* ── RESULTS ── */
#results{text-align:center;animation:fadeIn .5s ease}
.results-card{background:var(--card);border:1px solid var(--card-border);border-radius:20px;padding:32px 24px;box-shadow:0 4px 24px rgba(0,0,0,.06);position:relative;overflow:hidden}
.results-card::before{content:'';position:absolute;top:0;left:0;right:0;height:5px;background:linear-gradient(90deg,var(--primary),var(--gold),var(--green))}
.result-badge{font-size:4rem;display:block;margin-bottom:8px;animation:popIn .5s ease}
.result-rank{font-size:1.5rem;font-weight:900;color:var(--primary);margin-bottom:4px}
.result-score{font-size:1.1rem;color:var(--text-dim);margin-bottom:16px}
.stars-row{font-size:1.5rem;letter-spacing:4px;margin-bottom:20px;display:block}
.score-breakdown{display:flex;justify-content:center;gap:24px;margin-bottom:20px;flex-wrap:wrap}
.breakdown-item{text-align:center}
.breakdown-num{font-size:1.8rem;font-weight:900;display:block}
.breakdown-num.green{color:var(--green)}
.breakdown-num.red{color:var(--red)}
.breakdown-label{font-size:.72rem;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;font-weight:700}

/* Revision box */
.revision-box{background:var(--bg2);border:1px solid var(--card-border);border-radius:14px;padding:18px;margin-top:20px;text-align:left}
.revision-box h3{font-size:.85rem;font-weight:800;color:var(--primary);margin-bottom:10px;text-transform:uppercase;letter-spacing:1px}
.revision-box ul{list-style:none;padding:0}
.revision-box li{font-size:.85rem;color:var(--text);line-height:1.6;padding:4px 0;padding-left:20px;position:relative}
.revision-box li::before{content:'';position:absolute;left:0;top:11px;width:8px;height:8px;border-radius:50%;background:var(--primary)}

.result-btns{display:flex;gap:12px;justify-content:center;margin-top:24px;flex-wrap:wrap}
.retry-btn{background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;border:none;padding:14px 36px;border-radius:999px;font-size:1rem;font-weight:700;cursor:pointer;transition:transform .2s,box-shadow .2s;box-shadow:0 3px 14px rgba(22,163,74,.25)}
.retry-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(22,163,74,.35)}
.back-btn{background:var(--card);color:var(--primary);border:2px solid var(--card-border);padding:14px 36px;border-radius:999px;font-size:1rem;font-weight:700;cursor:pointer;transition:all .2s;text-decoration:none;display:inline-flex;align-items:center}
.back-btn:hover{border-color:var(--primary);background:var(--primary-pale)}

/* ── CONFETTI ── */
.confetti-piece{position:fixed;width:10px;height:10px;top:-20px;z-index:9999;pointer-events:none;animation:confettiFall linear forwards}

/* ── ANIMATIONS ── */
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes wobble{0%,100%{transform:rotate(0)}15%{transform:rotate(8deg)}30%{transform:rotate(-6deg)}45%{transform:rotate(4deg)}60%{transform:rotate(-2deg)}75%{transform:rotate(1deg)}}
@keyframes popIn{0%{transform:scale(.5);opacity:0}60%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes floatUp{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-80px)}}
@keyframes confettiFall{0%{opacity:1;transform:translateY(0) rotate(0)}100%{opacity:0;transform:translateY(105vh) rotate(720deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes greenFlash{0%{box-shadow:0 0 0 0 rgba(46,204,113,.4)}100%{box-shadow:0 0 0 20px rgba(46,204,113,0)}}

/* ── RESPONSIVE ── */
@media(max-width:500px){
    .container{padding:16px 10px}
    .top-bar{padding:8px 10px}
    .question-card{padding:16px 14px}
    .code-block{padding:14px}
    .code-block pre{font-size:.78rem}
    .answer-btn{padding:14px 16px}
    .answer-btn .btn-emoji{font-size:1.3rem}
    .answer-btn .btn-label{font-size:.92rem}
    .score-breakdown{gap:16px}
}
</style>
</head>
<body>
<div class="container">

<!-- ═══════════ INTRO SCREEN ═══════════ -->
<div id="intro">
    <a href="index.html" class="home-btn">&larr; Back to Activities</a>
    <span class="detective-icon">🔍</span>
    <h1>LOOP DETECTIVE</h1>
    <p class="tagline">The loop keywords have been redacted! Study each code snippet's structure to identify what type of loop it is. Can you crack every case?</p>
    <p class="sub">12 cases &bull; Redacted code &bull; Scenario analysis</p>
    <button class="start-btn" onclick="startGame()">Start Investigation &rarr;</button>
</div>

<!-- ═══════════ GAME SCREEN ═══════════ -->
<div id="game" class="hidden">
    <div class="top-bar">
        <span class="case-counter" id="caseCounter">Case 1/12</span>
        <span class="score-display" id="scoreDisplay">Score: 0</span>
        <span class="streak-display" id="streakDisplay">🔥 0</span>
        <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    </div>
    <div id="questionArea"></div>
    <div class="answers" id="answersArea"></div>
    <div id="feedbackArea"></div>
</div>

<!-- ═══════════ RESULTS SCREEN ═══════════ -->
<div id="results" class="hidden"></div>

</div>

<script>
/* ═══════════════════════════════════════
   DATA
   ═══════════════════════════════════════ */
const questions=[
{type:"code",code:'<span class="redacted">\u2588\u2588\u2588\u2588\u2588</span> i = 1 <span class="redacted">\u2588\u2588\u2588\u2588\u2588</span> 10\n    OUTPUT i\n<span class="redacted">\u2588\u2588\u2588\u2588\u2588</span>',answer:"FOR",explanation:"The counter variable (i) goes from a start value (1) TO an end value (10) \u2014 this is bounded iteration. The number of repetitions is known in advance."},
{type:"code",code:'password = ""\n<span class="redacted">\u2588\u2588\u2588\u2588\u2588</span> password != "secret"\n    OUTPUT "Enter password: "\n    INPUT password\n<span class="redacted">\u2588\u2588\u2588\u2588\u2588</span>',answer:"WHILE",explanation:"The loop depends on a condition (password != \u2018secret\u2019) \u2014 this is unbounded iteration. It could run 0 times if password already equals \u2018secret\u2019."},
{type:"code",code:'<span class="redacted">\u2588\u2588\u2588\u2588\u2588</span>\n    OUTPUT "Enter a mark (0-100): "\n    INPUT mark\n<span class="redacted">\u2588\u2588\u2588\u2588\u2588</span> mark &lt; 0 <span class="redacted">\u2588\u2588\u2588\u2588\u2588</span> mark &gt; 100',answer:"DO WHILE",explanation:"The body runs first (DO), then the condition is checked. This is the exam-standard validation pattern \u2014 it must run at least once because the user hasn\u2019t entered anything yet."},
{type:"code",code:'total = 0\n<span class="redacted">\u2588\u2588\u2588\u2588\u2588</span> i = 1 <span class="redacted">\u2588\u2588\u2588\u2588\u2588</span> 5\n    INPUT score\n    total = total + score\n<span class="redacted">\u2588\u2588\u2588\u2588\u2588</span>\naverage = total / 5',answer:"FOR",explanation:"This is the accumulator/totalling pattern with bounded iteration. The counter goes from 1 TO 5, so exactly 5 scores are input \u2014 the number of repetitions is known."},
{type:"code",code:'found = false\n<span class="redacted">\u2588\u2588\u2588\u2588\u2588</span> found == false\n    INPUT name\n    IF name == searchName <span class="redacted">\u2588\u2588\u2588\u2588\u2588</span>\n        found = true\n    <span class="redacted">\u2588\u2588\u2588\u2588\u2588</span>\n<span class="redacted">\u2588\u2588\u2588\u2588\u2588</span>',answer:"WHILE",explanation:"The loop continues while a condition is true (found == false) \u2014 unbounded iteration. The number of repetitions depends on when the item is found."},
{type:"code",code:'<span class="redacted">\u2588\u2588\u2588\u2588\u2588</span>\n    OUTPUT "Enter age (0-120): "\n    INPUT age\n<span class="redacted">\u2588\u2588\u2588\u2588\u2588</span> age &lt; 0 <span class="redacted">\u2588\u2588\u2588\u2588\u2588</span> age &gt; 120',answer:"DO WHILE",explanation:"This is the validation pattern \u2014 body runs first (input is taken), then the condition checks for INVALID input. Must run at least once."},
{type:"code",code:'<span class="redacted">\u2588\u2588\u2588\u2588\u2588</span> x = 0 <span class="redacted">\u2588\u2588\u2588\u2588\u2588</span> 4\n    OUTPUT names[x]\n<span class="redacted">\u2588\u2588\u2588\u2588\u2588</span>',answer:"FOR",explanation:"A counter (x) iterates from 0 TO 4, accessing each element of the names array \u2014 bounded iteration with a known number of repetitions."},
{type:"code",code:'total = 0\nINPUT number\n<span class="redacted">\u2588\u2588\u2588\u2588\u2588</span> number != -1\n    total = total + number\n    INPUT number\n<span class="redacted">\u2588\u2588\u2588\u2588\u2588</span>\nOUTPUT total',answer:"WHILE",explanation:"The loop continues until a sentinel value (-1) is entered \u2014 unbounded iteration. The number of repetitions is unknown in advance."},
{type:"scenario",text:"A teacher needs to input exactly 30 test marks and calculate the total. Which loop type should they use?",answer:"FOR",explanation:"The number of repetitions is known (30) \u2014 this is bounded iteration. A FOR loop is the correct choice when you know in advance how many times to repeat."},
{type:"scenario",text:"A program needs to keep asking the user for a valid temperature between -50 and 50. The user must be asked at least once. Which loop type should they use?",answer:"DO WHILE",explanation:"The input must be taken at least once (the user hasn\u2019t entered anything yet), then validated. This is the standard validation pattern using DO WHILE."},
{type:"scenario",text:"A program reads data from a file until it reaches the end. The file could be empty. Which loop type should they use?",answer:"WHILE",explanation:"The number of repetitions is unknown (depends on file length) and it might not run at all if the file is empty \u2014 unbounded iteration. WHILE checks the condition before entering the loop."},
{type:"scenario",text:"A quiz program needs to display each of the 20 questions in a question bank, one at a time. Which loop type should they use?",answer:"FOR",explanation:"The number of questions is known (20) \u2014 bounded iteration. A FOR loop with a counter from 1 TO 20 is the correct choice."}
];

const answerChoices=[
{id:"FOR",emoji:"\uD83D\uDD22",label:"FOR Loop",hint:"Known repetitions"},
{id:"WHILE",emoji:"\u2753",label:"WHILE Loop",hint:"Condition first"},
{id:"DO WHILE",emoji:"\uD83C\uDF55",label:"DO WHILE Loop",hint:"At least once"}
];

const ranks=[
{min:11,badge:"\uD83C\uDF1F",title:"Master Detective"},
{min:9,badge:"\uD83D\uDD0E",title:"Senior Detective"},
{min:7,badge:"\uD83D\uDCCB",title:"Detective"},
{min:0,badge:"\uD83D\uDC64",title:"Rookie"}
];

/* ═══════════════════════════════════════
   STATE
   ═══════════════════════════════════════ */
let shuffled=[], current=0, score=0, streak=0, bestStreak=0, answered=false;

/* ═══════════════════════════════════════
   FISHER-YATES SHUFFLE
   ═══════════════════════════════════════ */
function shuffle(arr){
    const a=[...arr];
    for(let i=a.length-1;i>0;i--){
        const j=Math.floor(Math.random()*(i+1));
        [a[i],a[j]]=[a[j],a[i]];
    }
    return a;
}

/* ═══════════════════════════════════════
   START GAME
   ═══════════════════════════════════════ */
function startGame(){
    shuffled=shuffle(questions);
    current=0; score=0; streak=0; bestStreak=0; answered=false;
    document.getElementById('intro').classList.add('hidden');
    document.getElementById('results').classList.add('hidden');
    document.getElementById('game').classList.remove('hidden');
    showQuestion();
}

/* ═══════════════════════════════════════
   SHOW QUESTION
   ═══════════════════════════════════════ */
function showQuestion(){
    answered=false;
    const q=shuffled[current];
    const total=shuffled.length;

    document.getElementById('caseCounter').textContent=`Case ${current+1}/${total}`;
    document.getElementById('scoreDisplay').textContent=`Score: ${score}`;
    document.getElementById('streakDisplay').textContent=`\uD83D\uDD25 ${streak}`;
    document.getElementById('progressFill').style.width=`${(current/total)*100}%`;
    document.getElementById('feedbackArea').innerHTML='';

    /* Build question card */
    let cardHTML='<div class="question-card">';
    if(q.type==='code'){
        cardHTML+=`<span class="type-badge code-badge">\uD83D\uDCBB REDACTED CODE</span>`;
        cardHTML+=`<div class="code-block"><pre>${q.code}</pre></div>`;
        cardHTML+=`<p class="question-prompt">What type of loop has been redacted?</p>`;
    } else {
        cardHTML+=`<span class="type-badge scenario-badge">\uD83D\uDCCB SCENARIO</span>`;
        cardHTML+=`<div class="scenario-block"><span class="scenario-icon">\uD83D\uDCCB</span>${q.text}</div>`;
    }
    cardHTML+='</div>';
    document.getElementById('questionArea').innerHTML=cardHTML;

    /* Build answer buttons */
    let btnsHTML='';
    answerChoices.forEach(c=>{
        btnsHTML+=`<button class="answer-btn" data-answer="${c.id}" onclick="submitAnswer(this,'${c.id}')">
            <span class="btn-emoji">${c.emoji}</span>
            <span class="btn-text">
                <span class="btn-label">${c.label}</span>
                <span class="btn-hint">${c.hint}</span>
            </span>
        </button>`;
    });
    document.getElementById('answersArea').innerHTML=btnsHTML;
}

/* ═══════════════════════════════════════
   SUBMIT ANSWER
   ═══════════════════════════════════════ */
function submitAnswer(btn, choice){
    if(answered) return;
    answered=true;

    const q=shuffled[current];
    const isCorrect=choice===q.answer;
    const allBtns=document.querySelectorAll('.answer-btn');

    /* Disable all */
    allBtns.forEach(b=>{
        b.classList.add('disabled');
        if(b.dataset.answer===q.answer) b.classList.add('correct');
    });

    if(isCorrect){
        score++;
        streak++;
        if(streak>bestStreak) bestStreak=streak;
        btn.classList.add('correct');
        btn.style.animation='greenFlash .5s ease';
        spawnFloat(btn,'+1','plus');
    } else {
        streak=0;
        btn.classList.add('wrong');
        spawnFloat(btn,'\u2718','minus');
    }

    /* Update displays */
    document.getElementById('scoreDisplay').textContent=`Score: ${score}`;
    document.getElementById('streakDisplay').textContent=`\uD83D\uDD25 ${streak}`;

    /* Feedback */
    const fbClass=isCorrect?'correct':'wrong';
    const hdClass=isCorrect?'correct':'wrong';
    const icon=isCorrect?'\u2705':'\u274C';
    const heading=isCorrect?'Correct!':(`Not quite \u2014 it was a ${q.answer} loop`);
    const isLast=current>=shuffled.length-1;
    const nextLabel=isLast?'See Results \u2192':'Next Case \u2192';

    document.getElementById('feedbackArea').innerHTML=`
        <div class="feedback-panel ${fbClass}-fb">
            <div class="feedback-header ${hdClass}-hd">${icon} ${heading}</div>
            <p class="feedback-explanation">${q.explanation}</p>
            <button class="next-btn" onclick="nextQuestion()">${nextLabel}</button>
        </div>`;
}

/* ═══════════════════════════════════════
   FLOATING SCORE
   ═══════════════════════════════════════ */
function spawnFloat(el,text,cls){
    const rect=el.getBoundingClientRect();
    const f=document.createElement('div');
    f.className=`float-score ${cls}`;
    f.textContent=text;
    f.style.left=`${rect.left+rect.width/2-16}px`;
    f.style.top=`${rect.top}px`;
    document.body.appendChild(f);
    setTimeout(()=>f.remove(),1000);
}

/* ═══════════════════════════════════════
   NEXT QUESTION
   ═══════════════════════════════════════ */
function nextQuestion(){
    current++;
    if(current>=shuffled.length){
        showResults();
    } else {
        showQuestion();
    }
}

/* ═══════════════════════════════════════
   RESULTS
   ═══════════════════════════════════════ */
function showResults(){
    document.getElementById('game').classList.add('hidden');
    const res=document.getElementById('results');
    res.classList.remove('hidden');

    const total=shuffled.length;
    const wrong=total-score;
    const rank=ranks.find(r=>score>=r.min);
    const stars='\u2B50'.repeat(score)+'\u2606'.repeat(total-score);

    if(score>=9) launchConfetti();

    res.innerHTML=`
    <a href="index.html" class="home-btn">&larr; Back to Activities</a>
    <div class="results-card">
        <span class="result-badge">${rank.badge}</span>
        <div class="result-rank">${rank.title}</div>
        <div class="result-score">${score} / ${total} cases solved</div>
        <span class="stars-row">${stars}</span>
        <div class="score-breakdown">
            <div class="breakdown-item"><span class="breakdown-num green">${score}</span><span class="breakdown-label">Correct</span></div>
            <div class="breakdown-item"><span class="breakdown-num red">${wrong}</span><span class="breakdown-label">Wrong</span></div>
            <div class="breakdown-item"><span class="breakdown-num" style="color:var(--gold)">${bestStreak}</span><span class="breakdown-label">Best Streak</span></div>
        </div>
        <div class="revision-box">
            <h3>Key Revision Points</h3>
            <ul>
                <li><strong>FOR loop</strong> \u2014 bounded iteration; the number of repetitions is known in advance (uses a counter from start TO end).</li>
                <li><strong>WHILE loop</strong> \u2014 unbounded iteration; condition is checked before the loop body runs, so it could execute 0 times.</li>
                <li><strong>DO WHILE loop</strong> \u2014 unbounded iteration; body runs first then condition is checked, so it always executes at least once. Standard for input validation.</li>
                <li><strong>Bounded</strong> = known repetitions. <strong>Unbounded</strong> = unknown repetitions (depends on a condition).</li>
                <li>The <strong>validation pattern</strong> (DO WHILE) is one of the most frequently examined constructs in CCEA GCSE.</li>
            </ul>
        </div>
        <div class="result-btns">
            <button class="retry-btn" onclick="startGame()">Try Again</button>
            <a href="index.html" class="back-btn">Back to Activities</a>
        </div>
    </div>`;
}

/* ═══════════════════════════════════════
   CONFETTI
   ═══════════════════════════════════════ */
function launchConfetti(){
    const colors=['#2ecc71','#16A34A','#FFD700','#E8652B','#22C55E','#D4A017'];
    for(let i=0;i<80;i++){
        const c=document.createElement('div');
        c.className='confetti-piece';
        c.style.left=Math.random()*100+'vw';
        c.style.background=colors[Math.floor(Math.random()*colors.length)];
        c.style.width=(Math.random()*8+6)+'px';
        c.style.height=(Math.random()*8+6)+'px';
        c.style.borderRadius=Math.random()>.5?'50%':'2px';
        c.style.animationDuration=(Math.random()*2+2)+'s';
        c.style.animationDelay=(Math.random()*1.5)+'s';
        document.body.appendChild(c);
        setTimeout(()=>c.remove(),5000);
    }
}
</script>
