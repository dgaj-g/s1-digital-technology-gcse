/* ---------- formulae ---------- */
form2019b:{shape:'pick-formula',needs:['formula'],fig:'ss2019-p21-activities.png',type:'mcq',src:'PP 2019 Q8(b)',ref:'2019 Q8(b) · 1 mark',
  q:'SPORTZONE use this spreadsheet to calculate the tax payable on the activities they offer.[FIG]Which formula is used in cell E4?',
  options:['=C4*D4','=B4*D4','=A4*D4'],answer:1,
  feedback:'Mark scheme: =B4*D4. B4 is the cost per session and D4 is the total weekly sessions. =C4*D4 uses the sessions each day, and A4 holds the word Gym.'},
form2022c:{shape:'pick-formula',needs:['formula'],fig:'ss2022-p6-tuck-shop.png',type:'mcq',src:'PP 2022 Q3(c)',ref:'2022 Q3(c) · 1 mark',
  q:'The school tuck shop spreadsheet is shown.[FIG]What formula does cell G4 (PROFIT FOR JUNE) contain?',
  options:['=F4*D4','=F4*C4','=F4*B4','=F4+D4'],answer:0,
  feedback:'Mark scheme: =F4*D4 (or (C4-B4)*F4). Number sold times profit per item. The equals sign is not needed and x can be used for multiply.'},
form2023b2:{shape:'pick-formula',needs:['formula'],fig:'ss2023-p8-wages.png',type:'mcq',src:'PP 2023 Q4(b)(ii)',ref:'2023 Q4(b)(ii) · 1 mark',
  q:'Mia’s wages spreadsheet is shown.[FIG]State the formula used in cell D3 (total wages).',
  options:['=B3*C3','=B3+C3','=C3/B3','=B3-C3'],answer:0,
  feedback:'Mark scheme: =B3*C3 (brackets are fine, and the equals sign is not needed). Hourly rate times hours worked.'},
form2024b:{shape:'pick-formula',needs:['formula'],fig:'ss2024-p10-quotations.png',type:'mcq',src:'PP 2024 Q4(b)',ref:'2024 Q4(b) · 1 mark',
  q:'The community group’s quotations spreadsheet is shown.[FIG]What is the formula used in cell D15 to calculate Total Cost?',
  options:['=D13-D14','=D13+D14','=D13*D14','=D14-D13'],answer:0,
  feedback:'Mark scheme: D13-D14 (brackets are fine, and the equals sign is not needed). Total cost is the total take away the discount amount.'},
form2026c:{shape:'pick-formula',needs:['formula'],fig:'ss2026-p14-stationery.png',type:'mcq',src:'PP 2026 Q6(c)',ref:'2026 Q6(c) · 1 mark',
  q:'Stationery Supplies use a spreadsheet to track their monthly sales.[FIG]What is the formula contained in cell G4 (Total Sales)?',
  options:['=E4*F4','=E4+F4','=E4/F4','=E4*H4'],answer:0,
  feedback:'Mark scheme: E4*F4 (also accepted: =(E4*F4) and Product(E4,F4)). Quantity sold times unit price. H4 is the discount, not the price.'},
/* ---------- replicating formulae ---------- */
rep2021c:{shape:'replicate-benefit',needs:['replicate', 'relative'],fig:'ss2021-p10-results.png',type:'mcq',src:'PP 2021 Q3(c)',ref:'2021 Q3(c) · 1 mark',
  q:'Piotr’s marks spreadsheet is shown.[FIG]Piotr has replicated the formula in cells I7:I10. What is the benefit of Piotr using this feature?',
  options:['The formula can be dragged down and the spreadsheet automatically changes the row numbers to match each row','It keeps the formula pointing at the same cell in every row','It stops anyone typing in the wrong marks','It makes the numbers in the column bigger'],answer:0,
  feedback:'Mark scheme: the formula can be dragged down and the row numbers change automatically to match the row being used. "Saves time" on its own does not get the mark.'},
rep2022d:{shape:'find-replicated',needs:['replicate'],fig:'ss2022-p6-tuck-shop.png',type:'mcq',src:'PP 2022 Q3(d)',ref:'2022 Q3(d) · 1 mark',
  q:'The school tuck shop spreadsheet is shown.[FIG]Which cell range is an example of replication of a formula?',
  options:['G4:G8','G9','I9','B4:B8'],answer:0,
  feedback:'Mark scheme, any one of G4:G8, H4:H8, I4:I8 or J4:J8. G9 and I9 are not accepted: they are totals, not a formula filled down a column. B4:B8 are typed-in prices.'},
rep2026d:{shape:'name-term',needs:['replicate'],type:'mcq',src:'PP 2026 Q6(d)',ref:'2026 Q6(d) · 1 mark',
  q:'What is the term used to describe copying a formula or data from one cell to another in a spreadsheet?',
  options:['Replicate','Validate','Merge','Import'],answer:0,
  feedback:'Mark scheme: Replicate (also accepted: Replication, Replicating).'},
/* ---------- functions ---------- */
fn2018b:{shape:'name-function',needs:['sum'],fig:'ss2018-p16-staff-pay.png',type:'mcq',src:'PP 2018 Q7(b)',ref:'2018 Q7(b) · 1 mark',
  q:'Jen uses this spreadsheet to calculate staff pay.[FIG]Name the function used to carry out the calculation in cell J13.',
  options:['SUM','AVERAGE','MAX','MIN'],answer:0,
  feedback:'Mark scheme: SUM. It adds up all the weekly pay amounts.'},
fn2021b:{shape:'pick-function',needs:['average'],fig:'ss2021-p10-results.png',type:'mcq',src:'PP 2021 Q3(b)',ref:'2021 Q3(b) · 1 mark',
  q:'In cell I6 Piotr has used a formula to calculate the Average Mark for Robert Lyttle.[FIG]State the formula used in cell I6.',
  options:['=AVERAGE(E6:H6)','=SUM(E6:H6)','=MAX(E6:H6)','=MIN(E6:H6)'],answer:0,
  feedback:'Mark scheme: =AVERAGE(E6:H6) (also accepted: (E6+F6+G6+H6)/4 or SUM(E6:H6)/4). SUM alone only gives the total.'},
fn2021g2:{shape:'name-function',needs:['max'],fig:'ss2021-p13-letter.png',type:'mcq',src:'PP 2021 Q3(g)(ii)',ref:'2021 Q3(g)(ii) · 1 mark',
  q:'Piotr’s results letter for Robert Lyttle is shown.[FIG]Suggest a function which could be used to return Robert’s highest subject result.',
  options:['MAX','MIN','SUM','AVERAGE'],answer:0,
  feedback:'Mark scheme: Max. It returns the highest value in a range of cells.'},
fn2023b1:{shape:'pick-function',needs:['sum'],fig:'ss2023-p8-wages.png',type:'mcq',src:'PP 2023 Q4(b)(i)',ref:'2023 Q4(b)(i) · 1 mark',
  q:'Mia’s wages spreadsheet is shown.[FIG]State the formula used in cell C8 (total hours worked).',
  options:['=SUM(C3:C7)','=SUM(C3,C7)','=C3+C7','=AVERAGE(C3:C7)'],answer:0,
  feedback:'Mark scheme: =SUM(C3:C7) (also accepted: =C3+C4+C5+C6+C7). The brackets must be in the right place and the range goes from C3 to C7.'},
fn2024a:{shape:'pick-function',needs:['sum'],fig:'ss2024-p10-quotations.png',type:'fill',src:'PP 2024 Q4(a)',ref:'2024 Q4(a) · 2 marks',
  q:'A community group has quotations for a new computer games room. If the total is over £2000 a 15% discount is applied.[FIG]What formula does cell B13 (Total of Quotation 1) contain? Build it from the words provided. (Not all words will be used.)',
  bank:['SUM','AVERAGE','MAX','B5:B12','B6:B12','B5:B13'],
  text:'Cell B13 contains =[[SUM]]([[B5:B12]])',
  feedback:'Mark scheme: SUM with the correct cell range, for example =SUM(B5:B12) (also accepted: B5+B6+B7+B8+B9+B10+B11+B12). One mark for SUM and one for the right cells, and both brackets are needed.'},
fn2024d:{shape:'name-function',needs:['min'],fig:'ss2024-p10-quotations.png',type:'mcq',src:'PP 2024 Q4(d)',ref:'2024 Q4(d) · 1 mark',
  q:'The community group’s quotations spreadsheet is shown.[FIG]Which function selects the lowest price for a Television?',
  options:['AVERAGE','ROUND','MIN','MAX'],answer:2,
  feedback:'Mark scheme: MIN. It returns the lowest value in a range of cells.'},
fn2025d:{shape:'pick-function',needs:['sum'],fig:'ss2025-p11-sheet.png',type:'mcq',src:'PP 2025 Q6(d)',ref:'2025 Q6(d) · 1 mark',
  q:'Bill’s daily activities spreadsheet is shown.[FIG]State the formula contained in cell E9.',
  options:['=SUM(E3:E7)','=SUM(E3,E7)','=E3+E7','=AVERAGE(E3:E7)'],answer:0,
  feedback:'Mark scheme: =SUM(E3:E7) (also accepted: =E3+E4+E5+E6+E7). It adds up the hours worked in E3 to E7.'},
fn2026e:{shape:'pick-function',needs:['average'],fig:'ss2026-p14-stationery.png',type:'mcq',src:'PP 2026 Q6(e)',ref:'2026 Q6(e) · 1 mark',
  q:'Stationery Supplies use a spreadsheet to track their monthly sales.[FIG]What is the formula used in cell G10 to calculate the Mean Sales for May?',
  options:['=AVERAGE(G4:G8)','=SUM(G4:G8)','=MAX(G4:G8)','=AVERAGE(G4,G8)'],answer:0,
  feedback:'Mark scheme: =AVERAGE(G4:G8) (also accepted: =SUM(G4:G8)/5). Mean means the average. =SUM(G4:G8) alone gives the total, not the mean.'},
/* ---------- absolute and relative references ---------- */
abs2018c3:{shape:'absolute-explain',needs:['absolute'],fig:'ss2018-p16-staff-pay.png',type:'fill',src:'PP 2018 Q7(c)(iii)',ref:'2018 Q7(c)(iii) · 2 marks',
  q:'Jen’s staff pay spreadsheet is shown.[FIG]Some of the formulae in Jen’s spreadsheet use absolute cell references (references with $ signs). Describe one advantage of using absolute cell references in spreadsheet formulae. Complete the answer using the words provided. (Not all words will be used.)',
  bank:['stays the same','changes','copied','printed','deleted'],
  text:'The cell reference [[stays the same]] when the formula is [[copied]] to other cells.',
  feedback:'Mark scheme: the cell reference stays the same [1] when the formula is copied / replicated [1].'},
abs2019c:{shape:'absolute-explain',needs:['absolute'],fig:'ss2019-p21-activities.png',type:'fill',src:'PP 2019 Q8(c)',ref:'2019 Q8(c) · 2 marks',
  q:'In the SPORTZONE spreadsheet cell F4 has the formula <code>E4*$F$1</code>. This contains an absolute cell reference.[FIG]What is the purpose of an absolute cell reference? Complete the answer using the words provided. (Not all words will be used.)',
  bank:['does not change','moves down a row','copied','printed','deleted'],
  text:'A cell reference [[does not change]] when the formula is [[copied]].',
  feedback:'Mark scheme: a cell reference stays the same or does not change [1] when the formula is copied [1]. Here $F$1 always points at the tax rate.'},
abs2021d:{shape:'absolute-name',needs:['absolute'],fig:'ss2021-p11-results-2.png',type:'mcq',src:'PP 2021 Q3(d)',ref:'2021 Q3(d) · 1 mark',
  q:'On Piotr’s Science sheet, cell F6 uses the dollar symbol ($) when multiplying E6 by F4.[FIG]Choose the correct term for using the $ symbol in the formula.',
  options:['Absolute currency referencing','Absolute cell referencing','Absolute column referencing'],answer:1,
  feedback:'Mark scheme: Absolute cell referencing. The $ signs fix the cell F4 so every row multiplies by 0.4. Ticking more than one box gets no mark.'},
abs2023c:{shape:'absolute-explain',needs:['absolute'],fig:'ss2023-p8-wages.png',type:'fill',src:'PP 2023 Q4(c)',ref:'2023 Q4(c) · 2 marks',
  q:'In Mia’s wages spreadsheet the formula in cell F3 contains an absolute cell reference.[FIG]Explain what is meant by an absolute cell reference. Complete the answer using the words provided. (Not all words will be used.)',
  bank:['dragged or copied down','printed','does not change','moves to the next row','turns into a number'],
  text:'When the formula is [[dragged or copied down]], the cell reference [[does not change]].',
  feedback:'Mark scheme: when the formula is dragged / copied down [1] the cell reference does not change [1]. The point is that the reference stays the same, not just the value.'},
abs2024e:{shape:'absolute-name',needs:['absolute', 'relative'],fig:'ss2024-p10-quotations.png',type:'fill',src:'PP 2024 Q4(e)',ref:'2024 Q4(e) · 1 mark',
  q:'In the quotations spreadsheet, cell C14 contains the formula <code>=C13*$E$2</code>.[FIG]Complete the sentence by choosing one of the two words.',
  bank:['Absolute','Relative'],
  text:'[[Absolute]] cell references include the dollar ($) sign.',
  feedback:'Mark scheme: Absolute. A relative reference has no dollar sign and changes when the formula is copied.'},
abs2026a:{shape:'absolute-fill',needs:['absolute', 'relative'],type:'fill',src:'PP 2026 Q6(a)',ref:'2026 Q6(a) · 3 marks',
  q:'Complete the sentence using the words provided. (Not all words will be used.)',
  bank:['Relative','Specific','Absolute','Formula'],
  text:'An [[Absolute]] cell reference in a spreadsheet stays fixed on a [[Specific]] cell, even when the [[Formula]] is copied to other cells.',
  feedback:'Mark scheme: Absolute, Specific, Formula. Relative is the spare word, because a relative reference changes when copied.'},
/* ---------- IF statements ---------- */
if2021g1:{shape:'pick-nested-if',needs:['if', 'nested-if', 'operators'],fig:'ss2021-p13-letter.png',type:'mcq',src:'PP 2021 Q3(g)(i)',ref:'2021 Q3(g)(i) · 1 mark',
  q:'Piotr’s results letter for Robert Lyttle is shown. His Average Mark is in cell B23, and the grade table shows the marks for each grade.[FIG]Which formula produces the Grade?',
  options:['=IF(B23=75, "DISTINCTION", IF(B23=60, "COMMENDATION", IF(B23=40, "PASS", "FAIL")))','=IF(B23&gt;=75, "DISTINCTION", IF(B23&gt;=60, "COMMENDATION", IF(B23&gt;=40, "PASS", "FAIL")))','=IF(B23&lt;=75, "DISTINCTION", IF(B23&lt;=60, "COMMENDATION", IF(B23&lt;=40, "PASS", "FAIL")))'],answer:1,
  feedback:'Mark scheme: the one with >=. A mark of 75 or more is a DISTINCTION, 60 or more a COMMENDATION, 40 or more a PASS. With = only a mark of exactly 75, 60 or 40 would work, and with <= a mark of 88 would wrongly give FAIL.'},
if2022f:{shape:'pick-nested-if',needs:['if', 'nested-if', 'operators'],fig:'ss2022-p6-tuck-shop.png',type:'mcq',src:'PP 2022 Q3(f)',ref:'2022 Q3(f) · 1 mark',
  q:'In the school tuck shop spreadsheet stock is reordered when STOCK AT END OF MONTH falls below 50.[FIG]Which formula is used in cell J4?',
  options:['=IF(H4&lt;0,"OUT OF STOCK",IF(H4&lt;=50,"REORDER","NO"))','=IF(H4&lt;=0,"OUT OF STOCK",IF(H4&gt;=50,"NO","REORDER"))','=IF(H4&lt;=0,"OUT OF STOCK",IF(H4&gt;50,"NO","REORDER"))'],answer:1,
  feedback:'Mark scheme: the second one. Stock of 0 or less is OUT OF STOCK, 50 or more is NO, and anything else (below 50) is REORDER. Maltesers has exactly 50 and shows NO.'},
if2023d:{shape:'pick-if',needs:['if', 'operators'],fig:'ss2023-p8-wages.png',type:'mcq',src:'PP 2023 Q4(d)',ref:'2023 Q4(d) · 1 mark',
  q:'In Mia’s wages spreadsheet, Tax Deducted is YES when Total Wages is more than the amount in C12.[FIG]Which formula is used in cell E3?',
  options:['=IF(D3&lt;C12, "YES","NO")','=IF(D3&gt;C12, "YES","NO")','=IF(D3&gt;=C12, "YES","NO")'],answer:1,
  feedback:'Mark scheme: =IF(D3>C12, "YES","NO"). Jeff Jones earns exactly £210 and shows NO, so it must be > and not >=.'},
if2024f:{shape:'pick-if',needs:['if', 'operators'],fig:'ss2024-p10-quotations.png',type:'mcq',src:'PP 2024 Q4(f)',ref:'2024 Q4(f) · 1 mark',
  q:'In the quotations spreadsheet, B16 shows In Budget or Over Budget by comparing the Total Cost with the Budget in B2.[FIG]Which IF statement is used in cell B16?',
  options:['=IF(B15&lt;=B2,"Budget","Budget")','=IF(B15&lt;=B2,"In Budget","Over Budget")','=IF(B15&gt;=B2,"In Budget","Over Budget")'],answer:1,
  feedback:'Mark scheme: =IF(B15<=B2,"In Budget","Over Budget"). A total cost that is less than or equal to the budget is In Budget. The first one gives the same answer either way, and >= would flip the results.'},
if2025e:{shape:'pick-if',needs:['if', 'operators'],fig:'ss2025-p11-sheet.png',type:'mcq',src:'PP 2025 Q6(e)',ref:'2025 Q6(e) · 1 mark',
  q:'When Bill is called out after 6 pm he adds an additional charge of £35.00 (cell G1).[FIG]Cell I3 contains an IF statement. Which statement is correct?',
  options:['=IF(C3=no,H3,(H3+G1)','=IF(C4="Yes",H3,(H3+$G$1))','=IF(C3="No",H3,(H3+$G$1))'],answer:2,
  feedback:'Mark scheme: =IF(C3="No",H3,(H3+$G$1)). If C3 is No the bill is the subtotal H3, otherwise the charge in $G$1 is added. $G$1 stays fixed when copied down. The first has no quotation marks round no, no $ signs and a missing bracket, and the second tests C4 and "Yes".'},
/* ---------- VLOOKUP ---------- */
vl2018c1:{shape:'pick-vlookup',needs:['vlookup'],fig:'ss2018-p16-staff-pay.png',type:'mcq',src:'PP 2018 Q7(c)(i)',ref:'2018 Q7(c)(i) · 1 mark',
  q:'A VLOOKUP function is used in column C of Jen’s spreadsheet to pick the correct Rate of Pay from the Job Title table in columns L and M.[FIG]Which VLOOKUP function is used in cell C3?',
  options:['=VLOOKUP(B3,$L$3:$M$5,1)','=VLOOKUP(B3,$L$3:$M$5,2)','=VLOOKUP(C3,L3:M5,1)','=VLOOKUP(C3,L3:M5,2)'],answer:1,
  feedback:'Mark scheme: =VLOOKUP(B3,$L$3:$M$5,2). It looks up the job title in B3, searches the fixed table, and returns the value from column 2 (the rate of pay).'},
vl2018c2:{shape:'vlookup-advantage',needs:['vlookup'],type:'mcq',src:'PP 2018 Q7(c)(ii)',ref:'2018 Q7(c)(ii) · 1 mark',
  q:'Explain one advantage of Jen using a VLOOKUP table in this way.',
  options:['If the table is changed, the linked cells update automatically','It sorts the job titles into alphabetical order automatically','It makes the Total Hours column add up to 40','It stops anyone typing a job title that is not in the table'],answer:0,
  feedback:'Mark scheme: data changed in the VLOOKUP table automatically updates the linked cells / puts in the rate of pay automatically.'},
vl2019h:{shape:'name-term',needs:['vlookup'],type:'mcq',src:'PP 2019 Q1(h)',ref:'2019 Q1(h) · 1 mark',
  q:'Select the correct meaning for the term VLookup, which is used with spreadsheet applications.',
  options:['Value Lookup','Vertical Lookup','Variable Lookup','Valid Lookup'],answer:1,keepOrder:true,
  feedback:'Mark scheme: B, Vertical Lookup. It searches down a column of a table.'},
vl2022g1:{shape:'build-vlookup',needs:['vlookup'],fig:'ss2022-p8-lookup.png',type:'fill',src:'PP 2022 Q3(g)(i)',ref:'2022 Q3(g)(i) · 2 marks',
  q:'The tuck shop spreadsheet has been amended. The user types an ITEM into cell B12 and a VLOOKUP puts the correct SELLING PRICE into cell B13.[FIG]Complete the formula used in cell B13 by choosing from the box.',
  bank:['B12','B13','2','3'],
  text:'=VLOOKUP([[B12]], $A$4:$C$8, [[3]])',
  feedback:'Mark scheme: =VLOOKUP(B12, $A$4:$C$8, 3). B12 holds the item to look up, and the selling price is in the 3rd column of A4:C8 (2 would give the cost price).'},
vl2022g2:{shape:'vlookup-error',needs:['vlookup'],fig:'ss2022-p9-lookup-error.png',type:'mcq',src:'PP 2022 Q3(g)(ii)',ref:'2022 Q3(g)(ii) · 1 mark',
  q:'The person running the tuck shop types Fanta into cell B12 to test the VLOOKUP.[FIG]Explain why cell B13 contains the error message #N/A.',
  options:['Fanta is not in the lookup list (the item list)','The SELLING PRICE column has been deleted','The word Fanta needs a capital letter','Cell B13 needs to be formatted as currency'],answer:0,
  feedback:'Mark scheme: Fanta is not in the lookup list / item list, so it does not match any item in the table.'},
vl2025f:{shape:'what-is',needs:['vlookup'],fig:'ss2025-p12-lookup.png',type:'pick',src:'PP 2025 Q6(f)',ref:'2025 Q6(f) · 2 marks',need:2,
  q:'Bill uses a VLOOKUP to create this invoice on another spreadsheet.[FIG]What is a VLOOKUP? Choose two correct answers.',
  options:[{text:'It is a function',ok:true},{text:'It searches for a value in a column of a table (cell range)',ok:true},{text:'It returns a value',ok:true},{text:'It joins several cells into one cell',ok:false},{text:'It adds up the numbers in a column',ok:false},{text:'It checks that data typed in is in the correct range',ok:false}],
  feedback:'Mark scheme, any two: a function used to search for a value in a column or a table / cell range; and it returns a value.'},

/* Shared mini-game kit for the HQ topic activities (Databases HQ, Spreadsheets HQ).
   Uses the engine's helpers only ($, say, sfx, mascot, musBtn, startMusic, stopMusic, shuffle, shakeScreen).
   Nothing here touches the page at load time, so the build's level gate can run it in node. */
let GM=null;
globalThis.simMusicOn=()=>!!(GM&&GM.state!=='end'&&$('gm'));
function gmOpen(area,o){
  if(GM&&GM.timer)clearInterval(GM.timer);
  GM={...o,stage:0,state:'play',lives:o.lives??3,maxLives:o.lives??3};
  area.innerHTML=`<div class="gm" id="gm"><div class="arena-grid"></div><div class="vs-head">${musBtn()}<span class="vs-title">${o.icon} ${o.title}</span>${mascot(o.bot||'🤖')}</div>
<div class="gm-bar"><div class="gm-stages" id="gmStages"></div><div class="gm-lives" id="gmLives" aria-label="Lives"></div></div>
<div id="gmMain"></div><div id="gmMsg" aria-live="polite"></div></div>`;
  gmStage(0);gmLives();startMusic();
}
/* the stages are always shown, and the current one is named */
function gmStage(i){
  GM.stage=i;const s=GM.stages||[];
  $('gmStages').innerHTML=s.length>1?s.map((n,k)=>k===i?`<span class="on">Stage ${k+1} of ${s.length}: ${n}</span>`:`<span class="${k<i?'done':''}">${k<i?'✓ ':''}${n}</span>`).join(''):'';
}
function gmLives(){
  const el=$('gmLives');if(!el)return;
  el.innerHTML=GM.maxLives?`<span class="gm-lab">Lives</span>${'❤️'.repeat(Math.max(0,GM.lives))}${'🖤'.repeat(GM.maxLives-Math.max(0,GM.lives))}`:'';
}
/* lose a life; returns true when none are left */
function gmLose(){GM.lives--;gmLives();sfx('bad');shakeScreen();return GM.lives<=0;}
function gmMsg(html,cls){$('gmMsg').innerHTML=html?`<div class="feedback-box ${cls||''}">${html}</div>`:'';}
function gmGo(label,fn,cls){
  $('gmMsg').insertAdjacentHTML('beforeend',`<button class="btn ${cls||'btn-primary'} next-btn" id="goBtn">${label}</button>`);
  $('goBtn').onclick=fn;$('goBtn').focus({preventScroll:true});
}
function gmBanner(head,text,btn,fn){
  GM.state='banner';gmMsg('');
  $('gmMain').innerHTML=`<div class="vs-banner"><div class="vs-bh">${head}</div><p>${text}</p><button class="btn btn-primary" id="goBtn">${btn}</button></div>`;
  $('goBtn').onclick=()=>{GM.state='play';fn();};$('goBtn').focus({preventScroll:true});
}
/* finish the mini-game: stars 0 = not passed (the engine asks for another go) */
function gmEnd(st,head,text){
  if(GM.timer)clearInterval(GM.timer);GM.state='end';stopMusic();gmMsg('');
  sfx(st>0?'win':'over');say(st>0?'Done! 🎉':'Oh no! 😬');
  $('gmMain').innerHTML=`<div class="vs-banner"><div class="vs-bh">${head}</div><p>${text}</p><div class="stars-big">${'★'.repeat(st)}${'☆'.repeat(3-st)}</div><button class="btn btn-success" id="goBtn">See level result →</button></div>`;
  const fin=GM.finish;$('goBtn').onclick=()=>{GM=null;fin(0,st);};$('goBtn').focus({preventScroll:true});
}
function gmStars(livesLeft,max){return livesLeft>=max?3:livesLeft>=max-1?2:livesLeft>0?1:0;}
/* a countdown bar inside el; calls out() when time runs out */
function gmTimer(el,secs,out){
  if(GM.timer)clearInterval(GM.timer);
  el.innerHTML='<div class="vs-timer"><div></div></div>';const bar=el.querySelector('.vs-timer div');
  const end=Date.now()+secs*1000;
  GM.timer=setInterval(()=>{
    if(!GM){return;}
    const left=end-Date.now();bar.style.width=Math.max(0,left/(secs*10))+'%';bar.classList.toggle('low',left<secs*300);
    if(left<=0){clearInterval(GM.timer);GM.timer=null;out();}
  },100);
}
function gmStop(){if(GM&&GM.timer){clearInterval(GM.timer);GM.timer=null;}}
function gmSel(id,opts,val){return `<select class="gm-sel" id="${id}">${opts.map(o=>{const [v,l]=Array.isArray(o)?o:[o,o];return `<option value="${v}"${v===val?' selected':''}>${l}</option>`;}).join('')}</select>`;}
function gmShuffle(a){const r=[...a];for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];}return r;}
/* exam rooms draw a fresh set of real questions each time the page opens: [[pool,n],…] */
function gmDraw(groups){return groups.flatMap(([pool,n])=>gmShuffle(pool.filter(Boolean)).slice(0,n));}
/* select a block of cells like a real worksheet: drag across them with a mouse or a finger.
   Cells carry data-c (0 = column A) and data-r (1 = row 1). A tap picks one cell; Shift-click stretches the block.
   With o.twoTap a single tap is held as the first cell and the next tap finishes the block (o.first(p) is told).
   o.expand(R) may grow the block (merged cells); o.move(R) runs while dragging; o.done(R) runs when the block is chosen.
   o.off() returning true ignores input. R = {c1,r1,c2,r2}. */
function gmGridSelect(table,o){
  let a=null,b=null,down=false,moved=false,held=false;
  const cellAt=(x,y)=>{const el=document.elementFromPoint(x,y),td=el&&el.closest('[data-c]');return td&&table.contains(td)?{c:+td.dataset.c,r:+td.dataset.r}:null;};
  const rect=()=>{const R={c1:Math.min(a.c,b.c),c2:Math.max(a.c,b.c),r1:Math.min(a.r,b.r),r2:Math.max(a.r,b.r)};return o.expand?o.expand(R):R;};
  const paint=()=>{const R=a&&b?rect():null;table.querySelectorAll('[data-c]').forEach(td=>{const c=+td.dataset.c,r=+td.dataset.r;td.classList.toggle('sel',!!R&&c>=R.c1&&c<=R.c2&&r>=R.r1&&r<=R.r2);});if(R&&o.move)o.move(R);};
  const press=(p,shift)=>{moved=false;if(a&&(shift||(o.twoTap&&held))){b=p;held=false;moved=true;}else{a=p;b=p;}paint();};
  const release=()=>{if(o.twoTap&&!moved){held=true;if(o.first)o.first(a);return;}held=false;o.done(rect());};
  table.style.touchAction='none';
  table.addEventListener('pointerdown',e=>{if(o.off&&o.off())return;const p=cellAt(e.clientX,e.clientY);if(!p)return;e.preventDefault();down=true;try{table.setPointerCapture(e.pointerId);}catch(_){}press(p,e.shiftKey);});
  table.addEventListener('pointermove',e=>{if(!down)return;const p=cellAt(e.clientX,e.clientY);if(p&&(p.c!==b.c||p.r!==b.r)){b=p;moved=true;held=false;paint();}});
  const up=()=>{if(!down)return;down=false;release();};
  table.addEventListener('pointerup',up);table.addEventListener('pointercancel',up);
  /* keyboard: Enter or Space on a cell button arrives as a click with no pointer */
  const key=(td,shift)=>{if(o.off&&o.off())return;press({c:+td.dataset.c,r:+td.dataset.r},shift);release();};
  table.addEventListener('click',e=>{if(e.detail!==0)return;const td=e.target.closest('[data-c]');if(td&&table.contains(td))key(td,e.shiftKey);});
  table.addEventListener('keydown',e=>{if(e.key!=='Enter'&&e.key!==' ')return;const td=e.target.closest('[data-c]');if(!td||!table.contains(td)||td.tagName==='BUTTON')return;e.preventDefault();key(td,e.shiftKey);});
  return {clear(){a=b=null;held=false;paint();},set(R){a={c:R.c1,r:R.r1};b={c:R.c2,r:R.r2};held=false;paint();}};
}
/* A1-style names: column number 0 = A */
const gmCol=c=>String.fromCharCode(65+c);
const gmRange=R=>R.c1===R.c2&&R.r1===R.r2?gmCol(R.c1)+R.r1:gmCol(R.c1)+R.r1+':'+gmCol(R.c2)+R.r2;
/* a small worksheet calculator for typed formulas: =, numbers, "text", cell references (with or without $), ranges,
   + - * / ( ), comparisons, and SUM AVERAGE MAX MIN IF VLOOKUP. Columns are single letters.
   gmParse(text) gives {ast} or {err:'noeq'|'syntax'}; gmEval(ast,get) gives a number, text, true/false or an error
   such as #N/A. get(col,row) returns what a cell shows ('' when empty). */
const GM_REF=/^(\$?)([A-Z])(\$?)(\d+)$/;
const gmIsErr=v=>typeof v==='string'&&/^#(N\/A|VALUE!|DIV\/0!|NAME\?|REF!)$/.test(v);
function gmTokens(f){
  const out=[],re=/\s+|"[^"]*"|\$?[A-Za-z]\$?\d+(?![A-Za-z(])|[A-Za-z]+|\d+(?:\.\d+)?|\.\d+|<=|>=|<>|[-+*\/(),:<>=]/y;let i=0;
  while(i<f.length){re.lastIndex=i;const m=re.exec(f);if(!m)return null;i=re.lastIndex;if(/^\s+$/.test(m[0]))continue;out.push(m[0][0]==='"'?m[0]:m[0].toUpperCase());}
  return out;
}
function gmParse(f){
  f=String(f||'').trim();if(f[0]!=='=')return {err:'noeq'};
  const T=gmTokens(f.slice(1));if(!T||!T.length)return {err:'syntax'};
  let p=0;const peek=()=>T[p],next=()=>T[p++],want=x=>{if(T[p]!==x)throw 0;p++;};
  const ref=t=>{const m=(t||'').match(GM_REF);return m&&{t:'ref',c:m[2],r:+m[4],ac:!!m[1],ar:!!m[3]};};
  const prim=()=>{
    const t=next();if(t===undefined)throw 0;
    if(/^[\d.]/.test(t))return {t:'n',v:+t};
    if(t[0]==='"')return {t:'s',v:t.slice(1,-1)};
    if(t==='('){const e=cmp();want(')');return e;}
    const a=ref(t);
    if(a){if(peek()!==':')return a;next();const b=ref(next());if(!b)throw 0;return {t:'rng',a,b};}
    if(/^[A-Z]+$/.test(t)){
      if(peek()!=='(')return t==='TRUE'||t==='FALSE'?{t:'b',v:t==='TRUE'}:{t:'name',v:t};
      next();const args=[];if(peek()!==')'){args.push(cmp());while(peek()===','){next();args.push(cmp());}}want(')');
      return {t:'fn',name:t,args};
    }
    throw 0;
  };
  const un=()=>peek()==='-'?(next(),{t:'neg',a:un()}):peek()==='+'?(next(),un()):prim();
  const mul=()=>{let a=un();while(peek()==='*'||peek()==='/'){const op=next();a={t:'op',op,a,b:un()};}return a;};
  const add=()=>{let a=mul();while(peek()==='+'||peek()==='-'){const op=next();a={t:'op',op,a,b:mul()};}return a;};
  const cmp=()=>{let a=add();if(['<','>','<=','>=','=','<>'].includes(peek())){const op=next();a={t:'op',op,a,b:add()};}return a;};
  try{const ast=cmp();if(p!==T.length)return {err:'syntax'};return {ast};}catch(e){return {err:'syntax'};}
}
const gmCells=n=>{const out=[],c1=Math.min(n.a.c.charCodeAt(0),n.b.c.charCodeAt(0)),c2=Math.max(n.a.c.charCodeAt(0),n.b.c.charCodeAt(0)),r1=Math.min(n.a.r,n.b.r),r2=Math.max(n.a.r,n.b.r);
  for(let r=r1;r<=r2;r++)for(let c=c1;c<=c2;c++)out.push({c:String.fromCharCode(c),r});return out;};
function gmEval(n,get){
  const E=x=>gmEval(x,get),num=v=>typeof v==='boolean'?+v:v===''?0:v;
  const vals=args=>{const out=[];for(const a of args){if(a.t==='rng'){for(const q of gmCells(a)){const v=get(q.c,q.r);if(gmIsErr(v))return v;if(typeof v==='number')out.push(v);}}
    else if(a.t==='ref'){const v=get(a.c,a.r);if(gmIsErr(v))return v;if(typeof v==='number')out.push(v);}
    else{const v=num(E(a));if(gmIsErr(v))return v;if(typeof v!=='number')return '#VALUE!';out.push(v);}}return out;};
  switch(n.t){
    case 'n':case 's':case 'b':return n.v;
    case 'name':return '#NAME?';
    case 'ref':return get(n.c,n.r);
    case 'rng':return '#VALUE!';
    case 'neg':{const a=num(E(n.a));return gmIsErr(a)?a:typeof a==='number'?-a:'#VALUE!';}
    case 'op':{
      const a=num(E(n.a)),b=num(E(n.b));if(gmIsErr(a))return a;if(gmIsErr(b))return b;
      if('+-*/'.includes(n.op)){
        if(typeof a!=='number'||typeof b!=='number')return '#VALUE!';
        return n.op==='+'?a+b:n.op==='-'?a-b:n.op==='*'?a*b:b===0?'#DIV/0!':a/b;
      }
      const x=typeof a==='string'?a.toUpperCase():a,y=typeof b==='string'?b.toUpperCase():b;
      if(typeof x!==typeof y)return n.op==='<>';
      return {'<':x<y,'>':x>y,'<=':x<=y,'>=':x>=y,'=':x===y,'<>':x!==y}[n.op];

      if(n.name==='VLOOKUP'){
        if(A.length<3||A.length>4||A[1].t!=='rng')return '#VALUE!';
        const v=E(A[0]),col=num(E(A[2]));if(gmIsErr(v))return v;if(gmIsErr(col))return col;
        if(typeof col!=='number'||col<1)return '#VALUE!';
        const c1=Math.min(A[1].a.c.charCodeAt(0),A[1].b.c.charCodeAt(0)),c2=Math.max(A[1].a.c.charCodeAt(0),A[1].b.c.charCodeAt(0));
        if(c1+Math.floor(col)-1>c2)return '#REF!';

           than the one looked up (the list is in order, so it stops at the first bigger one); nothing that small gives #N/A.
           A fourth part of FALSE asks for the exact code. Blank cells, and numbers against text, are passed over. */
        const near=A[3]?!!num(E(A[3])):true,key=x=>typeof x==='string'?x.toUpperCase():x;
        const rows=gmCells({a:{c:String.fromCharCode(c1),r:A[1].a.r},b:{c:String.fromCharCode(c1),r:A[1].b.r}});
        let hit=null;
        for(const q of rows){const k=get(q.c,q.r);if(k===''||typeof k!==typeof v)continue;
          if(!near){if(key(k)===key(v)){hit=q.r;break;}continue;}
          if(key(k)<=key(v))hit=q.r;else break;}

/* every cell reference in a formula, as {c,r}; ranges count each end */
function gmRefsIn(n,out=[]){if(!n||typeof n!=='object')return out;if(n.t==='ref')out.push(n);if(n.t==='rng'){out.push(n.a,n.b);}['a','b'].forEach(k=>n.t!=='rng'&&n[k]&&gmRefsIn(n[k],out));(n.args||[]).forEach(x=>gmRefsIn(x,out));return out;}
/* the formula copied dr rows down: references without $ before the row number move, the rest stay put */
function gmShift(f,dr){const T=gmTokens(String(f).trim().replace(/^=/,''));if(!T)return f;
  return '='+T.map(t=>{const m=t.match(GM_REF);return m?m[1]+m[2]+m[3]+(m[3]?+m[4]:+m[4]+dr):t;}).join('');}

  const r=dp==null?v:(Math.round(v*Math.pow(10,dp)+(v<0?-1e-6:1e-6))/Math.pow(10,dp));return (cur?'£':'')+(dp==null?String(+r.toFixed(6)):r.toFixed(dp));}

/* Activity 4 — Safe Sheet. Sources: TB p16 (conditional formatting; data validation and its Stop alert), TB p17 (templates, importing,

<div class="vs-h">then fill the cell</div>

const BV_ALLOW=[['any','Any value','lets anything in'],['whole','Whole number','only whole numbers, like 7 or 120'],['dec','Decimal','any number, including ones like 12.5'],['len','Text length','counts how many characters are typed']];

   q:'🚪 Wave 2 of 4. A new week, and the Wrecker is back with new tricks. Change your rule if you need to, then open the door.',
   win:'950 and -5 bounced off, while 0 and 500 got in. Letting in only values between a lowest and a highest value is a <b>range check</b>.'},
  {col:'C',items:TL_ITEMS,facts:BV_SOLD,real:bvRealSold,seq:[['h','300'],['w','12.5'],['h','7'],['w','2.5'],['h','64'],['h','18']],
   q:'🚪 Wave 3 of 4. Another week, another set of tricks. Change your rule if you need to, then open the door.',
   win:'12.5 and 2.5 bounced off: Whole number lets in whole numbers only, so nobody can sell half a bag.'},
  {col:'B',items:['Gum','Mints','Cookie','Yogurt','Raisins','Toast'],real:s=>/^[A-Z]\d{3}$/.test(s),seq:[['h','T007'],['w','T0007'],['h','T008'],['w','T8'],['h','T009'],['w','T09']],
   facts:'<ul class="ss-facts"><li>Every code is one letter and three digits, like T004.</li></ul>',

const BV_CODES=['T001','T002','T003','T004','T005','T006'];
function bvOk(s,R){
  const n=Number(s),num=s.trim()!==''&&!isNaN(n),lo=Number(R.min),hi=Number(R.max);
  if(R.allow==='any')return true;
  if(R.allow==='whole')return num&&Number.isInteger(n)&&n>=lo&&n<=hi;
  if(R.allow==='dec')return num&&n>=lo&&n<=hi;
  if(R.allow==='len')return s.length>=lo&&s.length<=hi;
  return false;
}
const bvSay=R=>R.allow==='any'?'Any value':`${BV_ALLOW.find(a=>a[0]===R.allow)[1]} between ${R.min} and ${R.max}${R.allow==='len'?' characters':''}`;
function bvTable(i){
  const W=BV_WAVES[i];
  return `<table class="gm-tbl ss-sheet" id="ssSheet"><tr><th></th><th>A</th><th>B</th><th>C</th></tr>
<tr><th>1</th><td class="fh-h">Item</td><td class="fh-h">Code</td><td class="fh-h">Sold</td></tr>
${W.items.map((it,r)=>`<tr><th>${r+2}</th><td>${it}</td>${W.col==='B'?`<td class="ss-in" id="bv_${r}" data-k="B${r+2}"></td><td></td>`:`<td data-k="B${r+2}" data-v="${BV_CODES[r]}">${BV_CODES[r]}</td><td class="ss-in n" id="bv_${r}" data-k="C${r+2}"></td>`}</tr>`).join('')}
${W.col==='C'?'<tr><th>8</th><td class="fh-h">Total</td><td></td><td class="n ss-tot" id="bvTot" data-k="C8" data-v="=C2+C3+C4+C5+C6+C7">0</td></tr>':''}</table>`;
}
function bvSet(i){
  gmStage(2);GM.state='rules';gmMsg('');SS.wave=i;
  const W=BV_WAVES[i],R=SS.bv[W.col];
  $('gmMain').innerHTML=`<div class="gm-q">${W.q}</div>
<div class="ss-wrap"><div class="ss-left"><div class="gm-panel"><div class="vs-h">📋 What real data looks like</div>${W.facts}</div>
<div class="gm-panel ss-bv" id="bvBox"><div class="vs-h">Data validation on ${W.col}2:${W.col}7 · Allow</div>
<div class="ss-chips">${BV_ALLOW.map(([a,l])=>`<button class="ss-chip${R.allow===a?' on':''}" data-a="${a}">${l}</button>`).join('')}</div>
<div class="ss-help" id="bvHelp"></div>
<div class="ss-between" id="bvBetween">between <input type="number" class="ss-n" id="bvMin" inputmode="numeric" value="${R.min}" aria-label="Minimum"> and <input type="number" class="ss-n" id="bvMax" inputmode="numeric" value="${R.max}" aria-label="Maximum"> <span id="bvUnit"></span></div></div></div>
<div class="gm-panel ss-side">${ssBar(W.col+'2','')}${bvTable(i)}</div></div>
<div class="gm-btns"><button class="btn btn-primary" id="bvGo">🚪 Open the door</button></div>`;
  const show=()=>{const a=BV_ALLOW.find(x=>x[0]===R.allow);$('bvHelp').textContent=`${a[1]}: ${a[2]}.`;$('bvBetween').hidden=R.allow==='any';$('bvUnit').textContent=R.allow==='len'?'characters (both included)':'(both included)';};
  show();$('ssSheet').addEventListener('click',ssPick);
  $('bvBox').addEventListener('click',e=>{const b=e.target.closest('.ss-chip');if(!b||GM.state!=='rules')return;R.allow=b.dataset.a;$('bvBox').querySelectorAll('.ss-chip').forEach(x=>x.classList.toggle('on',x===b));show();sfx('tick');gmMsg('');});
  $('bvBox').addEventListener('input',()=>{if(GM.state==='rules')gmMsg('');});
  $('bvGo').onclick=()=>{
    R.min=$('bvMin').value.trim();R.max=$('bvMax').value.trim();
    if(R.allow!=='any'){
      if(R.min===''||R.max==='')return gmMsg('Type a smallest value and a biggest value into the two boxes first.','part');
      if(+R.min>+R.max)return gmMsg('The first number is bigger than the second, so nothing could ever get in. A spreadsheet will not save a rule like that.','part');
      if(R.allow!=='dec'&&(!Number.isInteger(+R.min)||!Number.isInteger(+R.max)))return gmMsg(`${R.allow==='len'?'Text length counts whole characters':'Whole number needs whole-number limits'}, so use whole numbers in both boxes.`,'part');
      if(R.allow==='len'&&+R.min<0)return gmMsg('Text length cannot be below 0 characters.','part');
    }
    bvRun(i);
  };
}
function bvRun(i){
  GM.state='queue';gmMsg('');
  const W=BV_WAVES[i],R=SS.bv[W.col],vals=[],log=[];
  $('gmMain').innerHTML=`<div class="gm-q">🚪 Wave ${i+1} of 4: the door is open. Your rule on ${W.col}2:${W.col}7: <b>${bvSay(R)}</b>.</div>
<div class="ss-wrap"><div class="ss-left"><div class="ss-typer" id="bvWho">Ready…</div><div class="ss-score"><div class="gm-panel"><div class="vs-h">Junk let in</div><div class="ss-c" id="bvIn">0</div></div><div class="gm-panel"><div class="vs-h">Real data refused</div><div class="ss-c" id="bvOut">0</div></div></div>
<div class="ss-alert" id="bvAlert" hidden><b>⛔ Stop</b><span>This value doesn’t match the data validation restrictions defined for this cell.</span></div></div>
<div class="gm-panel ss-side">${ssBar(W.col+'2','')}${bvTable(i)}</div></div>`;
  $('ssSheet').addEventListener('click',ssPick);
  let e=0,junk=0,lost=0;
  const total=()=>{if(W.col!=='C')return;const t=$('bvTot'),txt=vals.some(v=>isNaN(Number(v)));t.textContent=txt?'#VALUE!':vals.reduce((a,v)=>a+Number(v),0);t.dataset.v='=C2+C3+C4+C5+C6+C7';t.classList.toggle('bad',junk>0);};
  const next=()=>{
    if(!GM||GM.state!=='queue')return;
    if(e>=W.seq.length){$('bvAlert').remove();return bvJudge(i,log);}
    const [who,s]=W.seq[e++],row=vals.length,cell=W.col+(row+2),td=$('bv_'+row);
    $('bvWho').innerHTML=who==='w'?`🧯 <b>The Wrecker</b> types into ${cell}…`:`🧑‍💼 <b>The helper</b> types into ${cell}…`;
    $('bvWho').className='ss-typer '+(who==='w'?'wreck':'help');
    $('ssName').textContent=cell;td.classList.add('typing');
    let c=0;
    const type=()=>{
      if(!GM||GM.state!=='queue')return;
      if(c<s.length){c++;td.textContent=s.slice(0,c);$('ssF').textContent=s.slice(0,c);return setTimeout(type,RM?10:85);}
      const inn=bvOk(s,R),real=W.real(s);log.push({s,inn,real});td.classList.remove('typing');
      if(inn){
        vals.push(s);td.dataset.v=s;td.classList.add(real?'okin':'junk');
        if(!real){junk++;$('bvIn').textContent=junk;$('bvIn').classList.add('bad');sfx('alarm');}else sfx('good');
        total();setTimeout(next,RM?80:520);
      }else{
        $('bvAlert').hidden=false;

      }
    };

  };

}
function bvWhy(s,inn,R,kind){
  const n=Number(s),num=s.trim()!==''&&!isNaN(n),len=s.length,rng=`${R.min} and ${R.max}`;
  if(inn){
    if(R.allow==='any')return `“${s}” got in: <b>Any value</b> lets everything in, even ${kind==='code'?'a code with the wrong number of characters':num?'a number that cannot be a real sale':'a word'}.`;
    if(R.allow==='len')return `“${s}” got in: <b>Text length</b> only counts characters. “${s}” has ${len}, and your rule allows between ${rng}.`;
    if(!Number.isInteger(n))return `“${s}” got in: <b>Decimal</b> lets in numbers like ${s}, but nobody sells half a bag.`;
    if(n>500)return `“${s}” got in because your biggest value is ${R.max}. The shop can never sell more than 500.`;
    if(n<0)return `“${s}” got in because your smallest value is ${R.min}. Nobody sells fewer than 0.`;
  }else{
    if(kind==='code'&&R.allow!=='len')return `“${s}” is a real code, but it was refused: a code has a letter in it, so <b>${R.allow==='whole'?'Whole number':'Decimal'}</b> refuses every code.`;
    if(R.allow==='len')return `“${s}” is real, but it was refused: it has ${len} character${len>1?'s':''}, and your rule allows between ${rng}.`;
    if(n<+R.min)return `“${s}” is a real sale${n===0?' (a week can sell none)':''}, but it was refused: your smallest value is ${R.min}.`;
    if(n>+R.max)return `“${s}” is a real sale${n===500?' (500 is the most the shop can sell)':''}, but it was refused: your biggest value is ${R.max}.`;
  }
  return `“${s}” ${inn?'got in':'was refused'}.`;
}
function bvJudge(i,log){
  GM.state='fb';
  const W=BV_WAVES[i],R=SS.bv[W.col],bad=log.filter(x=>x.inn!==x.real);
  $('bvWho').className='ss-typer';$('bvWho').textContent='The wave is over.';
  /* a changed rule must still deal with every earlier wave on the same column */
  let old=null;
  for(let j=0;j<i&&!bad.length&&!old;j++){const V=BV_WAVES[j];if(V.col!==W.col)continue;const x=V.seq.find(([,s])=>bvOk(s,R)!==V.real(s));if(x)old={s:x[1],inn:bvOk(x[1],R),j};}
  if(old){
    const out=gmLose();say('Old junk is back! 😬');
    gmMsg(`This wave went well, but your rule fails an earlier wave. From wave ${old.j+1}: ${bvWhy(old.s,old.inn,R,'sold')} A rule has to keep working for every week, not just this one.`,'wrong');
    if(out)return ssOut('The sheet was wrecked','Junk got into the sheet. Read the lesson on validation again, then have another go.');
    return gmGo('🛠️ Change the rule →',()=>bvSet(i));
  }

    return gmGo('Finish →',()=>gmEnd(gmStars(GM.lives,3),'The sheet is safe','The colours update by themselves, you cracked the Wrecker’s rules, and no junk got past your validation.'));
  }
  const out=gmLose();say('Junk got through! 😬');
  const x=bad[0];
  gmMsg(bvWhy(x.s,x.inn,R,W.col==='B'?'code':'sold')+(bad.length>1?` ${bad.length} entries went the wrong way altogether.`:''),'wrong');
  if(out)return ssOut('The sheet was wrecked','Junk got into the sheet. Read the lesson on validation again, then have another go.');
  gmGo('🛠️ Change the rule →',()=>bvSet(i));
}

{teaches:['conditional-formatting'],html:`<div class="teach-card"><h3>🚦 Traffic lights: conditional formatting</h3>
<p><span class="term">Conditional formatting</span> applies cell shading or font colour to a cell or a group of cells if a specified condition is met. If the condition is not met, the cell keeps its normal look.</p>
<table class="gm-tbl ss-sheet"><tr><th>Item</th><th>Sold</th></tr><tr><td>Crisps</td><td class="ss-v green">120</td></tr><tr><td>Juice</td><td class="ss-v">90</td></tr><tr><td>Apple</td><td class="ss-v red">60</td></tr></table>
<p>The rules here are “greater than or equal to 100: green” and “less than 70: red”. Conditional formatting changes how a cell <b>looks</b>. It never changes the <b>value</b> or the <b>formula</b> in the cell. When the value changes, the colour follows by itself.</p>

<script>

  level:[[523,.1],[659,.1],[784,.1],[1047,.3]],over:[[392,.16],[330,.16],[262,.35]],tick:[[880,.03]],zap:[[740,.03],[1480,.05]],alarm:[[1175,.05],[880,.05],[1175,.06]],scan:[[1047,.025],[1319,.025],[1568,.025],[2093,.04]],win:[[523,.08],[784,.08],[1047,.08],[1568,.35]]};

  p.className='popup '+(cls||'');p.textContent=text;p.style.left=(box.left+box.width/2)+'px';p.style.top=(box.top+Math.min(box.height/2,120))+'px';
  document.body.appendChild(p);setTimeout(()=>p.remove(),1100);
}
function flash(text){const f=document.createElement('div');f.className='flash-banner';f.textContent=text;document.body.appendChild(f);setTimeout(()=>f.remove(),1300);}
function shakeScreen(){const c=document.querySelector('.container');c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake');}
function starStr(n){return n==null?'☆☆☆':'★'.repeat(n)+'☆'.repeat(3-n);}
function hud(){
  if(!$('hudPts'))return;
  $('hudPts').textContent=G.points.toLocaleString();
  $('hudCombo').textContent=mult()>1?`🔥 ×${mult()}`:'';
  $('hudLives').textContent=S&&S.active?'❤️'.repeat(S.lives)+'🖤'.repeat(3-S.lives):'';
}

/* ---------- welcome + level map ---------- */
function bestStars(i){const a=stars[i],b=STORE.stars[i];return a==null?b:(b==null?a:Math.max(a,b));}
function unlocked(i){return i===0||bestStars(i-1)!=null;}
function renderWelcome(){
  document.title=ACT.title+' — '+(typeof HQ_NAME!=='undefined'?HQ_NAME:'Software HQ');
  stopSorter();
  const next=LEVELS.findIndex((L,i)=>bestStars(i)==null);
  const go=next<0?0:next;
  setProgress(Math.round(LEVELS.filter((L,i)=>bestStars(i)!=null).length/LEVELS.length*100));
  $('welcomeScreen').innerHTML=`<div class="welcome"><div class="welcome-icon">${ACT.icon}</div><h2>${ACT.title}</h2><p>${ACT.intro}</p>
<div class="level-map">${LEVELS.map((L,i)=>{const u=unlocked(i);return `<button class="node ${u?'':'locked'} ${i===go?'current':''}" ${u?`onclick="startLevel(${i})"`:'disabled'}>
<div class="node-icon">${u?lvIcon(L):'🔒'}</div><div class="node-num">Level ${i+1}</div><div class="node-title">${L.title}</div><div class="node-type">${lvName(L)}</div><div class="node-stars">${starStr(bestStars(i))}</div></button>`;}).join('<div class="node-path"></div>')}</div>
<button class="btn btn-primary btn-big" onclick="startLevel(${go})">${next<0?'▶ Play again from Level 1':next===0?'▶ Start Level 1':'▶ Continue: Level '+(go+1)}</button>
<div class="how-box">${['fall','belt','pop','sim','boss'].filter(k=>LEVELS.some(L=>L.kind===k)).map(k=>`<div><b>${KIND_ICON[k]} ${KIND_NAME[k]}</b>${KIND_HOW[k]}</div>`).join('')}</div>
<div class="best-line">🏆 Best score on this device: <b>${(STORE.best||0).toLocaleString()}</b> &nbsp;·&nbsp; <button class="mute-btn link-btn" onclick="toggleMute()">${G.muted?'🔇':'🔊'}</button> sound</div>
<p class="topics-line"><b>Topics:</b> ${ACT.topics}</p></div>`;
  showScreen('welcomeScreen');
}

/* ---------- briefing ---------- */
function startLevel(i){
  lvl=i;teachStep=0;stopSorter();
  if(LEVELS[i].brief.length){showScreen('teachScreen');renderBrief();}else playLevel();
}
function renderBrief(){
  const L=LEVELS[lvl],s=L.brief[teachStep];
  $('teachLabel').textContent=`Level ${lvl+1}: ${L.title} · Briefing ${teachStep+1} of ${L.brief.length}`;
  $('teachContent').innerHTML=s.html;
  const last=teachStep===L.brief.length-1;
  $('teachNextBtn').textContent=last?`${lvIcon(L)} Play Level ${lvl+1} →`:'Next →';
  $('teachNextBtn').className='btn '+(last?'btn-success btn-big':'btn-primary');
  $('teachBackBtn').textContent=teachStep===0?'🗺️ Map':'← Back';
  if(s.init)s.init();
}
function nextTeach(){teachStep++;if(teachStep>=LEVELS[lvl].brief.length)playLevel();else renderBrief();}
function prevTeach(){if(teachStep>0){teachStep--;renderBrief();}else renderWelcome();}
function openBrief(){
  const L=LEVELS[lvl];if(!L.book.length)return;
  if(S)S.paused=true;briefOpen=true;
  const o=document.createElement('div');o.className='overlay';o.id='briefOverlay';
  o.innerHTML=`<div class="overlay-inner">${L.book.map(b=>b.html.replace(/ id="/g,' data-oid="')).join('')}<button class="btn btn-primary" onclick="closeBrief()">Back to the game ▶</button></div>`;
  document.body.appendChild(o);
}
function closeBrief(){$('briefOverlay')?.remove();briefOpen=false;if(S&&S.active&&!S.wait){S.paused=false;S.last=performance.now();}}

/* ---------- level screen ---------- */
function playLevel(){
  const L=LEVELS[lvl];
  G.points-=G.lp[lvl]||0;G.lp[lvl]=0;G.combo=0;
  $('teachContent').innerHTML='';
  showScreen('roundScreen');
  $('roundLabel').innerHTML=`<span>${lvIcon(L)} Level ${lvl+1} of ${LEVELS.length}: ${L.title}</span>
<span class="hud"><span id="hudLives"></span><span id="hudCombo" class="hud-combo"></span><span class="hud-pts">⚡ <span id="hudPts">0</span></span>
${L.book.length?`<button class="hud-btn" title="${L.mode==='boss'?'Look at the lessons again':'Look at the briefing again'}" aria-label="${L.mode==='boss'?'Look at the lessons again':'Look at the briefing again'}" onclick="openBrief()">📖</button>`:''}<button class="hud-btn mute-btn" onclick="toggleMute()">${G.muted?'🔇':'🔊'}</button></span>`;
  $('roundHeading').textContent=L.heading;
  setProgress(Math.round(lvl/LEVELS.length*100));
  ({sorter:playSorter,boss:playBoss,sim:playSim})[L.mode](L);
