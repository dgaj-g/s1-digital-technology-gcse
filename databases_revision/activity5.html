qry2021q2c2:{shape:'sorted-by',needs:['sort'],fig:'db2021-p5-cars.png',type:'mcq',src:'PP 2021 Q2(c)(ii)',ref:'2021 Q2(c)(ii) · 1 mark',
  q:'A sample view of the car-sales table <code>tblCARS</code> is shown.[FIG]State how the data has been sorted.',
  options:['By RegistrationNo','By Country','By Company','By YearProduced'],answer:0,
  feedback:'Mark scheme: RegistrationNo. Only that column runs in order, A to Z: LJZ, PAZ, PUI, PUI, REZ, RJZ, VIW, WAZ. The mark scheme needs the field name.'},
qry2021q2f1:{shape:'name-feature',needs:['query','report'],fig:'db2021-p7-sales-report.png',type:'mcq',src:'PP 2021 Q2(f)(i)',ref:'2021 Q2(f)(i) · 1 mark',
  q:'The car-sales owner produced this monthly sales report.[FIG]What feature in the database software was used to produce the sales data before the report was created?',
  options:['A query','A macro','A form','A relationship'],answer:0,
  feedback:'Mark scheme: Query. The query finds the data, then the report displays it.'},
qry2026q4d1:{shape:'name-feature',needs:['query'],fig:'db2026-p8-tables.png',type:'mcq',src:'PP 2026 Q4(d)(i)',ref:'2026 Q4(d)(i) · 1 mark',
  q:'Academy Sports Club stores data about its members, activities and bookings.[FIG]The club wants to retrieve all the bookings for member John Smith. What feature in a database program would they use?',
  options:['A query','A report','A form','A macro'],answer:0,
  feedback:'Mark scheme: A Query. A query finds (retrieves) the records that match.'},
/* ---------- D1 forms ---------- */
form2022q10a:{shape:'match-tools',needs:['form','report','macro'],type:'match',src:'PP 2022 Q10(a)',ref:'2022 Q10(a) · 3 marks',
  q:'Jack’s database uses tables, queries, forms, reports and macros. Match each database tool to the task Jack could use it for. (Not all terms will be used.)',
  spare:['Queries'],
  pairs:[{term:'Forms',def:'Collect data about customers'},
         {term:'Reports',def:'Print the results of processing'},
         {term:'Macros',def:'Provide shortcuts for repetitive tasks'}],
  feedback:'Mark scheme: forms collect data; reports print the results of processing; macros give shortcuts for repetitive tasks. Queries is the term not used.'},
/* ---------- D1 reports ---------- */
rep2019q3d2:{shape:'name-feature',needs:['report'],fig:'db2019-p10-loans.png',type:'mcq',src:'PP 2019 Q3(d)(ii)',ref:'2019 Q3(d)(ii) · 1 mark',
  q:'John keeps a record of DVD loans in his <code>LOAN</code> table.[FIG]He runs a query to find the DVDs not returned. Which feature of a database would display the result of the query in a professional manner?',
  options:['Report','Form','Macro','Relationship'],answer:0,
  feedback:'Mark scheme: Report.'},
rep2021q2f2:{shape:'grouped-by',needs:['report','group'],fig:'db2021-p7-sales-report.png',type:'mcq',src:'PP 2021 Q2(f)(ii)',ref:'2021 Q2(f)(ii) · 1 mark',
  q:'The car-sales owner’s monthly sales report is shown.[FIG]How has the data on the report been organised?',
  options:['Grouped by YearProduced','Grouped by Colour','Grouped by Model','Sorted by Price'],answer:0,
  feedback:'Mark scheme: grouped by YearProduced / Year. Each year (2018, 2019, 2020) is shown once, with its cars below it. The mark scheme needs the field name.'},
rep2025q5c:{shape:'report-benefits',needs:['report','report-benefits'],type:'pick',src:'PP 2025 Q5(c)',ref:'2025 Q5(c) · 2 marks',need:2,
  q:'One benefit of using reports in a database is that the data is laid out in a format that can be printed. List two other benefits.',
  options:[{text:'Sorting the data',ok:true},{text:'Filtering the data',ok:true},{text:'Showing totals',ok:true},{text:'Easier to read and understand',ok:true},{text:'Adding new records to a table',ok:false},{text:'Stopping wrong data being typed in',ok:false},{text:'Making a backup copy of the database',ok:false}],
  feedback:'Mark scheme, any two: sorting; filtering; totals (an acceptable function). Readability / understanding also gets a mark. “User friendly” or “laid out” does not, because the question already gave that one.'},
rep2026q4d2:{shape:'name-feature',needs:['report'],fig:'db2026-p8-tables.png',type:'mcq',src:'PP 2026 Q4(d)(ii)',ref:'2026 Q4(d)(ii) · 1 mark',
  q:'Academy Sports Club stores data about its members, activities and bookings.[FIG]The club has retrieved all the bookings for member John Smith. What feature would they use to present those bookings?',
  options:['A report','A query','A form','A macro'],answer:0,
  feedback:'Mark scheme: A Report.'},
/* ---------- D1 macros ---------- */
mac2024q10:{shape:'definition',needs:['macro'],type:'mcq',src:'PP 2024 Q10',ref:'2024 Q10 (part) · 1 mark',
  q:'Which term matches this definition: “A series of stored commands that can be activated using a button”?',
  options:['Macro','Spyware','Backup','Intranet'],answer:0,
  feedback:'Macro, from the 2024 mark scheme.'},
/* ---------- D1 relationships ---------- */
rel2018q2c:{shape:'rel-type',needs:['one-to-many','join-line'],fig:'db2018-p6-tables.png',type:'mcq',src:'PP 2018 Q2(c)',ref:'2018 Q2(c) · 1 mark',
  q:'The diagram shows part of the World of Games database.[FIG]What type of relationship exists between the <code>Member</code> table and the <code>MemberNewsletter</code> table?',
  options:['One to Many','One to One','Many to Many'],answer:0,
  feedback:'Mark scheme: One to Many. The 1 is at the Member end of the line and the infinity symbol (many) is at MemberNewsletter: one member can appear many times, once for each newsletter they receive.'},
rel2018q2d:{shape:'link-table',needs:['link-table'],fig:'db2018-p6-tables.png',type:'mcq',src:'PP 2018 Q2(d)',ref:'2018 Q2(d) · 1 mark',
  q:'The diagram shows three linked tables in the World of Games database.[FIG]What is the purpose of the <code>MemberNewsletter</code> table?',
  options:['To store which newsletters each member receives','To store each member’s telephone number','To work out the joining fee for each member','To check that email addresses are in the right format'],answer:0,
  feedback:'Mark scheme, any one: so they know who to send the newsletter to; to store which newsletters each member receives; to store a list of members and the newsletters they receive; to provide a link between the member and newsletter tables.'},
rel2019q3f:{shape:'rel-type',needs:['one-to-many','join-line'],fig:'db2019-p11-relationship.png',type:'mcq',src:'PP 2019 Q3(f)',ref:'2019 Q3(f) · 1 mark',
  q:'The diagram shows the relationships between the <code>MEMBERS</code>, <code>LOAN</code> and <code>DVD</code> tables in John’s DVD loan system.[FIG]What type of relationship exists between the <code>MEMBERS</code> and <code>LOAN</code> tables?',
  options:['One to Many','One to One','Many to Many'],answer:0,
  feedback:'Mark scheme: One to Many (1:M). One member can have many loans.'},
rel2021q2b:{shape:'rel-type',needs:['one-to-many','join-line'],fig:'db2021-p4-relationship.png',type:'mcq',src:'PP 2021 Q2(b)',ref:'2021 Q2(b) · 1 mark',
  q:'The screenshot shows a relationship in the car-sales database.[FIG]What is the relationship between <code>tblCARSSOLD</code> and <code>tblCARS</code>?',
  options:['One to Many','One to One','Many to Many'],answer:0,
  feedback:'Mark scheme: 1 : Many, or many to one. The 1 is at tblCARS and the infinity symbol (many) is at tblCARSSOLD, so one car can appear in many sales.'},
rel2026q4c:{shape:'rel-type',needs:['one-to-many'],fig:'db2026-p8-tables.png',type:'mcq',src:'PP 2026 Q4(c)',ref:'2026 Q4(c) · 1 mark',
  q:'Academy Sports Club stores data about its members, activities and bookings.[FIG]Which term describes the relationship between <code>tblMEMBER</code> and <code>tblBOOKINGS</code>?',
  options:['One to Many','One to One','Many to Many'],answer:0,
  feedback:'Mark scheme: One to Many. One member can make many bookings: M001 appears twice in tblBOOKINGS.'},
/* ---------- D1 importing data ---------- */
imp2021q2e:{shape:'csv',needs:['csv'],type:'mcq',src:'PP 2021 Q2(e)',ref:'2021 Q2(e) · 1 mark',
  q:'The car-sales owner wants to import data files into the database. What do the letters CSV stand for?',

imp2022q10c:{shape:'import-fill',needs:['csv','import'],fig:'db2022-p21-text-file.png',type:'fill',src:'PP 2022 Q10(c)',ref:'2022 Q10(c) (part) · 2 marks',

typ2018q2a1:{shape:'type-one',needs:['date'],fig:'db2018-p6-tables.png',type:'mcq',src:'PP 2018 Q2(a)',ref:'2018 Q2(a) (part) · 1 mark',

  feedback:'Mark scheme: Date/Time or Date.'},
typ2018q2a2:{shape:'type-one',needs:['currency'],fig:'db2018-p6-tables.png',type:'mcq',src:'PP 2018 Q2(a)',ref:'2018 Q2(a) (part) · 1 mark',
  q:'World of Games stores data about its members in a database. Members over 16 pay a joining fee of £20.00.[FIG]Suggest the most suitable data type for the field <code>JoiningFee</code> in the <code>Member</code> table.',
  options:['Currency','Text','Date/Time','Boolean (Yes/No)'],answer:0,
  feedback:'Mark scheme: Currency (or Real or equivalent). The separate field JoiningFeePaid is the Yes/No one.'},
typ2019q3b:{shape:'type-match',needs:['text','date','boolean','currency'],fig:'db2019-p8-members.png',type:'match',src:'PP 2019 Q3(b)',ref:'2019 Q3(b) · 4 marks',
  q:'Part of John’s <code>MEMBERS</code> table is shown.[FIG]The data type for <code>MEMBERID</code> is String. Match each of these fields to its data type.',

  feedback:'Mark scheme: TITLE = String/Text; DATEOFBIRTH = Date/Time or Date; OVEREIGHTEEN = Boolean (Yes/No, true/false); JOININGFEE = Currency.'},
typ2019q3c1:{shape:'type-why',needs:['text'],fig:'db2019-p8-members.png',type:'mcq',src:'PP 2019 Q3(c)(i)',ref:'2019 Q3(c)(i) · 1 mark',
  q:'Part of John’s <code>MEMBERS</code> table is shown.[FIG]The data type for <code>MEMBERID</code> is string. Suggest one reason why string is the right data type.',

typ2019q3c2:{shape:'type-why',needs:['calculated'],fig:'db2019-p8-members.png',type:'mcq',src:'PP 2019 Q3(c)(ii)',ref:'2019 Q3(c)(ii) · 1 mark',
  q:'Part of John’s <code>MEMBERS</code> table is shown.[FIG]In the <code>OVEREIGHTEEN</code> field, the tick box is set automatically. How is its value set?',

  feedback:'Mark scheme: reference to the use of Date of Birth. The database works out the age from DATEOFBIRTH and ticks the box if the member is over eighteen.'},
typ2021q2c1a:{shape:'type-one',needs:['text'],fig:'db2021-p5-cars.png',type:'mcq',src:'PP 2021 Q2(c)(i)',ref:'2021 Q2(c)(i) (part) · 1 mark',
  q:'A sample view of the car-sales table <code>tblCARS</code> is shown.[FIG]Suggest an appropriate data type for <code>RegistrationNo</code>.',
  options:['Text / alphanumeric','Integer (whole number)','Date/Time','Currency'],answer:0,
  feedback:'Mark scheme: alphanumeric / text / string. It has letters and numbers.'},
typ2021q2c1b:{shape:'type-one',needs:['integer-real'],fig:'db2021-p5-cars.png',type:'mcq',src:'PP 2021 Q2(c)(i)',ref:'2021 Q2(c)(i) (part) · 1 mark',
  q:'A sample view of the car-sales table <code>tblCARS</code> is shown.[FIG]Suggest an appropriate data type for <code>YearProduced</code>.',
  options:['Numeric / Integer','Text / alphanumeric','Currency','Boolean (Yes/No)'],answer:0,
  feedback:'Mark scheme: numeric / integer. A year such as 2020 is a whole number.'},
typ2022q10b1:{shape:'type-one',needs:['currency'],fig:'db2022-p20-tables.png',type:'mcq',src:'PP 2022 Q10(b)',ref:'2022 Q10(b) (part) · 1 mark',

  feedback:'Mark scheme: fee_payable.'},
typ2022q10b2:{shape:'type-one',needs:['boolean'],fig:'db2022-p20-tables.png',type:'mcq',src:'PP 2022 Q10(b)',ref:'2022 Q10(b) (part) · 1 mark',

typ2024q3a:{shape:'type-match',needs:['text','date','currency'],fig:'db2024-p7-tables.png',type:'match',src:'PP 2024 Q3(a)',ref:'2024 Q3(a) · 3 marks',
  q:'A booking agent keeps a relational database of concerts.[FIG]Match each field in <code>tblBookings</code> to an appropriate data type.',

  feedback:'Mark scheme: ConcertID = Text/String; ConcertDate = Date/Time or Date; TicketPrice = Currency. Two answers in one row gets no marks.'},
typ2024q10int:{shape:'definition',needs:['integer-real'],type:'mcq',src:'PP 2024 Q10',ref:'2024 Q10 (part) · 1 mark',
  q:'Which term matches this definition: “A data type which stores positive or negative whole numbers”?',
  options:['Integer','Spyware','Intranet','Macro'],answer:0,
  feedback:'Integer, from the 2024 mark scheme.'},
typ2025q5a:{shape:'type-match',needs:['integer-real','text','date','boolean'],fig:'db2025-p8-table.png',type:'match',src:'PP 2025 Q5(a)',ref:'2025 Q5(a) · 4 marks',
  q:'Piotr is creating a database of customers and products. Complete the table to show a data type for each example of data.[FIG]£24 is already done. Match each other example to a data type.',

typ2026q4b:{shape:'type-match',needs:['text','date','currency'],fig:'db2026-p8-tables.png',type:'match',src:'PP 2026 Q4(b)',ref:'2026 Q4(b) · 3 marks',

/* ---------- D3 the need for validation ---------- */
val2025q5bi:{shape:'define-validation',needs:['validation'],type:'fill',src:'PP 2025 Q5(b)(i)',ref:'2025 Q5(b)(i) · 2 marks',
  q:'Piotr is creating a form to capture customer details on his website. He has been advised to use validation. What is validation? Use the words to complete the answer. (Not all words will be used.)',
  bank:['computer','person','sensible','accurate','printed'],
  text:'Validation is an automatic check carried out by the [[computer]] that makes sure the data entered is [[sensible]], reasonable or meets set criteria.',
  feedback:'Mark scheme: a process, software or automatic computer check [1] that ensures the data entered is sensible, reasonable or meets set criteria [1]. Validation cannot prove that data is accurate: a sensible but wrong date of birth still gets through.'},
/* ---------- D4 validation checks ---------- */
val2021q2g1:{shape:'describe-check',needs:['presence','describe'],fig:'db2021-p8-form.png',type:'pick',src:'PP 2021 Q2(g)',ref:'2021 Q2(g) (presence) · 2 marks',need:2,
  q:'The car-sales owner uses this form to enter data into <code>tblCARS</code>.[FIG]Describe how a <b>presence check</b> could be used on the form. Choose what the check does and an example on this form.',
  options:[{text:'It checks that data has been entered into a field',ok:true},{text:'For example, it makes sure RegistrationNo is not left empty',ok:true},{text:'It checks that the data is between an upper and a lower limit',ok:false},{text:'For example, it makes sure YearProduced is between 1990 and 2021',ok:false},{text:'It checks that the data has the right number of characters',ok:false},{text:'It checks that the data typed in is correct',ok:false}],
  feedback:'Mark scheme: to check that data has been entered into a field [1], for example to make sure RegistrationNo (or Country Code) is entered [1]. Any field name is acceptable. No validation check can prove that data is correct.'},
val2021q2g2:{shape:'describe-check',needs:['range','describe'],fig:'db2021-p8-form.png',type:'pick',src:'PP 2021 Q2(g)',ref:'2021 Q2(g) (range) · 2 marks',need:2,
  q:'The car-sales owner uses this form to enter data into <code>tblCARS</code>.[FIG]Describe how a <b>range check</b> could be used on the form. Choose what the check does and an example on this form.',
  options:[{text:'It makes sure the data entered is between an upper and a lower limit',ok:true},{text:'For example, YearProduced must be above 1990 and below 2021',ok:true},{text:'It makes sure something has been typed into the box',ok:false},{text:'For example, RegistrationNo must not be left empty',ok:false},{text:'It makes sure the data has the right number of characters',ok:false},{text:'For example, Country must contain letters only',ok:false}],
  feedback:'Mark scheme: to ensure data entered is between an upper and a lower limit [1], on the YearProduced field (above 1990, below 2021) or the Price field (for example between 10,000 and 50,000) [1]. Only YearProduced and Price are acceptable fields.'},
val2022q10c3:{shape:'name-check',needs:['presence'],type:'fill',src:'PP 2022 Q10(c)',ref:'2022 Q10(c) (part) · 1 mark',
  q:'Jack wants to make sure that no field is left blank when data is added to his table <code>cust_TBL</code>. Use the words to complete the sentence. (Not all words will be used.)',
  bank:['import','presence','export','CSV','txt'],
  text:'Jack can do this by adding a [[presence]] check to each field.',
  feedback:'Mark scheme: PRESENCE. A presence check makes sure something has been entered.'},
val2022q10d1:{shape:'name-range',needs:['range'],fig:'db2022-p20-tables.png',type:'mcq',src:'PP 2022 Q10(d)',ref:'2022 Q10(d) (part) · 1 mark',
  q:'Jack runs a repair shop. His database has these two tables.[FIG]Jack adds validation checks to <code>repair_TBL</code>. Name the type of validation check used when <code>fee_payable</code> should be between 20 and 100.',
  options:['Range check','Length check','Presence check','Format check'],answer:0,
  feedback:'Mark scheme: Range check.'},
val2022q10d2:{shape:'name-check',needs:['length'],fig:'db2022-p20-tables.png',type:'mcq',src:'PP 2022 Q10(d)',ref:'2022 Q10(d) (part) · 1 mark',
  q:'Jack runs a repair shop. His database has these two tables.[FIG]Jack adds validation checks to <code>repair_TBL</code>. Name the type of validation check used when <code>description</code> should be no longer than 35 characters.',
  options:['Length check','Range check','Presence check','Format check'],answer:0,
  feedback:'Mark scheme: Length check.'},
val2023q3b1:{shape:'name-check',needs:['format','length'],fig:'db2023-p7-sheet.png',type:'pick',src:'PP 2023 Q3(b)',ref:'2023 Q3(b) (part) · 1 mark',need:1,
  q:'Sinead’s database has built-in validation checks.[FIG]Apart from a presence check, identify a suitable validation check for <code>clientID</code>.',
  options:[{text:'Format check',ok:true},{text:'Length check',ok:true},{text:'Range check',ok:false},{text:'Presence check',ok:false}],
  feedback:'Mark scheme: Format check or Length check (either gets the mark). Range check is for numbers between limits.'},
val2023q3b2:{shape:'name-range',needs:['range'],fig:'db2023-p7-sheet.png',type:'mcq',src:'PP 2023 Q3(b)',ref:'2023 Q3(b) (part) · 1 mark',
  q:'Sinead’s database has built-in validation checks.[FIG]Apart from a presence check, identify the most appropriate validation check for <code>projectlength</code>.',
  options:['Range check','Length check','Format check','Presence check'],answer:0,
  feedback:'Mark scheme: Range. The value must sit between two limits. A length check counts characters, not days.'},

/* Shared mini-game kit for the HQ topic activities (Databases HQ, Spreadsheets HQ).
   Uses the engine's helpers only ($, say, sfx, mascot, musBtn, startMusic, stopMusic, shuffle, shakeScreen).
   Nothing here touches the page at load time, so the build's level gate can run it in node. */
let GM=null;
globalThis.simMusicOn=()=>!!(GM&&GM.state!=='end'&&$('gm'));
function gmOpen(area,o){
  if(GM&&GM.timer)clearInterval(GM.timer);
  GM={...o,stage:0,state:'play',lives:o.lives??3,maxLives:o.lives??3};
  area.innerHTML=`<div class="gm" id="gm"><div class="arena-grid"></div><div class="vs-head">${musBtn()}<span class="vs-title">${o.icon} ${o.title}</span>${mascot(o.bot||'🤖')}</div>
<div class="gm-bar"><div class="gm-stages" id="gmStages"></div><div class="gm-lives" id="gmLives" aria-label="Lives"></div></div>
<div id="gmMain"></div><div id="gmMsg" aria-live="polite"></div></div>`;
  gmStage(0);gmLives();startMusic();
}
/* the stages are always shown, and the current one is named */
function gmStage(i){
  GM.stage=i;const s=GM.stages||[];
  $('gmStages').innerHTML=s.length>1?s.map((n,k)=>k===i?`<span class="on">Stage ${k+1} of ${s.length}: ${n}</span>`:`<span class="${k<i?'done':''}">${k<i?'✓ ':''}${n}</span>`).join(''):'';
}
function gmLives(){
  const el=$('gmLives');if(!el)return;
  el.innerHTML=GM.maxLives?`<span class="gm-lab">Lives</span>${'❤️'.repeat(Math.max(0,GM.lives))}${'🖤'.repeat(GM.maxLives-Math.max(0,GM.lives))}`:'';
}
/* lose a life; returns true when none are left */
function gmLose(){GM.lives--;gmLives();sfx('bad');shakeScreen();return GM.lives<=0;}
function gmMsg(html,cls){$('gmMsg').innerHTML=html?`<div class="feedback-box ${cls||''}">${html}</div>`:'';}
function gmGo(label,fn,cls){
  $('gmMsg').insertAdjacentHTML('beforeend',`<button class="btn ${cls||'btn-primary'} next-btn" id="goBtn">${label}</button>`);
  $('goBtn').onclick=fn;$('goBtn').focus({preventScroll:true});
}
function gmBanner(head,text,btn,fn){
  GM.state='banner';gmMsg('');
  $('gmMain').innerHTML=`<div class="vs-banner"><div class="vs-bh">${head}</div><p>${text}</p><button class="btn btn-primary" id="goBtn">${btn}</button></div>`;
  $('goBtn').onclick=()=>{GM.state='play';fn();};$('goBtn').focus({preventScroll:true});
}
/* finish the mini-game: stars 0 = not passed (the engine asks for another go) */
function gmEnd(st,head,text){
  if(GM.timer)clearInterval(GM.timer);GM.state='end';stopMusic();gmMsg('');
  sfx(st>0?'win':'over');say(st>0?'Done! 🎉':'Oh no! 😬');
  $('gmMain').innerHTML=`<div class="vs-banner"><div class="vs-bh">${head}</div><p>${text}</p><div class="stars-big">${'★'.repeat(st)}${'☆'.repeat(3-st)}</div><button class="btn btn-success" id="goBtn">See level result →</button></div>`;
  const fin=GM.finish;$('goBtn').onclick=()=>{GM=null;fin(0,st);};$('goBtn').focus({preventScroll:true});
}
function gmStars(livesLeft,max){return livesLeft>=max?3:livesLeft>=max-1?2:livesLeft>0?1:0;}
/* a countdown bar inside el; calls out() when time runs out */
function gmTimer(el,secs,out){
  if(GM.timer)clearInterval(GM.timer);
  el.innerHTML='<div class="vs-timer"><div></div></div>';const bar=el.querySelector('.vs-timer div');
  const end=Date.now()+secs*1000;
  GM.timer=setInterval(()=>{
    if(!GM){return;}
    const left=end-Date.now();bar.style.width=Math.max(0,left/(secs*10))+'%';bar.classList.toggle('low',left<secs*300);
    if(left<=0){clearInterval(GM.timer);GM.timer=null;out();}
  },100);
}
function gmStop(){if(GM&&GM.timer){clearInterval(GM.timer);GM.timer=null;}}
function gmSel(id,opts,val){return `<select class="gm-sel" id="${id}">${opts.map(o=>{const [v,l]=Array.isArray(o)?o:[o,o];return `<option value="${v}"${v===val?' selected':''}>${l}</option>`;}).join('')}</select>`;}
function gmShuffle(a){const r=[...a];for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];}return r;}
/* exam rooms draw a fresh set of real questions each time the page opens: [[pool,n],…] */
function gmDraw(groups){return groups.flatMap(([pool,n])=>gmShuffle(pool.filter(Boolean)).slice(0,n));}
/* select a block of cells like a real worksheet: drag across them with a mouse or a finger.
   Cells carry data-c (0 = column A) and data-r (1 = row 1). A tap picks one cell; Shift-click stretches the block.
   With o.twoTap a single tap is held as the first cell and the next tap finishes the block (o.first(p) is told).
   o.expand(R) may grow the block (merged cells); o.move(R) runs while dragging; o.done(R) runs when the block is chosen.
   o.off() returning true ignores input. R = {c1,r1,c2,r2}. */
function gmGridSelect(table,o){
  let a=null,b=null,down=false,moved=false,held=false;
  const cellAt=(x,y)=>{const el=document.elementFromPoint(x,y),td=el&&el.closest('[data-c]');return td&&table.contains(td)?{c:+td.dataset.c,r:+td.dataset.r}:null;};
  const rect=()=>{const R={c1:Math.min(a.c,b.c),c2:Math.max(a.c,b.c),r1:Math.min(a.r,b.r),r2:Math.max(a.r,b.r)};return o.expand?o.expand(R):R;};
  const paint=()=>{const R=a&&b?rect():null;table.querySelectorAll('[data-c]').forEach(td=>{const c=+td.dataset.c,r=+td.dataset.r;td.classList.toggle('sel',!!R&&c>=R.c1&&c<=R.c2&&r>=R.r1&&r<=R.r2);});if(R&&o.move)o.move(R);};
  const press=(p,shift)=>{moved=false;if(a&&(shift||(o.twoTap&&held))){b=p;held=false;moved=true;}else{a=p;b=p;}paint();};
  const release=()=>{if(o.twoTap&&!moved){held=true;if(o.first)o.first(a);return;}held=false;o.done(rect());};
  table.style.touchAction='none';
  table.addEventListener('pointerdown',e=>{if(o.off&&o.off())return;const p=cellAt(e.clientX,e.clientY);if(!p)return;e.preventDefault();down=true;try{table.setPointerCapture(e.pointerId);}catch(_){}press(p,e.shiftKey);});
  table.addEventListener('pointermove',e=>{if(!down)return;const p=cellAt(e.clientX,e.clientY);if(p&&(p.c!==b.c||p.r!==b.r)){b=p;moved=true;held=false;paint();}});
  const up=()=>{if(!down)return;down=false;release();};
  table.addEventListener('pointerup',up);table.addEventListener('pointercancel',up);
  /* keyboard: Enter or Space on a cell button arrives as a click with no pointer */
  const key=(td,shift)=>{if(o.off&&o.off())return;press({c:+td.dataset.c,r:+td.dataset.r},shift);release();};
  table.addEventListener('click',e=>{if(e.detail!==0)return;const td=e.target.closest('[data-c]');if(td&&table.contains(td))key(td,e.shiftKey);});
  table.addEventListener('keydown',e=>{if(e.key!=='Enter'&&e.key!==' ')return;const td=e.target.closest('[data-c]');if(!td||!table.contains(td)||td.tagName==='BUTTON')return;e.preventDefault();key(td,e.shiftKey);});
  return {clear(){a=b=null;held=false;paint();},set(R){a={c:R.c1,r:R.r1};b={c:R.c2,r:R.r2};held=false;paint();}};
}
/* A1-style names: column number 0 = A */
const gmCol=c=>String.fromCharCode(65+c);
const gmRange=R=>R.c1===R.c2&&R.r1===R.r2?gmCol(R.c1)+R.r1:gmCol(R.c1)+R.r1+':'+gmCol(R.c2)+R.r2;
/* a small worksheet calculator for typed formulas: =, numbers, "text", cell references (with or without $), ranges,
   + - * / ( ), comparisons, and SUM AVERAGE MAX MIN IF VLOOKUP. Columns are single letters.
   gmParse(text) gives {ast} or {err:'noeq'|'syntax'}; gmEval(ast,get) gives a number, text, true/false or an error
   such as #N/A. get(col,row) returns what a cell shows ('' when empty). */
const GM_REF=/^(\$?)([A-Z])(\$?)(\d+)$/;
const gmIsErr=v=>typeof v==='string'&&/^#(N\/A|VALUE!|DIV\/0!|NAME\?|REF!)$/.test(v);
function gmTokens(f){
  const out=[],re=/\s+|"[^"]*"|\$?[A-Za-z]\$?\d+(?![A-Za-z(])|[A-Za-z]+|\d+(?:\.\d+)?|\.\d+|<=|>=|<>|[-+*\/(),:<>=]/y;let i=0;
  while(i<f.length){re.lastIndex=i;const m=re.exec(f);if(!m)return null;i=re.lastIndex;if(/^\s+$/.test(m[0]))continue;out.push(m[0][0]==='"'?m[0]:m[0].toUpperCase());}
  return out;
}
function gmParse(f){
  f=String(f||'').trim();if(f[0]!=='=')return {err:'noeq'};
  const T=gmTokens(f.slice(1));if(!T||!T.length)return {err:'syntax'};
  let p=0;const peek=()=>T[p],next=()=>T[p++],want=x=>{if(T[p]!==x)throw 0;p++;};
  const ref=t=>{const m=(t||'').match(GM_REF);return m&&{t:'ref',c:m[2],r:+m[4],ac:!!m[1],ar:!!m[3]};};
  const prim=()=>{
    const t=next();if(t===undefined)throw 0;
    if(/^[\d.]/.test(t))return {t:'n',v:+t};
    if(t[0]==='"')return {t:'s',v:t.slice(1,-1)};
    if(t==='('){const e=cmp();want(')');return e;}
    const a=ref(t);
    if(a){if(peek()!==':')return a;next();const b=ref(next());if(!b)throw 0;return {t:'rng',a,b};}
    if(/^[A-Z]+$/.test(t)){
      if(peek()!=='(')return t==='TRUE'||t==='FALSE'?{t:'b',v:t==='TRUE'}:{t:'name',v:t};
      next();const args=[];if(peek()!==')'){args.push(cmp());while(peek()===','){next();args.push(cmp());}}want(')');
      return {t:'fn',name:t,args};
    }
    throw 0;
  };
  const un=()=>peek()==='-'?(next(),{t:'neg',a:un()}):peek()==='+'?(next(),un()):prim();
  const mul=()=>{let a=un();while(peek()==='*'||peek()==='/'){const op=next();a={t:'op',op,a,b:un()};}return a;};
  const add=()=>{let a=mul();while(peek()==='+'||peek()==='-'){const op=next();a={t:'op',op,a,b:mul()};}return a;};
  const cmp=()=>{let a=add();if(['<','>','<=','>=','=','<>'].includes(peek())){const op=next();a={t:'op',op,a,b:add()};}return a;};
  try{const ast=cmp();if(p!==T.length)return {err:'syntax'};return {ast};}catch(e){return {err:'syntax'};}
}
const gmCells=n=>{const out=[],c1=Math.min(n.a.c.charCodeAt(0),n.b.c.charCodeAt(0)),c2=Math.max(n.a.c.charCodeAt(0),n.b.c.charCodeAt(0)),r1=Math.min(n.a.r,n.b.r),r2=Math.max(n.a.r,n.b.r);
  for(let r=r1;r<=r2;r++)for(let c=c1;c<=c2;c++)out.push({c:String.fromCharCode(c),r});return out;};
function gmEval(n,get){
  const E=x=>gmEval(x,get),num=v=>typeof v==='boolean'?+v:v===''?0:v;
  const vals=args=>{const out=[];for(const a of args){if(a.t==='rng'){for(const q of gmCells(a)){const v=get(q.c,q.r);if(gmIsErr(v))return v;if(typeof v==='number')out.push(v);}}
    else if(a.t==='ref'){const v=get(a.c,a.r);if(gmIsErr(v))return v;if(typeof v==='number')out.push(v);}
    else{const v=num(E(a));if(gmIsErr(v))return v;if(typeof v!=='number')return '#VALUE!';out.push(v);}}return out;};
  switch(n.t){
    case 'n':case 's':case 'b':return n.v;
    case 'name':return '#NAME?';
    case 'ref':return get(n.c,n.r);
    case 'rng':return '#VALUE!';
    case 'neg':{const a=num(E(n.a));return gmIsErr(a)?a:typeof a==='number'?-a:'#VALUE!';}
    case 'op':{
      const a=num(E(n.a)),b=num(E(n.b));if(gmIsErr(a))return a;if(gmIsErr(b))return b;
      if('+-*/'.includes(n.op)){
        if(typeof a!=='number'||typeof b!=='number')return '#VALUE!';
        return n.op==='+'?a+b:n.op==='-'?a-b:n.op==='*'?a*b:b===0?'#DIV/0!':a/b;
      }
      const x=typeof a==='string'?a.toUpperCase():a,y=typeof b==='string'?b.toUpperCase():b;
      if(typeof x!==typeof y)return n.op==='<>';
      return {'<':x<y,'>':x>y,'<=':x<=y,'>=':x>=y,'=':x===y,'<>':x!==y}[n.op];
    }
    case 'fn':{
      const A=n.args;
      if(['SUM','AVERAGE','MAX','MIN'].includes(n.name)){
        if(!A.length)return '#VALUE!';const v=vals(A);if(!Array.isArray(v))return v;
        if(n.name==='SUM')return v.reduce((s,x)=>s+x,0);
        if(n.name==='AVERAGE')return v.length?v.reduce((s,x)=>s+x,0)/v.length:'#DIV/0!';
        return v.length?Math[n.name.toLowerCase()](...v):0;
      }
      if(n.name==='IF'){if(A.length<2||A.length>3)return '#VALUE!';const c=num(E(A[0]));if(gmIsErr(c))return c;return c?E(A[1]):A[2]?E(A[2]):false;}
      if(n.name==='VLOOKUP'){
        if(A.length<3||A.length>4||A[1].t!=='rng')return '#VALUE!';
        const v=E(A[0]),col=num(E(A[2]));if(gmIsErr(v))return v;if(gmIsErr(col))return col;
        if(typeof col!=='number'||col<1)return '#VALUE!';
        const c1=Math.min(A[1].a.c.charCodeAt(0),A[1].b.c.charCodeAt(0)),c2=Math.max(A[1].a.c.charCodeAt(0),A[1].b.c.charCodeAt(0));
        if(c1+Math.floor(col)-1>c2)return '#REF!';
        /* as Excel: with three parts (or TRUE) it is the nearest match, the last code in the first column that is not bigger
           than the one looked up (the list is in order, so it stops at the first bigger one); nothing that small gives #N/A.
           A fourth part of FALSE asks for the exact code. Blank cells, and numbers against text, are passed over. */
        const near=A[3]?!!num(E(A[3])):true,key=x=>typeof x==='string'?x.toUpperCase():x;
        const rows=gmCells({a:{c:String.fromCharCode(c1),r:A[1].a.r},b:{c:String.fromCharCode(c1),r:A[1].b.r}});
        let hit=null;
        for(const q of rows){const k=get(q.c,q.r);if(k===''||typeof k!==typeof v)continue;
          if(!near){if(key(k)===key(v)){hit=q.r;break;}continue;}
          if(key(k)<=key(v))hit=q.r;else break;}
        if(hit==null)return '#N/A';
        return get(String.fromCharCode(c1+Math.floor(col)-1),hit);
      }
      return '#NAME?';
    }

/* every cell reference in a formula, as {c,r}; ranges count each end */
function gmRefsIn(n,out=[]){if(!n||typeof n!=='object')return out;if(n.t==='ref')out.push(n);if(n.t==='rng'){out.push(n.a,n.b);}['a','b'].forEach(k=>n.t!=='rng'&&n[k]&&gmRefsIn(n[k],out));(n.args||[]).forEach(x=>gmRefsIn(x,out));return out;}
/* the formula copied dr rows down: references without $ before the row number move, the rest stay put */
function gmShift(f,dr){const T=gmTokens(String(f).trim().replace(/^=/,''));if(!T)return f;
  return '='+T.map(t=>{const m=t.match(GM_REF);return m?m[1]+m[2]+m[3]+(m[3]?+m[4]:+m[4]+dr):t;}).join('');}
/* show a value the way a cell would: dp decimal places, rounded half up like a spreadsheet */
function gmShow(v,dp,cur){if(typeof v==='boolean')return v?'TRUE':'FALSE';if(typeof v!=='number')return v;
  const r=dp==null?v:(Math.round(v*Math.pow(10,dp)+(v<0?-1e-6:1e-6))/Math.pow(10,dp));return (cur?'£':'')+(dp==null?String(+r.toFixed(6)):r.toFixed(dp));}

/* Activity 5 — The Festival. Sources: TB p15; PP 2018 Q3(a)(b), 2021 Q8(b), 2022 Q1(h), 2026 Q4(e), 2026 Q10.

const DM_V={vol:'Volume',var:'Variety',vel:'Velocity'};
const DM_FMT={rec:'🧾 Records in tables',photo:'📷 Photos',video:'🎥 Video clips',sound:'🎵 Sound recordings',post:'💬 Social media posts',email:'📧 Emails'};

 vol:{ic:'💽',name:'Storage',up:'add 16 TB of storage',eng:'added 16 TB of storage'},

 vol:'the amount of data was more than the storage could hold. Volume is the amount of data stored, so it needs large storage capacity hardware.',

 {v:'vol',ic:'🗄️',text:'The organisers load every ticket record from the last five festivals, to compare them with this year.',f:['rec']},

let DM=null;
function sim_mountain(area,finish){

function dmFlow(fmts){

function dmOutcome(s,before){

 tasks:[],pool:[[[PP.ana2018q3a,PP.ana2026q4e2],1],[[PP.big2018q3b],1],[[PP.big2021q8b,PP.big2022q1h],1],[[PP.big2026q10v],1],[[PP.big2026q4e1],1]]}
]};

<script>
/* HQ engine v3 (Software HQ v2 + HQ_NAME, sorter variants fall/belt/pop, boss pools drawn fresh each play, real exam figures) — game levels (see S1 Software/GAME_DESIGN.md).
   ACT = {title, icon, intro, topics, ranks:[top,high,mid,low], teach:[{html,init?}], next,
          rounds:[{title, heading, teachAt:[teach indices shown before it], mode?:'sorter'|'boss'|'sim', sim?, boss?:{icon,name}, choices?, keepOrder?, tip, tasks}]}
   A round of classify tasks with shared choices plays as a SORTER (falling cards); any other round plays as a BOSS fight; mode:'sim' calls window['sim_'+r.sim](area, finish).
   Marks (and the rank) come only from sorter and boss levels. Every task carries src (see SOURCE_MAP.md). */
let lvl=0,taskIdx=0,teachStep=0,S=null,B=null,briefOpen=false;
const G={points:0,combo:0,muted:false,lp:[]};
const marks=[],maxMarks=[],stars=[];
function shuffle(a){const r=[...a];for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];}return r;}
function $(id){return document.getElementById(id);}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));$(id).classList.add('active');window.scrollTo({top:0,behavior:'smooth'});}
function setProgress(p){$('progressFill').style.width=p+'%';}
function norm(s){return String(s).trim().toLowerCase();}
const LEVELS=ACT.rounds.map(r=>{const mode=r.mode||(r.pool?'boss':r.choices&&r.tasks.every(t=>t.type==='classify')?'sorter':'boss');
  const brief=(r.teachAt||[]).map(i=>ACT.teach[i]);
  /* the 📖 button: the round's own lessons, and in an exam room every lesson in the activity */
  return {...r,mode,kind:mode==='sorter'?(r.variant||'fall'):mode,brief,book:mode==='boss'?ACT.teach:brief};});
/* kinds: three different sorting games, the boss, and the mini-games */
const KIND_ICON={fall:'🎮',belt:'🛤️',pop:'🎯',boss:'👾',sim:'🕹️'};
const KIND_NAME={fall:'Falling cards',belt:'Conveyor belt',pop:'Pop-up cards',boss:'Boss battle',sim:'Mini-game'};
const KIND_HOW={fall:'Cards fall. Tap the right box (or press 1, 2, 3) before the card lands. 3 lives.',
  belt:'Cards ride a conveyor belt. Send each one to the right box before it drops off the end. 3 lives.',
  pop:'Cards pop up anywhere and fade away. Tap the right box before each card vanishes. 3 lives.',
  boss:'Real CCEA exam questions. Every mark you score hits the boss. A new set of questions every time you play.',
  sim:'Do the computer\'s job yourself.'};
const lvIcon=L=>L.icon||KIND_ICON[L.kind];
const lvName=L=>L.kindName||KIND_NAME[L.kind];

/* ---------- saved progress (this browser only) ---------- */
const KEY='swhq2_'+ACT.title;
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{};}catch(e){return {};}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(STORE));}catch(e){}}
const STORE=Object.assign({best:0,stars:[],muted:false},load());
G.muted=!!STORE.muted;

/* ---------- sound ---------- */
let AC=null;
const SFX={good:[[660,.07],[880,.1]],combo:[[660,.06],[880,.06],[1175,.12]],bad:[[160,.25,'sawtooth']],hit:[[587,.05],[880,.05],[1319,.14]],
  level:[[523,.1],[659,.1],[784,.1],[1047,.3]],over:[[392,.16],[330,.16],[262,.35]],tick:[[880,.03]],zap:[[740,.03],[1480,.05]],alarm:[[1175,.05],[880,.05],[1175,.06]],scan:[[1047,.025],[1319,.025],[1568,.025],[2093,.04]],win:[[523,.08],[784,.08],[1047,.08],[1568,.35]]};
function sfx(k){
  if(G.muted)return;
  try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();let t=AC.currentTime;
    SFX[k].forEach(([f,d,w])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=w||'triangle';o.frequency.value=f;
      g.gain.setValueAtTime(0.1,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+0.03);t+=d;});}catch(e){}
}
function toggleMute(){G.muted=!G.muted;STORE.muted=G.muted;save();document.querySelectorAll('.mute-btn').forEach(b=>b.textContent=G.muted?'🔇':'🔊');if(G.muted)stopMusic();else if(musicWanted())startMusic();}

/* ---------- points, combo, popups ---------- */
function mult(){return Math.min(4,1+Math.floor(G.combo/3));}
function addPoints(n){G.points+=n;G.lp[lvl]=(G.lp[lvl]||0)+n;hud();}
function hit(){const before=mult();G.combo++;if(mult()>before){sfx('combo');flash(`🔥 Combo ×${mult()}!`);}else sfx('good');}
function miss(){G.combo=0;sfx('bad');hud();}
function popup(text,el,cls){
  const box=(el||$('taskArea')).getBoundingClientRect(),p=document.createElement('div');
  p.className='popup '+(cls||'');p.textContent=text;p.style.left=(box.left+box.width/2)+'px';p.style.top=(box.top+Math.min(box.height/2,120))+'px';
  document.body.appendChild(p);setTimeout(()=>p.remove(),1100);
}
function flash(text){const f=document.createElement('div');f.className='flash-banner';f.textContent=text;document.body.appendChild(f);setTimeout(()=>f.remove(),1300);}
function shakeScreen(){const c=document.querySelector('.container');c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake');}
function starStr(n){return n==null?'☆☆☆':'★'.repeat(n)+'☆'.repeat(3-n);}
function hud(){
  if(!$('hudPts'))return;
  $('hudPts').textContent=G.points.toLocaleString();
  $('hudCombo').textContent=mult()>1?`🔥 ×${mult()}`:'';
  $('hudLives').textContent=S&&S.active?'❤️'.repeat(S.lives)+'🖤'.repeat(3-S.lives):'';
}

/* ---------- welcome + level map ---------- */
function bestStars(i){const a=stars[i],b=STORE.stars[i];return a==null?b:(b==null?a:Math.max(a,b));}
function unlocked(i){return i===0||bestStars(i-1)!=null;}
function renderWelcome(){
  document.title=ACT.title+' — '+(typeof HQ_NAME!=='undefined'?HQ_NAME:'Software HQ');
  stopSorter();
  const next=LEVELS.findIndex((L,i)=>bestStars(i)==null);
  const go=next<0?0:next;
  setProgress(Math.round(LEVELS.filter((L,i)=>bestStars(i)!=null).length/LEVELS.length*100));
  $('welcomeScreen').innerHTML=`<div class="welcome"><div class="welcome-icon">${ACT.icon}</div><h2>${ACT.title}</h2><p>${ACT.intro}</p>
<div class="level-map">${LEVELS.map((L,i)=>{const u=unlocked(i);return `<button class="node ${u?'':'locked'} ${i===go?'current':''}" ${u?`onclick="startLevel(${i})"`:'disabled'}>
<div class="node-icon">${u?lvIcon(L):'🔒'}</div><div class="node-num">Level ${i+1}</div><div class="node-title">${L.title}</div><div class="node-type">${lvName(L)}</div><div class="node-stars">${starStr(bestStars(i))}</div></button>`;}).join('<div class="node-path"></div>')}</div>
<button class="btn btn-primary btn-big" onclick="startLevel(${go})">${next<0?'▶ Play again from Level 1':next===0?'▶ Start Level 1':'▶ Continue: Level '+(go+1)}</button>
<div class="how-box">${['fall','belt','pop','sim','boss'].filter(k=>LEVELS.some(L=>L.kind===k)).map(k=>`<div><b>${KIND_ICON[k]} ${KIND_NAME[k]}</b>${KIND_HOW[k]}</div>`).join('')}</div>
<div class="best-line">🏆 Best score on this device: <b>${(STORE.best||0).toLocaleString()}</b> &nbsp;·&nbsp; <button class="mute-btn link-btn" onclick="toggleMute()">${G.muted?'🔇':'🔊'}</button> sound</div>
<p class="topics-line"><b>Topics:</b> ${ACT.topics}</p></div>`;
  showScreen('welcomeScreen');
}

/* ---------- briefing ---------- */
function startLevel(i){
  lvl=i;teachStep=0;stopSorter();
  if(LEVELS[i].brief.length){showScreen('teachScreen');renderBrief();}else playLevel();
}
function renderBrief(){
  const L=LEVELS[lvl],s=L.brief[teachStep];
  $('teachLabel').textContent=`Level ${lvl+1}: ${L.title} · Briefing ${teachStep+1} of ${L.brief.length}`;
  $('teachContent').innerHTML=s.html;
  const last=teachStep===L.brief.length-1;
  $('teachNextBtn').textContent=last?`${lvIcon(L)} Play Level ${lvl+1} →`:'Next →';
  $('teachNextBtn').className='btn '+(last?'btn-success btn-big':'btn-primary');
  $('teachBackBtn').textContent=teachStep===0?'🗺️ Map':'← Back';
  if(s.init)s.init();
}
function nextTeach(){teachStep++;if(teachStep>=LEVELS[lvl].brief.length)playLevel();else renderBrief();}
function prevTeach(){if(teachStep>0){teachStep--;renderBrief();}else renderWelcome();}
function openBrief(){
  const L=LEVELS[lvl];if(!L.book.length)return;
  if(S)S.paused=true;briefOpen=true;
  const o=document.createElement('div');o.className='overlay';o.id='briefOverlay';
  o.innerHTML=`<div class="overlay-inner">${L.book.map(b=>b.html.replace(/ id="/g,' data-oid="')).join('')}<button class="btn btn-primary" onclick="closeBrief()">Back to the game ▶</button></div>`;
  document.body.appendChild(o);
}
function closeBrief(){$('briefOverlay')?.remove();briefOpen=false;if(S&&S.active&&!S.wait){S.paused=false;S.last=performance.now();}}

/* ---------- level screen ---------- */
function playLevel(){
  const L=LEVELS[lvl];
  G.points-=G.lp[lvl]||0;G.lp[lvl]=0;G.combo=0;
  $('teachContent').innerHTML='';
  showScreen('roundScreen');
  $('roundLabel').innerHTML=`<span>${lvIcon(L)} Level ${lvl+1} of ${LEVELS.length}: ${L.title}</span>
<span class="hud"><span id="hudLives"></span><span id="hudCombo" class="hud-combo"></span><span class="hud-pts">⚡ <span id="hudPts">0</span></span>
${L.book.length?`<button class="hud-btn" title="${L.mode==='boss'?'Look at the lessons again':'Look at the briefing again'}" aria-label="${L.mode==='boss'?'Look at the lessons again':'Look at the briefing again'}" onclick="openBrief()">📖</button>`:''}<button class="hud-btn mute-btn" onclick="toggleMute()">${G.muted?'🔇':'🔊'}</button></span>`;
  $('roundHeading').textContent=L.heading;
  setProgress(Math.round(lvl/LEVELS.length*100));
  ({sorter:playSorter,boss:playBoss,sim:playSim})[L.mode](L);
  hud();
}

/* ---------- SORTER: falling cards ----------
   Life: a robot host who reacts (lines are personality only, never facts), cards that fly into the bin you chose,
   an alarm when a card nears the floor, an "on fire" sky at combo ×3+, and the same quiet music as the bosses. */
const SAY={
  start:['Here they come!','Ready? Sort fast!',"Let's go!"],
  good:['Nice sort!','Yes!','Smooth!','Spot on!','Sorted!'],
  fast:['Lightning fast! ⚡','Whoa, speedy!','So quick!'],
  fire:["You're on fire! 🔥",'Unstoppable!','Combo time!'],
  bad:['Oops! Wrong box.','Not that one!','Argh, so close!'],
  slow:['Too slow!','Missed it!','Gone!'],
  last:['Careful: last life!']
};
function say(text){const el=$('bossSay');if(!el)return;el.textContent=text;el.classList.remove('show');void el.offsetWidth;el.classList.add('show');}
function sayFrom(pool){say(pool[Math.floor(Math.random()*pool.length)]);}
function cheer(cls){const m=$('mascotBot');if(m)retrigger(m,cls,600);}
function musicWanted(){return !!(($('arena')&&B&&B.left>0)||(S&&S.active)||(window.simMusicOn&&window.simMusicOn()));}
function musBtn(){return `<button class="mus-btn${STORE.music===false?' off':''}" id="musBtn" onclick="toggleMusic()" title="Music on or off" aria-label="Music on or off">🎵</button>`;}
function mascot(icon){return `<div class="mascot"><div class="say" id="bossSay" aria-live="polite"></div><span class="mascot-bot" id="mascotBot">${icon}</span></div>`;}
function flyFixed(el,to,ms,done){ // fly a fixed-position copy of el into the centre of element `to`
  const a=el.getBoundingClientRect(),b=to.getBoundingClientRect(),c=el.cloneNode(true);
  c.removeAttribute('id');c.classList.remove('danger');c.classList.add('flyer');
  Object.assign(c.style,{position:'fixed',left:a.left+'px',top:a.top+'px',width:a.width+'px',margin:'0',transform:'none',zIndex:'900'});
  document.body.appendChild(c);
  if(RM){c.remove();if(done)done();return;}
  c.animate([{transform:'translate(0,0) scale(1) rotate(0deg)',opacity:1},
    {transform:`translate(${b.left+b.width/2-a.left-a.width/2}px,${b.top+b.height/2-a.top-a.height/2}px) scale(0.15) rotate(${Math.random()<0.5?-14:14}deg)`,opacity:0.5}],
    {duration:ms,easing:'cubic-bezier(.5,0,.75,0)'}).onfinish=()=>{c.remove();if(done)done();};
}
function playSorter(L){
  const tasks=shuffle(L.tasks);
  marks[lvl]=0;maxMarks[lvl]=tasks.length;
  S={L,tasks,i:0,lives:3,speed:1,active:true,paused:true,wait:true,card:null,run:0,v:L.kind};
  const deco=S.v==='belt'?'<div class="belt"><div class="belt-roll"></div></div><div class="belt-edge">▼</div>':S.v==='pop'?'':'<div class="floor"></div>';
  $('taskArea').innerHTML=`<div class="sorter sorter-${S.v}"><div class="sky-head">${musBtn()}<span class="streak" id="streak"></span><span class="sky-count" id="skyCount"></span>${mascot(L.bot||'🤖')}</div>
<div class="sky sky-${S.v}" id="sky"><div class="arena-grid"></div>${deco}</div>
<div class="bins bins-${L.choices.length}">${L.choices.map((c,n)=>`<button class="bin" data-k="${c.key}"><span class="key">${n+1}</span>${c.label}</button>`).join('')}</div></div>`;
  document.querySelectorAll('.bin').forEach(b=>b.onclick=()=>sorterAnswer(b.dataset.k,b));
  hud();countdown(3);startMusic();
}
function countdown(n){
  if(!S||!S.active)return;
  const sky=$('sky');if(!sky)return;
  sky.querySelector('.go')?.remove();
  sky.insertAdjacentHTML('beforeend',`<div class="go${n?'':' go-go'}">${n||'GO!'}</div>`);sfx(n?'tick':'zap');
  if(n>0)setTimeout(()=>countdown(n-1),650);else{sayFrom(SAY.start);setTimeout(()=>{sky.querySelector('.go')?.remove();spawnCard();},500);}
}
function spawnCard(){
  if(!S||!S.active)return;
  const t=S.tasks[S.i],sky=$('sky');
  $('skyCount').textContent=`Card ${S.i+1} of ${S.tasks.length}`;
  sky.insertAdjacentHTML('beforeend',`<div class="card-fall card-${S.v}" id="fallCard">${t.text}${S.v==='pop'?'<i class="pop-clock"><b></b></i>':''}</div>`);
  const words=t.text.split(/\s+/).length;
  S.card=$('fallCard');S.dur=Math.max(6,4.5+words*0.5)*S.speed*1000*(S.v==='belt'?1.15:1);S.t=0;S.last=performance.now();S.paused=briefOpen;S.wait=false;S.alarm=false;
  if(S.v==='pop'){ // a random spot that keeps the whole card inside the sky
    const c=S.card,mx=Math.max(0,sky.clientWidth-c.offsetWidth-16),my=Math.max(0,sky.clientHeight-c.offsetHeight-16);
    c.style.left=(8+Math.random()*mx)+'px';c.style.top=(8+Math.random()*my)+'px';
  }
  S.raf=requestAnimationFrame(fall);
}
function fall(now){
  if(!S||!S.active||!S.card)return;
  if(!S.paused){S.t+=Math.min(100,now-S.last);}
  S.last=now;
  const sky=$('sky'),f=Math.min(1,S.t/S.dur);
  if(S.v==='belt'){const maxX=sky.clientWidth-S.card.offsetWidth-10;S.card.style.transform=`translate(${Math.round(f*maxX)}px,0)`;}
  else if(S.v==='pop'){S.card.querySelector('.pop-clock b').style.width=((1-f)*100).toFixed(1)+'%';S.card.style.opacity=f>0.8?(1-(f-0.8)*3).toFixed(2):'1';}
  else{const maxY=sky.clientHeight-S.card.offsetHeight-14;S.card.style.transform=`translate(-50%,${Math.round(f*maxY)}px) rotate(${RM?0:(Math.sin(S.t/350)*1.4).toFixed(2)}deg)`;}
  S.card.classList.toggle('danger',f>0.75);
  if(f>0.75&&!S.alarm){S.alarm=true;sfx('alarm');sky.classList.add('alarm');}
  if(f>=1){sorterAnswer(null);return;}
  S.raf=requestAnimationFrame(fall);
}
function streakDraw(){
  const s=$('streak');if(s)s.textContent=S.run>=2?`🔥 ${S.run} in a row`:'';
  const sky=$('sky');if(sky)sky.classList.toggle('fire',mult()>=3);
}
function stopSorter(){if(S){S.active=false;cancelAnimationFrame(S.raf);}S=null;stopMusic();}
function sorterAnswer(k,btn){
  if(!S||!S.active||S.wait||S.paused||!S.card)return;
  cancelAnimationFrame(S.raf);S.wait=true;
  const t=S.tasks[S.i],card=S.card,ok=k===t.answer,sky=$('sky');
  const right=S.L.choices.find(c=>c.key===t.answer);
  const bin=btn||document.querySelector(`.bin[data-k="${t.answer}"]`);
  sky.classList.remove('alarm');
  if(ok){
    marks[lvl]++;const before=mult();hit();S.run++;
    const left=1-S.t/S.dur,pts=100*mult()+Math.round(left*50);addPoints(pts);
    popup('+'+pts,bin,'good');sfx('zap');
    flyFixed(card,bin,320,()=>{retrigger(bin,'gulp',420);sparks(bin,bin.offsetWidth/2,bin.offsetHeight/2,'#69f0ae',12);});
    card.style.visibility='hidden';
    bin.classList.add('bin-good');setTimeout(()=>bin.classList.remove('bin-good'),500);
    cheer('cheer');
    if(mult()>before)sayFrom(SAY.fire);else if(left>0.6)sayFrom(SAY.fast);else if(Math.random()<0.45)sayFrom(SAY.good);
    streakDraw();
    S.speed=Math.max(0.6,S.speed*0.93);
    setTimeout(()=>{card.remove();nextCard();},380);
  }else{
    S.lives--;S.run=0;miss();shakeScreen();card.classList.add('crashed');
    retrigger(sky,'hurt',500);sparks(sky,...centre(card,sky),'#ff5252',14);
    cheer('sad');sayFrom(S.lives===1?SAY.last:(k?SAY.bad:SAY.slow));streakDraw();
    if(btn){btn.classList.add('bin-bad');setTimeout(()=>btn.classList.remove('bin-bad'),600);}
    hud();
    sky.insertAdjacentHTML('beforeend',`<div class="sky-panel bad"><div class="sp-head">${k?'✗ Wrong box!':S.v==='belt'?'⏱ Too slow — it fell off the belt!':S.v==='pop'?'⏱ Too slow — it vanished!':'⏱ Too slow — it landed!'} ${S.lives?'You lost a life.':''}</div>
<div class="sp-item">“${t.text}”</div><div class="sp-answer">belongs in <b>${right.label}</b></div><div class="sp-fb">${t.feedback||''}</div>
<button class="btn btn-primary" id="goBtn">${S.lives?'Got it ▶':'Continue ▶'}</button></div>`);
    $('goBtn').focus();
    $('goBtn').onclick=()=>{document.querySelector('.sky-panel')?.remove();card.remove();if(S.lives<=0)overload();else nextCard();};
  }
}
function nextCard(){S.i++;S.card=null;if(S.i>=S.tasks.length){S.active=false;stopMusic();say('All sorted! 🎉');cheer('cheer');setTimeout(levelComplete,700);}else spawnCard();}
function overload(){
  sfx('over');S.active=false;stopMusic();
  $('sky').insertAdjacentHTML('beforeend',`<div class="sky-panel over"><div class="big">💥</div><div class="sp-head">System overload! You ran out of lives.</div>
<div class="sp-fb">You sorted ${marks[lvl]} of ${S.tasks.length} cards. Try the level again — the cards come in a new order.</div>
<div class="btn-row-sm"><button class="btn btn-success" id="goBtn" onclick="playLevel()">↻ Retry level</button><button class="btn btn-ghost" onclick="levelComplete()">Carry on →</button></div></div>`);
  $('goBtn').focus();
}
document.addEventListener('keydown',e=>{
  if(briefOpen&&e.key==='Escape'){closeBrief();return;}
  if(!S||!S.active)return;
  const n=parseInt(e.key,10);
  if(n>=1&&n<=S.L.choices.length){e.preventDefault();sorterAnswer(S.L.choices[n-1].key,document.querySelectorAll('.bin')[n-1]);}
});
document.addEventListener('visibilitychange',()=>{if(S&&S.active&&!S.wait&&!briefOpen){S.paused=document.hidden;S.last=performance.now();}});

/* ---------- BOSS: exam questions in an arena ----------
   Every mark fires a bolt at the boss; the HP bar is exactly the marks still needed (hp = 70% of the marks), so it never lies.
   A 0-mark answer lets the boss fire back and knock off a shield (shields only add end-of-battle points).
   Full marks before the charge bar empties = a critical hit: double POINTS, never extra marks.
   Taunts are personality only: they never state a fact. */
const RM=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
const TAUNT={
  start:['So you think you can pass the exam?',"Let's see what you really know.","I've beaten better revisers than you!","I'm not going easy on you."],
  hurt:['Argh! Lucky guess!','That one stung!','Impossible!','How did you know that?!','Grr… not bad.'],
  gloat:['Ha! Check the mark scheme!','Too easy!','Missed me!','Is that your final answer? Ha!'],
  rage:["Now I'm ANGRY!",'Enough! Full power!'],

  const cap={},out=[];
  pool.forEach(([items,n])=>{let k=0;shuffle(items.filter(Boolean)).forEach(t=>{const sh=t.shape||t.src;if(k<n&&(cap[sh]||0)<2){cap[sh]=(cap[sh]||0)+1;out.push(t);k++;}});});

/* match: click a term then its definition; each description scores only if its first term is right. t.spare: extra terms that match nothing (as "not all terms will be used") */
function renderMatch(t){

  if(t.spare){t.spare.forEach((x,k)=>terms.push({term:x,i:'s'+k}));terms.sort((a,b)=>a.term.localeCompare(b.term));}

/* fill: text with [[answer]] blanks, choose from a word bank */
function renderFill(t){

function renderOrder(t){

function renderPick(t){
  const opts=shuffle(t.options.map((o,i)=>({...o,i})));
  $('taskBody').innerHTML=`<div class="item-text">${stem(t)}</div><div class="pick-hint">Choose ${t.need}.</div><div class="mcq-list">${opts.map(o=>`<button class="mcq-btn pick" data-i="${o.i}">${o.text}</button>`).join('')}</div><button class="btn btn-success" id="checkBtn" disabled>Check</button>`;
  const btns=[...document.querySelectorAll('#taskBody .pick')];
  btns.forEach(b=>b.onclick=()=>{
    if(!b.classList.contains('sel')&&btns.filter(x=>x.classList.contains('sel')).length>=t.need)return;
    b.classList.toggle('sel');$('checkBtn').disabled=btns.filter(x=>x.classList.contains('sel')).length!==t.need;
  });
  $('checkBtn').onclick=()=>{
    let right=0,wrong=0;
    const right_=btns.filter(b=>b.classList.contains('sel')&&t.options[+b.dataset.i].ok).length;
    btns.forEach(b=>{b.disabled=true;const o=t.options[+b.dataset.i];const s=b.classList.contains('sel');if(o.ok&&(s||right_<t.need))b.classList.add(s?'correct':'missed');if(s&&o.ok)right++;if(s&&!o.ok){wrong++;b.classList.add('wrong');}});
    $('checkBtn').remove();done(t,right);
  };
}

/* ---------- results ---------- */
function showResults(){
  stopSorter();
  const scored=LEVELS.map((L,i)=>i).filter(i=>LEVELS[i].mode!=='sim');
  const played=scored.filter(i=>maxMarks[i]>0&&marks[i]!=null);
  const total=played.reduce((a,i)=>a+marks[i],0),max=played.reduce((a,i)=>a+maxMarks[i],0),pct=max?Math.round(total/max*100):0;
  const [r1,r2,r3,r4]=ACT.ranks;
  const [icon,rank]=pct>=90?['👑',r1]:pct>=70?['⭐',r2]:pct>=50?['🔧',r3]:['🌱',r4];
  const newBest=G.points>(STORE.best||0);if(newBest){STORE.best=G.points;save();}
  setProgress(100);showScreen('resultsScreen');if(pct>=50||newBest)fireConfetti();sfx('win');
  const tips=played.map(i=>marks[i]/maxMarks[i]<0.7?LEVELS[i].tip:null).filter(Boolean);
  const row=(L,i)=>{const st=stars[i]!=null?starStr(stars[i]):'';
    const sc=L.mode==='sim'?(stars[i]!=null?'mini-game':'not played'):(played.includes(i)?`${marks[i]}/${maxMarks[i]}`:'not played');
    return `<div class="breakdown-row"><span>Level ${i+1}: ${L.title}</span><span><span class="row-stars">${st}</span> ${sc}</span></div>`;};
  $('resultsScreen').innerHTML=`<div class="results"><div class="results-icon">${icon}</div><h2>Mission Complete!</h2>
<div class="pts-big">⚡ ${G.points.toLocaleString()} points</div>
${newBest?'<div class="new-best">🏆 New high score on this device!</div>':`<div class="best-line">🏆 Best on this device: ${(STORE.best||0).toLocaleString()}</div>`}
<div class="score-big">${total}/${max} correct (${pct}%)</div><div class="rank">${rank}</div>
<div class="breakdown">${LEVELS.map(row).join('')}<div class="breakdown-row"><span>Total</span><span>${total}/${max}</span></div></div>
${played.length<scored.length?'<p class="ld-tip">Levels you did not play this time are not counted.</p>':''}
${tips.length?`<div class="revision-box"><h4>📝 Go over these again</h4><ul>${tips.map(t=>'<li>'+t+'</li>').join('')}</ul></div>`:''}
<div class="btn-row"><button class="btn btn-ghost" onclick="location.reload()">↻ Play again</button><a href="index.html" class="btn btn-primary" style="text-decoration:none;">← Back to HQ</a>
${ACT.next?`<a href="${ACT.next.href}" class="btn btn-success" style="text-decoration:none;">${ACT.next.label} →</a>`:''}</div></div>`;
}
function fireConfetti(){const c=['#64b5f6','#2ecc71','#f39c12','#e74c3c','#9b59b6','#1abc9c'];for(let i=0;i<40;i++){const d=document.createElement('div');d.className='confetti-piece';d.style.left=Math.random()*100+'%';d.style.top='-10px';d.style.background=c[i%c.length];d.style.width=d.style.height=(6+Math.random()*8)+'px';d.style.animationDelay=Math.random()*1.5+'s';d.style.animationDuration=(2+Math.random()*2)+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),5000);}}

renderWelcome();

</script>
