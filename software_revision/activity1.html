<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OS Control Room — Software HQ</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{min-height:100vh;background:linear-gradient(135deg,#0a1628 0%,#1a3a5c 40%,#0d2a44 100%);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;color:#e0e0e0;overflow-x:hidden;}
.container{max-width:850px;margin:0 auto;padding:20px 20px 60px;position:relative;}
a.back{display:inline-block;color:#64b5f6;text-decoration:none;font-size:0.9em;margin-bottom:18px;opacity:0.8;transition:opacity 0.3s;}
a.back:hover{opacity:1;}
.progress-bar{height:6px;background:rgba(255,255,255,0.08);border-radius:3px;margin-bottom:24px;overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,#64b5f6,#42a5f5);border-radius:3px;transition:width 0.5s ease;width:0%;}
.screen{display:none;animation:fadeIn 0.5s ease;}
.screen.active{display:block;}
@keyframes fadeIn{from{opacity:0;transform:translateY(15px);}to{opacity:1;transform:translateY(0);}}
@keyframes fadeInUp{from{opacity:0;transform:translateY(25px);}to{opacity:1;transform:translateY(0);}}
@keyframes pop{0%{transform:scale(0.8);opacity:0;}50%{transform:scale(1.08);}100%{transform:scale(1);opacity:1;}}
@keyframes shake{0%,100%{transform:translateX(0);}20%{transform:translateX(-8px);}40%{transform:translateX(8px);}60%{transform:translateX(-5px);}80%{transform:translateX(5px);}}
@keyframes bounceIn{0%{transform:scale(0);}50%{transform:scale(1.15);}100%{transform:scale(1);}}
@keyframes glow{0%,100%{box-shadow:0 0 5px rgba(100,181,246,0.3);}50%{box-shadow:0 0 20px rgba(100,181,246,0.6);}}
@keyframes confettiFall{0%{transform:translateY(-10px) rotate(0deg);opacity:1;}100%{transform:translateY(100vh) rotate(720deg);opacity:0;}}
@keyframes slideInLeft{from{opacity:0;transform:translateX(-40px);}to{opacity:1;transform:translateX(0);}}
@keyframes slideInRight{from{opacity:0;transform:translateX(40px);}to{opacity:1;transform:translateX(0);}}
h2{font-size:1.6em;font-weight:700;margin-bottom:6px;color:#90caf9;}
.phase-label{text-transform:uppercase;font-size:0.75em;letter-spacing:2px;color:#5588aa;margin-bottom:14px;}
/* Welcome */
.welcome{text-align:center;padding:40px 0;}
.welcome-icon{font-size:80px;animation:bounceIn 0.8s ease;}
.welcome h2{font-size:2em;background:linear-gradient(135deg,#64b5f6,#42a5f5);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin:16px 0 10px;}
.welcome p{color:#8899aa;max-width:500px;margin:0 auto 8px;line-height:1.6;}
.mission-box{background:rgba(100,181,246,0.08);border:1px solid rgba(100,181,246,0.2);border-radius:12px;padding:16px 20px;margin:20px auto;max-width:520px;text-align:left;font-size:0.92em;line-height:1.7;}
.mission-box strong{color:#64b5f6;}
.btn{display:inline-block;padding:12px 32px;border:none;border-radius:10px;font-size:1em;font-weight:700;cursor:pointer;transition:all 0.3s;color:#fff;}
.btn-primary{background:linear-gradient(135deg,#42a5f5,#1e88e5);}.btn-primary:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(66,165,245,0.4);}
.btn-success{background:linear-gradient(135deg,#2ecc71,#27ae60);}.btn-success:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(46,204,113,0.4);}
/* Teach cards */
.teach-card{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:14px;padding:24px;margin-bottom:18px;animation:fadeInUp 0.5s ease both;}
.teach-card h3{font-size:1.15em;color:#90caf9;margin-bottom:10px;display:flex;align-items:center;gap:8px;}
.teach-card p,.teach-card li{font-size:0.93em;color:#b0bec5;line-height:1.7;}
.teach-card ul{padding-left:20px;margin-top:6px;}
.highlight{background:rgba(100,181,246,0.1);border-left:3px solid #64b5f6;padding:10px 14px;border-radius:0 8px 8px 0;margin:12px 0;font-size:0.9em;}
.example-row{display:flex;gap:12px;margin:10px 0;flex-wrap:wrap;}
.example-item{background:rgba(255,255,255,0.06);border-radius:8px;padding:10px 16px;font-size:0.9em;flex:1;min-width:120px;text-align:center;}
.example-item .label{font-size:0.75em;color:#5588aa;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px;}
.example-item .val{font-weight:700;color:#e0e0e0;font-size:1.1em;}
/* Tower visual */
.tower{display:flex;flex-direction:column;align-items:center;gap:4px;margin:20px 0;}
.tower-block{display:flex;align-items:center;justify-content:center;border-radius:8px;padding:10px;font-weight:700;font-size:0.85em;color:#fff;transition:all 0.3s;cursor:default;text-align:center;}
.tower-arrow{color:#64b5f6;font-size:0.8em;margin:2px 0;}
/* Switch visual */
.switches{display:flex;gap:6px;justify-content:center;margin:16px 0;flex-wrap:wrap;}
.switch-box{width:48px;height:48px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:1.2em;cursor:pointer;transition:all 0.3s;}
.switch-box.on{background:#2ecc71;color:#fff;box-shadow:0 0 12px rgba(46,204,113,0.4);}
.switch-box.off{background:#333;color:#555;}
/* Test section */
.test-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:8px;}
.score-display{font-size:0.95em;color:#64b5f6;font-weight:600;}
.streak-badge{background:rgba(255,152,0,0.15);color:#ffb74d;padding:3px 12px;border-radius:12px;font-size:0.82em;font-weight:600;display:none;}
.streak-badge.show{display:inline-block;animation:pop 0.3s ease;}
/* Round 1: Classify */
.evidence-card{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:20px;margin-bottom:14px;text-align:center;animation:slideInLeft 0.4s ease;}
.evidence-card .item-text{font-size:1.3em;font-weight:700;margin-bottom:14px;min-height:50px;display:flex;align-items:center;justify-content:center;color:#fff;}
.classify-btns{display:flex;gap:12px;justify-content:center;}
.classify-btn{padding:10px 28px;border:2px solid rgba(255,255,255,0.15);border-radius:10px;background:rgba(255,255,255,0.04);color:#e0e0e0;font-size:0.95em;font-weight:600;cursor:pointer;transition:all 0.3s;}
.classify-btn:hover{border-color:rgba(100,181,246,0.5);background:rgba(100,181,246,0.1);}
.classify-btn:disabled{cursor:default;opacity:0.7;}
.classify-btn.correct{border-color:#2ecc71!important;background:rgba(46,204,113,0.15)!important;color:#2ecc71!important;}
.classify-btn.wrong{border-color:#e74c3c!important;background:rgba(231,76,60,0.15)!important;color:#e74c3c!important;animation:shake 0.4s ease;}
.feedback-box{padding:12px 16px;border-radius:8px;margin-top:10px;font-size:0.88em;line-height:1.5;animation:fadeIn 0.3s ease;}
.feedback-box.correct{background:rgba(46,204,113,0.1);border:1px solid rgba(46,204,113,0.25);color:#a5d6a7;}
.feedback-box.wrong{background:rgba(231,76,60,0.1);border:1px solid rgba(231,76,60,0.25);color:#ef9a9a;}
/* Round 2: Ordering & Conversions */
.order-zone{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;min-height:60px;padding:14px;background:rgba(255,255,255,0.03);border:2px dashed rgba(255,255,255,0.1);border-radius:12px;margin:14px 0;}
.drag-block{padding:10px 18px;border-radius:8px;font-weight:700;font-size:0.9em;cursor:grab;transition:all 0.3s;user-select:none;border:2px solid transparent;}
.drag-block:active{cursor:grabbing;}
.drag-block.placed{opacity:0.35;pointer-events:none;}
.conversion-q{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:12px;padding:20px;margin-bottom:12px;text-align:center;animation:fadeInUp 0.4s ease;}
.conversion-q .q-text{font-size:1.1em;font-weight:600;margin-bottom:14px;color:#e0e0e0;}
.conversion-q input{width:140px;padding:10px 14px;border:2px solid rgba(100,181,246,0.3);border-radius:8px;background:rgba(255,255,255,0.05);color:#fff;font-size:1.1em;font-weight:700;text-align:center;outline:none;transition:border-color 0.3s;}
.conversion-q input:focus{border-color:#64b5f6;}
.conversion-q input.correct{border-color:#2ecc71;background:rgba(46,204,113,0.1);}
.conversion-q input.wrong{border-color:#e74c3c;background:rgba(231,76,60,0.1);animation:shake 0.4s ease;}
.conversion-q .unit-label{font-size:0.9em;color:#64b5f6;margin-left:6px;}
/* Round 3: Match */
.match-container{display:flex;gap:20px;margin:14px 0;flex-wrap:wrap;}
.match-col{flex:1;min-width:200px;display:flex;flex-direction:column;gap:8px;}
.match-col h4{font-size:0.85em;color:#5588aa;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px;}
.match-term{padding:12px 16px;border-radius:8px;background:linear-gradient(135deg,#1a3a5c,#2a4a6c);color:#90caf9;font-weight:700;cursor:pointer;transition:all 0.3s;border:2px solid transparent;text-align:center;font-size:0.9em;}
.match-term.selected{border-color:#64b5f6;box-shadow:0 0 10px rgba(100,181,246,0.3);}
.match-term.matched{opacity:0.4;pointer-events:none;border-color:#2ecc71;}
.match-def{padding:12px 16px;border-radius:8px;background:rgba(255,255,255,0.04);border:2px dashed rgba(255,255,255,0.12);color:#b0bec5;cursor:pointer;transition:all 0.3s;font-size:0.88em;line-height:1.4;min-height:50px;}
.match-def.highlight-zone{border-color:#64b5f6;background:rgba(100,181,246,0.05);}
.match-def.matched{border-style:solid;border-color:#2ecc71;background:rgba(46,204,113,0.08);}
.match-def .match-label{font-size:0.78em;color:#2ecc71;font-weight:600;margin-top:4px;}
/* Results */
.results{text-align:center;padding:30px 0;}
.results-icon{font-size:80px;animation:bounceIn 0.6s ease;}
.results h2{margin:16px 0 6px;}
.results .score-big{font-size:2.2em;font-weight:900;color:#64b5f6;margin:10px 0;}
.results .rank{font-size:1.1em;color:#90caf9;margin-bottom:20px;}
.breakdown{background:rgba(255,255,255,0.04);border-radius:12px;padding:16px 20px;margin:20px auto;max-width:400px;text-align:left;}
.breakdown-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.06);font-size:0.9em;}
.breakdown-row:last-child{border:none;font-weight:700;color:#64b5f6;}
.revision-box{background:rgba(100,181,246,0.08);border:1px solid rgba(100,181,246,0.2);border-radius:12px;padding:16px 20px;margin:20px auto;max-width:500px;text-align:left;font-size:0.88em;line-height:1.7;}
.revision-box h4{color:#64b5f6;margin-bottom:8px;}
.btn-row{display:flex;gap:12px;justify-content:center;margin-top:20px;flex-wrap:wrap;}
.confetti-piece{position:fixed;width:10px;height:10px;border-radius:2px;animation:confettiFall 3s linear forwards;pointer-events:none;z-index:999;}
@media(max-width:600px){h2{font-size:1.3em;}.match-container{flex-direction:column;}.classify-btns{flex-direction:column;}.example-row{flex-direction:column;}.switches{gap:4px;}.switch-box{width:38px;height:38px;font-size:1em;}}
/* ---- Software HQ additions ---- */
.btn-ghost{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.18);}.btn-ghost:hover{background:rgba(255,255,255,0.14);}
.btn:disabled{opacity:0.45;cursor:default;transform:none!important;box-shadow:none!important;}
.teach-nav{display:flex;justify-content:space-between;gap:12px;margin-top:20px;}
.task{text-align:left;}
.task .item-text{font-size:1.08em;font-weight:600;line-height:1.5;justify-content:flex-start;min-height:0;}
.task .item-text.small{font-size:0.98em;}
.task .classify-btns{flex-wrap:wrap;}
.task-count{font-size:0.75em;color:#5588aa;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;}
.exam-badge{display:inline-block;background:rgba(255,193,7,0.12);border:1px solid rgba(255,193,7,0.35);color:#ffd54f;font-size:0.78em;font-weight:600;padding:3px 10px;border-radius:10px;margin-bottom:10px;}
.mcq-list{display:flex;flex-direction:column;gap:8px;margin:6px 0 10px;}
.mcq-btn{text-align:left;padding:11px 14px;border:2px solid rgba(255,255,255,0.13);border-radius:9px;background:rgba(255,255,255,0.04);color:#e0e0e0;font-size:0.93em;cursor:pointer;transition:all 0.2s;line-height:1.4;}
.mcq-btn:hover:not(:disabled){border-color:rgba(100,181,246,0.5);background:rgba(100,181,246,0.08);}
.mcq-btn:disabled{cursor:default;}
.mcq-btn.sel{border-color:#64b5f6;background:rgba(100,181,246,0.15);}
.mcq-btn.correct{border-color:#2ecc71;background:rgba(46,204,113,0.13);color:#a5d6a7;}
.mcq-btn.wrong{border-color:#e74c3c;background:rgba(231,76,60,0.13);color:#ef9a9a;animation:shake 0.4s ease;}
.mcq-btn.missed{border-color:#2ecc71;border-style:dashed;color:#a5d6a7;}
.pick-hint{font-size:0.82em;color:#8899aa;margin-bottom:4px;}
.feedback-box.part{background:rgba(255,152,0,0.1);border:1px solid rgba(255,152,0,0.3);color:#ffcc80;}
.next-btn{margin-top:14px;}
.word-bank{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 14px;}
.word-bank span{background:rgba(100,181,246,0.12);border:1px solid rgba(100,181,246,0.3);color:#90caf9;padding:4px 12px;border-radius:14px;font-size:0.85em;font-weight:600;}
.fill-text{font-size:0.98em;line-height:2.3;color:#cfd8dc;margin-bottom:14px;}
select.blank{background:#13283f;color:#fff;border:2px solid rgba(100,181,246,0.4);border-radius:6px;padding:3px 6px;font-size:0.92em;}
select.blank.correct{border-color:#2ecc71;color:#a5d6a7;}select.blank.wrong{border-color:#e74c3c;color:#ef9a9a;}
.fix{color:#a5d6a7;font-size:0.85em;font-weight:600;margin-left:4px;}
.order-pool{display:flex;flex-direction:column;gap:7px;margin:8px 0;}
.order-btn{text-align:left;padding:10px 14px;border:2px dashed rgba(255,255,255,0.18);border-radius:9px;background:rgba(255,255,255,0.04);color:#e0e0e0;cursor:pointer;font-size:0.9em;}
.order-btn:disabled{opacity:0.3;cursor:default;}
.order-answer{margin:10px 0 10px 22px;font-size:0.92em;line-height:1.6;color:#cfd8dc;}
.order-answer li{padding:3px 0;}.order-answer li.ok{color:#a5d6a7;}.order-answer li.bad{color:#ef9a9a;}
.btn-row-sm{display:flex;gap:10px;flex-wrap:wrap;}
.match-def .match-label{display:block;}
.src-note{font-size:0.72em;color:#5f7a92;margin-top:10px;}
.term{color:#90caf9;font-weight:700;}
.tip-box{background:rgba(255,193,7,0.08);border-left:3px solid #ffc107;padding:10px 14px;border-radius:0 8px 8px 0;margin:12px 0;font-size:0.88em;color:#ffe082;}
/* teaching visuals */
.disk{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;margin:12px 0;}
.disk div{aspect-ratio:1;border-radius:4px;background:rgba(255,255,255,0.07);display:flex;align-items:center;justify-content:center;font-size:0.7em;font-weight:700;color:#0a1628;transition:all 0.6s;}
.disk .fa{background:#64b5f6;}.disk .fb{background:#ffb74d;}.disk .fc{background:#81c784;}
.timeline{display:flex;gap:3px;margin:10px 0;flex-wrap:wrap;}
.timeline div{flex:1;min-width:34px;padding:8px 0;text-align:center;border-radius:5px;font-size:0.75em;font-weight:700;color:#0a1628;opacity:0.25;transition:opacity 0.3s;}
.timeline div.on{opacity:1;box-shadow:0 0 10px rgba(255,255,255,0.3);}
.mode-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px;}
.mode-grid>div{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);border-radius:10px;padding:12px;font-size:0.85em;color:#b0bec5;line-height:1.5;}
.mode-grid h4{color:#90caf9;margin-bottom:6px;font-size:1em;}
@media(max-width:600px){.mode-grid{grid-template-columns:1fr;}.disk{grid-template-columns:repeat(8,1fr);}}

/* ===== v2 game layer ===== */
.container.shake{animation:shake 0.4s ease;}
.round-heading{color:#90caf9;font-size:1.05em;margin:0 0 12px;text-align:center;}
.hud-row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;}
.hud{display:flex;align-items:center;gap:10px;text-transform:none;letter-spacing:0;font-size:1.25em;}
.hud-pts{color:#ffd54f;font-weight:800;}
.hud-combo{color:#ffb74d;font-weight:800;}
.hud-btn,.link-btn{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);border-radius:8px;color:#fff;cursor:pointer;font-size:0.95em;padding:2px 8px;}
.link-btn{font-size:1em;}
.btn-big{padding:16px 40px;font-size:1.15em;margin:18px 0 8px;animation:glow 2s infinite;}
/* level map */
.level-map{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:4px;margin:24px 0 6px;}
.node{width:150px;min-height:150px;background:rgba(255,255,255,0.05);border:2px solid rgba(100,181,246,0.35);border-radius:16px;color:#e0e0e0;cursor:pointer;padding:10px 8px;transition:transform 0.2s,border-color 0.2s;font-family:inherit;}
.node:hover:not(.locked){transform:translateY(-4px);border-color:#64b5f6;}
.node.current{border-color:#2ecc71;box-shadow:0 0 18px rgba(46,204,113,0.35);}
.node.locked{opacity:0.45;cursor:not-allowed;}
.node-icon{font-size:2em;}
.node-num{font-size:0.7em;text-transform:uppercase;letter-spacing:1.5px;color:#5588aa;margin-top:4px;}
.node-title{font-weight:800;font-size:0.92em;margin:2px 0;}
.node-type{font-size:0.72em;color:#8899aa;}
.node-stars,.row-stars{color:#ffd54f;letter-spacing:2px;}
.node-stars{margin-top:4px;font-size:1.05em;}
.node-path{width:18px;height:4px;background:rgba(100,181,246,0.35);border-radius:2px;}
.how-box{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;max-width:700px;margin:14px auto;text-align:left;}
.how-box div{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:10px;padding:10px 12px;font-size:0.83em;color:#b0bec5;line-height:1.45;}
.how-box b{display:block;color:#90caf9;margin-bottom:2px;}
.best-line{color:#8899aa;font-size:0.9em;margin:8px 0;}
.topics-line{font-size:0.8em;color:#667788;max-width:600px;margin:10px auto 0;}
/* sorter */
.sorter{user-select:none;}
.sky{position:relative;height:320px;border-radius:14px;overflow:hidden;background:linear-gradient(180deg,rgba(13,27,62,0.9),rgba(30,60,114,0.55));border:1px solid rgba(100,181,246,0.25);}
.sky::before{content:'';position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,0.18) 1px,transparent 1px);background-size:26px 26px;opacity:0.4;}
.sky-count{text-align:right;font-size:0.75em;color:#8899aa;margin:0 4px 4px;min-height:1.2em;}
.floor{position:absolute;left:0;right:0;bottom:0;height:6px;background:linear-gradient(90deg,#e74c3c,#ff9800,#e74c3c);opacity:0.7;}
.go{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:4em;font-weight:900;color:#ffd54f;animation:pop 0.5s ease;z-index:3;}
.card-fall{position:absolute;top:8px;left:50%;transform:translate(-50%,0);width:min(88%,560px);background:#f5f9ff;color:#0d1b3e;border-radius:12px;padding:14px 16px;font-weight:800;font-size:1.12em;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,0.45);z-index:2;line-height:1.35;}
.card-fall.danger{box-shadow:0 0 0 3px #ff7043,0 6px 22px rgba(255,112,67,0.5);}
.card-fall.caught{transition:opacity 0.35s,transform 0.35s;opacity:0;transform:translate(-50%,240px) scale(0.6)!important;}
.card-fall.crashed{background:#ffcdd2;}
.bins{display:grid;gap:10px;margin-top:12px;}
.bins-2{grid-template-columns:1fr 1fr;}.bins-3{grid-template-columns:1fr 1fr 1fr;}
.bin{position:relative;background:rgba(100,181,246,0.12);border:2px solid rgba(100,181,246,0.4);border-radius:12px;color:#fff;font-weight:800;font-size:1em;padding:16px 8px;cursor:pointer;font-family:inherit;transition:transform 0.1s,background 0.2s;}
.bin:hover{background:rgba(100,181,246,0.22);}
.bin:active{transform:scale(0.96);}
.bin .key{position:absolute;top:4px;left:8px;font-size:0.7em;color:#8899aa;}
.bin-good{background:rgba(46,204,113,0.35)!important;border-color:#2ecc71!important;}
.bin-bad{background:rgba(231,76,60,0.35)!important;border-color:#e74c3c!important;animation:shake 0.4s;}
.sky-panel{position:absolute;inset:10px;background:rgba(10,20,45,0.96);border-radius:12px;border:2px solid #e74c3c;padding:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;z-index:4;animation:pop 0.3s ease;overflow:auto;}
.sky-panel.over{border-color:#ff9800;}
.sp-head{font-weight:800;font-size:1.05em;color:#ef9a9a;}
.sky-panel.over .sp-head{color:#ffcc80;}
.sp-item{color:#fff;font-weight:700;}
.sp-answer{color:#a5d6a7;}
.sp-fb{color:#b0bec5;font-size:0.9em;max-width:520px;line-height:1.45;}
.big{font-size:2.6em;}
/* popups */
.popup{position:fixed;transform:translate(-50%,-50%);font-weight:900;font-size:1.5em;pointer-events:none;z-index:1000;animation:floatUp 1.1s ease forwards;text-shadow:0 2px 6px rgba(0,0,0,0.6);}
.popup.good{color:#69f0ae;}.popup.dmg{color:#ff5252;font-size:2em;}
@keyframes floatUp{0%{opacity:0;margin-top:10px;}15%{opacity:1;}100%{opacity:0;margin-top:-70px;}}
.flash-banner{position:fixed;top:30%;left:50%;transform:translate(-50%,-50%);background:linear-gradient(135deg,#ff9800,#f44336);color:#fff;font-weight:900;font-size:1.5em;padding:14px 28px;border-radius:14px;z-index:1001;pointer-events:none;animation:pop 0.35s ease,fadeOut 0.4s ease 0.9s forwards;box-shadow:0 8px 30px rgba(0,0,0,0.5);text-align:center;}
@keyframes fadeOut{to{opacity:0;}}
/* boss */
.boss-bar{display:flex;align-items:center;gap:14px;background:rgba(231,76,60,0.08);border:1px solid rgba(231,76,60,0.3);border-radius:14px;padding:10px 14px;}
.boss-av{font-size:3em;line-height:1;}
.boss-av.ouch{animation:ouch 0.45s ease;}
@keyframes ouch{0%{transform:scale(1);filter:none;}30%{transform:scale(0.85) rotate(-8deg);filter:brightness(2) saturate(0);}60%{transform:scale(1.08) rotate(5deg);}100%{transform:scale(1);filter:none;}}
.boss-info{flex:1;}
.boss-name{font-weight:800;color:#ef9a9a;}
.hp{height:14px;background:rgba(255,255,255,0.1);border-radius:7px;overflow:hidden;margin:5px 0 3px;}
.hp-fill{height:100%;width:100%;background:linear-gradient(90deg,#e74c3c,#ff9800);transition:width 0.5s ease;}
.hp-text{font-size:0.78em;color:#b0bec5;}
.boss-rule{font-size:0.82em;color:#8899aa;text-align:center;margin:8px 0 12px;}
.task-count{font-size:0.75em;color:#8899aa;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;}
.boss-end{text-align:center;padding:24px;}
.boss-end .sp-head{color:#90caf9;margin:8px 0 16px;font-size:1.2em;}
.boss-end.won .sp-head{color:#a5d6a7;}
/* level complete + results */
.level-done{text-align:center;padding:24px 0;}
.stars-big{font-size:3.4em;letter-spacing:8px;}
.stars-big span{color:rgba(255,255,255,0.15);display:inline-block;}
.stars-big span.on{color:#ffd54f;animation:starIn 0.45s ease both;text-shadow:0 0 18px rgba(255,213,79,0.6);}
@keyframes starIn{0%{transform:scale(0) rotate(-90deg);}70%{transform:scale(1.3);}100%{transform:scale(1);}}
.level-done h3{font-size:1.4em;margin:6px 0;}
.ld-marks{color:#90caf9;font-weight:700;}
.ld-pts{color:#ffd54f;font-weight:800;margin:6px 0 4px;}
.ld-tip{color:#8899aa;font-size:0.88em;margin:6px 0;}
.pts-big{font-size:1.6em;font-weight:900;color:#ffd54f;margin:6px 0;}
.new-best{display:inline-block;background:linear-gradient(135deg,#ff9800,#ffd54f);color:#1a1a2e;font-weight:900;padding:6px 16px;border-radius:20px;animation:bounceIn 0.6s ease;}
/* briefing overlay */
.overlay{position:fixed;inset:0;background:rgba(5,10,25,0.88);z-index:900;overflow:auto;padding:20px;}
.overlay-inner{max-width:760px;margin:0 auto;text-align:center;}
.overlay-inner .teach-card{text-align:left;}
.overlay-inner .teach-card button,.overlay-inner .btn-row-sm{display:none;}
@media(max-width:600px){
  .node{width:132px;min-height:136px;}
  .node-path{display:none;}
  .level-map{gap:8px;}
  .sky{height:290px;}
  .card-fall{font-size:1em;padding:12px;}
  .bins-3{grid-template-columns:1fr;}
  .bin{padding:12px 8px;}
  .bin .key{display:none;}
  .hud{font-size:1.05em;gap:6px;}
  .stars-big{font-size:2.6em;}
}
/* virus scanner mini-game (act4) */
.vs{position:relative;}
.vs.glitch{animation:glitch 0.25s steps(2) 6;}
@keyframes glitch{0%{filter:none;transform:translate(0);}50%{filter:hue-rotate(90deg) contrast(1.6);transform:translate(-4px,2px) skewX(-3deg);}100%{filter:invert(0.15);transform:translate(3px,-2px);}}
.vs-top{display:grid;grid-template-columns:1.4fr 1fr;gap:10px;margin-bottom:10px;}
.vs-db,.vs-perf{background:rgba(0,0,0,0.25);border:1px solid rgba(100,181,246,0.25);border-radius:12px;padding:10px 12px;}
.vs-h{font-size:0.72em;text-transform:uppercase;letter-spacing:1.5px;color:#5588aa;margin-bottom:6px;}
.vs-sig{display:flex;justify-content:space-between;align-items:center;padding:4px 8px;border-radius:8px;background:rgba(255,255,255,0.05);margin-bottom:4px;font-weight:700;}
.vs-sig b{font-size:1.35em;letter-spacing:2px;}
.vs-sig.new{animation:bounceIn 0.6s ease;background:rgba(46,204,113,0.2);border:1px solid #2ecc71;}
.meter{height:14px;background:rgba(255,255,255,0.1);border-radius:7px;overflow:hidden;}
.meter div{height:100%;background:#2ecc71;transition:width 0.6s ease;}
.meter div.slow{background:linear-gradient(90deg,#e74c3c,#ff9800);}
#vsPerfTxt{font-size:0.8em;color:#b0bec5;margin-top:4px;}
.vs-wave{font-size:0.75em;text-transform:uppercase;letter-spacing:1.5px;color:#8899aa;text-align:center;margin:4px 0 8px;min-height:1em;}
.vs-file{position:relative;background:#f5f9ff;color:#0d1b3e;border-radius:14px;padding:14px;text-align:center;animation:slideInRight 0.35s ease;overflow:hidden;}
.vs-name{font-weight:900;font-size:1.25em;}
.vs-where{font-size:0.82em;color:#455a64;margin:2px 0 10px;}
.vs-strip{display:flex;justify-content:center;gap:6px;}
.vs-strip span{font-size:2em;padding:4px 6px;border-radius:10px;border:2px solid transparent;transition:all 0.3s;}
.vs-strip span.hit{border-color:#e74c3c;background:rgba(231,76,60,0.2);animation:pop 0.4s ease;}
.vs-timer{height:6px;background:rgba(13,27,62,0.15);border-radius:3px;overflow:hidden;margin-top:12px;}
.vs-timer div{height:100%;width:100%;background:#42a5f5;transition:width 0.1s linear;}
.vs-timer div.low{background:#ff7043;}
.vs-stamp{position:absolute;top:10px;right:10px;transform:rotate(10deg);padding:3px 10px;border-radius:6px;font-weight:900;font-size:0.85em;letter-spacing:2px;opacity:0;}
.vs-stamp.show{opacity:1;animation:stampIn 0.3s ease;}
@keyframes stampIn{0%{transform:rotate(10deg) scale(2.2);opacity:0;}100%{transform:rotate(10deg) scale(1);opacity:1;}}
.vs-stamp.good{background:#2ecc71;color:#fff;}.vs-stamp.bad{background:#e74c3c;color:#fff;}
.vs-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;}
.vs-btns .bin:disabled{opacity:0.5;cursor:default;}
.vs-banner{text-align:center;background:rgba(255,255,255,0.05);border:1px solid rgba(100,181,246,0.3);border-radius:14px;padding:22px 16px;animation:pop 0.35s ease;}
.vs-bh{font-size:1.3em;font-weight:900;color:#90caf9;margin-bottom:6px;}
.vs-banner p{color:#b0bec5;margin-bottom:14px;line-height:1.5;}
.vs-log{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:12px;}
.vs-log span{font-size:0.85em;padding:3px 8px;border-radius:12px;background:rgba(255,255,255,0.06);}
.vs-log .ok{color:#a5d6a7;}.vs-log .no{color:#ef9a9a;}.vs-log .twist{color:#ffcc80;}
#vsMsg .next-btn{margin-top:10px;}
@media(max-width:600px){.vs-top{grid-template-columns:1fr;}.vs-strip span{font-size:1.6em;padding:3px;}.vs-btns .bin .key{display:none;}}
/* boss arena (engine v2.1: "needs a bit more life") */
.arena{position:sticky;top:0;z-index:20;height:176px;border-radius:16px;overflow:hidden;display:flex;align-items:center;justify-content:space-between;padding:0 7%;margin-bottom:8px;
  background:radial-gradient(ellipse at 78% 38%,rgba(231,76,60,0.28),transparent 55%),radial-gradient(ellipse at 18% 45%,rgba(64,196,255,0.18),transparent 50%),linear-gradient(180deg,#070b22 0%,#160e3a 58%,#2a0c38 100%);
  border:2px solid rgba(231,76,60,0.5);box-shadow:0 10px 30px rgba(0,0,0,0.5),inset 0 0 40px rgba(0,0,0,0.55);}
.arena-grid{position:absolute;left:-60%;right:-60%;bottom:-6px;height:58%;pointer-events:none;
  background-image:linear-gradient(rgba(255,64,129,0.4) 1px,transparent 1px),linear-gradient(90deg,rgba(255,64,129,0.4) 1px,transparent 1px);background-size:44px 44px;
  transform:perspective(200px) rotateX(58deg);transform-origin:bottom;animation:gridMove 1.4s linear infinite;-webkit-mask-image:linear-gradient(transparent,#000 75%);mask-image:linear-gradient(transparent,#000 75%);}
@keyframes gridMove{to{background-position:0 44px;}}
.arena.rage .arena-grid{animation-duration:0.5s;background-image:linear-gradient(rgba(255,23,68,0.6) 1px,transparent 1px),linear-gradient(90deg,rgba(255,23,68,0.6) 1px,transparent 1px);}
.fighter{position:relative;z-index:2;text-align:center;display:flex;flex-direction:column;align-items:center;}
.you-icon{font-size:2.7em;line-height:1.1;filter:drop-shadow(0 0 12px rgba(64,196,255,0.9));animation:bob 2.6s ease-in-out infinite;}
.you-name{font-weight:900;font-size:0.72em;letter-spacing:3px;color:#80d8ff;}
.shields{font-size:1.05em;margin-top:2px;letter-spacing:2px;}
.shields span{display:inline-block;transition:all 0.35s;}
.shields span.lost{opacity:0.18;filter:grayscale(1);transform:scale(0.75) rotate(-20deg);}
.arena-vs{position:relative;z-index:2;font-weight:900;font-size:1.5em;font-style:italic;letter-spacing:2px;color:rgba(255,255,255,0.18);}
.boss-sprite{font-size:4.4em;line-height:1;filter:drop-shadow(0 0 16px rgba(255,82,82,0.85));animation:bob 1.9s ease-in-out infinite,bossGlitch 5s steps(1) infinite;}
.boss-sprite.enter{animation:bossIn 0.75s cubic-bezier(.2,1.4,.4,1);}
.arena .boss-sprite.ouch,.arena.rage .boss-sprite.ouch,.you-icon.ouch{animation:ouch 0.45s ease;}
.arena .boss-sprite.dead{animation:die 0.9s ease-in forwards;}
.arena .boss-sprite.grave{animation:pop 0.4s ease;filter:grayscale(1) drop-shadow(0 0 8px #000);font-size:3.4em;}
.arena.rage .boss-sprite{animation:bob 0.75s ease-in-out infinite,bossGlitch 1.5s steps(1) infinite;filter:drop-shadow(0 0 22px #ff1744) saturate(1.7) hue-rotate(-25deg);}
@keyframes bob{0%,100%{transform:translateY(0);}50%{transform:translateY(-9px);}}
@keyframes bossGlitch{0%,90%,100%{translate:0 0;opacity:1;}91%{translate:-5px 0;opacity:0.55;}93%{translate:4px 1px;}95%{translate:-2px 0;opacity:0.85;}97%{translate:0 0;}}
@keyframes bossIn{0%{transform:translateX(140px) scale(0.3) rotate(25deg);opacity:0;}100%{transform:none;opacity:1;}}
@keyframes die{0%{transform:scale(1);}25%{transform:scale(1.35) rotate(-10deg);filter:brightness(3);}100%{transform:scale(0) rotate(540deg);opacity:0;}}
.arena .boss-name{font-weight:900;font-size:0.82em;color:#ffab91;margin-top:3px;text-shadow:0 2px 0 #000;}
.arena.rage .boss-name::after{content:' · ENRAGED';color:#ff1744;animation:blink 0.6s steps(1) infinite;}
@keyframes blink{50%{opacity:0.3;}}
.hp-segs{display:flex;gap:3px;width:190px;height:13px;margin:4px 0 2px;padding:2px;background:rgba(0,0,0,0.45);border:1px solid rgba(255,255,255,0.18);border-radius:4px;}
.hp-segs i{flex:1;border-radius:2px;background:linear-gradient(180deg,#ff8a65,#e53935);box-shadow:0 0 6px rgba(255,82,82,0.7);}
.arena.rage .hp-segs i:not(.gone){background:linear-gradient(180deg,#ff5252,#b71c1c);animation:blink 0.8s steps(1) infinite;}
.hp-segs i.gone{animation:segBreak 0.5s ease forwards;}
@keyframes segBreak{0%{background:#fff;transform:scale(1.6);box-shadow:0 0 14px #fff;}100%{background:rgba(255,255,255,0.07);box-shadow:none;transform:scale(1);}}
.arena .hp-text{font-size:0.72em;color:#cfd8dc;font-weight:700;}
.say{position:absolute;right:calc(100% + 4px);top:-4px;z-index:5;background:#fff;color:#1a1040;font-weight:800;font-size:0.78em;line-height:1.3;padding:7px 11px;border-radius:12px 12px 3px 12px;width:max-content;max-width:190px;opacity:0;pointer-events:none;box-shadow:0 4px 14px rgba(0,0,0,0.45);transform-origin:right bottom;}
.say.show{animation:say 2.8s ease forwards;}
@keyframes say{0%{opacity:0;transform:scale(0.4);}8%{opacity:1;transform:scale(1.08);}13%{transform:scale(1);}85%{opacity:1;}100%{opacity:0;}}
.bolt{position:absolute;left:0;top:0;width:44px;height:10px;margin:-5px 0 0 -22px;border-radius:6px;z-index:4;pointer-events:none;background:linear-gradient(90deg,transparent,#40c4ff 45%,#fff);box-shadow:0 0 12px #40c4ff,0 0 26px #40c4ff;}
.bolt.crit{height:15px;margin-top:-7px;background:linear-gradient(90deg,transparent,#ffab00 45%,#fff);box-shadow:0 0 14px #ffab00,0 0 34px #ff6d00;}
.orb{position:absolute;left:0;top:0;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;z-index:4;pointer-events:none;background:radial-gradient(circle,#fff 10%,#ff5252 45%,#b71c1c 75%);box-shadow:0 0 18px #ff1744,0 0 34px #ff1744;}
.spark{position:absolute;width:7px;height:7px;margin:-3px 0 0 -3px;border-radius:50%;z-index:4;pointer-events:none;box-shadow:0 0 8px currentColor;}
.dmg-num{position:absolute;z-index:6;transform:translate(-50%,-50%);font-weight:900;font-size:1.7em;color:#ff5252;pointer-events:none;text-shadow:0 2px 0 #000,0 0 12px rgba(255,82,82,0.9);animation:dmgUp 0.9s ease forwards;}
.dmg-num.crit{color:#ffd54f;font-size:2.1em;text-shadow:0 2px 0 #000,0 0 14px #ff6d00;}
@keyframes dmgUp{0%{opacity:0;margin-top:0;transform:translate(-50%,-50%) scale(0.4);}20%{opacity:1;transform:translate(-50%,-50%) scale(1.35);}100%{opacity:0;margin-top:-55px;transform:translate(-50%,-50%) scale(1);}}
.arena.jolt{animation:jolt 0.3s ease;}
@keyframes jolt{30%{transform:translate(3px,-2px);}60%{transform:translate(-3px,2px);}}
.arena.hurt::after{content:'';position:absolute;inset:0;z-index:5;pointer-events:none;box-shadow:inset 0 0 70px 24px rgba(255,23,68,0.75);animation:fadeOut 0.5s ease forwards;}
.arena.rage{border-color:#ff1744;animation:ragePulse 1.1s ease-in-out infinite;}
@keyframes ragePulse{50%{box-shadow:0 0 34px rgba(255,23,68,0.6),inset 0 0 60px rgba(255,23,68,0.3);}}
.arena.ko{border-color:#ffd54f;box-shadow:0 0 30px rgba(255,213,79,0.4);}
.mus-btn{position:absolute;top:7px;left:9px;z-index:6;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.18);border-radius:8px;font-size:0.8em;padding:2px 7px;cursor:pointer;color:#fff;}
.mus-btn.off{opacity:0.35;text-decoration:line-through;}
.charge{margin:0 2px 4px;transition:opacity 0.4s;}
.charge.done{opacity:0;}
.charge-label{font-size:0.68em;font-weight:800;color:#ffd54f;text-align:left;letter-spacing:0.5px;margin-bottom:3px;}
.charge-bar{height:7px;border-radius:4px;background:rgba(255,255,255,0.08);overflow:hidden;}
.charge-fill{height:100%;width:100%;background:linear-gradient(90deg,#ff6d00,#ffd54f);box-shadow:0 0 10px #ffab00;}
.shield-bonus{color:#80d8ff;font-weight:700;margin:-6px 0 16px;}
/* juicier answer buttons */
.mcq-btn:hover:not(:disabled),.classify-btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,0.3);}
.mcq-btn:active:not(:disabled),.classify-btn:active:not(:disabled),.btn:active{transform:scale(0.96);}
@media(max-width:600px){.arena{height:146px;padding:0 4%;}.arena-vs{display:none;}.boss-sprite{font-size:3.3em;}.you-icon{font-size:2.1em;}.hp-segs{width:124px;}.say{max-width:100px;font-size:0.66em;padding:5px 8px;}}
@media(prefers-reduced-motion:reduce){.arena-grid,.boss-sprite,.you-icon,.arena.rage,.arena.jolt,.arena.rage .hp-segs i{animation:none!important;}}

/* ---------- sorter + scanner life: robot host, neon sky, laser floor, fly-to-bin, scan beam, virus bugs ---------- */
.sky-head,.vs-head{position:relative;z-index:6;display:flex;align-items:center;gap:10px;min-height:40px;margin:0 2px 6px;}
.sky-head .mus-btn,.vs-head .mus-btn{position:static;}
.sky-head .sky-count{margin:0 0 0 auto;}
.streak{font-size:0.8em;font-weight:800;color:#ffab40;}
.mascot{position:relative;}
.mascot-bot{display:inline-block;font-size:1.9em;line-height:1;filter:drop-shadow(0 0 8px rgba(100,181,246,0.6));animation:botBob 2.4s ease-in-out infinite;}
@keyframes botBob{50%{transform:translateY(-4px);}}
.mascot-bot.cheer{animation:botCheer 0.6s ease;}
@keyframes botCheer{30%{transform:translateY(-10px) rotate(-12deg) scale(1.2);}60%{transform:translateY(0) rotate(10deg);}}
.mascot-bot.sad{animation:botSad 0.6s ease;filter:grayscale(0.6);}
@keyframes botSad{25%{transform:translateX(-4px) rotate(-8deg);}50%{transform:translateX(4px) rotate(8deg);}75%{transform:translateX(-2px);}}
.sky{background:radial-gradient(ellipse at 50% 120%,rgba(124,77,255,0.35),transparent 60%),linear-gradient(180deg,#070b1f,#141a4a 70%,#2a1450);border-color:rgba(124,77,255,0.35);transition:box-shadow 0.3s,border-color 0.3s;}
.sky .arena-grid{height:45%;opacity:0.7;}
.floor{height:8px;z-index:1;background:linear-gradient(90deg,#ff1744,#ff9100,#ff1744);opacity:0.85;box-shadow:0 0 14px 3px rgba(255,23,68,0.55);}
.sky.alarm{border-color:#ff5252;}
.sky.alarm .floor{animation:laser 0.35s ease-in-out infinite alternate;}
@keyframes laser{to{opacity:1;height:12px;box-shadow:0 0 26px 8px rgba(255,23,68,0.9);}}
.sky.fire{border-color:#ff9100;box-shadow:0 0 22px rgba(255,145,0,0.45),inset 0 0 40px rgba(255,145,0,0.18);}
.sky.fire .arena-grid{filter:hue-rotate(150deg) saturate(1.6);}
.sky.hurt::after{content:'';position:absolute;inset:0;z-index:5;pointer-events:none;box-shadow:inset 0 0 70px 24px rgba(255,23,68,0.75);animation:fadeOut 0.5s ease forwards;}
.card-fall{box-shadow:0 6px 20px rgba(0,0,0,0.45),0 0 18px rgba(100,181,246,0.35);}
.card-fall.danger{box-shadow:0 0 0 3px #ff7043,0 0 26px rgba(255,112,67,0.75);}
.card-fall.flyer{pointer-events:none;}
.go{text-shadow:0 0 24px rgba(255,213,79,0.8);animation:goZoom 0.6s ease;}
.go.go-go{color:#69f0ae;font-size:5em;text-shadow:0 0 30px rgba(105,240,174,0.9);}
@keyframes goZoom{0%{transform:scale(2.6);opacity:0;}40%{transform:scale(0.9);opacity:1;}100%{transform:scale(1);}}
.bin.gulp{animation:gulp 0.42s ease;}
@keyframes gulp{30%{transform:scale(1.1,0.86);}60%{transform:scale(0.95,1.06);}}
.vs{overflow:hidden;border-radius:16px;padding:10px 12px 14px;background:radial-gradient(ellipse at 50% 115%,rgba(0,230,118,0.18),transparent 60%),linear-gradient(180deg,#06131c,#0b2233 70%,#0d2b2a);border:1px solid rgba(0,230,118,0.25);}
.vs>*{position:relative;z-index:1;}
.vs>.vs-head{z-index:6;}
.vs>.arena-grid{position:absolute;z-index:0;height:40%;opacity:0.45;filter:hue-rotate(-110deg);}
.vs-title{margin-right:auto;font-size:0.72em;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:#69f0ae;}
.vs-file{box-shadow:0 0 22px rgba(0,230,118,0.25);}
.vs-file.thud{animation:thud 0.35s ease;}
@keyframes thud{30%{transform:scale(0.97) rotate(-0.6deg);}60%{transform:scale(1.01);}}

/* Activity 1 — OS Control Room. Spec S1. Sources: TB p9; PP 2018 Q5(b), 2023 Q5(b), 2024 Q10, 2025 Q4. */
function playSlices(){
  const cells=[...document.querySelectorAll('#slices div')];let i=0;
  cells.forEach(c=>c.classList.remove('on'));
  const t=setInterval(()=>{if(i>0)cells[i-1].classList.remove('on');if(i>=cells.length){clearInterval(t);cells.forEach(c=>c.classList.add('on'));return;}cells[i].classList.add('on');i++;},350);
}
const ACT={

intro:'Welcome to the Control Room. Every computer needs software in charge of it. Your mission: tell application software from system software, and find out how the operating system shares out memory, storage and processing time.',

teach:[
{html:`<div class="teach-card"><h3>💾 Two types of software</h3>
<p><span class="term">Application software</span> enables the computer to do a particular task, such as word processing. These are programs designed for an end user to do a particular task, such as word-processing and spreadsheet programs.</p>
<p style="margin-top:10px;"><span class="term">System software</span> is the interface between computer hardware and user application programs. It enables the computer to operate its hardware and applications software.</p>
<div class="highlight">System software includes the <b>operating system</b> and <b>utility programs</b>.</div>
<div class="example-row"><div class="example-item"><b>Application</b><br>word processing<br>spreadsheet programs</div><div class="example-item"><b>System</b><br>operating system<br>utility programs</div></div></div>`},
{html:`<div class="teach-card"><h3>⚙️ The operating system</h3>
<p>The operating system is <b>a computer program that provides the instructions that enable the computer hardware to work</b>.</p>
<div class="highlight">Operating systems are <b>software</b> that <b>manage</b> computer hardware and software <b>resources</b>. An operating system provides the user with a working <b>interface</b>.</div>
<p>A <span class="term">Graphical User Interface (GUI)</span> is used to interact with a computer through <b>icons and menus</b>.</p>
<p style="margin-top:10px;"><span class="term">Booting</span> (booting up) is the name given to the sequence of loading an operating system into RAM when a computer is turned on.</p>
<div class="tip-box">Exam tip: write "booting" or "booting up". The mark scheme does not accept just "boot".</div></div>`},
{html:`<div class="teach-card"><h3>🧠 Function 1: Allocating memory</h3>
<p>The operating system organises the use of main memory between programs and data files as they are transferred to and from the hard disc.</p>
<p style="margin-top:10px;">When a user wants to open data held on the hard disk, the memory is allocated in three steps:</p>
<ol style="padding-left:22px;margin-top:6px;"><li>A free space in memory (RAM) is located.</li><li>The free space is allocated to the data/program.</li><li>The program/data is transferred back out of main memory when it is no longer required.</li></ol>
<div class="tip-box">This came up as a 3-mark question in 2018. Learn the three steps in order.</div></div>`},
{html:`<div class="teach-card"><h3>🗄️ Function 2: Storage</h3>
<p>The operating system manages the storage of data and files on external devices, such as a hard drive.</p></div>
<div class="teach-card"><h3>⏱️ Function 3: Processing time</h3>
<p>The operating system allocates processing time between the programs that are currently in use. It divides the time into a number of <b>time slices</b>. Depending on the <b>priority</b> of the tasks to be processed, each task is allocated a number of these time slices.</p>
<p style="margin-top:8px;font-size:0.85em;color:#8899aa;">In this example, each program is allocated a number of time slices depending on its priority.</p>
<div class="timeline" id="slices">${'AABACAABAC'.split('').map(p=>`<div style="background:${p==='A'?'#64b5f6':p==='B'?'#ffb74d':'#81c784'}">${p}</div>`).join('')}</div>
<button class="btn btn-ghost" style="padding:8px 18px;font-size:0.85em;" onclick="playSlices()">▶ Play the time slices</button></div>`,init:playSlices},
{html:`<div class="teach-card"><h3>🎯 Exam focus</h3>
<p>Exam questions ask you to list the <b>resources</b> the operating system manages. These answers have got the marks:</p>
<ul><li>Memory (RAM) allocation</li><li>Storage</li><li>Processing time (task scheduling)</li><li>Peripherals (2023 mark scheme)</li></ul>
<div class="tip-box">Read the question carefully. 2018 asked: "Apart from allocating memory, list two other resources…". There, "memory" does not get a mark.</div>
<p>The textbook also asks you to <b>identify three functions of system software</b>: allocating memory, storage and processing time.</p></div>`}
],

<script>
/* Software HQ engine v2 — game levels (see S1 Software/GAME_DESIGN.md).
   ACT = {title, icon, intro, topics, ranks:[top,high,mid,low], teach:[{html,init?}], next,
          rounds:[{title, heading, teachAt:[teach indices shown before it], mode?:'sorter'|'boss'|'sim', sim?, boss?:{icon,name}, choices?, keepOrder?, tip, tasks}]}
   A round of classify tasks with shared choices plays as a SORTER (falling cards); any other round plays as a BOSS fight; mode:'sim' calls window['sim_'+r.sim](area, finish).
   Marks (and the rank) come only from sorter and boss levels. Every task carries src (see SOURCE_MAP.md). */
let lvl=0,taskIdx=0,teachStep=0,S=null,B=null,briefOpen=false;
const G={points:0,combo:0,muted:false,lp:[]};
const marks=[],maxMarks=[],stars=[];
function shuffle(a){const r=[...a];for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];}return r;}
function $(id){return document.getElementById(id);}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));$(id).classList.add('active');window.scrollTo({top:0,behavior:'smooth'});}
function setProgress(p){$('progressFill').style.width=p+'%';}
function norm(s){return String(s).trim().toLowerCase();}
const LEVELS=ACT.rounds.map(r=>({...r,
  mode:r.mode||(r.choices&&r.tasks.every(t=>t.type==='classify')?'sorter':'boss'),
  brief:(r.teachAt||[]).map(i=>ACT.teach[i])}));
const MODE_ICON={sorter:'🎮',boss:'👾',sim:'🕹️'};
const MODE_NAME={sorter:'Sorting game',boss:'Boss battle',sim:'Mini-game'};

/* ---------- saved progress (this browser only) ---------- */
const KEY='swhq2_'+ACT.title;
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{};}catch(e){return {};}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(STORE));}catch(e){}}
const STORE=Object.assign({best:0,stars:[],muted:false},load());
G.muted=!!STORE.muted;

/* ---------- sound ---------- */
let AC=null;
const SFX={good:[[660,.07],[880,.1]],combo:[[660,.06],[880,.06],[1175,.12]],bad:[[160,.25,'sawtooth']],hit:[[587,.05],[880,.05],[1319,.14]],
  level:[[523,.1],[659,.1],[784,.1],[1047,.3]],over:[[392,.16],[330,.16],[262,.35]],tick:[[880,.03]],zap:[[740,.03],[1480,.05]],alarm:[[1175,.05],[880,.05],[1175,.06]],scan:[[1047,.025],[1319,.025],[1568,.025],[2093,.04]],win:[[523,.08],[784,.08],[1047,.08],[1568,.35]]};
function sfx(k){
  if(G.muted)return;
  try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();let t=AC.currentTime;
    SFX[k].forEach(([f,d,w])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=w||'triangle';o.frequency.value=f;
      g.gain.setValueAtTime(0.1,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+0.03);t+=d;});}catch(e){}
}
function toggleMute(){G.muted=!G.muted;STORE.muted=G.muted;save();document.querySelectorAll('.mute-btn').forEach(b=>b.textContent=G.muted?'🔇':'🔊');if(G.muted)stopMusic();else if(musicWanted())startMusic();}

/* ---------- points, combo, popups ---------- */
function mult(){return Math.min(4,1+Math.floor(G.combo/3));}
function addPoints(n){G.points+=n;G.lp[lvl]=(G.lp[lvl]||0)+n;hud();}
function hit(){const before=mult();G.combo++;if(mult()>before){sfx('combo');flash(`🔥 Combo ×${mult()}!`);}else sfx('good');}
function miss(){G.combo=0;sfx('bad');hud();}
function popup(text,el,cls){
  const box=(el||$('taskArea')).getBoundingClientRect(),p=document.createElement('div');
  p.className='popup '+(cls||'');p.textContent=text;p.style.left=(box.left+box.width/2)+'px';p.style.top=(box.top+Math.min(box.height/2,120))+'px';
  document.body.appendChild(p);setTimeout(()=>p.remove(),1100);
}
function flash(text){const f=document.createElement('div');f.className='flash-banner';f.textContent=text;document.body.appendChild(f);setTimeout(()=>f.remove(),1300);}
function shakeScreen(){const c=document.querySelector('.container');c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake');}
function starStr(n){return n==null?'☆☆☆':'★'.repeat(n)+'☆'.repeat(3-n);}
function hud(){
  if(!$('hudPts'))return;
  $('hudPts').textContent=G.points.toLocaleString();
  $('hudCombo').textContent=mult()>1?`🔥 ×${mult()}`:'';
  $('hudLives').textContent=S&&S.active?'❤️'.repeat(S.lives)+'🖤'.repeat(3-S.lives):'';

const SAY={

function cheer(cls){const m=$('mascotBot');if(m)retrigger(m,cls,600);}
function musicWanted(){return !!(($('arena')&&B&&B.left>0)||(S&&S.active)||(window.simMusicOn&&window.simMusicOn()));}

function flyFixed(el,to,ms,done){ // fly a fixed-position copy of el into the centre of element `to`

function playSorter(L){
  const tasks=shuffle(L.tasks);

<div class="sky" id="sky"><div class="arena-grid"></div><div class="floor"></div></div>
<div class="bins bins-${L.choices.length}">${L.choices.map((c,n)=>`<button class="bin" data-k="${c.key}"><span class="key">${n+1}</span>${c.label}</button>`).join('')}</div></div>`;

function countdown(n){
  if(!S||!S.active)return;
  const sky=$('sky');if(!sky)return;
  sky.querySelector('.go')?.remove();
  sky.insertAdjacentHTML('beforeend',`<div class="go${n?'':' go-go'}">${n||'GO!'}</div>`);sfx(n?'tick':'zap');
  if(n>0)setTimeout(()=>countdown(n-1),650);else{sayFrom(SAY.start);setTimeout(()=>{sky.querySelector('.go')?.remove();spawnCard();},500);}
}
function spawnCard(){
  if(!S||!S.active)return;
  const t=S.tasks[S.i],sky=$('sky');
  $('skyCount').textContent=`Card ${S.i+1} of ${S.tasks.length}`;
  sky.insertAdjacentHTML('beforeend',`<div class="card-fall" id="fallCard">${t.text}</div>`);
  const words=t.text.split(/\s+/).length;
  S.card=$('fallCard');S.dur=Math.max(6,4.5+words*0.5)*S.speed*1000;S.t=0;S.last=performance.now();S.paused=briefOpen;S.wait=false;S.alarm=false;
  S.raf=requestAnimationFrame(fall);
}
function fall(now){
  if(!S||!S.active||!S.card)return;

  S.last=now;
  const sky=$('sky'),maxY=sky.clientHeight-S.card.offsetHeight-14,f=Math.min(1,S.t/S.dur);

function streakDraw(){

function stopSorter(){if(S){S.active=false;cancelAnimationFrame(S.raf);}S=null;stopMusic();}
function sorterAnswer(k,btn){
  if(!S||!S.active||S.wait||S.paused||!S.card)return;

<div class="sp-item">“${t.text}”</div><div class="sp-answer">belongs in <b>${right.label}</b></div><div class="sp-fb">${t.feedback||''}</div>
<button class="btn btn-primary" id="goBtn">${S.lives?'Got it ▶':'Continue ▶'}</button></div>`);
    $('goBtn').focus();
    $('goBtn').onclick=()=>{document.querySelector('.sky-panel')?.remove();card.remove();if(S.lives<=0)overload();else nextCard();};

function nextCard(){S.i++;S.card=null;if(S.i>=S.tasks.length){S.active=false;stopMusic();say('All sorted! 🎉');cheer('cheer');setTimeout(levelComplete,700);}else spawnCard();}

<div class="sp-fb">You sorted ${marks[lvl]} of ${S.tasks.length} cards. Try the level again — the cards come in a new order.</div>
<div class="btn-row-sm"><button class="btn btn-success" id="goBtn" onclick="playLevel()">↻ Retry level</button><button class="btn btn-ghost" onclick="levelComplete()">Carry on →</button></div></div>`);

document.addEventListener('keydown',e=>{

/* ---------- BOSS: exam questions in an arena ----------
   Every mark fires a bolt at the boss; the HP bar is exactly the marks still needed (hp = 70% of the marks), so it never lies.
   A 0-mark answer lets the boss fire back and knock off a shield (shields only add end-of-battle points).
   Full marks before the charge bar empties = a critical hit: double POINTS, never extra marks.
   Taunts are personality only: they never state a fact. */
const RM=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
const TAUNT={
  start:['So you think you can pass the exam?',"Let's see what you really know.","I've beaten better revisers than you!","I'm not going easy on you."],
  hurt:['Argh! Lucky guess!','That one stung!','Impossible!','How did you know that?!','Grr… not bad.'],
  gloat:['Ha! Check the mark scheme!','Too easy!','Missed me!','Is that your final answer? Ha!'],
  rage:["Now I'm ANGRY!",'Enough! Full power!'],
  ko:['Nooo… shutting… down…']
};
function taunt(k){
  const el=$('bossSay');if(!el||!B)return;
  const pool=(B.boss.taunts&&B.boss.taunts[k])||TAUNT[k];
  el.textContent=pool[Math.floor(Math.random()*pool.length)];
  el.classList.remove('show');void el.offsetWidth;el.classList.add('show');
}
/* quiet looping bass while a boss is alive; off when muted or switched off with 🎵 */
let MUS=null;
const BASS=[110,110,131,110,165,110,147,131];
function startMusic(){
  stopMusic();if(G.muted||STORE.music===false)return;
  try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
  MUS={i:0};
  const step=()=>{
    if(!MUS)return;
    try{const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type='square';o.frequency.value=BASS[MUS.i%8]*(MUS.i%16>=8?1.19:1);
      g.gain.setValueAtTime(0.022,t);g.gain.exponentialRampToValueAtTime(0.0008,t+0.15);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+0.17);}catch(e){}
    MUS.i++;MUS.t=setTimeout(step,($('arena')&&B&&B.rage)||(S&&S.active&&mult()>=3)?165:225);
  };
  step();
}
function stopMusic(){if(MUS){clearTimeout(MUS.t);MUS=null;}}
function toggleMusic(){
  STORE.music=STORE.music===false;save();
  const b=$('musBtn');if(b)b.classList.toggle('off',STORE.music===false);
  if(STORE.music===false)stopMusic();else if(musicWanted())startMusic();
}
function boom(){
  if(G.muted)return;
  try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();
    const n=Math.floor(AC.sampleRate*0.7),buf=AC.createBuffer(1,n,AC.sampleRate),d=buf.getChannelData(0);
    for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2.2);
    const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
    f.type='lowpass';f.frequency.value=700;g.gain.value=0.35;s.buffer=buf;s.connect(f);f.connect(g);g.connect(AC.destination);s.start();}catch(e){}
}
function sparks(host,x,y,col,n,big){
  if(RM)return;
  for(let i=0;i<n;i++){
    const s=document.createElement('i');s.className='spark';s.style.background=col;s.style.color=col;s.style.left=x+'px';s.style.top=y+'px';host.appendChild(s);
    const a=Math.random()*Math.PI*2,r=(big?50:22)+Math.random()*(big?110:40);
    s.animate([{transform:'translate(0,0) scale(1)',opacity:1},{transform:`translate(${Math.cos(a)*r}px,${Math.sin(a)*r}px) scale(0)`,opacity:0}],
      {duration:450+Math.random()*350,easing:'cubic-bezier(.2,.8,.3,1)'}).onfinish=()=>s.remove();
  }
}
function centre(el,host){const a=host.getBoundingClientRect(),r=el.getBoundingClientRect();return [r.left-a.left+r.width/2,r.top-a.top+r.height/2];}
function retrigger(el,cls,ms){el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls);clearTimeout(el['_'+cls]);el['_'+cls]=setTimeout(()=>el.classList.remove(cls),ms);}
function shoot(cls,from,to,ms,land){
  const ar=$('arena');if(!ar){land();return;}
  if(RM){land();return;}
  const [x0,y0]=from,[x1,y1]=to,ang=Math.atan2(y1-y0,x1-x0);

  b.animate([{transform:`translate(${x0}px,${y0}px) rotate(${ang}rad) scale(.5)`},{transform:`translate(${x1}px,${y1}px) rotate(${ang}rad) scale(1.15)`}],{duration:ms,easing:'ease-in'})
    .onfinish=()=>{b.remove();land();};
}

function playBoss(L){
  const tasks=L.keepOrder?L.tasks:shuffle(L.tasks);
  const max=tasks.reduce((a,t)=>a+taskMax(t),0),hp=Math.ceil(max*0.7);

  marks[lvl]=0;maxMarks[lvl]=max;
  B={L,tasks,max,hp,left:hp,disp:hp,boss,shields:3,rage:false,T:0,t0:0};taskIdx=0;
  $('taskArea').innerHTML=`<div class="arena" id="arena"><div class="arena-grid"></div>
${musBtn()}
<div class="fighter you"><div class="you-icon" id="you">💻</div><div class="you-name">YOU</div><div class="shields" id="shields">${'<span>🛡️</span>'.repeat(3)}</div></div>
<div class="arena-vs">VS</div>
<div class="fighter foe"><div class="say" id="bossSay" aria-live="polite"></div><div class="boss-sprite enter" id="bossAv">${boss.icon}</div>
<div class="boss-name">${boss.name}</div><div class="hp-segs" id="hpSegs">${'<i></i>'.repeat(hp)}</div><div class="hp-text" id="hpText"></div></div></div>
<div class="charge" id="charge"><div class="charge-label">⚡ CRITICAL CHARGE · full marks before it runs out = double points</div><div class="charge-bar"><div class="charge-fill" id="chargeFill"></div></div></div>
<div class="boss-rule" id="bossRule">Every mark you score fires a bolt. Score <b>${hp}</b> of the ${max} marks to defeat the boss.</div><div id="bossTask"></div>`;
  setTimeout(()=>{const a=$('bossAv');if(a)a.classList.remove('enter');},800);

function bossHp(){

}
function showTask(){
  if(taskIdx>=B.tasks.length){bossEnd();return;}
  const t=B.tasks[taskIdx];
  const ref=t.ref?`<div class="exam-badge">📝 Real exam question · CCEA ${t.ref}</div>`:'';
  const m=taskMax(t);
  $('bossTask').innerHTML=`<div class="evidence-card task" data-src="${t.src}"><div class="task-count">Question ${taskIdx+1} of ${B.tasks.length}${t.ref?'':` · ${m} mark${m>1?'s':''}`}</div>${ref}<div id="taskBody"></div><div id="taskFeedback"></div><div id="taskNext"></div></div>`;
  ({classify:renderClassify,mcq:renderMcq,match:renderMatch,fill:renderFill,order:renderOrder,pick:renderPick})[t.type](t,B.L);
  chargeStart(m);
}
function chargeStart(m){
  const f=$('chargeFill');if(!f)return;
  B.T=(15+10*m)*1000;B.t0=performance.now();
  f.style.transition='none';f.style.width='100%';void f.offsetWidth;
  f.style.transition=`width ${B.T/1000}s linear`;f.style.width='0%';

function chargeStop(){
  const f=$('chargeFill');if(!f)return false;
  f.style.width=getComputedStyle(f).width;f.style.transition='none';
  return performance.now()-B.t0<B.T;
}
function done(t,got){
  const max=taskMax(t),fast=chargeStop(),crit=got===max&&fast;
  marks[lvl]+=got;
  const dmg=Math.min(got,B.left);B.left-=dmg;
  if(got>0)fireBolts(got,dmg,crit);else counter();
  if(got===max)G.combo++;else G.combo=0;
  const pts=got*150*mult()*(crit?2:1);if(pts)addPoints(pts);hud();
  if(crit)setTimeout(()=>{sfx('combo');popup('⚡ CRITICAL! ×2 points',$('charge'),'good');},250);
  const cls=got===max?'correct':(got>0?'part':'wrong');
  const head=got===max?'✓ Correct!':(got>0?`Partly right — ${got}/${max}.`:'✗ Not quite.');
  $('taskFeedback').innerHTML=`<div class="feedback-box ${cls}">${head} ${t.feedback||''}</div>`;
  const last=taskIdx===B.tasks.length-1;
  $('taskNext').innerHTML=`<button class="btn btn-primary next-btn" onclick="taskIdx++;showTask()">${last?'Finish the battle →':'Next question →'}</button>`;
  $('taskNext').querySelector('button').focus({preventScroll:true});
}
function fireBolts(n,dmg,crit){
  const ar=$('arena');if(!ar)return;
  for(let k=0;k<n;k++)setTimeout(()=>{
    if(!$('arena'))return;
    const from=centre($('you'),ar),to=centre($('bossAv'),ar);to[1]+=(k%2?-14:14)*(n>1?1:0);
    sfx('zap');
    shoot('bolt'+(crit?' crit':''),from,to,320,()=>impact(to,k<dmg,crit,k===n-1));
  },k*180);
}
function impact([x,y],counts,crit,lastBolt){
  const ar=$('arena');if(!ar||!B)return;
  retrigger($('bossAv'),'ouch',450);retrigger(ar,'jolt',300);
  sparks(ar,x,y,crit?'#ffd54f':'#80d8ff',crit?16:10);
  sfx(lastBolt?'hit':'tick');
  const d=document.createElement('div');d.className='dmg-num'+(crit?' crit':'');d.textContent=crit?'CRIT!':'−1';
  d.style.left=x+'px';d.style.top=(y-20)+'px';ar.appendChild(d);setTimeout(()=>d.remove(),900);
  if(counts){
    B.disp--;bossHp();
    if(B.disp===0){ko();return;}
    if(!B.rage&&B.disp<=Math.floor(B.hp/2)){B.rage=true;ar.classList.add('rage');taunt('rage');return;}
  }
  if(lastBolt&&B.disp>0)taunt('hurt');
}
function counter(){
  const ar=$('arena');
  if(!ar||B.disp===0){sfx('bad');shakeScreen();return;}
  taunt('gloat');
  setTimeout(()=>{
    if(!$('arena'))return;
    sfx('bad');
    shoot('orb',centre($('bossAv'),ar),centre($('you'),ar),380,()=>{
      if(!$('arena'))return;
      B.shields=Math.max(0,B.shields-1);
      const sh=$('shields').children;for(let i=0;i<3;i++)sh[i].classList.toggle('lost',i>=B.shields);
      retrigger($('you'),'ouch',450);retrigger(ar,'hurt',500);shakeScreen();
      sparks(ar,...centre($('you'),ar),'#ff5252',12);
    });
  },350);
}
function ko(){
  const ar=$('arena'),av=$('bossAv');
  stopMusic();taunt('ko');ar.classList.remove('rage');
  setTimeout(()=>{
    if(!$('arena'))return;
    boom();sparks(ar,...centre(av,ar),'#ff9800',22,true);sparks(ar,...centre(av,ar),'#ffd54f',14,true);
    av.classList.add('dead');ar.classList.add('ko');shakeScreen();
    setTimeout(()=>{sfx('win');flash(`💥 ${B.boss.name} is defeated!`);},250);
    setTimeout(()=>{if(!$('arena'))return;av.className='boss-sprite grave';av.textContent='💀';},950);
    $('bossRule').innerHTML=taskIdx<B.tasks.length-1||!$('taskNext').innerHTML?'<b>Boss down!</b> Keep going: every mark still counts towards your stars.':'<b>Boss down!</b>';
    $('charge').classList.add('done');
  },650);
}
function bossEnd(){
  stopMusic();chargeStop();
  const won=marks[lvl]>=B.hp,bonus=B.shields*100;
  if(bonus)addPoints(bonus);
  $('charge').classList.add('done');
  $('bossTask').innerHTML=`<div class="boss-end ${won?'won':'lost'}"><div class="big">${won?'🏆':B.boss.icon}</div>
<div class="sp-head">${won?`You defeated ${B.boss.name}!`:`${B.boss.name} survived — you needed ${B.hp - marks[lvl]} more mark${B.hp-marks[lvl]===1?'':'s'}.`}</div>
<div class="shield-bonus">${'🛡️'.repeat(B.shields)||'No shields left'} · ${bonus?`+${bonus} shield bonus points`:'no shield bonus this time'}</div>
<button class="btn btn-primary" id="goBtn" onclick="levelComplete()">See level result →</button></div>`;
  if(!won&&$('arena'))taunt('gloat');
  sfx(won?'win':'over');$('goBtn').focus({preventScroll:true});
}

/* ---------- SIM: bespoke mini-game ---------- */
function playSim(L){
  marks[lvl]=0;maxMarks[lvl]=0;
  window['sim_'+L.sim]($('taskArea'),(pts,st)=>{addPoints(pts);levelComplete(st);});
}

/* ---------- level complete ---------- */
function levelComplete(simStars){
  stopSorter();
  const L=LEVELS[lvl],isSim=L.mode==='sim';
  const pct=isSim?null:(maxMarks[lvl]?marks[lvl]/maxMarks[lvl]:0);
  const st=isSim?simStars:(pct===1?3:pct>=0.7?2:pct>=0.4?1:0);
  stars[lvl]=st;STORE.stars[lvl]=Math.max(STORE.stars[lvl]??0,st);save();
  const last=lvl===LEVELS.length-1;
  setProgress(Math.round((lvl+1)/LEVELS.length*100));
  sfx('level');if(st===3)fireConfetti();
  $('roundHeading').textContent='';
  $('taskArea').innerHTML=`<div class="level-done"><div class="stars-big">${[0,1,2].map(n=>`<span class="${n<st?'on':''}" style="animation-delay:${0.15+n*0.25}s">★</span>`).join('')}</div>
<h3>Level ${lvl+1} complete!</h3>
${isSim?'':`<div class="ld-marks">${marks[lvl]}/${maxMarks[lvl]} correct</div>`}
<div class="ld-pts">⚡ ${G.points.toLocaleString()} points so far</div>
${st<3?`<p class="ld-tip">${st===0?'Have another go at this level before you move on.':'Replay the level to go for ★★★.'}</p>`:''}
<div class="btn-row-sm"><button class="btn btn-ghost" onclick="playLevel()">↻ Replay level</button>
<button class="btn btn-ghost" onclick="renderWelcome()">🗺️ Map</button>
<button class="btn btn-success" id="goBtn" onclick="${last?'showResults()':`startLevel(${lvl+1})`}">${last?'See my results →':`Level ${lvl+2}: ${LEVELS[lvl+1].title} →`}</button></div></div>`;
  $('goBtn').focus({preventScroll:true});
  hud();
}

/* ---------- task renderers (unchanged from v1) ---------- */
function taskMax(t){
  if(t.type==='match')return t.pairs.length;
  if(t.type==='fill')return (t.text.match(/\[\[/g)||[]).length;
  if(t.type==='order')return t.steps.length;
  if(t.type==='pick')return t.need;
  return 1;
}
/* classify: one statement, sort into a category */
function renderClassify(t,r){
  const choices=t.choices||r.choices;
  $('taskBody').innerHTML=`<div class="item-text">${t.text}</div><div class="classify-btns">${choices.map(c=>`<button class="classify-btn" data-k="${c.key}">${c.label}</button>`).join('')}</div>`;
  document.querySelectorAll('#taskBody .classify-btn').forEach(b=>b.onclick=()=>{
    document.querySelectorAll('#taskBody .classify-btn').forEach(x=>{x.disabled=true;if(x.dataset.k===t.answer)x.classList.add('correct');});
    const ok=b.dataset.k===t.answer;if(!ok)b.classList.add('wrong');
    done(t,ok?1:0);
  });
}
/* mcq: options[] with answer index; past-paper A-D keep their order */
function renderMcq(t){
  const letters=t.keepOrder?['A','B','C','D','E']:null;
  const opts=t.options.map((o,i)=>({o,i}));
  const shown=t.keepOrder?opts:shuffle(opts);
  $('taskBody').innerHTML=`<div class="item-text">${t.q}</div><div class="mcq-list">${shown.map((x,n)=>`<button class="mcq-btn" data-i="${x.i}">${letters?'<b>'+letters[n]+'.</b> ':''}${x.o}</button>`).join('')}</div>`;
  document.querySelectorAll('#taskBody .mcq-btn').forEach(b=>b.onclick=()=>{
    document.querySelectorAll('#taskBody .mcq-btn').forEach(x=>{x.disabled=true;if(+x.dataset.i===t.answer)x.classList.add('correct');});
    const ok=+b.dataset.i===t.answer;if(!ok)b.classList.add('wrong');
    done(t,ok?1:0);
  });
}
/* match: click a term then its definition; a pair scores only if matched first time */
function renderMatch(t){
  let sel=null,left=t.pairs.length,got=0;const missed=new Set();
  const defs=shuffle(t.pairs.map((p,i)=>({d:p.def,i})));
  $('taskBody').innerHTML=`<div class="item-text">${t.q||'Click a term, then click the description that matches it.'}</div>
<div class="match-container"><div class="match-col">${t.pairs.map((p,i)=>`<div class="match-term" data-i="${i}">${p.term}</div>`).join('')}</div>
<div class="match-col">${defs.map(x=>`<div class="match-def" data-i="${x.i}">${x.d}</div>`).join('')}</div></div>`;
  document.querySelectorAll('#taskBody .match-term').forEach(el=>el.onclick=()=>{
    if(el.classList.contains('matched'))return;
    document.querySelectorAll('#taskBody .match-term').forEach(x=>x.classList.remove('selected'));
    el.classList.add('selected');sel=+el.dataset.i;
  });
  document.querySelectorAll('#taskBody .match-def').forEach(el=>el.onclick=()=>{
    if(sel===null||el.classList.contains('matched'))return;
    const term=document.querySelector(`#taskBody .match-term[data-i="${sel}"]`);
    if(+el.dataset.i===sel){
      el.classList.add('matched');term.classList.remove('selected');term.classList.add('matched');
      el.innerHTML=`<span class="match-label">${t.pairs[sel].term}</span> ${el.innerHTML}`;
      if(!missed.has(sel))got++;left--;sel=null;
      if(left===0)done(t,got);
    }else{
      missed.add(sel);el.style.animation='shake 0.4s ease';el.style.borderColor='#e74c3c';
      setTimeout(()=>{el.style.animation='';el.style.borderColor='';},500);
    }
  });
}
/* fill: text with [[answer]] blanks, choose from a word bank */
function renderFill(t){
  const answers=[];let n=0;
  const bank=shuffle(t.bank);
  const html=t.text.replace(/\[\[(.+?)\]\]/g,(m,a)=>{answers.push(a);return `<select class="blank" data-n="${n++}"><option value="">— choose —</option>${bank.map(w=>`<option>${w}</option>`).join('')}</select>`;});
  $('taskBody').innerHTML=`<div class="item-text small">${t.q||'Complete the text using the words supplied. Not all words will be used.'}</div>
<div class="word-bank">${t.bank.map(w=>`<span>${w}</span>`).join('')}</div><div class="fill-text">${html}</div>
<button class="btn btn-success" id="checkBtn">Check answers</button>`;
  $('checkBtn').onclick=()=>{
    const sels=[...document.querySelectorAll('#taskBody select.blank')];
    if(sels.some(s=>!s.value)&&!confirm('Some gaps are empty. Check anyway?'))return;
    let got=0;
    sels.forEach((s,i)=>{s.disabled=true;if(norm(s.value)===norm(answers[i])){got++;s.classList.add('correct');}else{s.classList.add('wrong');s.insertAdjacentHTML('afterend',`<span class="fix">${answers[i]}</span>`);}});
    $('checkBtn').remove();done(t,got);
  };
}
/* order: click the steps in the right order */
function renderOrder(t){
  const picked=[];
  $('taskBody').innerHTML=`<div class="item-text small">${t.q}</div><div class="order-pool">${shuffle(t.steps.map((s,i)=>({s,i}))).map(x=>`<button class="order-btn" data-i="${x.i}">${x.s}</button>`).join('')}</div>
<ol class="order-answer" id="orderAns"></ol><div class="btn-row-sm"><button class="btn btn-ghost" id="resetBtn">Reset</button><button class="btn btn-success" id="checkBtn" disabled>Check order</button></div>`;
  const pool=[...document.querySelectorAll('#taskBody .order-btn')];
  pool.forEach(b=>b.onclick=()=>{b.disabled=true;picked.push(+b.dataset.i);$('orderAns').insertAdjacentHTML('beforeend',`<li>${t.steps[+b.dataset.i]}</li>`);$('checkBtn').disabled=picked.length<t.steps.length;});
  $('resetBtn').onclick=()=>{picked.length=0;$('orderAns').innerHTML='';pool.forEach(b=>b.disabled=false);$('checkBtn').disabled=true;};
  $('checkBtn').onclick=()=>{
    let got=0;[...$('orderAns').children].forEach((li,i)=>{if(picked[i]===i){got++;li.classList.add('ok');}else{li.classList.add('bad');li.insertAdjacentHTML('beforeend',` <span class="fix">→ should be: ${t.steps[i]}</span>`);}});
    $('resetBtn').remove();$('checkBtn').remove();done(t,got);
  };
}
/* pick: choose `need` correct answers from a list (each wrong pick cancels a right one) */
function renderPick(t){
  const opts=shuffle(t.options.map((o,i)=>({...o,i})));
  $('taskBody').innerHTML=`<div class="item-text">${t.q}</div><div class="pick-hint">Choose ${t.need}.</div><div class="mcq-list">${opts.map(o=>`<button class="mcq-btn pick" data-i="${o.i}">${o.text}</button>`).join('')}</div><button class="btn btn-success" id="checkBtn" disabled>Check</button>`;
  const btns=[...document.querySelectorAll('#taskBody .pick')];
  btns.forEach(b=>b.onclick=()=>{
    if(!b.classList.contains('sel')&&btns.filter(x=>x.classList.contains('sel')).length>=t.need)return;
    b.classList.toggle('sel');$('checkBtn').disabled=btns.filter(x=>x.classList.contains('sel')).length!==t.need;
  });
  $('checkBtn').onclick=()=>{
    let right=0,wrong=0;
    const right_=btns.filter(b=>b.classList.contains('sel')&&t.options[+b.dataset.i].ok).length;
    btns.forEach(b=>{b.disabled=true;const o=t.options[+b.dataset.i];const s=b.classList.contains('sel');if(o.ok&&(s||right_<t.need))b.classList.add(s?'correct':'missed');if(s&&o.ok)right++;if(s&&!o.ok){wrong++;b.classList.add('wrong');}});
    $('checkBtn').remove();done(t,right);
  };
}

/* ---------- results ---------- */
function showResults(){
  stopSorter();
  const scored=LEVELS.map((L,i)=>i).filter(i=>LEVELS[i].mode!=='sim');
  const played=scored.filter(i=>maxMarks[i]>0&&marks[i]!=null);
  const total=played.reduce((a,i)=>a+marks[i],0),max=played.reduce((a,i)=>a+maxMarks[i],0),pct=max?Math.round(total/max*100):0;
  const [r1,r2,r3,r4]=ACT.ranks;
  const [icon,rank]=pct>=90?['👑',r1]:pct>=70?['⭐',r2]:pct>=50?['🔧',r3]:['🌱',r4];
  const newBest=G.points>(STORE.best||0);if(newBest){STORE.best=G.points;save();}
  setProgress(100);showScreen('resultsScreen');if(pct>=50||newBest)fireConfetti();sfx('win');
  const tips=played.map(i=>marks[i]/maxMarks[i]<0.7?LEVELS[i].tip:null).filter(Boolean);
  const row=(L,i)=>{const st=stars[i]!=null?starStr(stars[i]):'';
    const sc=L.mode==='sim'?(stars[i]!=null?'mini-game':'not played'):(played.includes(i)?`${marks[i]}/${maxMarks[i]}`:'not played');
    return `<div class="breakdown-row"><span>Level ${i+1}: ${L.title}</span><span><span class="row-stars">${st}</span> ${sc}</span></div>`;};
  $('resultsScreen').innerHTML=`<div class="results"><div class="results-icon">${icon}</div><h2>Mission Complete!</h2>
<div class="pts-big">⚡ ${G.points.toLocaleString()} points</div>
${newBest?'<div class="new-best">🏆 New high score on this device!</div>':`<div class="best-line">🏆 Best on this device: ${(STORE.best||0).toLocaleString()}</div>`}
<div class="score-big">${total}/${max} correct (${pct}%)</div><div class="rank">${rank}</div>
<div class="breakdown">${LEVELS.map(row).join('')}<div class="breakdown-row"><span>Total</span><span>${total}/${max}</span></div></div>
${played.length<scored.length?'<p class="ld-tip">Levels you did not play this time are not counted.</p>':''}
${tips.length?`<div class="revision-box"><h4>📝 Go over these again</h4><ul>${tips.map(t=>'<li>'+t+'</li>').join('')}</ul></div>`:''}
<div class="btn-row"><button class="btn btn-ghost" onclick="location.reload()">↻ Play again</button><a href="index.html" class="btn btn-primary" style="text-decoration:none;">← Back to HQ</a>
${ACT.next?`<a href="${ACT.next.href}" class="btn btn-success" style="text-decoration:none;">${ACT.next.label} →</a>`:''}</div></div>`;
}
function fireConfetti(){const c=['#64b5f6','#2ecc71','#f39c12','#e74c3c','#9b59b6','#1abc9c'];for(let i=0;i<40;i++){const d=document.createElement('div');d.className='confetti-piece';d.style.left=Math.random()*100+'%';d.style.top='-10px';d.style.background=c[i%c.length];d.style.width=d.style.height=(6+Math.random()*8)+'px';d.style.animationDelay=Math.random()*1.5+'s';d.style.animationDuration=(2+Math.random()*2)+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),5000);}}

renderWelcome();

</script>
