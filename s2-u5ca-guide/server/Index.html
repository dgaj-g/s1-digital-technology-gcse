<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<base target="_top">
<title>GCSE Digital Technology &#183; Unit 5 Coursework Guide</title>
<style>
/* A2 SSD platform \2014  plain examiner register. Built at 1280x800; fits 1024 to 1440 wide (G3). Ported from the approved prototype. */
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap');
:root{--ink:#1C1A2E;--mute:#5E5A78;--line:#E2DCF2;--bg:#FBF9FF;--card:#fff;--navy:#4F2D9E;--gold:#FFC53D;--ok:#1b7f3b;--bad:#b3261e;--tint:#F5F1FC;--wd:#EDE6FA;--mono:"JetBrains Mono",Menlo,Consolas,monospace;--sans:"Nunito",-apple-system,"Segoe UI",Calibri,Arial,sans-serif}
:root{--white:#fff;--black:#000;--white-a90:rgba(255,255,255,.9);--shadow-a08:rgba(0,0,0,.08);--shadow-a30:rgba(0,0,0,.3);--shadow-a35:rgba(0,0,0,.35);--grey-50:#fafbfc;--grey-60:#f7f8fa;--grey-70:#f1f3f6;--grey-80:#eef1f4;--grey-90:#eef1f5;--grey-100:#e6e9ee;--grey-110:#e6eaf0;--grey-120:#e3e7ed;--grey-200:#c9d1dc;--grey-300:#b9c2cf;--grey-400:#a0a8b3;--grey-410:#9aa4b0;--grey-420:#9aa6b8;--grey-500:#8a94a0;--grey-510:#8a94a3;--grey-600:#6b7380;--grey-900:#28303c;--navy-a15:rgba(79,45,158,.15);--navy-a25:rgba(79,45,158,.25);--navy-a28:rgba(79,45,158,.28);--navy-a35:rgba(79,45,158,.35);--navy-wash-1:#fbfdfd;--navy-wash-2:#f4f9f8;--navy-wash-3:#f1f8f7;--navy-wash-4:#ecf4f3;--navy-wash-5:#e6f2f1;--navy-wash-6:#e6f1f0;--navy-wash-7:#e1efee;--navy-wash-8:#dbeceb;--navy-edge-1:#c2dcda;--navy-edge-2:#b5d3d1;--gold-a45:rgba(255,197,61,.45);--gold-wash-1:#fffbea;--gold-wash-2:#fffaf0;--gold-wash-3:#fff8e1;--gold-wash-4:#fff8dc;--gold-edge-1:#f1dc9a;--gold-edge-2:#d9c27a;--gold-deep-1:#7a5a00;--gold-deep-2:#5a4300;--gold-deep-3:#4a3b00;--hl:#fff3c4;--hl-strong:#ffe89a;--hl-strongest:#ffe27a;--hl-ink:#3b2e00;--ok-wash-1:#e6f4ea;--ok-wash-2:#e8f5ec;--ok-wash-3:#f1faf3;--ok-wash-4:#e3f5e8;--ok-edge:#bfe0c8;--bad-wash-1:#fdecea;--bad-wash-2:#fde3e1;--bad-wash-3:#fff3f0;--bad-wash-4:#ffecec;--bad-edge:#f3b8b3;--bad-deep:#a3271b;--bad-strong:#c62828;--warn:#e39b12;--ssms-key:#0000ff;--ssms-fn:#ff00ff;--ssms-str:#ff0000;--ssms-comment:#008000;--ssms-op:#808080;--cs-key:#0b4a9e;--cs-str:#a3410b;--cs-comment:#6a8a5a;--cs-num:#7a1f8a;--cs-type:#0b6b6b;--navy-a18:rgba(79,45,158,.18);--wd-hover:#c4e4e0;--wd-flash:#9fd3cc;--wd-typed:#d6ecd9;--fix-ink:#9a3412}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font:15px/1.45 var(--sans);color:var(--ink);background:var(--bg)}
button{font:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:var(--ink)}
[hidden]{display:none!important}
.app{width:100%;min-width:1000px;height:100vh;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
header.bar{height:52px;background:var(--navy);color:var(--white);display:flex;align-items:center;padding:0 20px;gap:14px;flex:none}
header.bar .title{font-weight:700;font-size:17px}header.bar .school{opacity:.8;font-size:13px}
header.bar .who{margin-left:auto;font-size:14px;white-space:nowrap}header.bar .crumb{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}header.bar .crumb a{color:var(--white);text-decoration:underline;cursor:pointer}
.sysbar{flex:none;display:flex;gap:12px;align-items:center;padding:8px 20px;background:var(--gold-wash-3);border-bottom:1px solid var(--gold-edge-1);font-size:14px}
.sysbar.bad{background:var(--bad-wash-1);border-color:var(--bad-edge)}
.sysbar .btn{padding:5px 12px;font-size:14px}
main{flex:1;min-height:0;overflow:auto;padding:22px 28px}
main.split{display:grid;grid-template-columns:minmax(380px,38%) 1fr;gap:0;padding:0;overflow:hidden}
.figure{border-right:1px solid var(--line);background:var(--card);overflow:auto;height:100%;padding:0 0 16px;min-width:0}
.figure .tabs{display:flex;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card);z-index:1}
.figure .tabs button{flex:1;border:0;background:transparent;padding:10px 4px;font-weight:700;font-size:12px;letter-spacing:.06em;color:var(--mute);border-bottom:3px solid transparent}
.figure .tabs button.on{color:var(--navy);border-bottom-color:var(--gold)}
.figure .cap{font-size:12px;color:var(--mute);padding:10px 12px 0}
.tbls{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px 12px 0;align-items:start}
.paperfig .tbls{grid-template-columns:repeat(auto-fill,minmax(210px,1fr));padding:0}
.tbl{border:1px solid var(--grey-300);border-radius:8px;background:var(--white);overflow:hidden;min-width:0}
.tbl h4{margin:0;padding:6px 10px;font-size:13px;letter-spacing:.04em;background:var(--tint);border-bottom:1px solid var(--grey-300);color:var(--navy)}
.tbl table{border-collapse:collapse;width:100%;font-size:13px}.tbl td{padding:3px 8px;border-bottom:1px solid var(--grey-80)}.tbl tr:last-child td{border-bottom:0}
.tbl td.t{color:var(--mute);font-family:var(--mono);font-size:12px;text-align:right;white-space:nowrap}
.tbl td.none{color:var(--mute);font-size:12px;font-style:italic}
.tbl .pk{font-weight:700}.tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.05em;padding:0 5px;border-radius:4px;margin-left:6px;background:var(--tint);color:var(--navy);border:1px solid var(--line)}
.tbl.hl{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold-a45)}.tbl.hl2{border-color:var(--gold-edge-2)}
.tbl tr.hl td{background:var(--hl)}.tbl tr.hl.strong td{background:var(--hl-strongest)}.tbl.hl.strong{box-shadow:0 0 0 3px var(--gold)}
.pick-fields tr[data-f]{cursor:pointer}.pick-fields tr[data-f]:hover td{background:var(--navy-wash-5)}.pick-tables .tbl{cursor:pointer}.pick-tables .tbl:hover{border-color:var(--navy);box-shadow:0 0 0 2px var(--navy-a25)}
.legend{font-size:12px;color:var(--mute);padding:10px 12px 0}
.subcap{font-size:12px;font-weight:700;letter-spacing:.05em;color:var(--mute);padding:14px 12px 0;text-transform:uppercase}
.paperfig .subcap,.paperfig .legend{padding-left:0}
.sample{padding:8px 12px 0}.paperfig .sample{padding-left:0}
.sample table,.data table{border-collapse:collapse;font-size:12px;font-family:var(--mono)}.sample th,.data th{text-align:left;background:var(--tint);padding:3px 5px;border:1px solid var(--line)}.sample td,.data td{padding:2px 5px;border:1px solid var(--line);white-space:nowrap}
.data{padding:0 12px 10px}.data h4{margin:12px 0 4px;font-size:13px}.data h4 small{font-weight:400;color:var(--mute);margin-left:6px}.data .scroll{overflow-x:auto}
.work{overflow:auto;padding:18px 26px 90px;position:relative;min-width:0}
.rail{display:flex;gap:22px;font-size:14px;color:var(--mute);margin-bottom:14px;flex-wrap:wrap}
.rail .st{display:flex;align-items:center;gap:7px;border:0;background:none;padding:0;color:inherit;text-align:left}
.rail button.st:hover span{text-decoration:underline}
.rail i{width:14px;height:14px;border-radius:50%;border:2px solid var(--grey-410);display:inline-block;flex:none}
.rail .now{color:var(--navy);font-weight:700}.rail .now i{background:var(--navy);border-color:var(--navy)}
.rail .done i{background:var(--ok);border-color:var(--ok)}.rail .skip{opacity:.6}.rail small{display:block;font-size:11px;font-weight:400;color:var(--mute)}
h1{font-size:24px;margin:0 0 6px}h2{font-size:19px;margin:0 0 8px}h3{font-size:15px;margin:0 0 8px}
.sub{color:var(--mute);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:14px}
.card h3{display:flex;align-items:center;gap:10px}
.ask{font-size:17px;margin:4px 0 14px}.ask q{quotes:"\201C" "\201D"}
.lead{margin:0 0 6px;color:var(--ink)}
.btn{background:var(--navy);color:var(--white);border:0;border-radius:8px;padding:10px 18px;font-weight:600;font-size:15px}
.btn.sec{background:var(--white);color:var(--navy);border:1px solid var(--navy)}.btn.ghost{background:transparent;color:var(--navy);border:0;text-decoration:underline;padding:6px 4px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;margin-top:18px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px;min-height:190px;text-align:left;display:flex;flex-direction:column;gap:8px;color:var(--ink)}
.tile.live{cursor:pointer;border-color:var(--navy)}.tile.live:hover{box-shadow:0 2px 10px var(--navy-a15)}
.tile h2{margin:0}.tile p{margin:0}.tile .state{margin-top:auto;font-size:13px;color:var(--mute)}.tile.soon{color:var(--mute)}.tile.soon .soon{font-weight:700;color:var(--mute);margin-top:auto}
.papers{list-style:none;padding:0;margin:0}
.papers li{display:grid;grid-template-columns:1fr 90px 80px 280px;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin-bottom:8px}
.papers li.open{cursor:pointer}.papers li.open:hover{border-color:var(--navy)}.papers li.locked{color:var(--mute)}
.pill{justify-self:end;font-size:13px;padding:4px 10px;border-radius:999px;background:var(--tint);border:1px solid var(--line);text-align:right}.pill.grey{color:var(--mute)}.pill.go{background:var(--navy-wash-5);color:var(--navy);border-color:var(--navy-edge-1)}.pill.done{background:var(--ok-wash-1);color:var(--ok);border-color:var(--ok-edge)}
.parts{list-style:none;padding:0;margin:0}.parts li{display:grid;grid-template-columns:48px 1fr 80px 300px;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.parts li:last-child{border-bottom:0}.parts .state{display:flex;flex-direction:column;align-items:flex-end;gap:6px;text-align:right}
.doors{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:14px 0 10px}
.door{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:22px;text-align:left;display:flex;flex-direction:column;gap:8px;position:relative;color:var(--ink)}
.door:hover{border-color:var(--navy)}.door b{font-size:19px}.door span{color:var(--mute);font-size:14px}
.door .sug{position:absolute;top:-11px;right:14px;background:var(--gold);color:var(--ink);font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px}
.check{list-style:none;padding:0;margin:0}.check li{padding:5px 0 5px 26px;position:relative}.check li::before{position:absolute;left:2px;top:5px;font-weight:700}
.check li.hit::before{content:"\2713";color:var(--ok)}.check li.miss::before{content:"\2717";color:var(--bad)}
.marklist{list-style:none;padding:0;margin:0}.marklist li{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}.marklist li:last-child{border:0}.marklist .mk{flex:none;font-size:12px;font-weight:700;color:var(--navy);background:var(--tint);border:1px solid var(--line);border-radius:999px;padding:2px 10px}
.habits{margin:0;padding-left:18px}
/* editor (SPEC 4): gutter, SSMS colours, 15px / 1.5, 6 to 20 lines then it scrolls */
.ed{position:relative;display:flex;border:1px solid var(--line);border-radius:8px;background:var(--white);font-family:var(--mono);font-size:15px;line-height:1.5;overflow:hidden}
.ed:focus-within{border-color:var(--navy);box-shadow:0 0 0 2px var(--navy-a15)}
.ed-g{flex:none;min-width:3em;background:var(--tint);border-right:1px solid var(--line);color:var(--grey-500);text-align:right;overflow:hidden;position:relative;user-select:none}
.ed-gi{padding:10px 8px 10px 6px;white-space:pre;font-size:13px;line-height:22.5px}
.ed-c{position:relative;flex:1;min-width:0;overflow:hidden}
.ed-c pre,.ed-c textarea{margin:0;padding:10px 12px;font:inherit;font-size:15px;line-height:22.5px;white-space:pre;tab-size:4;letter-spacing:0}
.ed-c pre{position:absolute;top:0;left:0;min-width:100%;pointer-events:none;color:var(--black);will-change:transform}
.ed-c textarea{position:relative;display:block;width:100%;resize:none;background:transparent;color:transparent;caret-color:var(--black);border:0;outline:0;overflow:auto;z-index:1}
.ed-c textarea::placeholder{color:var(--grey-500)}
.ed-cur{position:absolute;left:0;right:0;height:22.5px;background:var(--tint);pointer-events:none;display:none}
.ed:focus-within .ed-cur{display:block}
.ed.ro{background:var(--grey-50)}.ed.ro .ed-c{overflow-x:auto}.ed.ro .ed-c pre{position:static}
.stubed{margin-bottom:8px}
.k{color:var(--ssms-key)}.f{color:var(--ssms-fn)}.s{color:var(--ssms-str)}.c{color:var(--ssms-comment)}.o{color:var(--ssms-op)}.n{color:var(--black)}
/* written answers */
textarea.prose{width:100%;min-height:120px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;resize:vertical;font-size:15px;line-height:1.5}
textarea.prose:focus,input.txt:focus,.cloze input:focus{outline:0;border-color:var(--navy);box-shadow:0 0 0 2px var(--navy-a15)}
input.txt{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px}
.rowsans{border-collapse:collapse;width:100%}.rowsans th{text-align:left;font-size:13px;color:var(--mute);padding:4px 6px}.rowsans td{padding:4px 6px;vertical-align:top}.rowsans td.fld{font-family:var(--mono);font-weight:600;white-space:nowrap;padding-top:12px}
.rowsans td:nth-child(2){width:28%}
.cloze{margin:0;font-family:var(--mono);font-size:14px;line-height:34px;white-space:pre-wrap;border:1px solid var(--line);border-radius:8px;background:var(--grey-50);padding:10px 14px}
.cloze label{display:inline-flex;align-items:center;gap:4px;vertical-align:baseline}
.cloze label b{font-size:11px;color:var(--navy);background:var(--tint);border:1px solid var(--line);border-radius:4px;padding:0 4px;line-height:18px}
.cloze input{font-family:var(--mono);font-size:14px;width:18ch;padding:2px 6px;border:1px solid var(--grey-410);border-radius:5px;background:var(--white);line-height:22px}
.prosebox{white-space:pre-wrap;background:var(--grey-50);border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin:0}
.confirm{margin-top:10px;padding:10px 14px;background:var(--gold-wash-3);border:1px solid var(--gold-edge-1);border-radius:8px}
.marks{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.score{font-size:40px;font-weight:700;line-height:1;margin-bottom:10px}.score small{font-size:16px;color:var(--mute);font-weight:400}
.spell{margin:8px 0;padding:6px 12px;border-left:4px solid var(--gold);background:var(--gold-wash-1);font-size:14px;border-radius:0 6px 6px 0}
.pts{list-style:none;padding:0;margin:0}.pts li{padding:6px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:22px 1fr 40px;gap:8px}.pts li .hint,.pts li .note{grid-column:2/4;color:var(--mute);font-size:13px}
.pts .yes{color:var(--ok);font-weight:700}.pts .no{color:var(--bad);font-weight:700}.pts .m{color:var(--mute);text-align:right}
.result .scroll{overflow-x:auto}.result table{border-collapse:collapse;font-family:var(--mono);font-size:12px;margin-bottom:10px}.result th{text-align:left;background:var(--tint);padding:3px 6px;border:1px solid var(--line)}.result td{padding:2px 6px;border:1px solid var(--line);white-space:nowrap}
.same{color:var(--ok);font-weight:700}.diff{color:var(--bad);font-weight:700}
.walk{margin:10px 0 0;padding-left:20px}.walk li{margin-bottom:4px}
.bullets{margin:6px 0 10px;padding:8px 12px;background:var(--tint);border-radius:8px;font-family:var(--mono);font-size:13px;white-space:pre-wrap}
.flag{position:fixed;right:34px;bottom:22px;background:var(--white);border:1px solid var(--navy);color:var(--navy);border-radius:999px;padding:8px 16px;font-size:14px;z-index:5;box-shadow:0 1px 4px var(--shadow-a08)}
.flag.on{background:var(--bad-wash-1);border-color:var(--bad);color:var(--bad)}
.dots::after{content:"";animation:d 1.2s steps(4,end) infinite}@keyframes d{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
.guard{display:flex;align-items:center;justify-content:center;height:100%;font-size:20px;color:var(--mute);text-align:center;padding:20px}
.guard .box{max-width:560px;display:flex;flex-direction:column;gap:14px;align-items:center}
.guard .box p{margin:0}
.guard input{font-size:17px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;width:280px}
.ev .line{display:grid;grid-template-columns:1fr 320px;gap:14px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.seg{display:flex;gap:6px}.seg button{border:1px solid var(--line);background:var(--white);border-radius:8px;padding:7px 10px;color:var(--ink)}.seg button.on{background:var(--navy);color:var(--white);border-color:var(--navy)}
textarea.comment{width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;resize:none;height:64px}
.count{font-size:13px;color:var(--mute)}
.note{font-size:13px;color:var(--mute)}
.err{color:var(--bad)}
/* staff */
.staff table.grid{border-collapse:collapse;width:100%;font-size:13px;background:var(--white)}.staff .grid th,.staff .grid td{border:1px solid var(--line);padding:6px 8px;text-align:left}.staff .grid th{background:var(--tint)}
.staff td.c{text-align:center;font-family:var(--mono);cursor:pointer;white-space:nowrap}.staff td.c:hover{background:var(--navy-wash-5)}.staff td.c small{color:var(--mute);margin-left:4px}.staff td.c.empty{cursor:default;color:var(--mute)}.staff td.c.empty:hover{background:none}
.staff .tg{font-size:10px;font-weight:700;padding:0 5px;border-radius:4px;margin-left:5px;background:var(--tint);border:1px solid var(--line);font-family:var(--sans)}.staff .tg.red{background:var(--bad-wash-1);color:var(--bad);border-color:var(--bad-edge)}
.staff .amber{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--warn);margin-left:5px;vertical-align:middle}
.staff tr.me td{background:var(--navy-wash-1)}
.stabs{display:flex;gap:4px;margin-bottom:14px;border-bottom:1px solid var(--line)}.stabs button{border:1px solid var(--line);border-bottom:0;background:var(--white);border-radius:8px 8px 0 0;padding:8px 16px;color:var(--ink)}.stabs button.on{background:var(--navy);color:var(--white);border-color:var(--navy)}
.stabs .cls{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:14px;padding-bottom:4px}
.stabs select{padding:5px 8px;border:1px solid var(--line);border-radius:6px}
.clist{list-style:none;padding:0;margin:0 0 16px}.clist li{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;background:var(--white);border:1px solid var(--line);border-radius:10px;margin-bottom:8px}.clist li b{margin-right:auto}
.plist{list-style:none;padding:0;margin:0 0 12px}.plist li{display:grid;grid-template-columns:1fr 90px 90px 110px;gap:10px;align-items:center;padding:8px 14px;background:var(--white);border:1px solid var(--line);border-radius:8px;margin-bottom:6px}
.plist .st{font-size:13px;font-weight:700}.plist .st.on{color:var(--ok)}.plist .st.off{color:var(--mute)}
.drawer{position:fixed;top:52px;right:0;bottom:0;width:min(640px,60vw);background:var(--white);border-left:1px solid var(--line);box-shadow:-4px 0 18px var(--shadow-a08);overflow:auto;padding:18px 22px;z-index:6}
.drawer .part{border-top:1px solid var(--line);padding:12px 0}
.drawer pre{white-space:pre-wrap;font-family:var(--mono);font-size:13px;background:var(--grey-50);border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin:6px 0}
.passbox{max-width:420px;margin:60px auto;display:flex;flex-direction:column;gap:12px}
.passbox input{padding:9px 12px;border:1px solid var(--line);border-radius:8px;font-size:16px}
/* lesson (Beat 2) */
.banner{background:var(--gold-wash-3);border:1px solid var(--gold-edge-1);border-radius:10px;padding:12px 16px;margin-bottom:14px;font-size:14px}
.lesson .ltask{font-size:16px;font-weight:600;margin-bottom:12px}
.steps{list-style:none;padding:0;margin:0 0 16px;display:flex;gap:6px;flex-wrap:wrap}

/* ---- the S2 look (DESIGN_SPEC 7) ---- */
/* S2 U5CA guide tokens (DESIGN_SPEC 7.1, 7.2). Every colour in the other stylesheets is a var() of one of these. Text variants (--sw-ink) are each swatch darkened until it reads at 4.5:1 on white. */
:root{--ok-bg:#ECF9EF;--bad-bg:#FBE4E2;--form-bg:#ECE9F1;--isense-bg:#2A2640;--isense-edge:#4A4566;--wrap-bg:#3A3458;--wrap-ink:#E7E0FF;--code-cur:#2E2947;--inset-12:rgba(0,0,0,.12);--inset-15:rgba(0,0,0,.15);--inset-25:rgba(0,0,0,.25);--brand:#4F2D9E;--accent:#FFC53D;--tint:#F5F1FC;--bg:#FBF9FF;--card:#FFFFFF;--ink:#1C1A2E;--mute:#5E5A78;--line:#E2DCF2;--ok:#1B7F3B;--bad:#B3261E;--code-bg:#1E1B2E;--code-ink:#F4F1FF;--typed:#FFF0B3;--locked:#D9D6E3;--open:#FFE08A;--white:#FFFFFF;--black:#000000;--tok-k:#C792EA;--tok-s:#FFD580;--tok-c:#A29DBF;--tok-n:#82D8FF;--tok-m:#7FE1C1;--tok-v:#F4F1FF;--ok-ink:#1B7F3B;--bad-ink:#B3261E;--watch:#FFF4D6;--watch-edge:#E6A700;--watch-ink:#6B4E00;--gold-ink:#6B4E00;--sans:"Nunito","Segoe UI",system-ui,sans-serif;--mono:"JetBrains Mono",Menlo,Consolas,monospace;--sw:#4F2D9E;--sw-ink:#4F2D9E;--r:18px;--dim:rgba(28,26,46,.45);--shadow:0 6px 24px rgba(28,26,46,.10);--shadow-lift:0 10px 32px rgba(79,45,158,.18)}
.sw-00{--sw:#4F2D9E;--sw-ink:#4F2D9E}
.sw-01{--sw:#E84D6A;--sw-ink:#E32448}
.sw-02{--sw:#F28C28;--sw-ink:#B35E0B}
.sw-03{--sw:#2A9D8F;--sw-ink:#228175}
.sw-04{--sw:#1F77B4;--sw-ink:#1F77B4}
.sw-05{--sw:#8E44AD;--sw-ink:#8E44AD}
.sw-06{--sw:#D1495B;--sw-ink:#CF4154}
.sw-07{--sw:#0F9D8A;--sw-ink:#0C8171}
.sw-08{--sw:#E07A1F;--sw-ink:#AF5F18}

/* S2 U5CA guide: the shell (DESIGN_SPEC 7). Nunito for words, JetBrains Mono for code. Every colour is a token from tokens-s2.css. */
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap');
@font-face{font-family:"JetBrains Mono";src:url(https://dgaj-g.github.io/s1-digital-technology-gcse/s2-u5ca-guide/fonts/JetBrainsMono-normal-400-latin.woff2) format("woff2");font-weight:400;font-display:swap}
*{box-sizing:border-box}html{scroll-behavior:smooth}html,body{margin:0;min-height:100%}
body{font:19px/1.5 var(--sans);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}

/* ---- cw.css: the coursework guide ---- */

.cw-crumb{display:inline-flex;align-items:center;gap:6px;color:var(--mute);text-decoration:none;font-weight:700;font-size:17px;margin-bottom:10px}

.cw-card .ring .bg{fill:none;stroke:var(--line);stroke-width:7}
.cw-card .ring .fg{fill:none;stroke:var(--sw-ink);stroke-width:7;stroke-linecap:round;transition:stroke-dashoffset .8s ease-out}
.cw-card .ring .lab{position:absolute;inset:0;display:grid;place-items:center;font-weight:900;font-size:15px;color:var(--sw-ink)}
.cw-card .tags{grid-column:1/4;display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.cw-card .tag{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 12px;font-size:15px;font-weight:700;background:var(--tint);color:var(--brand)}
.cw-card .tag.ok{background:var(--ok-bg);color:var(--ok)}
.cw-card .tag.had{background:var(--locked);color:var(--mute)}
.cw-card .tag.opt{background:var(--accent);color:var(--gold-ink)}
.cw-card .acts{grid-column:1/4;display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
.cw-card .acts .btn{padding:9px 20px;font-size:17px}
.cw-card .ask{grid-column:1/4;background:var(--tint);border-radius:12px;padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:8px;font-weight:700}
.cw-card .ask .btn{padding:7px 16px;font-size:16px}
.cw-card.lit{border-color:var(--sw-ink);box-shadow:0 0 0 4px color-mix(in srgb,var(--sw) 28%,transparent),var(--shadow-lift);animation:cardIn .4s ease-out both,glow 2.2s ease-in-out 1s infinite}
@keyframes glow{0%,100%{box-shadow:0 0 0 4px color-mix(in srgb,var(--sw) 28%,transparent),var(--shadow-lift)}50%{box-shadow:0 0 0 9px color-mix(in srgb,var(--sw) 14%,transparent),var(--shadow-lift)}}
.cw-card.lit .ttl::after{content:attr(data-start);margin-left:10px;font-size:14px;background:var(--accent);color:var(--gold-ink);border-radius:999px;padding:3px 10px;vertical-align:middle;white-space:nowrap}
.cw-card.done,.cw-card.had{background:color-mix(in srgb,var(--card) 70%,var(--tint))}
.cw-card.had .num{background:var(--locked);color:var(--mute);box-shadow:none}
.cw-card.coming{opacity:.6}
.cw-card.coming .num{background:var(--locked);color:var(--mute);box-shadow:none}
.cw-home .later{color:var(--mute);font-size:17px;margin:0 0 30px}
/* ---------- chapter frame ---------- */
.cw-top{display:flex;align-items:flex-start;gap:16px;margin-bottom:12px;flex-wrap:wrap}
.cw-top .num{width:56px;height:56px;border-radius:18px;background:var(--sw);display:grid;place-items:center;font-weight:900;font-size:26px;color:var(--white);flex:none;box-shadow:inset 0 -3px 0 var(--inset-15)}
.sw-01 .cw-top .num,.sw-02 .cw-top .num,.sw-03 .cw-top .num,.sw-07 .cw-top .num,.sw-08 .cw-top .num,.sw-11 .cw-top .num,.sw-14 .cw-top .num{color:var(--ink)}
.cw-top h1{margin:2px 0 0;font-size:32px}
.cw-top .one{color:var(--mute);margin:2px 0 0;font-size:18px}
.cw-stages{display:flex;gap:8px;flex-wrap:wrap;list-style:none;padding:0;margin:14px 0 6px}
.cw-pill{display:inline-flex;align-items:center;gap:8px;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:6px 14px 6px 6px;color:var(--mute);font-weight:700;font-size:16px;text-decoration:none;transition:border-color .2s,color .2s}
.cw-pill i{font-style:normal;width:28px;height:28px;border-radius:999px;display:grid;place-items:center;background:var(--tint);color:var(--sw-ink);font-weight:900;font-size:15px}
.cw-pill.on{border-color:var(--sw-ink);color:var(--ink);background:var(--card)}
.cw-pill.on i{background:var(--sw-ink);color:var(--white)}
.cw-pill.ok i{background:var(--ok);color:var(--white)}
.cw-pill.ok i::before{content:"\2713 "}
.cw-pill:hover{border-color:var(--sw-ink);color:var(--ink)}
.cw-dots{display:flex;gap:7px;align-items:center;margin:0 0 16px 8px}
.cw-dots .dot{width:12px;height:12px;border-radius:999px;background:var(--line);border:0;padding:0;display:block;cursor:pointer;transition:transform .2s,background .2s}
.cw-dots .dot.ok{background:var(--ok)}
.cw-dots .dot.on{background:var(--sw-ink);transform:scale(1.35)}
.cw-dots .lab{margin-left:8px;color:var(--mute);font-size:15px;font-weight:700}
.cw-screen{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:26px 30px 22px;animation:screenIn .35s ease-out both;position:relative;overflow:hidden}
.cw-screen::before{content:"";position:absolute;left:0;top:0;right:0;height:8px;background:var(--sw)}
@keyframes screenIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.cw-where{color:var(--mute);font-size:15px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;margin:0 0 6px}
.cw-screen h2{margin-bottom:14px}
.cw-screen > p,.cw-p{font-size:20px;line-height:1.55;margin:0 0 14px;max-width:760px}
.cw-screen .opener{font-weight:700}
/* marked words and the popover */
.wd{background:none;border:0;padding:0 2px;margin:0;font:inherit;color:var(--sw-ink);font-weight:700;border-bottom:3px dotted var(--sw);cursor:pointer;border-radius:3px}
.wd:hover,.wd.on{background:var(--tint)}
.cw-pop{position:absolute;z-index:40;max-width:360px;background:var(--ink);color:var(--white);border-radius:14px;padding:12px 16px;font-size:17px;line-height:1.4;box-shadow:var(--shadow-lift);animation:popIn .18s ease-out}
.cw-pop b{color:var(--accent);display:block;margin-bottom:2px}
.cw-pop .go{display:inline-block;margin-top:6px;color:var(--accent);font-weight:700;text-decoration:underline;font-size:15px}
@keyframes popIn{from{opacity:0;transform:translateY(6px) scale(.97)}to{opacity:1;transform:none}}
/* watch out */
.cw-watch{display:flex;gap:12px;align-items:flex-start;background:var(--watch);border-left:6px solid var(--watch-edge);color:var(--watch-ink);border-radius:12px;padding:12px 16px;margin:6px 0 16px;font-size:18px;line-height:1.45;font-weight:700}
.cw-watch .ic{flex:none;width:30px;height:30px;border-radius:999px;background:var(--watch-edge);color:var(--ink);display:grid;place-items:center;font-weight:900;font-size:19px;animation:wiggle 2.4s ease-in-out 1}
@keyframes wiggle{0%,60%,100%{transform:rotate(0)}70%{transform:rotate(-12deg)}80%{transform:rotate(10deg)}90%{transform:rotate(-6deg)}}
.cw-watch .lab{display:block;font-size:13px;letter-spacing:.06em;text-transform:uppercase;opacity:.8;margin-bottom:1px}
/* words box */
.cw-words{background:var(--tint);border-radius:14px;padding:14px 18px;margin:0 0 16px}
.cw-words .intro{margin:0 0 10px;font-size:17px;color:var(--mute);font-weight:700}
.cw-wds{display:flex;flex-wrap:wrap;gap:8px;list-style:none;padding:0;margin:0}
.cw-wds li{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:8px 14px;font-size:17px;cursor:pointer;transition:border-color .2s;max-width:100%}
.cw-wds li b{font-weight:900;color:var(--sw-ink)}
.cw-wds li b.code{font-family:var(--mono);font-weight:400;background:var(--code-bg);color:var(--code-ink);padding:1px 7px;border-radius:6px;font-size:15px}
.cw-wds li .m{display:none;color:var(--ink);margin-top:4px;font-size:16px}
.cw-wds li.on{border-color:var(--sw-ink)}.cw-wds li.on .m{display:block;animation:popIn .18s ease-out}
.cw-wds li .m a{font-size:15px}
/* drawn pictures */
.cw-drawn{margin:4px 0 18px;background:var(--bg);border:2px solid var(--line);border-radius:16px;padding:18px 20px 12px;overflow:hidden}
.cw-drawn .say{margin:10px 0 0;color:var(--mute);font-size:17px;font-weight:700;text-align:center}
.cw-drawn .stage{position:relative;min-height:150px}
.dw-cards{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;align-items:start}
.dw-card{background:var(--card);border:3px solid var(--sw);border-radius:14px;padding:10px 10px 8px;text-align:center;min-height:118px;animation:cardIn .5s ease-out both;position:relative}
.dw-card:nth-child(2){animation-delay:.25s}.dw-card:nth-child(3){animation-delay:.5s}.dw-card:nth-child(4){animation-delay:.75s}.dw-card:nth-child(5){animation-delay:1s}
.dw-card .bar{height:10px;border-radius:6px 6px 0 0;background:var(--sw);margin:-10px -10px 8px;opacity:.9}
.dw-card .ttl{font-weight:900;font-size:17px;line-height:1.15}
.dw-card .nm{font-family:var(--mono);font-size:13px;color:var(--mute);margin:2px 0 4px;word-break:break-all}
.dw-card .ln{font-size:14px;color:var(--ink);line-height:1.25}
.dw-card:not(:last-child)::after{content:"\2192 ";position:absolute;right:-16px;top:44%;color:var(--sw-ink);font-weight:900;font-size:20px;animation:arrowIn .4s ease-out both;animation-delay:inherit}
@keyframes arrowIn{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
.dw-file{margin:16px auto 0;max-width:420px;background:var(--watch);border:2px dashed var(--watch-edge);border-radius:12px;padding:10px 14px;display:flex;gap:12px;align-items:center;animation:cardIn .5s ease-out 1.3s both}
.dw-file .ic{font-size:30px}
.dw-file .ttl{font-weight:900}.dw-file .nm{font-family:var(--mono);font-size:13px;color:var(--mute)}.dw-file .ln{font-size:14px}
.dw-win{position:relative;width:min(420px,100%);margin:0 auto;background:var(--card);border:2px solid var(--line);border-radius:10px;box-shadow:var(--shadow);overflow:hidden;animation:winIn .9s cubic-bezier(.2,.9,.3,1.2) both}
.dw-win .tb{height:30px;background:var(--brand);color:var(--white);font-size:14px;font-weight:700;display:flex;align-items:center;padding:0 10px;gap:8px}
.dw-win .tb i{width:11px;height:11px;border-radius:999px;background:var(--accent);display:inline-block}
.dw-win .body{padding:14px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;min-height:90px}
.dw-win .body .pn{height:34px;border-radius:6px;background:var(--locked)}
.dw-win .body .pn.open{background:var(--open);animation:pnOpen .5s ease-out 1.3s both}
@keyframes winIn{from{opacity:0;transform:translateX(-80px) scale(.9)}to{opacity:1;transform:none}}
@keyframes pnOpen{from{background:var(--locked)}to{background:var(--open)}}
.dw-code{margin:12px auto 0;width:min(420px,100%);background:var(--code-bg);color:var(--code-ink);font-family:var(--mono);font-size:14px;border-radius:10px;padding:10px 14px;position:relative;opacity:0;animation:codeOn .6s ease-out 1.1s forwards}
@keyframes codeOn{from{opacity:0;box-shadow:0 0 0 0 var(--accent)}60%{box-shadow:0 0 0 8px color-mix(in srgb,var(--accent) 40%,transparent)}to{opacity:1;box-shadow:0 0 0 0 transparent}}
.dw-code .badge{position:absolute;right:-8px;top:-14px;background:var(--accent);color:var(--gold-ink);font-family:var(--sans);font-weight:900;font-size:14px;border-radius:999px;padding:4px 12px;transform:rotate(4deg)}
.dw-stop{display:flex;align-items:center;gap:22px;justify-content:center;flex-wrap:wrap}
.dw-stop .sign{width:110px;height:110px;background:var(--bad);color:var(--white);clip-path:polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,30% 100%,0 70%,0 30%);display:grid;place-items:center;font-weight:900;font-size:22px;animation:stopIn .6s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes stopIn{from{transform:scale(.3) rotate(-30deg);opacity:0}to{transform:none;opacity:1}}
.dw-stop .lines{font-family:var(--mono);font-size:14px;background:var(--code-bg);color:var(--code-ink);border-radius:10px;padding:10px 14px;min-width:230px}
.dw-stop .lines .d{opacity:.35;text-decoration:line-through}
.dw-mini{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.dw-mini .st{background:var(--card);border:2px solid var(--sw);border-radius:12px;padding:8px 12px;font-weight:700;font-size:15px;animation:cardIn .4s ease-out both}
.dw-mini .st:nth-child(3){animation-delay:.3s}.dw-mini .st:nth-child(5){animation-delay:.6s}.dw-mini .st:nth-child(7){animation-delay:.9s}
.dw-mini .ar{color:var(--sw-ink);font-weight:900}
.dw-note{max-width:420px;margin:0 auto;display:grid;gap:14px}
.dw-note .dw-win.shut{animation:winIn .9s cubic-bezier(.2,.9,.3,1.2) both,winShut .7s ease-in 1.1s forwards}
.dw-note .book{background:var(--watch);border:2px dashed var(--watch-edge);border-radius:12px;padding:10px 14px;font-size:14px}
.dw-note .book .ttl{font-weight:900;margin-bottom:6px}
.dw-note .book .ln{font-family:var(--mono);font-size:13px;color:var(--mute)}
.dw-note .slot{height:24px}
.dw-note .score{display:inline-block;font-family:var(--mono);font-size:13px;font-weight:700;background:var(--card);border:2px solid var(--accent);border-radius:6px;padding:0 6px;animation:scoreDrop 1s cubic-bezier(.3,.1,.3,1.3) 1.7s both}
@keyframes winShut{to{opacity:.25;transform:scale(.92)}}
@keyframes scoreDrop{from{transform:translateY(-120px);opacity:0}30%{opacity:1}to{transform:none;opacity:1}}
.dw-fresh{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:center;max-width:620px;margin:0 auto}
.dw-fresh .sc{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:12px;min-height:110px;font-size:14px}
.dw-fresh .sc .t{font-weight:900;margin-bottom:6px}
.dw-fresh .sc .l{height:9px;border-radius:5px;background:var(--line);margin:6px 0}
.dw-fresh .sc.new{border-color:var(--sw);animation:winIn .6s ease-out .5s both}
.dw-fresh .ar{font-size:28px;color:var(--sw-ink);font-weight:900}
/* panel diagram: the flow block */
.cw-flow{margin:4px 0 18px;background:var(--bg);border:2px solid var(--line);border-radius:16px;padding:16px 18px 10px}
.cw-flow .form{position:relative;margin:0 auto;background:var(--form-bg);border:2px solid var(--mute);border-radius:6px;overflow:hidden;box-shadow:var(--shadow)}
.cw-flow .form .tb{position:absolute;left:0;right:0;top:0;height:22px;background:var(--brand);color:var(--white);font-size:12px;font-weight:700;padding:0 8px;line-height:22px}
.cw-flow .fp{position:absolute;border:2px solid var(--locked);background:var(--locked);border-radius:4px;transition:background .6s,border-color .6s,box-shadow .6s;display:flex;align-items:flex-start;padding:4px 6px;font-size:11px;font-weight:700;color:var(--mute);font-family:var(--mono);overflow:hidden;overflow-wrap:anywhere;line-height:1.25}
.cw-flow .fp .k{position:absolute;right:4px;bottom:3px;font-size:14px}
.cw-flow .fp.lit{background:var(--open);border-color:var(--watch-edge);color:var(--gold-ink);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 45%,transparent)}
.cw-flow .fp.just{animation:justLit .9s ease-out}
@keyframes justLit{0%{transform:scale(1)}30%{transform:scale(1.04)}100%{transform:scale(1)}}
.cw-flow .key{display:flex;gap:16px;justify-content:center;margin:10px 0 2px;font-size:15px;font-weight:700;color:var(--mute);flex-wrap:wrap}
.cw-flow .key i{display:inline-block;width:18px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:6px}
.cw-flow .key .o i{background:var(--open);border:1px solid var(--watch-edge)}.cw-flow .key .l i{background:var(--locked)}
.cw-flow .say{margin:6px 0 0;text-align:center;color:var(--mute);font-weight:700;font-size:17px}
.cw-flow .fixed{text-align:center;font-size:15px;color:var(--mute);margin:4px 0 0}
.cw-flow .again{display:block;margin:6px auto 0}
/* picture strip: the frames block */
.cw-frames{margin:4px 0 18px;background:var(--bg);border:2px solid var(--line);border-radius:16px;padding:14px 16px 12px}
.cw-frames .ttl{font-weight:900;font-size:17px;margin:0 0 8px;display:flex;align-items:center;gap:10px}
.cw-frames .ttl .n{color:var(--mute);font-weight:700;font-size:15px;margin-left:auto}
.cw-frames .stage{position:relative;aspect-ratio:16/10;max-width:680px;margin:0 auto;background:var(--card);border:2px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer}
.cw-frames .stage img{width:100%;height:100%;object-fit:contain;display:block;animation:popIn .3s ease-out}
.cw-frames .ph{position:absolute;inset:0;display:grid;place-items:center;background:repeating-linear-gradient(135deg,var(--tint) 0 14px,var(--card) 14px 28px);color:var(--mute);font-weight:900;font-size:22px;text-align:center;padding:20px}
.cw-frames .ph small{display:block;font-weight:700;font-size:15px;margin-top:8px;max-width:520px;line-height:1.35}
.cw-frames .say{margin:10px auto 0;max-width:680px;font-size:18px;font-weight:700;min-height:1.5em;animation:popIn .3s ease-out}
.cw-frames .bar{display:flex;align-items:center;gap:8px;margin:10px auto 0;max-width:680px;flex-wrap:wrap}
.cw-frames .fdot{width:12px;height:12px;border-radius:999px;background:var(--line);border:0;padding:0;cursor:pointer}
.cw-frames .fdot.on{background:var(--sw-ink);transform:scale(1.3)}
.cw-frames .bar .btn{margin-left:auto;padding:7px 16px;font-size:16px}
.cw-frames .prog{position:absolute;left:0;bottom:0;height:5px;background:var(--sw-ink);width:0;transition:none}
.cw-frames .prog.run{width:100%;transition:width var(--dur,2s) linear}
/* IntelliSense animation */
.cw-isense{margin:4px 0 14px;background:var(--code-bg);color:var(--code-ink);border-radius:16px;padding:14px 18px 14px;position:relative;overflow:hidden}
.cw-isense .ttl{font-family:var(--sans);font-weight:900;font-size:17px;color:var(--accent);margin:0 0 10px;display:flex;align-items:center;gap:10px}
.cw-isense .ttl .btn{margin-left:auto;padding:5px 14px;font-size:15px;background:transparent;border-color:var(--tok-c);color:var(--code-ink)}
.cw-isense .line{font-family:var(--mono);font-size:18px;min-height:30px;white-space:pre}
.cw-isense .caret{display:inline-block;width:2px;height:1.15em;background:var(--code-ink);vertical-align:-3px;animation:blink .9s step-end infinite}
@keyframes blink{50%{opacity:0}}
.cw-isense .list{display:none;margin:6px 0 0 20px;width:min(360px,90%);background:var(--isense-bg);border:1px solid var(--isense-edge);border-radius:8px;overflow:hidden;font-family:var(--mono);font-size:15px}
.cw-isense .list.on{display:block;animation:popIn .25s ease-out}
.cw-isense .list div{padding:5px 10px;display:flex;gap:8px;align-items:center}
.cw-isense .list div i{font-style:normal;width:14px;height:14px;border-radius:3px;background:var(--tok-n);display:inline-block;flex:none}
.cw-isense .list div.sel{background:var(--brand);color:var(--white)}
.cw-isense .list div b{font-weight:400;color:var(--accent)}
.cw-isense .fixed{font-family:var(--sans);font-size:17px;margin:12px 0 0;color:var(--code-ink);opacity:.9;font-weight:700}
.cw-isense .ig{display:grid;grid-template-columns:minmax(0,400px) minmax(0,1fr);gap:6px 28px;align-items:start}
.cw-isense .ir .fixed{margin:4px 0 0;font-size:18px;line-height:1.45}
.cw-isense .ir .fixed + .fixed{margin-top:10px}
.cw-isense .fixed + .fixed{margin-top:4px;opacity:.75;font-weight:400}
/* names strip */
.cw-names{margin:4px 0 14px;border:2px solid var(--line);border-radius:16px;padding:10px 16px;background:var(--card)}
.cw-names .ttl{font-weight:900;font-size:17px;margin:0 0 6px}
.cw-names ul{list-style:none;padding:0;margin:0;display:flex;flex-wrap:wrap;gap:8px}
.cw-names li{display:inline-flex;align-items:center;flex-wrap:wrap;gap:6px 8px;background:var(--tint);border-radius:10px;padding:5px 10px;font-size:16px}
.cw-names li span{flex:1 1 160px;min-width:0}
.cw-names li code{font-family:var(--mono);background:var(--code-bg);color:var(--code-ink);border-radius:6px;padding:2px 8px;font-size:15px}
.cw-names .fixed{margin:8px 0 0;font-size:16px;font-weight:700}
@media (min-width:1100px){.cw-names ul{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px}.cw-names li{display:flex}}
.cw-names .how{margin-top:6px}
/* steps */
.cw-steps{list-style:none;padding:0;margin:0 0 16px;counter-reset:st}
.cw-step{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:6px 14px;padding:14px 0;border-top:2px solid var(--line);animation:cardIn .35s ease-out both}
.cw-step > .do,.cw-step > .cw-see,.cw-step > .cw-wrong{grid-column:2;align-self:start}
.cw-step{grid-template-rows:auto auto 1fr}
.cw-step:first-child{border-top:0}

/* platform/lessonview.js \u2014 one lesson as one part sees it (D35). Public: lessons carry no exam answers.
 * A lesson holds ONE annotated whole statement (src). Its fragments are tagged with step ids:

 *   \u27eaid|then|else\u27eb   else shows while step id is hidden for this part or not yet reached
 *   \u27ea<id|text\u27eb       the text shows only until step id is reached (a placeholder, e.g. a cloze blank)
 *   \u27ea@id\u27eb            a line guard: the whole line shows only once step id is visible and reached
 *   \u27ea@a,b\u27eb           a line guard naming several steps: the line shows once ANY of them is visible and reached

 * A step shows for a part when it has no `need`, or `need` meets the part's skills, no skill of the part is in `not`,

 * tables = [{name, cols:[[field, type]], pk?, fk?, need?, not?, parts?}] replaces the lesson-set table of that name in the lesson pane

 * lesson's `gate` SQL applied first.

 * checks every row is in its result (all: the rows are the whole result, in any order). grid may be a list of variants

 * Tokens in any string: {todayIso} 2026-09-27 \u00b7 {todayUK} 27/09/2026 \u00b7 {todayLong} 27 September 2026 \u00b7 {todayDay} Sunday.
 * {mon1Iso} 2026-09-07 \u00b7 {mon1Long} 7 September 2026: the first Monday of this month, the seed's date('now','start of month','weekday 1').
 * {agoIso:N} the date N days before today, 2026-09-15 for {agoIso:12}: the seed's date('now','-N days'), for grid rows.
 * {aheadIso:N} the date N days after today, 2026-10-07 for {aheadIso:10}: the seed's date('now','+N days').
 * {wdIso:W,K} the first date on weekday W (0 Sunday to 6 Saturday) at least K days after today: the seed's date('now','+K days','weekday W').

      const sql = s.sql != null ? T(s.sql) : src ? T(statement(src, s.whole ? all : reach)) : '';
      const hl = s.hl ? { pane: s.hl.pane || 'lesson', t: (Array.isArray(s.hl.t) ? items(s.hl.t, part)[0] : s.hl.t) || null, f: (s.hl.f || []).concat(...(s.hl.extra || []).filter((x) => meets(x, part)).map((x) => x.f)), say: T(line(joined(s.hl.say), all)) } : null;

      const u = UNIT[(a[0] || '').toLowerCase()] || 'day'; const n = a[1] || '0'; const d = asDate(a[2] || "date('now')");
      // MINUTE/HOUR keep the time: a time ('17:00', '17:00:00') stays a time, a date-time stays a date-time
      if (u === 'minute' || u === 'hour') { const x = a[2] || "datetime('now')"; return "(CASE WHEN length(" + x + ") <= 8 THEN strftime('%H:%M', " + x + ", (" + n + ") || ' " + u + "s') ELSE datetime(" + x + ", (" + n + ") || ' " + u + "s') END)"; }
      if (u === 'week') return 'date(' + d + ", ((" + n + ") * 7) || ' days')";
      if (u === 'month' || u === 'year') {
        const k = u === 'year' ? '((' + n + ') * 12)' : '(' + n + ')';
        return 'date(' + d + ", 'start of month', " + k + " || ' months', '+' || (min(CAST(strftime('%d', " + d + ") AS INTEGER), CAST(strftime('%d', date(" + d + ", 'start of month', (" + k + " + 1) || ' months', '-1 day')) AS INTEGER)) - 1) || ' days')";
      }
      return 'date(' + d + ', (' + n + ") || ' " + u + "s')";
    });
    // DATEDIFF(unit, a, b)
    sql = rewriteCalls(sql, 'DATEDIFF', (a) => { const u = UNIT[(a[0] || '').toLowerCase()] || 'day'; const x = a[1], y = a[2]; if (u === 'day') return 'CAST(julianday(' + asDate(y) + ') - julianday(' + asDate(x) + ') AS INTEGER)'; if (u === 'week') return "(CAST((julianday(" + asDate(y) + ") - julianday('1899-12-31')) / 7 AS INTEGER) - CAST((julianday(" + asDate(x) + ") - julianday('1899-12-31')) / 7 AS INTEGER))"; if (u === 'month') return "((CAST(strftime('%Y'," + y + ") AS INTEGER) - CAST(strftime('%Y'," + x + ") AS INTEGER)) * 12 + CAST(strftime('%m'," + y + ") AS INTEGER) - CAST(strftime('%m'," + x + ") AS INTEGER))"; if (u === 'year') return "(CAST(strftime('%Y'," + y + ") AS INTEGER) - CAST(strftime('%Y'," + x + ") AS INTEGER))"; if (u === 'minute') return "(CAST(strftime('%s'," + y + ") AS INTEGER) / 60 - CAST(strftime('%s'," + x + ") AS INTEGER) / 60)"; return "(CAST(strftime('%s'," + y + ") AS INTEGER) / 3600 - CAST(strftime('%s'," + x + ") AS INTEGER) / 3600)"; });
    // YEAR/MONTH/DAY(d), DATEPART(unit, d)
    sql = rewriteCalls(sql, 'YEAR', (a) => "CAST(strftime('%Y'," + a[0] + ') AS INTEGER)');
    sql = rewriteCalls(sql, 'MONTH', (a) => "CAST(strftime('%m'," + a[0] + ') AS INTEGER)');
    sql = rewriteCalls(sql, 'DAY', (a) => "CAST(strftime('%d'," + a[0] + ') AS INTEGER)');
    sql = rewriteCalls(sql, 'DATEPART', (a) => { const u = UNIT[(a[0] || '').toLowerCase()] || 'day'; const f = { year: '%Y', month: '%m', day: '%d', week: '%W', minute: '%M', hour: '%H' }[u]; return "CAST(strftime('" + f + "'," + a[1] + ') AS INTEGER)'; });
    // TOP n \u2192 LIMIT n (appended)
    const top = /\bSELECT\s+(DISTINCT\s+)?TOP\s+(\d+)\s+/i.exec(sql);
    if (top) { sql = sql.replace(top[0], 'SELECT ' + (top[1] || '')); sql = sql.replace(/;?\s*$/, ' LIMIT ' + top[2]); }
    // CREATE TABLE bits SQLite lacks: IDENTITY(1,1) \u2192 drop (INTEGER PRIMARY KEY autoincrements); inline FOREIGN KEY REFERENCES \u2192 REFERENCES
    sql = sql.replace(/\bIDENTITY\s*(\(\s*\d+\s*,\s*\d+\s*\))?/gi, '').replace(/\bFOREIGN\s+KEY\s+REFERENCES\b/gi, 'REFERENCES');
    sql = sql.replace(/\b(N?VARCHAR|NCHAR|CHAR)\s*\(\s*(\d+|MAX)\s*\)/gi, 'TEXT').replace(/\bDATETIME2?\b/gi, 'DATE').replace(/\bMONEY\b/gi, 'REAL');
    // DEFAULT GETDATE(): SQLite wants an expression default in brackets
    sql = sql.replace(/\bDEFAULT\s+(date\('now'\))/gi, 'DEFAULT ($1)');
    // string concatenation: 'a' + b \u2192 'a' || b   (only when a literal or a known text column sits on one side)
    sql = sql.replace(/(\u0001\d+\u0001)\s*\+\s*/g, '$1 || ').replace(/\s*\+\s*(\u0001\d+\u0001)/g, ' || $1');
    // ISNULL \u2192 IFNULL, LEN \u2192 LENGTH
    sql = sql.replace(/\bISNULL\s*\(/gi, 'IFNULL(').replace(/\bLEN\s*\(/gi, 'LENGTH(');
    // ORDER BY Name where the SELECT list has t.Name: SQL Server sorts by that output column; SQLite calls it ambiguous
    const sel = /^\s*SELECT\s+(?:DISTINCT\s+)?([\s\S]*?)\bFROM\b/i.exec(sql);
    const ob = /\bORDER\s+BY\s+([\s\S]*?)(\s+LIMIT\s+\d+)?\s*;?\s*$/i.exec(sql);
    if (sel && ob) {
      const q = {};
      args(sel[1]).forEach((it) => { const m = /^(\w+)\.(\w+)$/.exec(it.trim()); if (m) q[m[2].toLowerCase()] = m[1] + '.' + m[2]; });
      const terms = args(ob[1]).map((t) => { const m = /^(\w+)(\s+(?:ASC|DESC))?$/i.exec(t.trim()); return m && q[m[1].toLowerCase()] ? q[m[1].toLowerCase()] + (m[2] || '') : t; });
      sql = sql.slice(0, ob.index) + 'ORDER BY ' + terms.join(', ') + (ob[2] || '') + sql.slice(ob.index + ob[0].length).replace(/^/, /;\s*$/.test(ob[0]) ? ';' : '');
    }
    // statements written without semicolons (SQL Server allows it; SQLite does not): a new line that starts a statement ends the last one
    sql = splitStatements(sql);
    // restore literals
    sql = sql.replace(/\u0001(\d+)\u0001/g, (m, i) => lits[+i]);
    return sql.trim();
  }
  return { convert };
});

</script>
<script>
/* platform/editor.js \u2014 the SQL editor (SPEC 4, his ruling on SSMS colours). A transparent textarea over a coloured <pre>,
 * with a line-number gutter and the current line tinted while focused. Colours as SQL Server Management Studio:
 * keywords #0000FF, built-in functions #FF00FF, strings #FF0000, comments #008000, operators #808080, names and numbers #000000.
 * Enter keeps the indent; Tab inserts 4 spaces. 6 lines tall, grows to 20, then scrolls; long lines scroll sideways (no wrap).
 * window.SqlEditor.create(host, {value, readOnly, placeholder, label, onChange}) -> {get, set, focus, el}
 * window.SqlEditor.html(sql) -> coloured HTML. */
(function () {
  'use strict';
  const KEYWORDS = new Set(('select from where and or not in is null as on join inner left right full outer cross group by having order asc desc distinct top ' +
    'insert into values update set delete create table alter add drop column primary key foreign references constraint unique check default identity ' +
    'int integer smallint bigint varchar nvarchar char nchar date datetime time decimal numeric float money bit text between like exists case when then else end ' +
    'union all go with begin declare').split(' '));
  const FUNCS = new Set(('count sum avg min max getdate dateadd datediff datepart year month day cast convert len upper lower round isnull coalesce substring ' +
    'replace concat abs floor ceiling sysdatetime datename current_timestamp').split(' '));
  const BARE = new Set(['getdate', 'current_timestamp', 'sysdatetime']);
  const LINE = 22.5, MIN = 6, MAX = 20;
  const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

  function html(src) {
    let out = '', i = 0;
    const s = src || '';
    while (i < s.length) {
      const ch = s[i];
      if (ch === '-' && s[i + 1] === '-') { let j = s.indexOf('\n', i); if (j < 0) j = s.length; out += '<span class="c">' + esc(s.slice(i, j)) + '</span>'; i = j; continue; }
      if (ch === '/' && s[i + 1] === '*') { let j = s.indexOf('*/', i + 2); j = j < 0 ? s.length : j + 2; out += '<span class="c">' + esc(s.slice(i, j)) + '</span>'; i = j; continue; }
      if (ch === "'") {
        let j = i + 1;
        while (j < s.length) { if (s[j] === "'" && s[j + 1] === "'") { j += 2; continue; } if (s[j] === "'") { j++; break; } j++; }
        out += '<span class="s">' + esc(s.slice(i, j)) + '</span>'; i = j; continue;
      }
      if (ch === '[') { let j = s.indexOf(']', i); j = j < 0 ? s.length : j + 1; out += '<span class="n">' + esc(s.slice(i, j)) + '</span>'; i = j; continue; }
      if (/[A-Za-z_@#]/.test(ch)) {
        let j = i + 1;
        while (j < s.length && /[\w$]/.test(s[j])) j++;
        const w = s.slice(i, j), lw = w.toLowerCase();
        let cls = 'n';
        if (FUNCS.has(lw) && (/^\s*\(/.test(s.slice(j)) || BARE.has(lw))) cls = 'f';
        else if (KEYWORDS.has(lw)) cls = 'k';
        out += '<span class="' + cls + '">' + esc(w) + '</span>'; i = j; continue;
      }
      if (/[0-9]/.test(ch)) { let j = i + 1; while (j < s.length && /[\d.]/.test(s[j])) j++; out += '<span class="n">' + esc(s.slice(i, j)) + '</span>'; i = j; continue; }
      if (/[=<>!+\-*\/%]/.test(ch)) { out += '<span class="o">' + esc(ch) + '</span>'; i++; continue; }
      out += esc(ch); i++;
    }
    return out + '\n';
  }

  function create(host, opts) {
    opts = opts || {};
    host.classList.add('ed');
    host.innerHTML = '<div class="ed-g"><div class="ed-gi"></div></div><div class="ed-c"><div class="ed-cur"></div><pre></pre></div>';
    const gi = host.querySelector('.ed-gi'), wrap = host.querySelector('.ed-c'), pre = wrap.querySelector('pre'), cur = wrap.querySelector('.ed-cur');
    const gutter = (n) => { let t = ''; for (let k = 1; k <= n; k++) t += k + '\n'; gi.textContent = t; };
    if (opts.readOnly) {
      host.classList.add('ro');
      let val = opts.value || '';
      const show = () => { pre.innerHTML = html(val); gutter(Math.max(1, val.split('\n').length)); };
      show();
      if (opts.label) host.setAttribute('aria-label', opts.label);
      return { el: host, get: () => val, set: (v) => { val = v || ''; show(); }, focus: () => {} };
    }
    const ta = document.createElement('textarea');
    ta.spellcheck = false; ta.wrap = 'off'; ta.placeholder = opts.placeholder || '';
    ta.setAttribute('autocapitalize', 'off'); ta.setAttribute('autocomplete', 'off'); ta.setAttribute('autocorrect', 'off');
    if (opts.label) ta.setAttribute('aria-label', opts.label);
    wrap.appendChild(ta);
    let lines = 0;
    function size() {
      const n = Math.max(1, ta.value.split('\n').length);
      const rows = Math.min(MAX, Math.max(MIN, n));
      ta.style.height = (rows * LINE + 20) + 'px';
      if (n !== lines) { lines = n; gutter(Math.max(n, rows)); }
    }
    function follow() {
      pre.style.transform = 'translate(' + (-ta.scrollLeft) + 'px,' + (-ta.scrollTop) + 'px)';
      gi.style.transform = 'translateY(' + (-ta.scrollTop) + 'px)';
      const row = ta.value.slice(0, ta.selectionStart).split('\n').length - 1;
      cur.style.top = (10 + row * LINE - ta.scrollTop) + 'px';
    }
    function paint(silent) { pre.innerHTML = html(ta.value); size(); follow(); if (!silent && opts.onChange) opts.onChange(ta.value); }
    function put(text) {
      const a = ta.selectionStart, b = ta.selectionEnd;
      ta.setRangeText(text, a, b, 'end');
      paint();
    }
    ta.addEventListener('input', () => paint());
    ta.addEventListener('scroll', follow);
    ['keyup', 'click', 'focus', 'select'].forEach((ev) => ta.addEventListener(ev, follow));
    ta.addEventListener('keydown', (e) => {
      if (e.key === 'Tab' && !e.shiftKey && !e.ctrlKey && !e.metaKey && !e.altKey) { e.preventDefault(); put('    '); return; }
      if (e.key === 'Enter' && !e.shiftKey && !e.ctrlKey && !e.metaKey && !e.altKey && !e.isComposing) {
        const a = ta.selectionStart, start = ta.value.lastIndexOf('\n', a - 1) + 1, indent = /^[ \t]*/.exec(ta.value.slice(start, a))[0];
        e.preventDefault(); put('\n' + indent);
      }
    });
    ta.value = opts.value || '';
    paint(true);
    return { el: host, get: () => ta.value, set: (v) => { ta.value = v || ''; paint(); }, focus: () => ta.focus() };
  }
  window.SqlEditor = { create, html };
})();

</script>
<script>
/* platform/lesson.js \u2014 Beat 2, the lesson (\u00a712a; his prototype look, 26 Sep 2026). Ported from prototype/lesson.js.
 * The lesson announces itself, teaches on the Tinies tables one step per skill, and each step ends in a quick check that reads
 * the EXAM design (never a line of the exam answer). Input is LessonView.view(lesson, part, today): only this part's steps.
 * window.Lesson.render(host, o) -> {destroy}
 *   o: { view, state:{step, done:{id:{how,msg}}, tries:{id:n}, wrong:{id:[picked]}, seed, finished}, save(), onOut(beat), T(key, vars),
 *        figure: { examHtml(), showPane(id), highlight(spec), pickable(pane, kind, cb, otherCb) } }
 * Checks: choose (options shuffled once per state) \u00b7 field (click a field; answer may be a list, D53) \u00b7 table (click a table).
 * A wrong pick shows wrong[picked], then outside, then wrong['*'] (D62) and stays struck out; after two wrong the answer is shown,
 * with every wrong pick still struck. Next opens once the check is settled; Back is always there. */
(function () {
  'use strict';
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  // the statement, one line per row; new lines since the last step marked .new; text answers are not coloured
  function blockHtml(text, prev, isText, extra) {
    const lines = String(text || '').split('\n'), fresh = prev == null ? lines.map(() => false) : LessonView.newLines(text, prev);
    return '<pre class="lsql' + (isText ? ' txt' : '') + (extra ? ' ' + extra : '') + '">' + lines.map((line, i) =>
      '<div class="ln' + (fresh[i] ? ' new' : '') + '">' + (isText ? esc(line) : SqlEditor.html(line).replace(/\n$/, '')) + '</div>').join('') + '</pre>';
  }
  function shuffled(arr, seed) { // stable shuffle per lesson state, so a reload keeps the order
    const a = arr.slice(); let s = seed || 1;
    for (let i = a.length - 1; i > 0; i--) { s = (s * 9301 + 49297) % 233280; const j = Math.floor((s / 233280) * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }
  const answers = (c) => [].concat(c.answer);
  const tableOf = (f) => String(f).split('.')[0];

  function render(host, o) {
    const V = o.view, T = o.T, st = o.state, steps = V.steps, n = steps.length, isText = V.answer === 'text';
    st.step = Math.min(Math.max(st.step || 0, 0), n - 1);
    st.done = st.done || {}; st.tries = st.tries || {}; st.wrong = st.wrong || {};
    if (!st.seed) st.seed = 1 + (Date.now() % 100000);
    let pickOff = null;

    const settled = (k) => !steps[k].check || !!st.done[steps[k].id];
    function maxReach() { let m = 0; while (m < n - 1 && settled(m)) m++; return m; }

    function strip() {
      const reach = maxReach();
      return '<ol class="steps">' + steps.map((s, k) => {
        const ok = !!st.done[s.id] || (!s.check && k < st.step);
        return '<li class="' + (k < st.step ? 'done' : k === st.step ? 'now' : '') + (ok ? ' ok' : '') + '"' + (k <= reach && k !== st.step ? ' data-step="' + k + '" role="button" tabindex="0"' : '') +
          '><i>' + (ok && k !== st.step ? '\u2713' : k + 1) + '</i><span>' + esc(s.name) + '</span></li>';
      }).join('') + '</ol>';
    }

    function checkHtml(s) {
      const c = s.check; if (!c) return '';
      const done = st.done[s.id], tries = st.tries[s.id] || 0, wrong = st.wrong[s.id] || [];
      const tryLine = tries && !done ? ' <small>' + esc(tries === 1 ? T('lesson.try1') : T('lesson.tries', { n: tries })) + '</small>' : '';
      let inner = '<p class="q">' + esc(c.q) + '</p>';
      const design = o.figure && o.figure.examHtml ? '<div class="qfig" data-qfig><p class="cap">' + esc(T('lesson.qfigCap', { year: o.year })) + '</p>' + o.figure.examHtml() + '</div>' : '';
      if (c.kind === 'choose') {
        const opts = shuffled(c.opts.map((op, i) => Object.assign({ i }, op)), st.seed + steps.indexOf(s) * 7);
        inner += design + '<div class="opts">' + opts.map((op) => {
          const struck = wrong.includes(op.i), cls = struck ? ' wrong' : done && op.ok ? ' right' : '';
          return '<button class="opt' + cls + '" data-opt="' + op.i + '"' + (done || struck ? ' disabled' : '') + '>' + esc(op.t) + '</button>';
        }).join('') + '</div>';
      } else {
        inner += (done ? '' : '<p class="note">' + esc(T('lesson.clickDesign')) + '</p>') + design;
      }
      inner += '<div class="fb" data-fb>' + (done ? '<p class="' + (done.how === 'right' ? 'okline' : 'revealed') + '">' + esc(done.msg) + '</p>' : '') + '</div>';
      return '<div class="qcheck' + (done ? ' settled' : '') + '"><h4>' + esc(T('lesson.quick')) + tryLine + '</h4>' + inner + '</div>';
    }

    function gridHtml(g) {
      return '<div class="lgrid"><span class="lab">' + esc(g.cap) + '</span><table><tr>' + g.cols.map((c) => '<th>' + esc(c) + '</th>').join('') + '</tr>' +
        g.rows.map((r) => '<tr>' + r.map((c) => (c == null ? '<td class="null">' + esc(T('lesson.nullCell')) + '</td>' : '<td>' + esc(c) + '</td>')).join('') + '</tr>').join('') + '</table></div>';
    }

    function stepHtml(k) {
      const s = steps[k];
      let html = '<div class="lstep"><div class="lhead"><span class="lnum">' + esc(T('lesson.step', { k: k + 1, n })) + '</span><h3>' + esc(s.title) + '</h3></div>';
      html += '<div class="teach">' + s.teach.map((p) => '<p>' + esc(p) + '</p>').join('') + '</div>';
      if (s.hl && s.hl.say) html += '<p class="say">' + esc(s.hl.say) + '</p>';
      if (s.write && s.write.length) html += '<span class="lab">' + esc(T('lesson.write')) + '</span><ul class="lwrite">' + s.write.map((w) => '<li>' + esc(w) + '</li>').join('') + '</ul>';
      if (s.shape) html += '<div class="shape"><span class="lab">' + esc(T('lesson.shape')) + '</span>' + blockHtml(s.shape, null, isText, 'shp') + '</div>';
      if (s.example && s.example.length) html += '<span class="lab">' + esc(T('lesson.example')) + '</span>' + blockHtml(s.example.join('\n'), null, isText);
      if (s.sql) {
        const lab = s.whole ? T(isText ? 'lesson.wholeText' : 'lesson.whole') : s.prev != null ? T(isText ? 'lesson.soFarTextNew' : 'lesson.soFarNew') : T(isText ? 'lesson.soFarText' : 'lesson.soFar');
        html += '<div class="grow"><span class="lab">' + esc(lab) + '</span>' + blockHtml(s.sql, s.whole ? null : s.prev, isText) + '</div>';
      }
      if (s.grid) html += gridHtml(s.grid);
      if (s.whole && (s.why.length || s.marks.length)) {
        html += '<div class="whycard">' + (s.why.length ? '<h4>' + esc(T('lesson.why')) + '</h4><ol>' + s.why.map((w) => '<li>' + esc(w) + '</li>').join('') + '</ol>' : '') +
          (s.marks.length ? '<h4>' + esc(T('lesson.marks')) + '</h4><ul class="marklist">' + s.marks.map((m) => { const mm = /^\[([^\]]+)\]\s*(.*)$/.exec(m); return '<li><span>' + esc(mm ? mm[2] : m) + '</span>' + (mm ? '<span class="mk">' + esc(mm[1]) + '</span>' : '') + '</li>'; }).join('') + '</ul>' : '') + '</div>';
      }
      html += checkHtml(s);
      html += '<div class="row lnav">' + (k > 0 ? '<button class="btn ghost" data-back>' + esc(T('lesson.back')) + '</button>' : '<button class="btn ghost" data-out="ask">' + esc(T('lesson.backQ')) + '</button>') +
        (k < n - 1 ? '<button class="btn" data-next' + (settled(k) ? '' : ' disabled') + '>' + esc(T('lesson.next', { name: steps[k + 1].name })) + '</button>' + (settled(k) ? '' : '<span class="note">' + esc(T('lesson.answerFirst')) + '</span>')
          : '<button class="btn" data-out="turn"' + (settled(k) ? '' : ' disabled') + '>' + esc(T('lesson.toTurn')) + '</button>' + (settled(k) ? '' : '<span class="note">' + esc(T('lesson.answerFirst')) + '</span>')) + '</div></div>';
      return html;
    }

    // light the answer, in the side figure and in the design inside the check
    function lightAnswer(c) {
      const spec = { pane: c.pane || 'exam', f: c.kind === 'field' ? answers(c) : [], t: c.kind === 'table' ? c.answer : null, strong: true };
      if (o.figure) o.figure.highlight(spec);
      const qf = host.querySelector('[data-qfig]'); if (!qf) return;
      if (c.kind === 'table') qf.querySelectorAll('.tbl[data-t]').forEach((t) => { if (t.dataset.t === c.answer) t.classList.add('hl', 'strong'); });
      else qf.querySelectorAll('tr[data-f]').forEach((r) => { if (answers(c).includes(r.dataset.f)) { r.classList.add('hl', 'strong'); const t = r.closest('.tbl'); if (t) t.classList.add('hl2'); } });
    }

    function paint(scroll) {
      if (pickOff) { pickOff(); pickOff = null; }
      const s = steps[st.step], c = s.check, d = c && st.done[s.id];
      host.innerHTML = '<div class="banner"><b>' + esc(T('lesson.banner')) + '</b> ' + esc(V.banner) + '</div><div class="card lesson"><div class="ltask">' + esc(V.task) + '</div>' + strip() + stepHtml(st.step) + '</div>';
      if (o.figure) {
        if (c && d && c.kind !== 'choose') lightAnswer(c);
        else { o.figure.highlight(s.hl ? { pane: s.hl.pane || 'lesson', t: s.hl.t, f: s.hl.f } : null); if (!s.hl) o.figure.showPane('lesson'); }
      }
      wire();
      if (c && !d && c.kind !== 'choose') {
        const qf = host.querySelector('[data-qfig]');
        if (qf) {
          qf.classList.add(c.kind === 'table' ? 'pick-tables' : 'pick-fields');
          qf.addEventListener('click', (e) => { const hit = c.kind === 'table' ? e.target.closest('.tbl[data-t]') : e.target.closest('tr[data-f]'); if (hit) answer(c.kind === 'table' ? hit.dataset.t : hit.dataset.f); });
        }
        // the side figure answers too: a click on the exam pane counts; a click on the lesson pane is told so and switched over
        if (o.figure) pickOff = o.figure.pickable(c.pane || 'exam', c.kind, (picked) => answer(picked), () => {
          const fb = host.querySelector('[data-fb]'); if (fb) fb.innerHTML = '<p class="notthat">' + esc(T('lesson.otherPane')) + '</p>'; o.figure.showPane(c.pane || 'exam');
        });
      }
      if (scroll !== false) { const w = host.closest('.work'); if (w) w.scrollTop = 0; }
    }

    function answer(picked) {
      const s = steps[st.step], c = s.check, fb = host.querySelector('[data-fb]');
      if (!c || st.done[s.id]) return;
      let right, why;

}
function tickAll(ctx) {

}

  } else if (kind === 'chapter-done') {

    else {
      const b = el(`<button class="btn big gold">${esc(t('foot.chapterDone', { n: ctx.ch.n }))}</button>`);
      b.addEventListener('click', () => { tickAll(ctx); const d = done(); d[ctx.chId] = true; store('done', d); b.disabled = true; confetti([sw, '#FFC53D', '#4F2D9E', '#1B7F3B']); later(() => { location.hash = '#cw'; }, 1300); });
      f.appendChild(b); f.appendChild(el(`<span class="note">${esc(t('foot.chapterDoneSub'))}</span>`));
    }
  }
  return f;
}
function refreshFoot(ctx) { const old = $('.cw-foot', S.host); if (old) old.replaceWith(foot(ctx)); }

/* ---------- routes and boot ---------- */
function route() {
  const m = location.hash.match(/^#cw(?:\/(\d\d)(?:\/([\d]+-[\d]+))?)?$/);
  if (!m || !m[1]) { S.opened = null; return Promise.resolve(home()); }
  return chapter(m[1], m[2]).catch(e => { console.error(e); home(); });
}
function shell() {
  /* the toast, the names sheet and the confetti live on the body, once */
  if (!$('#toast')) document.body.appendChild(el(`<div class="toast" id="toast" role="status" aria-live="polite"></div>`));
  if (!$('#sheet')) {
    document.body.appendChild(el(`<div class="sheet-wrap" id="sheet"><button class="dim" aria-label="${esc(t('sheet.close'))}"></button><aside class="sheet" role="dialog" aria-modal="true"><div class="sheet-top"><h2></h2><button class="close" aria-label="${esc(t('sheet.close'))}">\u00d7</button></div><div class="sheet-body"></div></aside></div>`));

}
let ready = null;
function mount(host, opts) {
  S.host = host; S.base = opts.base || S.base; S.api = opts.api || {};
  if (opts.strings) S.T = opts.strings;
  if (new URLSearchParams(location.search).get('fast')) S.fast = true;
  document.documentElement.classList.toggle('no-motion', S.fast);
  shell();
  ready = Promise.all([getJSON(S.base + 'index.json'), getJSON(S.base + 'controls.json'), getJSON(S.base + 'names.json'), getJSON(S.base + 'ch00.json')])
    .then(([ix, co, nm, c0]) => { S.index = ix; S.controls = co; S.names = nm; S.ch['00'] = c0; });
  return ready;
}
/* the platform calls show on every #cw hash; it resolves to the chapter on screen (or null on the checklist) */
function show(hash) {
  if (hash && location.hash !== hash) history.replaceState(null, '', hash);
  return ready.then(route).then(() => (S.cur ? { n: S.cur.ch.n, title: S.cur.ch.title } : null), e => { console.error(e); S.host.textContent = t('cw.failed'); return null; });
}
window.CW = { S, mount, show, openSheet, route };
})();

</script>
<script>
/* platform/app.js \u2014 the pupil page (SPEC \u00a73\u2013\u00a711, \u00a712a). Every pupil string comes from strings.json (D5); every mark from the server.
 * Screens: guard \u00b7 home \u00b7 SQL map \u00b7 paper \u00b7 part (door \u00b7 the question \u00b7 the lesson \u00b7 your turn \u00b7 another question) \u00b7 How did it go?
 * The staff page is staff.js (a bare /exec link with no class). window.App.boot() starts it. */
(function () {
  'use strict';
  const C = window.A2CONTENT, S = C.strings;
  const T = (k, v) => { const s = S[k]; if (s == null) return k; return v ? s.replace(/\{(\w+)\}/g, (m, x) => (v[x] != null ? v[x] : m)) : s; };
  const h = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const PAPERS = {}, PARTS = {};
  C.papers.forEach((p) => { PAPERS[p.id] = p; p.parts.forEach((q) => { PARTS[q.id] = { paper: p, part: q }; }); });
  const label = (q) => q.label || q.id.split('-').pop();
  const marksText = (n) => (n === 1 ? T('part.mark1') : T('part.marks', { n }));
  const pad = (n) => (n < 10 ? '0' : '') + n;
  const today = () => { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
  const BUILD = String(window.A2_DEPLOY || '').replace(/^a2ssd-/, '');
  const isText = (q) => q.kind === 'text' || q.kind === 'rows' || q.type === 'prose' || q.type === 'short' || q.type === 'rows';
  let app, ME = { email: '', cls: '', name: '' }, REC = { n: '', P: {}, E: {} }, CFG = { order: C.papers.map((p) => p.id), open: [] };

  // ---------- local storage (per-viewer mirror; every read and write guarded) ----------
  const LS = {
    // keyed by the signed-in account, so two pupils sharing one browser never see each other's drafts, doors or marks
    key(k) { return (ME.email || '?') + '|' + k; },
    get(k) { try { const v = localStorage.getItem(LS.key(k)); return v == null ? null : JSON.parse(v); } catch (e) { return null; } },
    set(k, v) { try { if (v == null) localStorage.removeItem(LS.key(k)); else localStorage.setItem(LS.key(k), JSON.stringify(v)); } catch (e) {} }
  };

  // ---------- system line: offline \u00b7 sign-in expired \u00b7 stale build ----------
  const SYS = { offline: false, expired: false, stale: false, retry: null };
  function paintSys() {
    const el = document.getElementById('sys'); if (!el) return;
    let html = '';
    if (SYS.expired) html = '<span>' + h(T('sys.expired')) + '</span><button class="btn" data-sys="reload">' + h(T('sys.reload')) + '</button>';
    else if (SYS.offline) html = '<span>' + h(T('sys.offline')) + '</span><button class="btn" data-sys="retry">' + h(T('sys.retry')) + '</button>';
    else if (SYS.stale) html = '<span>' + h(T('sys.stale')) + '</span><button class="btn" data-sys="reload">' + h(T('sys.reload')) + '</button>';
    el.className = html ? 'sysbar' + (SYS.expired || SYS.offline ? ' bad' : '') : '';
    el.innerHTML = html;
  }

  // ---------- server calls ----------
  function call(fn, req) {
    req = Object.assign({ cls: ME.cls }, req || {});
    return window.OLS_TRANSPORT.call(fn, req).then((r) => {
      if (SYS.offline) { SYS.offline = false; paintSys(); flushOutbox(); }
      if (r && r.v && BUILD && r.v !== BUILD && !SYS.stale) { SYS.stale = true; paintSys(); }
      if (!r || r.ok === false) {
        const code = (r && r.error) || 'error';
        if (code === 'not-signed-in') { SYS.expired = true; paintSys(); }
        const e = new Error(code); e.code = code; throw e;
      }
      if (r.rec) REC = r.rec;
      if (r.cfg) CFG = r.cfg;
      if (r.part && req.part) REC.P[req.part] = r.part;
      return r;
    }, (err) => {
      SYS.offline = true; SYS.retry = () => call(fn, req); paintSys();
      const e = new Error('offline'); e.code = 'offline'; e.cause = err; throw e;
    });
  }

  // ---------- the pupil's own drafts and lesson state: local first, server copy for another machine (D84) ----------
  const kvTimers = {};
  function kvKey(kind, part, twin) { return kind + ':' + ME.cls + ':' + part + (twin ? ':t' : ''); }
  function kvPut(key, val) {
    const box = val == null ? null : { v: val, at: Date.now() };

    clearTimeout(kvTimers[key]);
    kvTimers[key] = setTimeout(() => { delete kvTimers[key]; call('apiKv', { op: 'set', key, val: box ? JSON.stringify(box) : '' }).catch(() => {}); }, 1000);
  }
  function kvLocal(key) { const b = LS.get('a2kv:' + key); return b && b.v !== undefined ? b : null; }
  const kvFetched = {};
  function kvSync(keys) { // pull the server copies once per session; a newer copy wins
    const want = keys.filter((k) => !kvFetched[k]);
    if (!want.length) return Promise.resolve(false);
    return call('apiKv', { op: 'get', keys: want }).then((r) => {
      let changed = false;
      want.forEach((k) => {
        kvFetched[k] = true;
        let srv = null; try { srv = r.vals[k] ? JSON.parse(r.vals[k]) : null; } catch (e) { srv = null; }
        const loc = kvLocal(k);
        if (srv && (!loc || srv.at > loc.at)) { LS.set('a2kv:' + k, srv); changed = true; }
      });
      return changed;
    }, () => false);
  }
  window.addEventListener('pagehide', () => Object.keys(kvTimers).forEach((k) => { clearTimeout(kvTimers[k]); const b = LS.get('a2kv:' + k); call('apiKv', { op: 'set', key: k, val: b ? JSON.stringify(b) : '' }).catch(() => {}); }));

  function lessonState(partId) { const b = kvLocal(kvKey('L', partId)); return (b && b.v) || { step: 0, done: {}, tries: {}, wrong: {}, seed: 0, finished: false, door: null }; }
  function saveLesson(partId, st) { kvPut(kvKey('L', partId), st); }

  // ---------- the practice database (sql.js from the vendor list; D75) ----------
  let SQLP = null, SQLJS = null, SQLFAIL = false;
  function sqlReady() {
    if (SQLP) return SQLP;
    SQLP = new Promise((res, rej) => {
      const bases = (window.A2_VENDOR || []).slice();
      const next = () => {
        const base = bases.shift();
        if (!base) { rej(new Error('sql.js')); return; }
        const s = document.createElement('script');
        s.src = base + 'sql-wasm.js';
        s.onload = () => { window.initSqlJs({ locateFile: (f) => base + f }).then(res, next); };
        s.onerror = () => { s.remove(); next(); };
        document.head.appendChild(s);
      };
      next();
    }).then((sq) => { SQLJS = sq; return sq; }, (e) => { SQLFAIL = true; throw e; });
    return SQLP;
  }
  const nowFix = (sql, d) => sql.replace(/'now'/g, "'" + d + "'"); // the practice rows and the pupil's GETDATE() both mean the pupil's own today (D81)
  function makeDb(seedKey) {
    const db = new SQLJS.Database(), seed = C.seeds[seedKey];
    if (seed) db.exec(nowFix(seed, today()));
    return db;
  }
  function runSql(seedKey, sql) {
    const db = makeDb(seedKey);
    try {
      const r = db.exec(nowFix(Tsql2Sqlite.convert(sql), today()));
      if (!r.length) return { cols: [], rows: [] };
      const last = r[r.length - 1];
      return { cols: last.columns, rows: last.values };
    } finally { db.close(); }
  }
  const noName = (c) => (/[()*+\/|'"]|\s[-+]\s/.test(c) || /^\d/.test(c) ? T('result.noName') : c);
  function gridHtml(res, cap) {
    if (!res) return '';
    const head = '<p><b>' + h(cap) + '</b>' + (res.rows.length > 50 ? ' \u00b7 ' + h(T('result.showing', { n: res.rows.length })) : '') + '</p>';
    if (!res.rows.length) return head + '<p class="note">' + h(T('result.none')) + '</p>';
    return head + '<div class="scroll"><table><tr>' + res.cols.map((c) => '<th>' + h(noName(c)) + '</th>').join('') + '</tr>' +
      res.rows.slice(0, 50).map((r) => '<tr>' + r.map((v) => '<td>' + (v == null ? 'NULL' : h(v)) + '</td>').join('') + '</tr>').join('') + '</table></div>';
  }
  // D66: values only (numbers normalised), in order only when the question sorts
  const normVal = (v) => { if (v == null) return 'NULL'; const s = String(v).trim(); return /^-?\d+(\.\d+)?$/.test(s) ? String(Number(s)) : s; };
  function sameRows(a, b, ordered) {
    if (!a || !b || a.cols.length !== b.cols.length || a.rows.length !== b.rows.length) return false;
    const rows = (x) => x.rows.map((r) => JSON.stringify(r.map(normVal)));
    const ra = rows(a), rb = rows(b);
    if (!ordered) { ra.sort(); rb.sort(); }
    return ra.every((r, i) => r === rb[i]);
  }

  // ---------- figure: table designs, data, highlight, pick ----------
  const normT = (t) => ({ name: t.name, cols: (t.cols || []).map((c) => (Array.isArray(c) ? { f: c[0], t: c[1] } : c)), pk: t.pk || [], fk: t.fk || [] });
  function tblHtml(t) {
    const rows = t.cols.length ? t.cols.map((c) => '<tr data-f="' + h(t.name + '.' + c.f) + '"><td' + (t.pk.includes(c.f) ? ' class="pk"' : '') + '>' + h(c.f) +
      (t.pk.includes(c.f) ? '<span class="tag">PK</span>' : '') + (t.fk.includes(c.f) ? '<span class="tag">FK</span>' : '') + '</td><td class="t">' + (c.t == null ? '\u2014' : h(c.t)) + '</td></tr>').join('')
      : '<tr><td class="none">\u2014</td></tr>';
    return '<div class="tbl" data-t="' + h(t.name) + '"><h4>' + h(t.name) + '</h4><table>' + rows + '</table></div>';
  }
  function designsHtml(tables, opt) {
    opt = opt || {};
    const norm = tables.map(normT), assumed = (opt.assumed || []).map(normT), all = norm.concat(assumed);
    const anyKey = norm.some((t) => t.pk.length || t.fk.length), noType = all.some((t) => t.cols.some((c) => c.t == null));
    let html = '<div class="tbls">' + norm.map(tblHtml).join('') + '</div>';
    if (assumed.length) html += '<div class="subcap">' + h(T('part.assumed')) + '</div><div class="tbls">' + assumed.map(tblHtml).join('') + '</div>';
    (opt.sample || []).forEach((sr) => {
      const t = all.find((x) => x.name === sr.table), cols = t ? t.cols.map((c) => c.f) : [];
      html += '<div class="sample"><h4>' + h(sr.table) + '</h4><table>' + (cols.length ? '<tr>' + cols.map((c) => '<th>' + h(c) + '</th>').join('') + '</tr>' : '') +
        sr.rows.map((r) => '<tr>' + r.map((v) => '<td>' + h(v) + '</td>').join('') + '</tr>').join('') + '</table></div>';
    });
    html += '<div class="legend">' + h(anyKey ? T('part.legend') : T('part.noKeys')) + (noType ? '<br>' + h(T('part.noTypes')) : '') + '</div>';
    return html;
  }
  const normName = (s) => String(s).toLowerCase().replace(/[^a-z0-9]/g, '');
  function dataHtml(seedKey, tables, hides) {
    if (!C.seeds[seedKey]) return '<p class="note">' + h(T('part.noData')) + '</p>';
    if (SQLFAIL) return '<p class="err">' + h(T('guard.dbFail')) + '</p>';
    if (!SQLJS) return '<p class="note" data-dbwait>' + h(T('guard.dbLoading')) + '<span class="dots"></span></p>';

      const used = {}, order = [];

      have.forEach((x) => { if (!used[x]) order.push([x, x]); });
