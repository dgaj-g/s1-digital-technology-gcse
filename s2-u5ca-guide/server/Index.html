        if (hides && hides.col && normName(hides.table) === normName(shown)) {
          const i = cols.findIndex((c) => normName(c) === normName(hides.col));
          if (i > -1) { cols = cols.filter((c, k) => k !== i); rows = rows.map((row) => row.filter((c, k) => k !== i)); }
        }
        const cnt = n === 1 ? T('part.rows1') : n > 30 ? T('part.rowsFirst', { n }) : T('part.rows', { n });
        return '<h4>' + h(shown) + '<small>' + h(cnt) + '</small></h4><div class="scroll"><table><tr>' + cols.map((c) => '<th>' + h(c) + '</th>').join('') + '</tr>' +
          rows.map((row) => '<tr>' + row.map((v) => '<td>' + (v == null ? 'NULL' : h(v)) + '</td>').join('') + '</tr>').join('') + '</table></div>';
      }).join('');
    } catch (e) { return '<p class="err">' + h(T('guard.dbFail')) + '</p>'; } finally { db.close(); }
  }
  // panes: [{id, tab, cap, html}] or [{id, tab, cap, data:{seed, tables, hides}}]
  let PANES = [];
  function figureHtml(panes) {
    PANES = panes;
    return '<aside class="figure"><div class="tabs">' + panes.map((p, i) => '<button' + (i === 0 ? ' class="on"' : '') + ' data-tab="' + p.id + '">' + h(p.tab) + '</button>').join('') + '</div>' +
      panes.map((p, i) => '<div data-pane="' + p.id + '"' + (p.data ? ' class="data"' : '') + (i ? ' hidden' : '') + '>' + (p.cap ? '<div class="cap">' + h(p.cap) + '</div>' : '') +
        '<div data-body>' + (p.data ? dataHtml(p.data.seed, p.data.tables, p.data.hides) : p.html) + '</div></div>').join('') + '</aside>';
  }
  function repaintData() {
    PANES.forEach((p) => { if (!p.data) return; const el = app.querySelector('.figure [data-pane="' + p.id + '"] [data-body]'); if (el) el.innerHTML = dataHtml(p.data.seed, p.data.tables, p.data.hides); });
  }
  const byName = (root, sel, attr, val) => Array.prototype.find.call(root.querySelectorAll(sel), (el) => el.getAttribute(attr) === val) || null;
  const FIG = {
    exam: null,
    examHtml() { return FIG.exam ? designsHtml(FIG.exam.tables, { assumed: FIG.exam.assumed }) : ''; },
    showPane(id) {
      const fig = app.querySelector('.figure'); if (!fig) return;
      fig.querySelectorAll('.tabs button').forEach((b) => b.classList.toggle('on', b.dataset.tab === id));

    },
    highlight(spec) {
      app.querySelectorAll('.figure .hl, .figure .hl2, .figure .strong').forEach((x) => x.classList.remove('hl', 'hl2', 'strong'));
      if (!spec) return;
      const pane = app.querySelector('.figure [data-pane="' + (spec.pane || 'exam') + '"]'); if (!pane) return;
      FIG.showPane(spec.pane || 'exam');
      if (spec.t) { const t = byName(pane, '.tbl[data-t]', 'data-t', spec.t); if (t) { t.classList.add('hl'); if (spec.strong) t.classList.add('strong'); } }
      (spec.f || []).forEach((f) => {
        const r = byName(pane, 'tr[data-f]', 'data-f', f); if (!r) return;
        r.classList.add('hl'); if (spec.strong) r.classList.add('strong');
        const t = r.closest('.tbl'); if (t && !t.classList.contains('hl')) t.classList.add('hl2');
      });
      const first = pane.querySelector('.hl'); if (first && first.scrollIntoView) first.scrollIntoView({ block: 'nearest' });
    },
    pickable(paneId, kind, cb, otherCb) {
      const fig = app.querySelector('.figure'), pane = fig && fig.querySelector('[data-pane="' + paneId + '"]'); if (!pane) return () => {};
      const cls = kind === 'table' ? 'pick-tables' : 'pick-fields';
      fig.querySelectorAll('[data-pane]').forEach((p) => p.classList.add(cls));
      const on = (e) => {
        const hit = kind === 'table' ? e.target.closest('.tbl[data-t]') : e.target.closest('tr[data-f]'); if (!hit) return;
        if (e.target.closest('[data-pane]') !== pane) { if (otherCb) otherCb(); return; }
        cb(kind === 'table' ? hit.dataset.t : hit.dataset.f);
      };
      fig.addEventListener('click', on);
      return () => { fig.querySelectorAll('[data-pane]').forEach((p) => p.classList.remove('pick-tables', 'pick-fields')); fig.removeEventListener('click', on); };
    }
  };

  function paperState(p) {

  // ---------- coursework guide (DESIGN \u00a76.1, \u00a76.7): cw.js draws it; every pupil act goes to apiCw; the server copy wins on the first open ----------
  const CWBASE = window.A2_CW || 'https://dgaj-g.github.io/ols-digital-skills/a2-ssd/content/coursework/';
  let cwHost = null, cwSynced = null;
  const cwLS = { get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } } };
  function cwState() {
    let done = 0, ticks = 0;
    for (let i = 0; i <= 14; i++) { const c = String(i).padStart(2, '0'); if (cwLS.get('cw:done:' + c)) done++; ticks += (cwLS.get('cw:ticks:' + c) || []).length; }
    return done ? (done === 1 ? T('home.cwDoneOne') : T('home.cwDone', { n: done })) : ticks ? (ticks === 1 ? T('home.cwTick') : T('home.cwTicks', { n: ticks })) : T('home.notStarted');
  }
  function cwApply(W) {
    const done = {}, had = {};
    Object.keys(W || {}).forEach((ch) => {
      if (!/^\d\d$/.test(ch)) return;
      const c = W[ch], k = {};
      (c.k || []).forEach((id) => { k[id] = true; });
      cwLS.set('s2:ticks:' + ch, k);
      if (c.d) done[ch] = true;
      if (c.h) had[ch] = true;
      if (c.a) cwLS.set('s2:at:' + ch, c.a);
    });
    cwLS.set('s2:done', done); cwLS.set('s2:had', had);
  }
  function cwSync() {
    if (!cwSynced) cwSynced = call('apiCw', { op: 'state' }).then((r) => { cwApply((r && r.W) || {}); }, () => { cwSynced = null; });
    return cwSynced.catch(() => {});
  }
  function vCw() {

        open: (ch) => send({ op: 'open', ch }), screen: (ch, key) => send({ op: 'screen', ch, key }),
        tick: (ch, id, on) => send({ op: 'tick', ch, id, on: !!on }), done: (ch, on) => send({ op: 'done', ch, on: !!on }),

      frame([crumbSql(), { t: paperTitle(p) }], '<h1>' + h(paperTitle(p)) + '</h1><div class="card"><p>' + h(T('paper.lockedHere')) + '</p><button class="btn" data-go="#sql">' + h(T('paper.backToPapers')) + '</button></div>');

      '<div class="card"><h3>' + h(T('paper.parts')) + '</h3><ul class="parts">' + parts + '</ul></div>' + tail);

  // ---------- inputs for every answer type ----------
  // q: {type, stub, rows}; value: string | string[] | [{name, reason}]
  function buildInput(host, q, value, onChange) {
    const type = q.type;
    if (type === 'sql' && !(q.kind === 'fragment' && q.stub)) {
      const ed = SqlEditor.create(host, { value: value || '', placeholder: T('turn.placeholder'), label: T('turn.card'), onChange });
      return { get: ed.get, focus: ed.focus };
    }
    if (type === 'sql') { // fragment: the printed start of the script, then the pupil's lines (only the typed lines are sent)
      host.innerHTML = '<div class="stubed"></div><p class="note">' + h(T('turn.stub')) + '</p><div class="typed"></div>';
      SqlEditor.create(host.querySelector('.stubed'), { readOnly: true, value: q.stub });
      const ed = SqlEditor.create(host.querySelector('.typed'), { value: value || '', placeholder: T('turn.placeholder'), label: T('turn.stub'), onChange });
      return { get: ed.get, focus: ed.focus };
    }
    if (type === 'cloze') {
      const parts = String(q.stub || '').split(/\u27e6(\d+)\u27e7/), vals = Array.isArray(value) ? value : [];
      let html = '';
      parts.forEach((bit, i) => {
        if (i % 2 === 0) html += SqlEditor.html(bit).replace(/\n$/, '');
        else { const n = +bit; html += '<label><b>' + n + '</b><input type="text" data-blank="' + n + '" spellcheck="false" autocomplete="off" autocapitalize="off" aria-label="' + h(T('turn.blank', { n })) + '" value="' + h(vals[n - 1] || '') + '"></label>'; }
      });
      host.innerHTML = '<p class="note">' + h(T('turn.cloze')) + '</p><pre class="cloze">' + html + '</pre>';
      const inputs = Array.prototype.slice.call(host.querySelectorAll('[data-blank]')).sort((a, b) => a.dataset.blank - b.dataset.blank);
      const get = () => inputs.map((x) => x.value);
      inputs.forEach((x) => x.addEventListener('input', () => onChange(get())));
      return { get, focus: () => inputs[0] && inputs[0].focus() };
    }
    if (type === 'rows') {
      const vals = Array.isArray(value) ? value : [];
      host.innerHTML = '<table class="rowsans"><tr><th>' + h(T('turn.rowsField')) + '</th><th>' + h(T('turn.rowsName')) + '</th><th>' + h(T('turn.rowsReason')) + '</th></tr>' +
        (q.rows || []).map((f, i) => '<tr><td class="fld">' + h(f) + '</td><td><input class="txt" data-r="' + i + '" data-k="name" aria-label="' + h(f + ' \u00b7 ' + T('turn.rowsName')) + '" value="' + h((vals[i] || {}).name || '') + '"></td>' +
          '<td><input class="txt" data-r="' + i + '" data-k="reason" aria-label="' + h(f + ' \u00b7 ' + T('turn.rowsReason')) + '" value="' + h((vals[i] || {}).reason || '') + '"></td></tr>').join('') + '</table>';
      const get = () => (q.rows || []).map((f, i) => ({ name: host.querySelector('[data-r="' + i + '"][data-k="name"]').value, reason: host.querySelector('[data-r="' + i + '"][data-k="reason"]').value }));
      host.querySelectorAll('input').forEach((x) => x.addEventListener('input', () => onChange(get())));
      return { get, focus: () => { const f = host.querySelector('input'); if (f) f.focus(); } };
    }
    if (type === 'short') {
      host.innerHTML = '<input class="txt" type="text" spellcheck="true" placeholder="' + h(T('turn.short')) + '" aria-label="' + h(T('turn.card')) + '">';
      const el = host.querySelector('input'); el.value = value || '';
      el.addEventListener('input', () => onChange(el.value));
      return { get: () => el.value, focus: () => el.focus() };
    }
    host.innerHTML = '<textarea class="prose" rows="5" spellcheck="true" placeholder="' + h(T('turn.prose')) + '" aria-label="' + h(T('turn.card')) + '"></textarea>';
    const ta = host.querySelector('textarea'); ta.value = value || '';
    ta.addEventListener('input', () => onChange(ta.value));
    return { get: () => ta.value, focus: () => ta.focus() };
  }
  function isEmpty(q, v) {
    if (q.type === 'cloze') return !(v || []).some((x) => String(x || '').trim());
    if (q.type === 'rows') return !(v || []).some((r) => String(r.name || '').trim() || String(r.reason || '').trim());
    return String(v || '').replace(/\s/g, '').length < 3;
  }

  // ---------- the marks card ----------
  // spell: names read one letter off (his ruling 28 Sep 2026); missing / nofield: the names a lost point needed; extra: re-mark lines
  function marksHtml(v, line, extra) {
    const names = (list) => ({ names: list.join(', ') });
    return (extra && extra.top ? extra.top : '') + '<div class="score">' + v.total + ' <small>/ ' + v.of + '</small></div>' + (v.kind && v.kind !== 'ok' && v.kindNote ? '<p><b>' + h(v.kindNote) + '</b></p>' : '') +
      (v.spell ? v.spell.map((x) => '<p class="spell">' + h(T('verdict.spell', x)) + '</p>').join('') : '') +
      '<ul class="pts">' + v.points.map((p) => '<li><span class="' + (p.awarded >= p.of ? 'yes' : 'no') + '">' + (p.awarded >= p.of ? '\u2713' : '\u2717') + '</span><span>' + h(p.label) + '</span><span class="m">[' +
        (p.awarded > 0 && p.awarded < p.of ? p.awarded + '/' + p.of : p.of) + ']</span>' + (p.hint ? '<span class="hint">' + h(p.hint) + '</span>' : '') +
        (p.missing ? '<span class="hint">' + h(T('verdict.missing', names(p.missing))) + '</span>' : '') + (p.nofield ? '<span class="hint">' + h(T('verdict.nofield', names(p.nofield))) + '</span>' : '') +
        (p.note ? '<span class="note">' + h(p.note) + '</span>' : '') + '</li>').join('') + '</ul>' +
      (line ? '<p class="note">' + h(line) + '</p>' : '') + (extra && extra.end ? extra.end : '');
  }
  // re-mark lines (D97) for one side of a part (f/b or tf/tb): above the marks when the ticks shown were saved before the re-mark, else a note below
  const EPOCH = 1767225600000;
  function remarkHtml(r, fields, of, savedAt) {
    const list = (r.rm || []).filter((c) => fields.indexOf(c[1]) !== -1);
    if (!list.length) return null;
    const d = (m) => { const x = new Date(EPOCH + m * 60000); return ('0' + x.getDate()).slice(-2) + '/' + ('0' + (x.getMonth() + 1)).slice(-2) + '/' + x.getFullYear(); };
    const lines = list.map((c) => h(T('verdict.remarked', { date: d(c[0]), which: T('verdict.rm.' + c[1]), from: c[2], to: c[3], of })));
    if (savedAt == null || savedAt < EPOCH + list[list.length - 1][0] * 60000) return { top: '<p class="spell">' + lines.join('<br>') + '<br>' + h(T('verdict.remarkedTicks')) + '</p>' };
    return { end: lines.map((x) => '<p class="note">' + x + '</p>').join('') };
  }
  function msBox(box, r) {
    box.innerHTML = '<div class="card"><h3>' + h(T('verdict.msTitle')) + '</h3><div data-msbody></div>' + (r.walk && r.walk.length ? '<ol class="walk">' + r.walk.map((w) => '<li>' + h(w) + '</li>').join('') + '</ol>' : '') +
      '<p class="note">' + h(T('verdict.msNote')) + '</p><button class="btn ghost" data-closems>' + h(T('verdict.close')) + '</button></div>';
    const body = box.querySelector('[data-msbody]');

    else body.innerHTML = '<pre class="prosebox">' + h(r.text) + '</pre>';
    box.querySelector('[data-closems]').addEventListener('click', () => { box.innerHTML = ''; });
  }

  // ---------- part screen ----------
  const BEATS = ['ask', 'lesson', 'turn', 'another'];
  function railHtml(beat, cold, marked) {
    const stops = [['ask', 'rail.question'], ['lesson', 'rail.lesson'], ['turn', 'rail.turn'], ['another', 'rail.another']], i = BEATS.indexOf(beat);
    return '<nav class="rail">' + stops.map(([b, k], n) => {
      let cls = n < i ? 'done' : n === i ? 'now' : '', sub = '';
      if (cold && !marked && n < 2) { cls = 'skip'; sub = '<small>' + h(T('rail.skipped')) + '</small>'; }
      return n === i ? '<span class="st ' + cls + '" aria-current="step"><i></i><span>' + h(T(k)) + sub + '</span></span>'
        : '<button class="st ' + cls + '" data-beat="' + b + '"><i></i><span>' + h(T(k)) + sub + '</span></button>';
    }).join('') + '</nav>';
  }
  function skillsFull(part) {
    return (part.skills || []).length > 0 && part.skills.every((s) => C.papers.some((p) => p.parts.some((q) => (q.skills || []).includes(s) && P(q.id).b === q.marks)));
  }
  function askBlock(part) { return (part.lead ? '<p class="lead">' + h(part.lead) + '</p>' : '') + '<p class="ask"><q>' + h(part.ask) + '</q></p>'; }

  let CUR = null; // {id, beat} of the part on screen
  function vPart(id, beatArg) {
    const hit = PARTS[id];
    if (!hit) { go('#sql'); return; }
    const p = hit.paper, part = hit.part;
    if (!reachable(p)) { go('#paper/' + p.id); return; }
    const keys = [kvKey('L', id), kvKey('draft', id), kvKey('draft', id, true)];
    const want = keys.some((k) => !kvFetched[k]);
    renderPart(p, part, beatArg);
    if (want) kvSync(keys).then((changed) => { if (changed && CUR && CUR.id === id && !CUR.dirty) renderPart(p, part, beatArg); });
  }
  function renderPart(p, part, beatArg) {
    const id = part.id, r = P(id), L = lessonState(id), marked = r.f != null;
    let beat = beatArg;
    if (!beat) beat = marked ? 'turn' : !L.door ? 'door' : L.door === 'cold' ? 'turn' : L.finished ? 'turn' : (L.step > 0 || Object.keys(L.done || {}).length) ? 'lesson' : 'ask';
    if (beat === 'door' && marked) beat = 'turn';
    // D82: the question or the lesson opened before a first mark means the pupil is learning it first
    if (!marked && (beat === 'ask' || beat === 'lesson') && L.door !== 'learn') { L.door = 'learn'; saveLesson(id, L); }
    const cold = marked ? r.d === 1 : L.door === 'cold';
    CUR = { id, beat, dirty: false };
    const lesson = C.lessons[part.lesson], view = lesson ? LessonView.view(lesson, part, today()) : null;
    FIG.exam = { tables: p.tables, assumed: p.assumed };
    const examPane = { id: 'exam', tab: T('part.tabDesigns'), html: designsHtml(p.tables, { assumed: p.assumed, sample: p.sampleRows }) };
    const dataPane = { id: 'data', tab: T('part.tabData'), cap: T('part.capData'), data: { seed: p.id, tables: p.tables.concat(p.assumed || []), hides: part.hides } };
    let panes = [examPane, dataPane];
    let tw = null;
    if (beat === 'lesson' && view) {
      const setT = ((C.sets[view.set] || {}).tables || []).map(normT);
      let lt = view.focus && view.focus.length ? setT.filter((t) => view.focus.includes(t.name)) : setT.slice();
      (view.tables || []).map(normT).forEach((vt) => { const i = lt.findIndex((t) => t.name === vt.name); if (i > -1) lt[i] = vt; else lt.push(vt); });
      panes = [{ id: 'lesson', tab: T('part.tabLesson'), cap: T('part.capLesson'), html: designsHtml(lt) },
        { id: 'exam', tab: T('part.tabExam', { year: p.year }), cap: T('part.capExamLesson'), html: designsHtml(p.tables, { assumed: p.assumed }) }];
    }
    if (beat === 'another' && r.t && C.twins[r.t]) {
      tw = C.twins[r.t];
      const tt = tw.tables || (C.sets[tw.set] || {}).tables || [];
      panes = [{ id: 'practice', tab: T('part.tabPractice'), cap: T('part.capPractice'), html: designsHtml(tt) },
        { id: 'data', tab: T('part.tabData'), cap: T('part.capDataPractice'), data: { seed: 'tinies-' + tw.set, tables: tt } }];

        '<button class="door" data-door="cold">' + (full ? '<span class="sug">' + h(T('door.suggested')) + '</span>' : '') + '<b>' + h(T('door.cold')) + '</b><span>' + h(T('door.coldSub')) + '</span></button></div><p class="note">' + h(T('door.note')) + '</p>';

        '<div class="card"><h3>' + h(T('ask.marking')) + '</h3><p class="note">' + h(T('ask.markingNote')) + '</p><ul class="marklist">' + (part.points || []).map((pt) => '<li><span>' + h(pt.label) + '</span><span class="mk">' + h(marksText(pt.of)) + '</span></li>').join('') + '</ul></div>' +
        (needs.length ? '<div class="card"><h3>' + h(T('ask.needs')) + '</h3><p>' + needs.map((n) => '<b>' + h(n) + '</b>').join(' \u00b7 ') + '</p><p class="note">' + h(T('ask.needsNote')) + '</p></div>' : '') +
        (part.habits && part.habits.length ? '<div class="card"><h3>' + h(T('ask.habits')) + '</h3><ul class="habits">' + part.habits.map((x) => '<li>' + h(x) + '</li>').join('') + '</ul></div>' : '') +
        '<div class="row"><button class="btn" data-beat="lesson">' + h(T('ask.next')) + '</button><button class="btn ghost" data-beat="turn">' + h(T('ask.skip')) + '</button></div>';
    } else if (beat === 'lesson') {
      body = railHtml('lesson', cold, marked) + '<div id="lesson"></div>';
    } else if (beat === 'turn') {
      body = railHtml('turn', cold, marked) + headLine + '<div class="card"><h3>' + h(T('turn.card')) + '</h3>' + askBlock(part) + '<div id="turn-in"></div><p class="note" data-kept hidden>' + h(T('turn.kept')) + '</p>' +
        '<div class="row">' + (part.kind === 'select' ? '<button class="btn sec" data-run>' + h(T('turn.run')) + '</button>' : '') + '<button class="btn" data-submit disabled>' + h(T('turn.submit')) + '</button><span class="note" data-typefirst>' + h(T('turn.typeFirst')) + '</span></div><div data-confirm></div></div>' +
        '<div id="result"></div><div id="verdict"></div>';

      body = railHtml('another', cold, marked) + '<div id="another"><p class="note">' + h(T('turn.marking')).replace('\u2026', '') + '<span class="dots"></span></p></div>';
    }
    frame([crumbSql(), { t: paperTitle(p), go: '#paper/' + p.id }, { t: T('part.crumb', { label: lab }) }], figureHtml(panes) + '<section class="work">' + body + '</section>', 'split');
    app.insertAdjacentHTML('beforeend', '<button class="flag' + (r.fl ? ' on' : '') + '" data-flag>' + h(r.fl ? T('flag.on') : T('flag.ask')) + '</button>');
    wirePart(p, part, beat, view, L);
  }

  function wirePart(p, part, beat, view, L) {

    app.querySelectorAll('[data-door]').forEach((b) => b.addEventListener('click', () => {
      L.door = b.dataset.door; saveLesson(id, L); go('#part/' + id + '/' + (L.door === 'cold' ? 'turn' : 'ask'));
    }));
    app.querySelectorAll('[data-beat]').forEach((b) => b.addEventListener('click', () => go('#part/' + id + '/' + b.dataset.beat)));
    const flag = app.querySelector('[data-flag]');
    flag.addEventListener('click', () => {
      const on = !P(id).fl; flag.disabled = true;
      call('apiFlag', { part: id, beat: CUR && CUR.beat === 'another' ? 'another' : beat, on }).then(() => {
        flag.classList.toggle('on', !!P(id).fl); flag.textContent = P(id).fl ? T('flag.on') : T('flag.ask');
      }, () => {}).then(() => { flag.disabled = false; });

      LESSON = Lesson.render(host, { view, state: L, T, year: p.year, figure: FIG, save: () => saveLesson(id, L), onOut: (b) => go('#part/' + id + '/' + b) });
    }
    if (beat === 'turn') wireTurn(p, part);
    if (beat === 'another') wireAnother(p, part);

  function wireTurn(p, part) {
    const id = part.id, sub = app.querySelector('[data-submit]'), tf = app.querySelector('[data-typefirst]'), conf = app.querySelector('[data-confirm]');
    const dkey = kvKey('draft', id), d = kvLocal(dkey);

    const input = buildInput(document.getElementById('turn-in'), part, d ? d.v : null, onChange);
    if (d && d.v != null && !isEmpty(part, d.v) && P(id).f == null) app.querySelector('[data-kept]').hidden = false;

        const out = { verdict: r.verdict, first: r.first, expected: r.expected || null, yours: null, err: null, at: Date.now() };
        const finish = () => { LS.set(vkey, out); showVerdict(p, part, out, input); sub.disabled = false; vbox.scrollIntoView({ behavior: 'smooth', block: 'start' }); };
        if (part.kind === 'select' && r.expected) {
          sqlReady().then(() => { try { out.yours = runSql(p.id, text); } catch (e) { out.err = String((e && e.message) || e).split('\n')[0]; } finish(); }, finish);
        } else finish();
      }, (e) => {
        sub.disabled = false;

        conf.querySelector('[data-no]').addEventListener('click', () => { conf.innerHTML = ''; });
        conf.querySelector('[data-yes]').focus();

  function showVerdict(p, part, out, input) {

      : T('verdict.attempt', { n: r.a, t: v.total, of: v.of, best: r.b });

    if (part.kind === 'select' && out.expected) {

      resCard = '<div class="card result"><h3>' + h(T('result.title')) + ' <span class="' + (same ? 'same' : 'diff') + '">' + h(T(same ? 'result.same' : out.err ? 'result.noRun' : 'result.diff')) + '</span></h3>' +
        (out.err ? '<p><b>' + h(T('result.yours')) + '</b></p><p>' + h(T('result.err', { err: out.err })) + '</p>' : gridHtml(out.yours, T('result.yours'))) + gridHtml(exp, T('result.expected')) + '<p class="note">' + h(T('result.expectedNote')) + '</p></div>';
    }
    let html = '<div class="' + (resCard ? 'marks' : '') + '"><div class="card"><h3>' + h(T('verdict.title')) + '</h3>' + marksHtml(v, line, remarkHtml(r, ['f', 'b'], v.of, out.at)) + '</div>' + resCard + '</div>' +

      '<div class="card"><h3>' + h(T('verdict.lesson')) + '</h3><p class="note">' + h(T(isText(part) ? 'verdict.lessonNoteText' : 'verdict.lessonNote')) + '</p><button class="btn sec" data-beat="lesson">' + h(T('verdict.openLesson')) + '</button></div>';
    const box = document.getElementById('verdict');

      const b = e.currentTarget; b.disabled = true;

    });
    box.querySelectorAll('[data-beat]').forEach((b) => b.addEventListener('click', () => go('#part/' + id + '/' + b.dataset.beat)));
  }

  function wireAnother(p, part) {

  function twinCard(p, part, tw, host, back) {

    const show = (v, at) => {

      const box = document.getElementById('verdict');

        (e) => { document.getElementById('verdict').innerHTML = e.code === 'empty' ? '<p class="err">' + h(T('turn.typeFirst')) + '</p>' : ''; }).then(() => { sub.disabled = false; });
    });
  }

  // ---------- How did it go? (D83: the lines follow the skills the paper used, in order of first need, at most five) ----------
  const GROUPS = {
    CREATE: ['CREATE', 'COLTYPES', 'PK', 'PK2', 'FK', 'NOTNULL', 'IDENTITY', 'DEFAULT', 'CHECK'], ALTER: ['ALTER'], INSERT: ['INSERT', 'INSERTCOLS', 'INSERTMULTI', 'INSERTSELECT'],
    UPDATE: ['UPDATE', 'ARITH'], JOIN: ['SELECT', 'SELECTMULTI', 'JOIN', 'JOIN3+', 'LEFTJOIN', 'ALIAS', 'CONCAT', 'CAST', 'ISNULL'],
    WHERE: ['WHERE', 'WHERETEXT', 'WHEREDATE', 'WHERENUM', 'AND', 'OR', 'BETWEEN', 'NOTEQ'], GROUP: ['COUNT', 'COUNTDISTINCT', 'SUM', 'AVG', 'GROUPBY', 'HAVING'],
    ORDER: ['ORDERBY', 'DESC'], DATE: ['GETDATE', 'DATEDIFF', 'DATEADD', 'YEARMONTH'], PROSE: ['DESIGN']
  };
  const groupOf = (skill) => Object.keys(GROUPS).find((g) => GROUPS[g].includes(skill)) || null;
  function evalGroups(p) {
    const out = [];
    p.parts.forEach((q) => {
      const gs = isText(q) ? ['PROSE'] : (q.skills || []).map(groupOf);
      gs.forEach((g) => { if (g && !out.includes(g)) out.push(g); });
    });
    return out.slice(0, 5);
  }
  function flushOutbox() {
    if (!ME.cls) return;
    C.papers.forEach((p) => {
      const k = 'a2ev:' + ME.cls + ':' + p.id, box = LS.get(k);
      if (!box) return;
      if (REC.E[p.id]) { LS.set(k, null); return; }
      window.OLS_TRANSPORT.call('apiEval', Object.assign({ cls: ME.cls }, box)).then((r) => { if (r && r.ok !== false) { LS.set(k, null); if (r.rec) REC = r.rec; } }, () => {});
    });
  }
  function vEval(pid) {
    const p = PAPERS[pid];
    if (!p || !reachable(p)) { go('#sql'); return; }
    const crumbs = [crumbSql(), { t: paperTitle(p), go: '#paper/' + pid }, { t: T('ev.title') }];
    const shell = (inner) => frame(crumbs, '<h1>' + h(T('ev.title')) + '</h1><p class="sub">' + h(paperTitle(p)) + '</p>' + inner, 'ev');
    if (REC.E[pid]) { shell('<div class="card"><p>' + h(T('ev.already')) + '</p><button class="btn" data-go="#sql">' + h(T('ev.back')) + '</button></div>'); return; }
    if (!paperState(p).allF) { shell('<div class="card"><p>' + h(T('ev.notYet')) + '</p><button class="btn" data-go="#paper/' + pid + '">' + h(T('ev.backPaper')) + '</button></div>'); return; }
    const outbox = LS.get('a2ev:' + ME.cls + ':' + pid);
    if (outbox) { shell('<div class="card"><p>' + h(T('ev.offline')) + '</p><button class="btn" data-go="#sql">' + h(T('ev.back')) + '</button></div>'); flushOutbox(); return; }
    const groups = evalGroups(p), ans = { l: {}, f: null, c: '' };
    const seg = (attr, opts) => '<span class="seg" role="radiogroup" ' + attr + '>' + opts.map(([v, k]) => '<button type="button" role="radio" aria-checked="false" data-v="' + v + '">' + h(T(k)) + '</button>').join('') + '</span>';
    const lines = groups.map((g) => '<div class="line"><span>' + h(T('ev.line.' + g)) + '</span>' + seg('data-line="' + g + '"', [[0, 'ev.can'], [1, 'ev.getting'], [2, 'ev.not']]) + '</div>').join('');
    shell('<div class="card">' + lines + '<div class="line"><span><b>' + h(T('ev.feel')) + '</b></span>' + seg('data-feel', [[0, 'ev.easy'], [1, 'ev.right'], [2, 'ev.tricky']]) + '</div>' +
      '<div><textarea class="comment" maxlength="60" placeholder="' + h(T('ev.placeholder')) + '" aria-label="' + h(T('ev.placeholder')) + '"></textarea><div class="count">' + h(T('ev.left', { n: 60 })) + '</div></div>' +
      '<p class="note" data-lock>' + h(T('ev.lock')) + '</p><button class="btn" data-send disabled>' + h(T('ev.send')) + '</button></div>');
    const send = app.querySelector('[data-send]'), lock = app.querySelector('[data-lock]');
    const check = () => { const ok = groups.every((g) => ans.l[g] != null) && ans.f != null; send.disabled = !ok; lock.hidden = ok; };
    app.querySelectorAll('.seg button').forEach((b) => b.addEventListener('click', () => {
      const sg = b.parentElement;
      sg.querySelectorAll('button').forEach((x) => { x.classList.toggle('on', x === b); x.setAttribute('aria-checked', x === b ? 'true' : 'false'); });
      if (sg.dataset.line) ans.l[sg.dataset.line] = +b.dataset.v; else ans.f = +b.dataset.v;
      check();
    }));
    const ta = app.querySelector('textarea.comment'), cnt = app.querySelector('.count');
    ta.addEventListener('input', () => { const left = 60 - ta.value.length; cnt.textContent = left > 1 ? T('ev.left', { n: left }) : left === 1 ? T('ev.left1') : T('ev.full'); ans.c = ta.value; });
    send.addEventListener('click', () => {
      const card = app.querySelector('.card'), req = { paper: pid, l: ans.l, f: ans.f, c: ans.c };
      card.innerHTML = '<p>' + h(T('ev.sending')) + '</p>';
      call('apiEval', req).then((r) => {
        card.innerHTML = '<p><b>' + h(T(r.already ? 'ev.already' : 'ev.sent')) + '</b></p><button class="btn" data-go="#sql">' + h(T('ev.back')) + '</button>';
      }, (e) => {
        if (e.code === 'offline') { LS.set('a2ev:' + ME.cls + ':' + pid, req); card.innerHTML = '<p>' + h(T('ev.offline')) + '</p><button class="btn" data-go="#sql">' + h(T('ev.back')) + '</button>'; }
        else if (e.code === 'not-yet') card.innerHTML = '<p>' + h(T('ev.notYet')) + '</p><button class="btn" data-go="#paper/' + pid + '">' + h(T('ev.backPaper')) + '</button>';
        else card.innerHTML = '<p class="err">' + h(T('sys.offline')) + '</p><button class="btn" data-go="#paper/' + pid + '">' + h(T('ev.backPaper')) + '</button>';
      });
    });
  }

  // ---------- routing ----------
  // The served page sits in Google's sandbox frame: location.reload() reloads only the frame, which comes back blank.
  // Reload the whole page at its real address instead.
  function reloadPage() {
    const B = window.OLS_BOOT || {};
    if (!B.baseUrl) { location.reload(); return; }
    window.open(B.baseUrl + (B.classCode ? '?class=' + encodeURIComponent(B.classCode) : '') + location.hash, '_top');
  }
  function go(hash) { if (location.hash === hash) route(); else location.hash = hash; }
  function route() {
    if (!ME.cls) return;
    const bits = (location.hash || '#home').slice(1).split('/'), k = bits[0];
    if (k === 'sql') vSql();
    else if (k === 'paper') vPaper(bits[1]);
    else if (k === 'part') vPart(bits[1], BEATS.concat('door').includes(bits[2]) ? bits[2] : null);
    else if (k === 'eval') vEval(bits[1]);
    else if (k === 'cw') { vCw(); return; }
    else { history.replaceState(null, '', '#cw'); vCw(); return; }
    const w = app.querySelector('.work') || app.querySelector('main'); if (w) w.scrollTop = 0;
  }
  function fitTables() {
    if (!app) return;
    app.querySelectorAll('.tbl').forEach((t) => { if (t.classList.contains('wide') || !t.clientWidth) return; const tb = t.querySelector('table'); if (tb && tb.scrollWidth > t.clientWidth + 1) t.classList.add('wide'); });
  }

  // ---------- the one-off "guide has changed" message (his ruling 18 Oct 2026) ----------
  // For a pupil who used the guide before the change. It cannot be closed or got past: the pupil reads it for 30 seconds (the timer
  // stops while the page is hidden), ticks to confirm, then clicks Continue. The timer reaching 0 never closes it. The confirmation
  // is saved on the server (once per pupil, any computer) and on this computer, so a failed save never shows it twice here.
  const NOTICE = { id: 's2-guide', at: 0, secs: 30 }; // at = 17 Oct 2026 19:00 Irish time, in server minutes
  function notice(cw) {
    cw = cw || {};
    if ((cw.N || {})[NOTICE.id]) return;
    if (LS.get('notice:' + NOTICE.id)) { call('apiCw', { op: 'notice', id: NOTICE.id }).catch(() => {}); return; }
    if (!cw.f || cw.f >= NOTICE.at) return;
    const li = (lines) => '<ul>' + lines.map((x) => '<li>' + h(x) + '</li>').join('') + '</ul>';
    const back = document.createElement('div');
    back.className = 'ntc-back';
    back.innerHTML = '<div class="ntc" role="dialog" aria-modal="true" aria-labelledby="ntc-h" tabindex="-1"><h1 id="ntc-h">' + h(T('notice.title')) + '</h1>' +
      '<h2>' + h(T('notice.whyHead')) + '</h2>' + li([T('notice.why1'), T('notice.why2'), T('notice.why3')]) +
      '<h2>' + h(T('notice.meansHead')) + '</h2>' + li([T('notice.means1'), T('notice.means2'), T('notice.means3'), T('notice.means4'), T('notice.means5'), T('notice.means6')]) +
      '<div class="ntc-foot"><div class="ntc-timer" aria-hidden="true"><b></b><span></span></div><div class="ntc-act">' +
      '<p class="ntc-msg" role="status"></p><label class="ntc-tick"><input type="checkbox"> ' + h(T('notice.tick')) + '</label>' +
      '<button class="btn" type="button" disabled>' + h(T('notice.continue')) + '</button></div></div></div>';
    document.body.appendChild(back);
    app.inert = true;
    const box = back.querySelector('.ntc'), num = back.querySelector('.ntc-timer b'), unit = back.querySelector('.ntc-timer span'),
      ring = back.querySelector('.ntc-timer'), msg = back.querySelector('.ntc-msg'), tick = back.querySelector('input'), btn = back.querySelector('.btn');
    let left = NOTICE.secs;
    const say = (text, bad) => { msg.textContent = text; msg.classList.toggle('bad', !!bad); };
    const paint = () => { num.textContent = left; unit.textContent = left === 1 ? T('notice.second') : T('notice.seconds'); ring.classList.toggle('done', !left); };
    paint(); say(T('notice.wait'));
    const clock = setInterval(() => {
      if (document.hidden || !left) return;
      left--; paint();
      if (!left) { clearInterval(clock); if (!tick.checked) say(T('notice.ready')); }
    }, 1000);
    tick.addEventListener('change', () => {
      if (left) { tick.checked = false; say(T('notice.early'), true); return; }
      btn.disabled = !tick.checked;
      say(tick.checked ? T('notice.go') : T('notice.ready'));
    });
    btn.addEventListener('click', () => {
      if (left || !tick.checked) return;
      LS.set('notice:' + NOTICE.id, Date.now());
      call('apiCw', { op: 'notice', id: NOTICE.id }).catch(() => {});
      back.remove(); app.inert = false;
    });
    // nothing closes it but Continue: Escape does nothing and Tab stays inside the message
    back.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); return; }
      if (e.key !== 'Tab') return;
      const f = [tick, btn].filter((x) => !x.disabled), i = f.indexOf(document.activeElement);
      e.preventDefault();
      (f[(i + (e.shiftKey ? f.length - 1 : 1)) % f.length] || box).focus();
    });
    box.focus();
  }

  function start(r) {
    ME = { email: r.email, cls: r.cls, name: r.name || '' };
    REC = r.rec || REC; CFG = r.cfg || CFG;
    if (r.cw && r.cw.W) { cwApply(r.cw.W); cwSynced = Promise.resolve(); }
    sqlReady().then(repaintData, repaintData);
    // activity (D100): once a minute while the page is on screen; act = typed, clicked or scrolled in the last 3 minutes
    let lastAct = Date.now();
    ['keydown', 'pointerdown', 'input', 'wheel', 'scroll', 'touchstart'].forEach((t) => window.addEventListener(t, () => { lastAct = Date.now(); }, { capture: true, passive: true }));
    setInterval(() => { if (!document.hidden) call('apiPing', { act: Date.now() - lastAct < 180000 ? 1 : 0 }).catch(() => {}); }, 60000);
    flushOutbox();
    route();
    notice(r.cw);
  }
  function askName(r) {
    app.innerHTML = '<div id="sys"></div><div class="guard"><div class="box"><p>' + h(T('guard.nameAsk')) + '</p><input type="text" maxlength="40" autocomplete="given-name" aria-label="' + h(T('guard.nameAsk')) + '"><button class="btn" disabled>' + h(T('guard.continue')) + '</button></div></div>';
    const inp = app.querySelector('input'), btn = app.querySelector('.guard .btn');
    inp.addEventListener('input', () => { btn.disabled = !inp.value.trim(); });
    const send = () => { const name = inp.value.trim(); if (!name) return; btn.disabled = true; ME.cls = r.cls; call('apiName', { name }).then((x) => { r.name = x.name; REC.n = x.name; start(r); }, () => { btn.disabled = false; }); };
    btn.addEventListener('click', send);
    inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') send(); });
    inp.focus();
  }
  function boot() {
    app = document.getElementById('app');
    document.addEventListener('click', (e) => {
      const s = e.target.closest('[data-sys]');
      if (s) { if (s.dataset.sys === 'reload') reloadPage(); else if (SYS.retry) { const f = SYS.retry; SYS.retry = null; f().then(() => route(), () => {}); } return; }
      const t = e.target.closest('[data-go]');
      if (t) { e.preventDefault(); go(t.dataset.go); return; }
      const tab = e.target.closest('.figure .tabs button');
      if (tab) FIG.showPane(tab.dataset.tab);
    });
    document.addEventListener('keydown', (e) => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('li[data-go]')) { e.preventDefault(); go(e.target.dataset.go); } });
    new MutationObserver(fitTables).observe(app, { childList: true, subtree: true, attributes: true, attributeFilter: ['class', 'hidden'] });
    window.addEventListener('resize', fitTables);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitTables);
    window.addEventListener('hashchange', route);
    const cls = (window.OLS_BOOT && window.OLS_BOOT.classCode) || '';
    guard(T('guard.signing'), true);
    window.OLS_TRANSPORT.call('apiBoot', { cls }).then((r) => {
      if (r && r.v && BUILD && r.v !== BUILD) SYS.stale = true;
      if (!r || r.ok === false) {
        const code = r && r.error;
        guard(code === 'unknown-class' ? T('guard.noClass') : T('guard.domain'));
        return;
      }
      if (r.staff) { window.Staff.boot(app, r); return; }
      if (r.needName) askName(r); else start(r);
    }, () => { SYS.offline = true; SYS.retry = () => { reloadPage(); return Promise.resolve(); }; guard(T('guard.signing'), true); paintSys(); });
  }
  window.App = { boot, T, h, NOTICE };
})();

</script>
<script>
/* platform/staff.js \u2014 the staff page (SPEC \u00a710): the bare /exec link with no class. Passcode once per account (the owner is admitted by email, D56).
 * Tabs: Classes \u00b7 Papers \u00b7 Live \u00b7 Coursework \u00b7 Export. Every string from strings.json (D5). window.Staff.boot(app, bootReply). */
(function () {
  'use strict';
  const C = window.A2CONTENT;
  const T = (k, v) => window.App.T(k, v), h = (s) => window.App.h(s);
  const PAPERS = {}; C.papers.forEach((p) => { PAPERS[p.id] = p; });
  const label = (q) => q.label || q.id.split('-').pop();
  const EPOCH = 1767225600000;
  const pad = (n) => (n < 10 ? '0' : '') + n;
  const dateOf = (m) => { const d = new Date(EPOCH + m * 60000); return pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + '/' + d.getFullYear(); };
  const at = (m) => new Date(EPOCH + m * 60000), hm = (m) => { const d = at(m); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
  const dayKey = (d) => d.getFullYear() * 10000 + d.getMonth() * 100 + d.getDate();
  function dayName(m, now) {
    const d = at(m), t = at(now), y = at(now - 1440);
    if (dayKey(d) === dayKey(t)) return T('staff.today');
    if (dayKey(d) === dayKey(y)) return T('staff.yesterday');
    return T('staff.day', { day: T('staff.days').split(',')[d.getDay()], date: d.getDate(), month: T('staff.months').split(',')[d.getMonth()] });
  }
  const mins = (n) => (n < 60 ? T('staff.act.min', { n }) : T('staff.act.hm', { h: Math.floor(n / 60), m: n % 60 }));
  const marked = (n) => T(n === 1 ? 'staff.act.marked1' : 'staff.act.marked', { n });
  let app, ME = '', OWNER = false, TAB = 'coursework', CLS = '', CLASSES = [], timer = null;
  const sel = (k) => { try { return localStorage.getItem('a2staff:' + k) || ''; } catch (e) { return ''; } };
  const keep = (k, v) => { try { localStorage.setItem('a2staff:' + k, v); } catch (e) {} };

  function call(req) {
    return window.OLS_TRANSPORT.call('apiStaff', req).then((r) => {
      if (!r || r.ok === false) { const e = new Error((r && r.error) || 'error'); e.code = (r && r.error) || 'error'; throw e; }
      return r;
    });
  }
  function frame(inner) {
    app.innerHTML = '<header class="bar"><span class="title">' + h(T('staff.title')) + '</span><span class="who">' + h(ME) + '</span></header><div id="sys"></div><main class="staff">' + inner + '</main>';
  }
  function fail(e) {
    const box = app.querySelector('[data-msg]');
    const text = e.code === 'offline' || !e.code || e.code === 'error' ? T('sys.offline') : e.code === 'owner-only' ? T('staff.ownerOnly') : e.code === 'not-staff' ? T('staff.bad') : T('sys.offline');
    if (box) { box.textContent = text; box.hidden = false; }
  }

  // ---------- passcode ----------
  function gate() {
    frame('<div class="passbox"><label for="pass"><b>' + h(T('staff.passcode')) + '</b></label><input id="pass" type="password" autocomplete="off"><button class="btn">' + h(T('staff.enter')) + '</button>' +
      '<p class="err" data-msg hidden></p><p class="note">' + h(T('staff.pupilsUse')) + '</p></div>');
    const inp = app.querySelector('#pass'), btn = app.querySelector('.passbox .btn');
    const go = () => {
      if (!inp.value) return;
      btn.disabled = true;
      call({ op: 'check', pass: inp.value }).then((r) => { OWNER = !!r.owner; open(); }, (e) => {
        btn.disabled = false; inp.value = ''; inp.focus();
        const m = app.querySelector('[data-msg]'); m.textContent = e.code === 'bad-pass' ? T('staff.bad') : T('sys.offline'); m.hidden = false;
      });
    };
    btn.addEventListener('click', go);
    inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); });
    inp.focus();
  }

  // ---------- shell ----------
  function open() {
    if (OWNER) call({ op: 'health' }).catch(() => {}); // the owner's visit keeps the store under its limit (D76)
    TAB = sel('tab') || 'coursework'; if (TAB === 'papers' || TAB === 'live') TAB = 'coursework';
    loadClasses().then(paint, paint);
  }
  function loadClasses() {
    return call({ op: 'classes' }).then((r) => {
      CLASSES = r.classes; OWNER = !!r.owner;
      if (!CLASSES.some((c) => c.name === CLS)) CLS = CLASSES.some((c) => c.name === sel('cls')) ? sel('cls') : (CLASSES[0] || {}).name || '';
    });
  }
  function paint() {
    clearInterval(timer); timer = null;
    const tabs = [['classes', 'staff.tabClasses'], ['coursework', 'staff.tabCoursework'], ['export', 'staff.tabExport']];
    if (!CLASSES.length) TAB = 'classes';
    const pick = TAB !== 'classes' && CLASSES.length ? '<span class="cls"><label for="cls">' + h(T('staff.class')) + '</label><select id="cls">' +
      CLASSES.map((c) => '<option' + (c.name === CLS ? ' selected' : '') + '>' + h(c.name) + '</option>').join('') + '</select></span>' : '';
    frame('<div class="stabs">' + tabs.map(([k, s]) => '<button data-tab="' + k + '"' + (k === TAB ? ' class="on"' : '') + '>' + h(T(s)) + '</button>').join('') + pick + '</div><div id="pane"></div><p class="err" data-msg hidden></p>');
    app.querySelectorAll('.stabs [data-tab]').forEach((b) => b.addEventListener('click', () => { TAB = b.dataset.tab; keep('tab', TAB); paint(); }));
    const s = app.querySelector('#cls');
    if (s) s.addEventListener('change', () => { CLS = s.value; keep('cls', CLS); paint(); });
    ({ classes: vClasses, papers: vPapers, live: vLive, coursework: vCoursework, export: vExport })[TAB]();
  }
  const pane = () => app.querySelector('#pane');
  function twoPress(btn, confirmText, act) { // a destructive button asks once, in its own words, then acts on the second press
    let armed = false, t = null;
    const orig = btn.textContent;
    btn.addEventListener('click', () => {
      if (!armed) { armed = true; btn.textContent = confirmText; btn.classList.add('arm'); t = setTimeout(() => { armed = false; btn.textContent = orig; btn.classList.remove('arm'); }, 5000); return; }
      clearTimeout(t); btn.disabled = true; act(() => { btn.disabled = false; armed = false; btn.textContent = orig; btn.classList.remove('arm'); });
    });
  }
  function classLink(name) { return String((window.OLS_BOOT && window.OLS_BOOT.baseUrl) || location.href.split('?')[0]) + '?class=' + encodeURIComponent(name); }

  // ---------- Classes ----------
  function vClasses() {
    const list = CLASSES.length ? '<ul class="clist">' + CLASSES.map((c) => '<li data-c="' + h(c.name) + '"><b>' + h(T(c.n === 1 ? 'staff.classLine1' : 'staff.classLine', { name: c.name, n: c.n, date: c.c ? dateOf(c.c) : '' })) + '</b>' +
      '<button class="btn sec" data-copy>' + h(T('staff.copy')) + '</button>' + (c.mine || OWNER ? '<button class="btn ghost" data-del>' + h(T('staff.delete')) + '</button>' : '') + '</li>').join('') + '</ul>'
      : '<p class="note">' + h(T('staff.noClasses')) + '</p>';
    pane().innerHTML = list + '<div class="card"><h3>' + h(T('staff.add')) + '</h3><div class="row"><label for="newc">' + h(T('staff.className')) + '</label><input id="newc" class="txt" maxlength="40" style="max-width:260px" autocomplete="off">' +
      '<button class="btn" data-create disabled>' + h(T('staff.create')) + '</button></div><p class="note" data-rule>' + h(T('staff.rule')) + '</p><p class="note" data-copied hidden>' + h(T('staff.copied')) + '</p></div>';
    pane().querySelectorAll('[data-copy]').forEach((b) => b.addEventListener('click', () => {
      const link = classLink(b.closest('li').dataset.c), done = () => { const m = pane().querySelector('[data-copied]'); m.hidden = false; setTimeout(() => { m.hidden = true; }, 3000); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(link).then(done, () => prompt(T('staff.copy'), link));
      else prompt(T('staff.copy'), link);
    }));
    pane().querySelectorAll('[data-del]').forEach((b) => {
      const name = b.closest('li').dataset.c;
      twoPress(b, T('staff.deleteConfirm', { name }), (reset) => call({ op: 'delete', name }).then(() => loadClasses()).then(paint, (e) => { reset(); fail(e); }));
    });
    const inp = pane().querySelector('#newc'), btn = pane().querySelector('[data-create]'), rule = pane().querySelector('[data-rule]');
    inp.addEventListener('input', () => {
      const ok = /^[A-Za-z0-9-]{1,40}$/.test(inp.value.trim());
      btn.disabled = !ok; rule.className = ok || !inp.value ? 'note' : 'err'; rule.textContent = T('staff.rule');
    });
    const create = () => {
      const name = inp.value.trim(); if (btn.disabled) return;
      btn.disabled = true;
      call({ op: 'create', name }).then((r) => { CLS = r.name; keep('cls', CLS); return loadClasses(); }).then(paint, (e) => {
        btn.disabled = false;
        if (e.code === 'taken') { rule.className = 'err'; rule.textContent = T('staff.taken'); }
        else if (e.code === 'bad-name') { rule.className = 'err'; rule.textContent = T('staff.rule'); }
        else fail(e);
      });
    };
    btn.addEventListener('click', create);
    inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') create(); });
  }

  // ---------- Papers ----------
  function vPapers() {
    pane().innerHTML = '<p class="note">' + h(T('turn.marking')).replace('\u2026', '') + '<span class="dots"></span></p>';
    call({ op: 'papers', name: CLS }).then((r) => {
      let order = r.order.slice(), openL = r.open.slice();
      const can = r.canManage;
      const draw = () => {
        pane().innerHTML = '<p class="note">' + h(T('staff.papersNote')) + '</p><ul class="plist">' + order.map((id, i) => {
          const p = PAPERS[id], on = openL.includes(id);
          return '<li data-p="' + id + '"><b>' + h(T('map.paper', { year: p.year, title: p.title })) + '</b><span class="st ' + (on ? 'on' : 'off') + '">' + h(T(on ? 'staff.isOpen' : 'staff.isLocked')) + '</span>' +
            (can ? '<button class="btn sec" data-toggle>' + h(T(on ? 'staff.lock' : 'staff.open')) + '</button><span class="row" style="gap:4px"><button class="btn ghost" data-up aria-label="' + h(T('staff.up')) + '" title="' + h(T('staff.up')) + '"' + (i ? '' : ' disabled') + '>\u25b2</button>' +
              '<button class="btn ghost" data-down aria-label="' + h(T('staff.down')) + '" title="' + h(T('staff.down')) + '"' + (i < order.length - 1 ? '' : ' disabled') + '>\u25bc</button></span>' : '<span></span><span></span>') + '</li>';
        }).join('') + '</ul>' + (can ? '<div class="row"><button class="btn sec" data-all>' + h(T('staff.openAll')) + '</button><button class="btn ghost" data-reset>' + h(T('staff.resetOrder')) + '</button></div>' : '<p class="note">' + h(T('staff.ownerOnly')) + '</p>');
        if (!can) return;
        const save = () => call({ op: 'papers', name: CLS, set: true, order, open: openL }).then((x) => { order = x.order; openL = x.open; draw(); }, (e) => { fail(e); draw(); });
        pane().querySelectorAll('.plist li').forEach((li) => {
          const id = li.dataset.p, i = order.indexOf(id);
          li.querySelector('[data-toggle]').addEventListener('click', () => { openL = openL.includes(id) ? openL.filter((x) => x !== id) : openL.concat(id); save(); });
          li.querySelector('[data-up]').addEventListener('click', () => { if (i > 0) { order.splice(i, 1); order.splice(i - 1, 0, id); save(); } });
          li.querySelector('[data-down]').addEventListener('click', () => { if (i < order.length - 1) { order.splice(i, 1); order.splice(i + 1, 0, id); save(); } });
        });
        pane().querySelector('[data-all]').addEventListener('click', () => { openL = order.slice(); save(); });
        pane().querySelector('[data-reset]').addEventListener('click', () => { order = C.papers.map((p) => p.id); save(); });
      };
      draw();
    }, (e) => { pane().innerHTML = ''; fail(e); });
  }

  // ---------- Live ----------
  let LIVE = null;
  function paperCell(pu, pid) {
    const p = PAPERS[pid]; let first = 0, best = 0, n = 0, cold = true, seen = false, flag = false;
    p.parts.forEach((q) => { const r = pu.P[q.id]; if (!r) { cold = false; return; } if (r.fl) flag = true; if (r.f == null) { cold = false; return; } n++; first += r.f; best += r.b != null ? r.b : r.f; if (r.d !== 1) cold = false; if (r.sb) seen = true; });
    const ev = pu.E[pid], amber = ev && (ev.f === 2 || Object.keys(ev.l || {}).some((k) => ev.l[k] === 2));
    if (!n && !flag) return '<td class="c empty">\u2014</td>';
    return '<td class="c" data-cell="' + h(pu.email) + '|' + pid + '" tabindex="0">' + (n ? first + (best > first ? '<small>' + best + '</small>' : '') : '\u00b7') +
      (n && n < p.parts.length ? '<small>' + h(T('staff.cellParts', { n, of: p.parts.length })) + '</small>' : '') +
      (cold && n === p.parts.length ? '<span class="tg">' + h(T('staff.tagUnaided')) + '</span>' : '') + (seen ? '<span class="tg">' + h(T('staff.tagSeen')) + '</span>' : '') +
      (flag ? '<span class="tg red">' + h(T('staff.tagFlag')) + '</span>' : '') + (amber ? '<span class="amber" aria-label="' + h(T('staff.eval')) + '"></span>' : '') + '</td>';
  }
  function ago(now, m) { const d = now - m; return !m ? '\u2014' : d < 1 ? T('staff.justNow') : d < 60 ? T('staff.minAgo', { n: d }) : dayName(m, now) + ' ' + hm(m); }
  // the Last seen cell's second line (D100): the last session's working time and answers marked
  const lastLine = (s) => (s ? [s[2] ? mins(s[2]) : '', s[3] ? marked(s[3]) : ''].filter(Boolean).join(' \u00b7 ') : '');
  function vLive() {
    const load = () => call({ op: 'live', name: CLS }).then((r) => {
      LIVE = r;
      const d = new Date(), stamp = pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
      const order = r.order;
      pane().innerHTML = '<div class="row" style="margin-bottom:10px"><button class="btn sec" data-refresh>' + h(T('staff.refresh')) + '</button><span class="note">' + h(T('staff.updated', { time: stamp })) + '</span></div>' +
        (r.pupils.length ? '<div class="scroll"><table class="grid"><tr><th>' + h(T('staff.pupil')) + '</th><th>' + h(T('staff.lastSeen')) + '</th>' + order.map((id) => '<th>' + h(PAPERS[id].year) + '</th>').join('') + '</tr>' +
          r.pupils.map((pu) => '<tr' + (pu.me ? ' class="me"' : '') + '><td><button class="who" data-act="' + h(pu.email) + '" title="' + h(T('staff.act.open')) + '">' + h(pu.n || pu.email) + '</button>' + (pu.n && r.pupils.filter((x) => x.n === pu.n).length > 1 ? ' <small class="note">' + h(pu.email.split('@')[0]) + '</small>' : '') + (pu.me ? ' ' + h(T('staff.you')) : '') + '</td><td class="seen">' + h(ago(r.now, pu.seen)) + (lastLine(pu.last) ? '<small>' + h(lastLine(pu.last)) + '</small>' : '') + '</td>' + order.map((id) => paperCell(pu, id)).join('') + '</tr>').join('') + '</table></div>'
          : '<p class="note">' + h(T('staff.nothing')) + '</p>') +

  function timeline(r) {

        (w.o === 1 ? p('staff.cw.opened1', { first: when(w.f, now) }) : p('staff.cw.opened', { o: w.o || 0, first: when(w.f, now), last: when(w.l, now) })) +
        (w.a ? p('staff.cw.lastScreen', { s: scr[0], k: scr[1], of: inStage || '\u2014' }) : '') +
        (w.d ? p('staff.cw.done', { when: when(w.d, now) }) : p('staff.cw.notDone')) +
        p('staff.cw.copies', { c: w.c || 0, r: w.r || 0 }) +
        Object.keys(pu.W.D || {}).map((f) => p('staff.cw.downloads', { file: f, times: times(pu.W.D[f]) })).join('') +
        (c.stages || []).map(([sid, title]) => {
          const ids = shots[sid] || []; if (!ids.length) return '';
          return '<div class="stg"><b>' + h(T('staff.cw.stage', { s: sid, title, t: ids.filter((id) => on.has(id)).length, n: ids.length })) + '</b>' +
            ids.map((id) => '<span class="sq' + (on.has(id) ? ' on' : '') + '" title="' + h(id) + '"></span>').join('') + '</div>';
        }).join('');
    }
    app.insertAdjacentHTML('beforeend', '<aside class="drawer cwd" role="dialog" aria-label="' + h(name) + '"><div class="row" style="justify-content:space-between"><h3>' + h(T('staff.cw.title', { name, c: c.n, title: c.title })) + '</h3>' +
      '<button class="btn ghost" data-close>' + h(T('staff.close')) + '</button></div>' + html + '</aside>');
    const dr = app.querySelector('.drawer');
    dr.querySelector('[data-close]').addEventListener('click', () => dr.remove());
  }

  // ---------- Export ----------
  function vExport() {
    pane().innerHTML = '<div class="card"><p class="note">' + h(T('staff.csvNote')) + '</p><button class="btn" data-csv>' + h(T('staff.csv')) + '</button></div>';
    const b = pane().querySelector('[data-csv]');
    b.addEventListener('click', () => {
      b.disabled = true;
      call({ op: 'csv', name: CLS }).then((r) => {
        const url = URL.createObjectURL(new Blob(['\ufeff' + r.csv], { type: 'text/csv;charset=utf-8' }));
        const a = document.createElement('a'); a.href = url; a.download = r.file; document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 5000);
      }, fail).then(() => { b.disabled = false; });
    });
  }

  function boot(host, r) {
    app = host; ME = r.email;
    call({ op: 'check' }).then((x) => { OWNER = !!x.owner; if (x.admitted) open(); else gate(); }, () => gate());
  }
  window.Staff = { boot };
})();

</script>
<script>window.addEventListener('DOMContentLoaded', function () { App.boot(); });</script>
</body>
